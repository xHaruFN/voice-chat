<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Voice & Screen Share</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-dark: #0b0f19;
  --bg-card: #151d30;
  --bg-input: #1e293b;
  --border: #334155;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --danger: #ef4444;
  --speaking: #10b981;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

/* 入室画面 */
.join-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
.join-box { background: var(--bg-card); border: 1px solid var(--border); padding: 32px; border-radius: 16px; width: 90%; max-width: 380px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); text-align: center; }
.join-box h1 { font-size: 1.4rem; margin-bottom: 20px; color: var(--primary); }
.input-field { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: white; outline: none; font-size: 0.95rem; }
.input-field:focus { border-color: var(--primary); }
.join-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
.join-btn:hover { background: var(--primary-hover); }

/* ヘッダー */
header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.logo { font-weight: 800; font-size: 1.1rem; }
.room-tag { background: var(--bg-dark); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: #818cf8; }

.app-container { flex: 1; display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 60px - 72px); }
.stage-container { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; }

/* 画面共有領域（大きめ表示） */
.spotlight-area { width: 100%; max-width: 1000px; background: #000; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid var(--primary); display: none; }
.spotlight-area.active { display: block; }
.spotlight-area video { width: 100%; max-height: 520px; object-fit: contain; display: block; }
.spotlight-header { position: absolute; top: 12px; left: 12px; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: #818cf8; z-index: 10; }

/* ユーザーグリッド */
.video-grid { width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.user-tile { background: var(--bg-card); border-radius: 16px; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.user-tile video { width: 100%; height: 100%; object-fit: cover; }

/* アバターと話者エフェクト */
.avatar { width: 85px; height: 85px; border-radius: 50%; background: #334155; color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; border: 4px solid transparent; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
.avatar.speaking { border-color: var(--speaking); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); transform: scale(1.05); }

.tile-overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(6px); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); }

/* サイドバー（チャット） */
.sidebar { background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-right: 4px; }
.msg { background: var(--bg-input); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; max-width: 85%; word-break: break-word; }
.msg.mine { align-self: flex-end; background: var(--primary); }
.msg .author { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
.sys-msg { font-size: 0.75rem; color: var(--text-muted); text-align: center; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 12px; }

/* 操作バー */
.controls-bar { height: 72px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 16px; }
.control-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-input); color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.control-btn.active { background: var(--primary); border-color: transparent; }
.control-btn.off { background: var(--danger); border-color: transparent; }
.control-btn:hover { transform: scale(1.05); }

#remoteAudio { display: none; }
</style>
</head>
<body>

<div id="joinScreen" class="join-screen">
  <div class="join-box">
    <h1>🎙️ ボイス＆画面共有</h1>
    <input type="text" id="usernameInput" class="input-field" placeholder="あなたの表示名" value="ユーザー1">
    <input type="text" id="roomInput" class="input-field" placeholder="部屋名（例: my-room）">
    <button class="join-btn" onclick="joinRoom()">部屋に入る</button>
  </div>
</div>

<header>
  <div class="logo">⚡ 1on1 Room</div>
  <div class="room-tag">部屋名: <strong id="displayRoomName">-</strong></div>
</header>

<div class="app-container">
  <div class="stage-container">
    <!-- スポットライト（画面共有表示用） -->
    <div id="spotlightArea" class="spotlight-area">
      <div id="spotlightTitle" class="spotlight-header">🖥️ 画面共有中</div>
      <video id="spotlightVideo" autoplay playsinline></video>
    </div>

    <div class="video-grid">
      <!-- 自分 -->
      <div class="user-tile">
        <div id="avatarSelf" class="avatar">自</div>
        <video id="videoSelf" autoplay playsinline muted style="display:none;"></video>
        <div class="tile-overlay"><span id="labelSelf">自分</span></div>
      </div>

      <!-- 相手 -->
      <div class="user-tile">
        <div id="avatarPeer" class="avatar">対</div>
        <video id="videoPeer" autoplay playsinline style="display:none;"></video>
        <div class="tile-overlay"><span id="labelPeer">待機中...</span></div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <h3 style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px; text-transform:uppercase;">チャット</h3>
    <div id="chatMessages" class="chat-messages"></div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="chatInput" class="input-field" style="margin-bottom:0;" placeholder="メッセージ..." onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button class="join-btn" style="width:auto; padding:0 16px;" onclick="sendChatMessage()">送信</button>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button id="micBtn" class="control-btn active" onclick="toggleMic()" title="マイク">🎤</button>
  <button id="camBtn" class="control-btn off" onclick="toggleCamera()" title="カメラ">📷</button>
  <button id="screenBtn" class="control-btn off" onclick="toggleScreenShare()" title="画面共有">🖥️</button>
  <button class="control-btn off" style="background:#dc2626;" onclick="location.reload()" title="退出">🚪</button>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
let peer = null;
let roomName = '';
let myName = 'ユーザー1';
let peerName = '相手';

let activeDataConn = null;
let activeMediaCall = null;

let localStream = null;
let screenStream = null;
let remoteStream = null;

let isMicOn = true;
let isCamOn = false;
let isScreenSharing = false;
let isPeerScreenSharing = false;
let isPeerCamOn = false;
let isSelfSpeaking = false;

async function joinRoom() {
  myName = document.getElementById('usernameInput').value.trim() || 'ユーザー1';
  roomName = document.getElementById('roomInput').value.trim();

  if (!roomName) return alert('部屋名を入力してください');

  document.getElementById('labelSelf').textContent = myName;
  document.getElementById('avatarSelf').textContent = myName.charAt(0);
  document.getElementById('displayRoomName').textContent = roomName;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false
    });
    setupAudioAnalysis(localStream);
  } catch (e) {
    addSystemMessage("⚠️ マイク無効で開始します");
    localStream = new MediaStream();
    isMicOn = false;
    updateControlsUI();
  }

  const hostId = `room-${roomName}-host`;
  const guestId = `room-${roomName}-guest-${Math.floor(Math.random() * 1000)}`;

  peer = new Peer(hostId);

  peer.on('open', () => {
    addSystemMessage(`🏠 部屋「${roomName}」を作成しました（相手の入室待ち）`);
    document.getElementById('joinScreen').style.display = 'none';
    setupPeerEvents();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      peer = new Peer(guestId);
      peer.on('open', () => {
        addSystemMessage(`🚪 部屋「${roomName}」に入室しました`);
        document.getElementById('joinScreen').style.display = 'none';
        setupPeerEvents();

        activeDataConn = peer.connect(hostId);
        setupDataConnection();
        activeMediaCall = peer.call(hostId, getActiveStream());
        setupMediaCall();
      });
    } else {
      alert("接続エラーが発生しました: " + err.type);
    }
  });
}

function setupPeerEvents() {
  peer.on('connection', (conn) => {
    activeDataConn = conn;
    setupDataConnection();
  });

  peer.on('call', (call) => {
    activeMediaCall = call;
    call.answer(getActiveStream());
    setupMediaCall();
  });
}

function setupDataConnection() {
  activeDataConn.on('open', () => {
    addSystemMessage("🎉 相手と接続しました！");
    sendSignal({ type: 'HANDSHAKE', name: myName, isCamOn, isSharing: isScreenSharing });
  });

  activeDataConn.on('data', (data) => {
    if (data.type === 'HANDSHAKE') {
      peerName = data.name;
      isPeerCamOn = data.isCamOn;
      isPeerScreenSharing = data.isSharing;
      updatePeerUI();
    } else if (data.type === 'CHAT') {
      appendChatMessage(peerName, data.text, false);
    } else if (data.type === 'SCREEN') {
      // 相手の画面共有状態の変更を受信
      isPeerScreenSharing = data.isSharing;
      updatePeerUI();
    } else if (data.type === 'CAM_STATE') {
      isPeerCamOn = data.isCamOn;
      updatePeerUI();
    } else if (data.type === 'SPEAKING') {
      const avatarPeer = document.getElementById('avatarPeer');
      if (data.isSpeaking) avatarPeer.classList.add('speaking');
      else avatarPeer.classList.remove('speaking');
    }
  });

  activeDataConn.on('close', () => {
    addSystemMessage("🚪 相手が退出しました");
    resetPeerUI();
  });
}

function setupMediaCall() {
  activeMediaCall.on('stream', (stream) => {
    remoteStream = stream;
    document.getElementById('remoteAudio').srcObject = stream;
    updatePeerUI();
  });
}

function getActiveStream() {
  return isScreenSharing && screenStream ? screenStream : localStream;
}

// マイク入力から発声判定（お互いにリングを光らせる）
function setupAudioAnalysis(stream) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = ctx.createAnalyser();
  const mic = ctx.createMediaStreamSource(stream);
  mic.connect(analyser);

  analyser.fftSize = 256;
  const data = new Uint8Array(analyser.frequencyBinCount);

  function check() {
    if (isMicOn) {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const speakingNow = avg > 20;

      if (speakingNow !== isSelfSpeaking) {
        isSelfSpeaking = speakingNow;
        const avatarSelf = document.getElementById('avatarSelf');
        if (isSelfSpeaking) avatarSelf.classList.add('speaking');
        else avatarSelf.classList.remove('speaking');

        sendSignal({ type: 'SPEAKING', isSpeaking: isSelfSpeaking });
      }
    } else if (isSelfSpeaking) {
      isSelfSpeaking = false;
      document.getElementById('avatarSelf').classList.remove('speaking');
      sendSignal({ type: 'SPEAKING', isSpeaking: false });
    }
    requestAnimationFrame(check);
  }
  check();
}

function toggleMic() {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t) {
    isMicOn = !isMicOn;
    t.enabled = isMicOn;
    updateControlsUI();
  }
}

async function toggleCamera() {
  if (!isCamOn) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      const vt = s.getVideoTracks()[0];
      localStream.addTrack(vt);
      isCamOn = true;
      if (!isScreenSharing) replaceTracks(vt);
    } catch { return alert("カメラを起動できません"); }
  } else {
    const vt = localStream.getVideoTracks()[0];
    if (vt) { vt.stop(); localStream.removeTrack(vt); }
    isCamOn = false;
    if (!isScreenSharing) replaceTracks(null);
  }
  updateControlsUI();
  updateSelfUI();
  sendSignal({ type: 'CAM_STATE', isCamOn });
}

// 画面共有の開始／停止処理
async function toggleScreenShare() {
  if (!isScreenSharing) {
    try {
      // 画面のキャプチャを取得
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const st = screenStream.getVideoTracks()[0];
      
      // ブラウザ標準の「共有停止」ボタンを押した時のハンドリング
      st.onended = () => stopScreenShare();
      
      isScreenSharing = true;
      
      // 相手へ送信している映像トラックを画面映像に即座に差し替え
      replaceTracks(st);
      
      // 自分の画面にもスポットライト表示
      setSpotlight(`${myName} の画面（自分）`, screenStream, true);
      
      // 相手に画面共有開始を通知
      sendSignal({ type: 'SCREEN', isSharing: true });
    } catch (e) { 
      return; 
    }
  } else {
    stopScreenShare();
  }
  updateControlsUI();
}

function stopScreenShare() {
  if (screenStream) { 
    screenStream.getTracks().forEach(t => t.stop()); 
    screenStream = null; 
  }
  isScreenSharing = false;
  
  // 送信トラックをカメラ（または無映像）に戻す
  replaceTracks(isCamOn ? localStream.getVideoTracks()[0] : null);
  
  // スポットライト表示の解除
  removeSpotlight();
  
  // 相手に画面共有終了を通知
  sendSignal({ type: 'SCREEN', isSharing: false });
  updateControlsUI();
  
  // 相手側で画面共有中であればそれを再描画
  if (isPeerScreenSharing) updatePeerUI();
}

// 通信中の映像トラックをリアルタイム差し替えするWebRTC処理
function replaceTracks(track) {
  if (activeMediaCall && activeMediaCall.peerConnection) {
    const senders = activeMediaCall.peerConnection.getSenders();
    const videoSender = senders.find(sender => sender.track && sender.track.kind === 'video');
    
    if (videoSender) {
      videoSender.replaceTrack(track);
    } else if (track) {
      activeMediaCall.peerConnection.addTrack(track, getActiveStream());
    }
  }
}

function updateSelfUI() {
  const v = document.getElementById('videoSelf');
  const a = document.getElementById('avatarSelf');
  if (isCamOn) {
    v.srcObject = localStream;
    v.style.display = 'block';
    a.style.display = 'none';
  } else {
    v.style.display = 'none';
    a.style.display = 'flex';
  }
}

// 相手の状態変化・映像受信時の画面更新
function updatePeerUI() {
  document.getElementById('labelPeer').textContent = peerName;
  document.getElementById('avatarPeer').textContent = peerName.charAt(0);

  const v = document.getElementById('videoPeer');
  const a = document.getElementById('avatarPeer');

  // 1. 相手が画面共有している場合（スポットライトに表示）
  if (isPeerScreenSharing && remoteStream) {
    setSpotlight(`${peerName} の画面`, remoteStream, false);
    v.style.display = 'none';
    a.style.display = 'flex';
  } 
  // 2. 自分が画面共有中の場合（自分の画面共有をスポットライトにキープ）
  else if (isScreenSharing && screenStream) {
    setSpotlight(`${myName} の画面（自分）`, screenStream, true);
    if (isPeerCamOn && remoteStream) {
      v.srcObject = remoteStream;
      v.style.display = 'block';
      a.style.display = 'none';
    } else {
      v.style.display = 'none';
      a.style.display = 'flex';
    }
  }
  // 3. どちらも画面共有していない場合（通常のカメラ表示/アバター表示）
  else {
    removeSpotlight();
    if (isPeerCamOn && remoteStream) {
      v.srcObject = remoteStream;
      v.style.display = 'block';
      a.style.display = 'none';
    } else {
      v.style.display = 'none';
      a.style.display = 'flex';
    }
  }
}

function resetPeerUI() {
  document.getElementById('labelPeer').textContent = '待機中...';
  document.getElementById('avatarPeer').textContent = '対';
  document.getElementById('videoPeer').style.display = 'none';
  document.getElementById('avatarPeer').style.display = 'flex';
  document.getElementById('avatarPeer').classList.remove('speaking');
  isPeerScreenSharing = false;
  isPeerCamOn = false;
  if (!isScreenSharing) removeSpotlight();
}

function setSpotlight(title, stream, isMuted) {
  const area = document.getElementById('spotlightArea');
  const video = document.getElementById('spotlightVideo');
  document.getElementById('spotlightTitle').textContent = `🖥️ ${title}`;
  video.muted = isMuted; // 自分の共有画面の場合はハウリング防止でミュート
  if (video.srcObject !== stream) {
    video.srcObject = stream;
  }
  area.classList.add('active');
}

function removeSpotlight() {
  const area = document.getElementById('spotlightArea');
  const video = document.getElementById('spotlightVideo');
  area.classList.remove('active');
  video.srcObject = null;
}

function sendSignal(data) {
  if (activeDataConn && activeDataConn.open) activeDataConn.send(data);
}

function updateControlsUI() {
  document.getElementById('micBtn').className = `control-btn ${isMicOn ? 'active' : 'off'}`;
  document.getElementById('camBtn').className = `control-btn ${isCamOn ? 'active' : 'off'}`;
  document.getElementById('screenBtn').className = `control-btn ${isScreenSharing ? 'active' : 'off'}`;
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  sendSignal({ type: 'CHAT', text });
  appendChatMessage(myName, text, true);
  input.value = '';
}

function appendChatMessage(name, text, isMine) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${isMine ? 'mine' : ''}`;
  div.innerHTML = `<div class="author">${name}</div><div>${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSystemMessage(text) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
