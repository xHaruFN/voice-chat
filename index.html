<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-time Voice & Video Chat</title>
<!-- PeerJS CDN (WebRTC通信用) -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #111827; color: white; }
header { height: 64px; background: #1f2937; display: flex; align-items: center; padding: 0 24px; font-size: 22px; font-weight: bold; }
main { max-width: 900px; margin: 40px auto; padding: 20px; }
.card { background: #1f2937; border-radius: 16px; padding: 25px; margin-bottom: 20px; }
h2 { margin-top: 0; }
input { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 10px; font-size: 16px; background: #374151; color: white; }
button { border: none; border-radius: 10px; padding: 12px 20px; margin: 6px 4px 6px 0; font-size: 16px; cursor: pointer; background: #4f46e5; color: white; }
button:hover { opacity: 0.9; }
.red { background: #dc2626; }
.green { background: #22c55e; }
.mediaArea { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
.videoBox { background: #111827; border-radius: 12px; padding: 10px; min-height: 220px; }
video { width: 100%; max-height: 300px; background: #000; border-radius: 10px; object-fit: cover; }
.dmMessages { height: 200px; overflow-y: auto; background: #030712; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.message { background: #374151; padding: 8px 12px; border-radius: 8px; margin: 6px 0; max-width: 80%; }
.message.mine { margin-left: auto; background: #4f46e5; }
.status-badge { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 14px; background: #374151; }
</style>
</head>

<body>

<header>🎙️ Real-time Voice Chat</header>

<main>
  <!-- 接続設定 -->
  <div class="card">
    <h2>1. 自分のID（通話待機）</h2>
    <p>あなたの接続ID: <strong id="myPeerId" style="color: #6366f1;">発行中...</strong></p>
    
    <button id="micBtn" onclick="toggleMedia('audio')">🎤 マイク OFF</button>
    <button id="camBtn" onclick="toggleMedia('video')">📷 カメラ OFF</button>
  </div>

  <!-- 通話相手への接続 -->
  <div class="card">
    <h2>2. 相手に接続する（通話開始）</h2>
    <input id="remotePeerIdInput" placeholder="相手の接続IDを入力">
    <button class="green" onclick="connectToPeer()">📞 通話開始</button>
    <button class="red" onclick="hangUp()">🛑 切断</button>
    <p id="connectionStatus" class="status-badge">未接続</p>
  </div>

  <!-- 映像エリア -->
  <div class="card">
    <h2>📹 通話画面</h2>
    <div class="mediaArea">
      <div class="videoBox">
        <h3>自分</h3>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div class="videoBox">
        <h3>相手</h3>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
  </div>

  <!-- リアルタイムDM -->
  <div class="card">
    <h2>💬 リアルタイムテキストチャット</h2>
    <div id="chatMessages" class="dmMessages"></div>
    <input id="chatInput" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendMessage()">
    <button onclick="sendMessage()">送信</button>
  </div>
</main>

<script>
let peer = null;
let currentCall = null;
let dataConnection = null;
let localStream = null;

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const myPeerIdEl = document.getElementById('myPeerId');
const statusEl = document.getElementById('connectionStatus');

// 1. PeerJSの初期化（ブラウザ間直接通信シグナリング）
function initPeer() {
  peer = new Peer();

  peer.on('open', (id) => {
    myPeerIdEl.textContent = id;
  });

  // 着信処理
  peer.on('call', async (call) => {
    if (!localStream) await setupMedia();
    call.answer(localStream);
    setupCallEvents(call);
  });

  // データ通信（チャット）着信処理
  peer.on('connection', (conn) => {
    dataConnection = conn;
    setupDataEvents();
  });
}

// 2. メディア（マイク・カメラ）の準備
async function setupMedia() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    localVideo.srcObject = localStream;
  } catch (e) {
    alert("マイク/カメラの取得に失敗しました。");
  }
}

async function toggleMedia(type) {
  if (!localStream) await setupMedia();
  
  if (type === 'audio') {
    const track = localStream.getAudioTracks()[0];
    if (track) {
      track.enabled = !track.enabled;
      document.getElementById('micBtn').textContent = track.enabled ? "🎤 マイク ON" : "🔇 マイク OFF";
    }
  } else if (type === 'video') {
    const track = localStream.getVideoTracks()[0];
    if (track) {
      track.enabled = !track.enabled;
      document.getElementById('camBtn').textContent = track.enabled ? "📷 カメラ ON" : "📷 カメラ OFF";
    }
  }
}

// 3. 発信処理
async function connectToPeer() {
  const remoteId = document.getElementById('remotePeerIdInput').value.trim();
  if (!remoteId) return alert("相手のIDを入力してください");

  if (!localStream) await setupMedia();

  // 音声・映像の通話開始
  const call = peer.call(remoteId, localStream);
  setupCallEvents(call);

  // チャットデータ通信の開始
  dataConnection = peer.connect(remoteId);
  setupDataEvents();
}

// 通話ストリームイベント
function setupCallEvents(call) {
  currentCall = call;
  statusEl.textContent = "通話中";
  statusEl.style.background = "#22c55e";

  call.on('stream', (remoteStream) => {
    remoteVideo.srcObject = remoteStream;
  });

  call.on('close', () => {
    remoteVideo.srcObject = null;
    statusEl.textContent = "切断されました";
    statusEl.style.background = "#374151";
  });
}

// チャットイベント
function setupDataEvents() {
  dataConnection.on('data', (data) => {
    appendMessage(data.sender, data.text, false);
  });
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !dataConnection) return;

  dataConnection.send({ sender: '相手', text: text });
  appendMessage('自分', text, true);
  input.value = '';
}

function appendMessage(sender, text, isMine) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `message ${isMine ? 'mine' : ''}`;
  div.innerHTML = `<strong>${sender}:</strong> ${text}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function hangUp() {
  if (currentCall) currentCall.close();
  if (dataConnection) dataConnection.close();
  remoteVideo.srcObject = null;
  statusEl.textContent = "未接続";
  statusEl.style.background = "#374151";
}

// 初期化実行
initPeer();
</script>
</body>
</html>
