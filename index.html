<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Voice & Screen Share (Multi-party)</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-dark: #0b0f19;
  --bg-card: #151d30;
  --bg-input: #1e293b;
  --border: #334155;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --danger: #ef4444;
  --speaking: #10b981;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

/* 入室画面 */
.join-screen { position: fixed; inset: 0; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; z-index: 100; }
.join-box { background: var(--bg-card); border: 1px solid var(--border); padding: 32px; border-radius: 16px; width: 90%; max-width: 380px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); text-align: center; }
.join-box h1 { font-size: 1.4rem; margin-bottom: 20px; color: var(--primary); }
.input-field { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: white; outline: none; font-size: 0.95rem; }
.input-field:focus { border-color: var(--primary); }
.join-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
.join-btn:hover { background: var(--primary-hover); }

/* ヘッダー */
header { height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.logo { font-weight: 800; font-size: 1.1rem; }
.room-tag { background: var(--bg-dark); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: #818cf8; }

.app-container { flex: 1; display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 60px - 72px); }
.stage-container { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; align-items: center; }

/* 画面共有領域 */
.spotlight-area { width: 100%; max-width: 1000px; background: #000; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid var(--primary); display: none; }
.spotlight-area.active { display: block; }
.spotlight-area video { width: 100%; max-height: 480px; object-fit: contain; display: block; }
.spotlight-header { position: absolute; top: 12px; left: 12px; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(8px); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: #818cf8; z-index: 10; }

/* メンバー表示グリッド */
.video-grid { width: 100%; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.user-tile { background: var(--bg-card); border-radius: 16px; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.user-tile video { width: 100%; height: 100%; object-fit: cover; }

/* アバターと話者エフェクト */
.avatar { width: 75px; height: 75px; border-radius: 50%; background: #334155; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; border: 4px solid transparent; transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s; }
.avatar.speaking { border-color: var(--speaking); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); transform: scale(1.05); }

.tile-overlay { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(6px); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.05); }

/* サイドバー（チャット） */
.sidebar { background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; padding-right: 4px; }
.msg { background: var(--bg-input); padding: 8px 12px; border-radius: 10px; font-size: 0.85rem; max-width: 85%; word-break: break-word; }
.msg.mine { align-self: flex-end; background: var(--primary); }
.msg .author { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }
.sys-msg { font-size: 0.75rem; color: var(--text-muted); text-align: center; background: rgba(255,255,255,0.03); padding: 4px 8px; border-radius: 12px; }

/* 操作バー */
.controls-bar { height: 72px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 16px; }
.control-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-input); color: white; font-size: 1.2rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
.control-btn.active { background: var(--primary); border-color: transparent; }
.control-btn.off { background: var(--danger); border-color: transparent; }
.control-btn:hover { transform: scale(1.05); }

.remote-audio-container { display: none; }
</style>
</head>
<body>

<div id="joinScreen" class="join-screen">
  <div class="join-box">
    <h1>🎙️ グループルーム (最大5人)</h1>
    <input type="text" id="usernameInput" class="input-field" placeholder="あなたの表示名" value="ユーザー1">
    <input type="text" id="roomInput" class="input-field" placeholder="部屋名（例: team-room）">
    <button class="join-btn" onclick="joinRoom()">部屋に入る</button>
  </div>
</div>

<header>
  <div class="logo">⚡ Group Voice & Share</div>
  <div class="room-tag">部屋名: <strong id="displayRoomName">-</strong></div>
</header>

<div class="app-container">
  <div class="stage-container">
    <div id="spotlightArea" class="spotlight-area">
      <div id="spotlightTitle" class="spotlight-header">🖥️ 画面共有中</div>
      <video id="spotlightVideo" autoplay playsinline></video>
    </div>

    <div id="videoGrid" class="video-grid">
      <div class="user-tile" id="tile-self">
        <div id="avatarSelf" class="avatar">自</div>
        <video id="videoSelf" autoplay playsinline muted style="display:none;"></video>
        <div class="tile-overlay"><span id="labelSelf">自分</span></div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <h3 style="font-size:0.8rem; color:var(--text-muted); margin-bottom:10px; text-transform:uppercase;">グループチャット</h3>
    <div id="chatMessages" class="chat-messages"></div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="chatInput" class="input-field" style="margin-bottom:0;" placeholder="メッセージ..." onkeydown="if(event.key==='Enter')sendChatMessage()">
      <button class="join-btn" style="width:auto; padding:0 16px;" onclick="sendChatMessage()">送信</button>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button id="micBtn" class="control-btn active" onclick="toggleMic()" title="マイク">🎤</button>
  <button id="camBtn" class="control-btn off" onclick="toggleCamera()" title="カメラ">📷</button>
  <button id="screenBtn" class="control-btn off" onclick="toggleScreenShare()" title="画面共有">🖥️</button>
  <button class="control-btn off" style="background:#dc2626;" onclick="location.reload()" title="退出">🚪</button>
</div>

<div id="remoteAudioContainer" class="remote-audio-container"></div>

<script>
let peer = null;
let myPeerId = '';
let roomName = '';
let myName = 'ユーザー';

const peers = {};

let localStream = null;
let screenStream = null;

let isMicOn = true;
let isCamOn = false;
let isScreenSharing = false;
let isSelfSpeaking = false;
let activeSpotlightPeerId = null;

async function joinRoom() {
  myName = document.getElementById('usernameInput').value.trim() || 'ユーザー';
  roomName = document.getElementById('roomInput').value.trim();

  if (!roomName) return alert('部屋名を入力してください');

  document.getElementById('labelSelf').textContent = `${myName} (自分)`;
  document.getElementById('avatarSelf').textContent = myName.charAt(0);
  document.getElementById('displayRoomName').textContent = roomName;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false
    });
    setupAudioAnalysis(localStream);
  } catch (e) {
    addSystemMessage("⚠️ マイク無効で開始します");
    localStream = new MediaStream();
    isMicOn = false;
    updateControlsUI();
  }

  myPeerId = `room-${roomName}-${Math.floor(Math.random() * 1000000)}`;
  peer = new Peer(myPeerId);

  peer.on('open', (id) => {
    addSystemMessage(`🏠 部屋「${roomName}」に入室しました`);
    document.getElementById('joinScreen').style.display = 'none';
    
    setupIncomingHandlers();
    discoverAndConnectPeers();
  });

  peer.on('error', (err) => {
    console.error("PeerJS Error:", err);
  });
}

function setupIncomingHandlers() {
  peer.on('connection', (conn) => {
    setupDataConnection(conn);
  });

  peer.on('call', (call) => {
    call.answer(getActiveStream());
    setupMediaCall(call);
  });
}

function discoverAndConnectPeers() {
  const hostId = `room-${roomName}-host`;
  
  if (myPeerId !== hostId) {
    const tempHostPeer = new Peer(hostId);
    tempHostPeer.on('open', () => {
      tempHostPeer.destroy();
      reconnectAsHost(hostId);
    });
    tempHostPeer.on('error', () => {
      connectToPeer(hostId);
    });
  }
}

function reconnectAsHost(hostId) {
  peer.destroy();
  myPeerId = hostId;
  peer = new Peer(hostId);
  peer.on('open', () => {
    setupIncomingHandlers();
  });
}

function connectToPeer(targetPeerId) {
  if (peers[targetPeerId] || targetPeerId === myPeerId) return;

  const dataConn = peer.connect(targetPeerId);
  setupDataConnection(dataConn);

  const mediaCall = peer.call(targetPeerId, getActiveStream());
  setupMediaCall(mediaCall);
}

function setupDataConnection(conn) {
  const peerId = conn.peer;
  if (!peers[peerId]) peers[peerId] = {};
  peers[peerId].dataConn = conn;

  conn.on('open', () => {
    conn.send({
      type: 'HANDSHAKE',
      name: myName,
      isCamOn,
      isSharing: isScreenSharing,
      knownPeers: Object.keys(peers)
    });
  });

  conn.on('data', (data) => {
    handleSignalData(peerId, data);
  });

  conn.on('close', () => {
    removePeer(peerId);
  });
}

function setupMediaCall(call) {
  const peerId = call.peer;
  if (!peers[peerId]) peers[peerId] = {};
  peers[peerId].mediaCall = call;

  call.on('stream', (remoteStream) => {
    peers[peerId].stream = remoteStream;
    updatePeerTile(peerId);
    attachRemoteAudio(peerId, remoteStream);
  });
}

function handleSignalData(peerId, data) {
  if (!peers[peerId]) peers[peerId] = {};

  if (data.type === 'HANDSHAKE') {
    peers[peerId].name = data.name;
    peers[peerId].isCamOn = data.isCamOn;
    peers[peerId].isSharing = data.isSharing;
    
    createPeerTile(peerId, data.name);
    updatePeerTile(peerId);

    if (data.knownPeers && Array.isArray(data.knownPeers)) {
      data.knownPeers.forEach(id => {
        if (id !== myPeerId && !peers[id]) {
          connectToPeer(id);
        }
      });
    }
  } else if (data.type === 'CHAT') {
    appendChatMessage(peers[peerId].name || '他メンバー', data.text, false);
  } else if (data.type === 'SCREEN') {
    peers[peerId].isSharing = data.isSharing;
    updatePeerTile(peerId);
  } else if (data.type === 'CAM_STATE') {
    peers[peerId].isCamOn = data.isCamOn;
    updatePeerTile(peerId);
  } else if (data.type === 'SPEAKING') {
    const avatar = document.getElementById(`avatar-${peerId}`);
    if (avatar) {
      if (data.isSpeaking) avatar.classList.add('speaking');
      else avatar.classList.remove('speaking');
    }
  }
}

function getActiveStream() {
  return isScreenSharing && screenStream ? screenStream : localStream;
}

function createPeerTile(peerId, name) {
  if (document.getElementById(`tile-${peerId}`)) return;

  const grid = document.getElementById('videoGrid');
  const tile = document.createElement('div');
  tile.className = 'user-tile';
  tile.id = `tile-${peerId}`;

  tile.innerHTML = `
    <div id="avatar-${peerId}" class="avatar">${name.charAt(0)}</div>
    <video id="video-${peerId}" autoplay playsinline style="display:none;"></video>
    <div class="tile-overlay"><span id="label-${peerId}">${name}</span></div>
  `;

  grid.appendChild(tile);
  addSystemMessage(`👋 ${name} さんが参加しました`);
}

function updatePeerTile(peerId) {
  const p = peers[peerId];
  if (!p) return;

  const videoEl = document.getElementById(`video-${peerId}`);
  const avatarEl = document.getElementById(`avatar-${peerId}`);

  if (!videoEl || !avatarEl) return;

  if (p.isSharing && p.stream) {
    setSpotlight(`${p.name} の画面`, p.stream, false, peerId);
    videoEl.style.display = 'none';
    avatarEl.style.display = 'flex';
  } 
  else if (p.isCamOn && p.stream) {
    if (activeSpotlightPeerId === peerId) removeSpotlight();
    videoEl.srcObject = p.stream;
    videoEl.style.display = 'block';
    avatarEl.style.display = 'none';
  } 
  else {
    if (activeSpotlightPeerId === peerId) removeSpotlight();
    videoEl.style.display = 'none';
    avatarEl.style.display = 'flex';
  }
}

function removePeer(peerId) {
  const p = peers[peerId];
  if (p) {
    addSystemMessage(`🚪 ${p.name || 'メンバー'} が退出しました`);
    if (activeSpotlightPeerId === peerId) removeSpotlight();
    delete peers[peerId];
  }

  const tile = document.getElementById(`tile-${peerId}`);
  if (tile) tile.remove();

  const audio = document.getElementById(`audio-${peerId}`);
  if (audio) audio.remove();
}

function attachRemoteAudio(peerId, stream) {
  let audio = document.getElementById(`audio-${peerId}`);
  if (!audio) {
    audio = document.createElement('audio');
    audio.id = `audio-${peerId}`;
    audio.autoplay = true;
    document.getElementById('remoteAudioContainer').appendChild(audio);
  }
  audio.srcObject = stream;
}

function setupAudioAnalysis(stream) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const analyser = ctx.createAnalyser();
  const mic = ctx.createMediaStreamSource(stream);
  mic.connect(analyser);

  analyser.fftSize = 256;
  const data = new Uint8Array(analyser.frequencyBinCount);

  function check() {
    if (isMicOn) {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const speakingNow = avg > 20;

      if (speakingNow !== isSelfSpeaking) {
        isSelfSpeaking = speakingNow;
        const avatarSelf = document.getElementById('avatarSelf');
        if (isSelfSpeaking) avatarSelf.classList.add('speaking');
        else avatarSelf.classList.remove('speaking');

        broadcastSignal({ type: 'SPEAKING', isSpeaking: isSelfSpeaking });
      }
    } else if (isSelfSpeaking) {
      isSelfSpeaking = false;
      document.getElementById('avatarSelf').classList.remove('speaking');
      broadcastSignal({ type: 'SPEAKING', isSpeaking: false });
    }
    requestAnimationFrame(check);
  }
  check();
}

function toggleMic() {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t) {
    isMicOn = !isMicOn;
    t.enabled = isMicOn;
    updateControlsUI();
  }
}

async function toggleCamera() {
  if (!isCamOn) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      const vt = s.getVideoTracks()[0];
      localStream.addTrack(vt);
      isCamOn = true;
      if (!isScreenSharing) replaceTracksAll(vt);
    } catch { return alert("カメラを起動できません"); }
  } else {
    const vt = localStream.getVideoTracks()[0];
    if (vt) { vt.stop(); localStream.removeTrack(vt); }
    isCamOn = false;
    if (!isScreenSharing) replaceTracksAll(null);
  }
  updateControlsUI();
  updateSelfUI();
  broadcastSignal({ type: 'CAM_STATE', isCamOn });
}

async function toggleScreenShare() {
  if (!isScreenSharing) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      const st = screenStream.getVideoTracks()[0];
      st.onended = () => stopScreenShare();

      isScreenSharing = true;
      replaceTracksAll(st);
      setSpotlight(`${myName} の画面（自分）`, screenStream, true, 'self');
      broadcastSignal({ type: 'SCREEN', isSharing: true });
    } catch { return; }
  } else stopScreenShare();
  updateControlsUI();
}

function stopScreenShare() {
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  isScreenSharing = false;
  replaceTracksAll(isCamOn ? localStream.getVideoTracks()[0] : null);
  removeSpotlight();
  broadcastSignal({ type: 'SCREEN', isSharing: false });
  updateControlsUI();
}

function replaceTracksAll(track) {
  Object.values(peers).forEach(p => {
    if (p.mediaCall && p.mediaCall.peerConnection) {
      const senders = p.mediaCall.peerConnection.getSenders();
      const s = senders.find(sender => sender.track && sender.track.kind === 'video');
      if (s) s.replaceTrack(track);
      else if (track) p.mediaCall.peerConnection.addTrack(track, getActiveStream());
    }
  });
}

function updateSelfUI() {
  const v = document.getElementById('videoSelf');
  const a = document.getElementById('avatarSelf');
  if (isCamOn) {
    v.srcObject = localStream;
    v.style.display = 'block';
    a.style.display = 'none';
  } else {
    v.style.display = 'none';
    a.style.display = 'flex';
  }
}

function setSpotlight(title, stream, isMuted, sourcePeerId) {
  activeSpotlightPeerId = sourcePeerId;
  const area = document.getElementById('spotlightArea');
  const video = document.getElementById('spotlightVideo');
  document.getElementById('spotlightTitle').textContent = `🖥️ ${title}`;
  video.muted = isMuted;
  if (video.srcObject !== stream) video.srcObject = stream;
  area.classList.add('active');
}

function removeSpotlight() {
  activeSpotlightPeerId = null;
  const area = document.getElementById('spotlightArea');
  const video = document.getElementById('spotlightVideo');
  area.classList.remove('active');
  video.srcObject = null;
}

function broadcastSignal(data) {
  Object.values(peers).forEach(p => {
    if (p.dataConn && p.dataConn.open) p.dataConn.send(data);
  });
}

function updateControlsUI() {
  document.getElementById('micBtn').className = `control-btn ${isMicOn ? 'active' : 'off'}`;
  document.getElementById('camBtn').className = `control-btn ${isCamOn ? 'active' : 'off'}`;
  document.getElementById('screenBtn').className = `control-btn ${isScreenSharing ? 'active' : 'off'}`;
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  broadcastSignal({ type: 'CHAT', text });
  appendChatMessage(myName, text, true);
  input.value = '';
}

function appendChatMessage(name, text, isMine) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${isMine ? 'mine' : ''}`;
  div.innerHTML = `<div class="author">${name}</div><div>${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSystemMessage(text) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
