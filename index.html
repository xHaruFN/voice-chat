<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      height: 64px;
      background: #1f2937;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-top: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 6px 4px 6px 0;
      font-size: 16px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout,
    .red {
      background: #dc2626;
    }

    .green {
      background: #22c55e;
    }

    .gray {
      background: #4b5563;
    }

    .blue {
      background: #2563eb;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #374151;
      padding: 15px;
      border-radius: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    #status {
      margin-top: 15px;
      color: #9ca3af;
    }

    #accountStatus,
    #settingsStatus {
      color: #9ca3af;
    }

    #settingsCard,
    #friendCard,
    #partyCard {
      display: none;
    }

    .friend {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #374151;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .friendAvatar {
      width: 45px;
      height: 45px;
      background: #4f46e5;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .friendInfo {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .online {
      color: #22c55e;
      font-size: 13px;
    }

    .offline {
      color: #9ca3af;
      font-size: 13px;
    }

    .friend button {
      padding: 8px 14px;
      margin: 0 0 0 5px;
    }

    .request {
      background: #374151;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
    }

    .partyBox {
      background: #374151;
      padding: 15px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .empty {
      color: #9ca3af;
      padding: 15px 0;
    }

    /* ==========================================
       カメラ・画面共有
       ========================================== */

    .mediaArea {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .videoBox {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      min-height: 200px;
      position: relative;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
      max-height: 500px;
      object-fit: contain;
    }

    .videoLabel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 10px;
      border-radius: 8px;
      z-index: 2;
    }

    .mediaButtons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    @media (min-width: 700px) {
      .mediaArea {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

  <!-- ==========================================
       アカウント
       ========================================== -->

  <div class="card">

    <h2>👤 アカウント</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
      autocomplete="current-password"
    >

    <button onclick="signUp()">
      アカウント作成
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

    <button onclick="createGuest()">
      👻 仮アカウント
    </button>

    <button
      id="logoutButton"
      class="logout"
      onclick="signOut()"
      style="display:none;"
    >
      ログアウト
    </button>

    <p id="accountStatus">
      ログインしていません
    </p>

  </div>


  <!-- ==========================================
       アカウント設定
       ========================================== -->

  <div
    class="card"
    id="settingsCard"
  >

    <h2>⚙️ アカウント設定</h2>

    <h3>📧 メールアドレス変更</h3>

    <input
      id="newEmail"
      type="email"
      placeholder="新しいメールアドレス"
    >

    <button onclick="changeEmail()">
      メールアドレス変更
    </button>

    <h3>🔑 パスワード変更</h3>

    <input
      id="newPassword"
      type="password"
      placeholder="新しいパスワード"
    >

    <button onclick="changePassword()">
      パスワード変更
    </button>

    <p id="settingsStatus"></p>

  </div>


  <!-- ==========================================
       自分
       ========================================== -->

  <div class="card">

    <h2>自分</h2>

    <div class="user">

      <div class="avatar">
        👤
      </div>

      <div>

        <strong id="username">
          未ログイン
        </strong>

        <div id="onlineStatus">
          ⚪ オフライン
        </div>

      </div>

    </div>

    <br>

    <!-- マイク -->

    <button
      id="micButton"
      onclick="toggleMic()"
    >
      🎤 マイクON
    </button>


    <!-- カメラ -->

    <button
      id="cameraButton"
      class="blue"
      onclick="toggleCamera()"
    >
      📷 カメラON
    </button>


    <!-- 画面共有 -->

    <button
      id="screenButton"
      class="gray"
      onclick="toggleScreenShare()"
    >
      🖥️ 画面共有
    </button>


    <div id="status">
      マイク・カメラ・画面共有を操作できます。
    </div>


    <!-- 映像 -->

    <div class="mediaArea">

      <div
        id="cameraBox"
        class="videoBox"
        style="display:none;"
      >

        <div class="videoLabel">
          📷 カメラ
        </div>

        <video
          id="cameraVideo"
          autoplay
          muted
          playsinline
        ></video>

      </div>


      <div
        id="screenBox"
        class="videoBox"
        style="display:none;"
      >

        <div class="videoLabel">
          🖥️ 画面共有
        </div>

        <video
          id="screenVideo"
          autoplay
          muted
          playsinline
        ></video>

      </div>

    </div>

  </div>


  <!-- ==========================================
       フレンド
       ========================================== -->

  <div
    class="card"
    id="friendCard"
  >

    <h2>👥 フレンド</h2>

    <input
      id="friendSearch"
      type="text"
      placeholder="🔍 プレイヤーを検索"
    >

    <button onclick="searchFriend()">
      🔍 検索
    </button>

    <div id="searchResult"></div>

    <h3>フレンドリスト</h3>

    <div id="friendList">
      <div class="empty">
        フレンドはいません。
      </div>
    </div>

    <h3>📨 フレンド申請</h3>

    <div id="requestList">
      <div class="empty">
        フレンド申請はありません。
      </div>
    </div>

  </div>


  <!-- ==========================================
       パーティー
       ========================================== -->

  <div
    class="card"
    id="partyCard"
  >

    <h2>🎉 パーティー</h2>

    <button
      class="green"
      onclick="createParty()"
    >
      ＋ パーティー作成
    </button>

    <div id="partyArea">
      <div class="empty">
        パーティーに参加していません。
      </div>
    </div>

  </div>

</main>


<script>

  // ==========================================
  // Supabase設定
  // ==========================================

  const SUPABASE_URL =
    "https://znzwsbumfqderjoehrwd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_HbZtKu-et14XUIGwIegw0g_ltLcrBhl";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // 状態
  // ==========================================

  let currentUser = null;
  let guestMode = false;

  let microphone = null;
  let micEnabled = false;

  let cameraStream = null;
  let cameraEnabled = false;

  let screenStream = null;
  let screenEnabled = false;


  // ==========================================
  // UI更新
  // ==========================================

  function setLoggedInUI(name) {

    document.getElementById(
      "username"
    ).textContent = name;

    document.getElementById(
      "onlineStatus"
    ).textContent = "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent = "✅ ログイン中";

    document.getElementById(
      "logoutButton"
    ).style.display = "inline-block";

    document.getElementById(
      "settingsCard"
    ).style.display = "block";

    document.getElementById(
      "friendCard"
    ).style.display = "block";

    document.getElementById(
      "partyCard"
    ).style.display = "block";
  }


  function setLoggedOutUI() {

    document.getElementById(
      "username"
    ).textContent = "未ログイン";

    document.getElementById(
      "onlineStatus"
    ).textContent = "⚪ オフライン";

    document.getElementById(
      "accountStatus"
    ).textContent = "ログインしていません";

    document.getElementById(
      "logoutButton"
    ).style.display = "none";

    document.getElementById(
      "settingsCard"
    ).style.display = "none";

    document.getElementById(
      "friendCard"
    ).style.display = "none";

    document.getElementById(
      "partyCard"
    ).style.display = "none";
  }


  // ==========================================
  // アカウント作成
  // 作成後は自動ログインしない
  // ==========================================

  async function signUp() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    if (password.length < 6) {

      alert(
        "パスワードは6文字以上にしてください。"
      );

      return;
    }

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {

        alert(
          "アカウント作成エラー:\n" +
          error.message
        );

        return;
      }

      /*
        メール確認がOFFの場合、
        Supabaseがセッションを作ることがあるため、
        作成直後にサインアウトする。
      */

      if (data.session) {

        await supabaseClient.auth.signOut();

      }

      currentUser = null;
      guestMode = false;

      setLoggedOutUI();

      alert(
        "✅ アカウントを作成しました！\n\n" +
        "自動ログインはされません。\n" +
        "作成したメールアドレスとパスワードでログインしてください。"
      );

    } catch (error) {

      console.error(
        "signUp error:",
        error
      );

      alert(
        "アカウント作成中にエラーが発生しました:\n" +
        error.message
      );
    }
  }


  // ==========================================
  // ログイン
  // ==========================================

  async function signIn() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        alert(
          "ログインエラー:\n" +
          error.message
        );

        return;
      }

      currentUser = data.user;
      guestMode = false;

      setLoggedInUI(
        currentUser.email
      );

      await loadFriends();
      await loadFriendRequests();

    } catch (error) {

      alert(
        "ログイン中にエラーが発生しました:\n" +
        error.message
      );
    }
  }


  // ==========================================
  // ログアウト
  // ==========================================

  async function signOut() {

    stopAllMedia();

    if (guestMode) {

      currentUser = null;
      guestMode = false;

      setLoggedOutUI();

      alert(
        "仮アカウントからログアウトしました。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.signOut();

    if (error) {

      alert(
        "ログアウトに失敗しました:\n" +
        error.message
      );

      return;
    }

    currentUser = null;
    guestMode = false;

    setLoggedOutUI();

    document.getElementById(
      "friendList"
    ).innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    document.getElementById(
      "requestList"
    ).innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';
  }


  // ==========================================
  // 仮アカウント
  // ==========================================

  function createGuest() {

    if (currentUser) {

      alert(
        "すでにログインしています。"
      );

      return;
    }

    const guestName =
      "Guest_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    currentUser = {
      id: "guest_" + Date.now(),
      email: guestName
    };

    guestMode = true;

    setLoggedInUI(
      guestName
    );

    document.getElementById(
      "accountStatus"
    ).textContent =
      "👻 仮アカウント: " +
      guestName;

    document.getElementById(
      "friendList"
    ).innerHTML =
      '<div class="empty">仮アカウントではフレンド機能を利用できません。</div>';

    document.getElementById(
      "requestList"
    ).innerHTML =
      '<div class="empty">仮アカウントではフレンド申請を利用できません。</div>';

    alert(
      "仮アカウントを作成しました！\n\n" +
      guestName
    );
  }


  // ==========================================
  // メールアドレス変更
  // ==========================================

  async function changeEmail() {

    if (guestMode) {

      alert(
        "仮アカウントでは変更できません。"
      );

      return;
    }

    const newEmail =
      document.getElementById(
        "newEmail"
      ).value.trim();

    if (!newEmail) {

      alert(
        "新しいメールアドレスを入力してください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        email: newEmail
      });

    if (error) {

      alert(
        "メールアドレス変更エラー:\n" +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ メールアドレス変更を受け付けました。";

    document.getElementById(
      "newEmail"
    ).value = "";
  }


  // ==========================================
  // パスワード変更
  // ==========================================

  async function changePassword() {

    if (guestMode) {

      alert(
        "仮アカウントでは変更できません。"
      );

      return;
    }

    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;

    if (!newPassword) {

      alert(
        "新しいパスワードを入力してください。"
      );

      return;
    }

    if (newPassword.length < 6) {

      alert(
        "パスワードは6文字以上にしてください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) {

      alert(
        "パスワード変更エラー:\n" +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ パスワードを変更しました。";

    document.getElementById(
      "newPassword"
    ).value = "";
  }


  // ==========================================
  // マイク
  // ==========================================

  async function toggleMic() {

    if (!micEnabled) {

      try {

        microphone =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        micEnabled = true;

        document.getElementById(
          "micButton"
        ).textContent =
          "🔇 マイクOFF";

        updateMediaStatus();

      } catch (error) {

        console.error(error);

        alert(
          "マイクへのアクセスが許可されませんでした。"
        );
      }

    } else {

      stopMicrophone();

      updateMediaStatus();
    }
  }


  function stopMicrophone() {

    if (microphone) {

      microphone
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    microphone = null;
    micEnabled = false;

    document.getElementById(
      "micButton"
    ).textContent =
      "🎤 マイクON";
  }


  // ==========================================
  // カメラ
  // ==========================================

  async function toggleCamera() {

    if (!cameraEnabled) {

      try {

        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: true
          });

        const video =
          document.getElementById(
            "cameraVideo"
          );

        video.srcObject =
          cameraStream;

        document.getElementById(
          "cameraBox"
        ).style.display =
          "block";

        cameraEnabled = true;

        document.getElementById(
          "cameraButton"
        ).textContent =
          "📷 カメラOFF";

        updateMediaStatus();

      } catch (error) {

        console.error(error);

        alert(
          "カメラへのアクセスが許可されませんでした。"
        );
      }

    } else {

      stopCamera();

      updateMediaStatus();
    }
  }


  function stopCamera() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    cameraStream = null;
    cameraEnabled = false;

    const video =
      document.getElementById(
        "cameraVideo"
      );

    video.srcObject = null;

    document.getElementById(
      "cameraBox"
    ).style.display =
      "none";

    document.getElementById(
      "cameraButton"
    ).textContent =
      "📷 カメラON";
  }


  // ==========================================
  // 画面共有
  // ==========================================

  async function toggleScreenShare() {

    if (!screenEnabled) {

      try {

        screenStream =
          await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: true
          });

        const video =
          document.getElementById(
            "screenVideo"
          );

        video.srcObject =
          screenStream;

        document.getElementById(
          "screenBox"
        ).style.display =
          "block";

        screenEnabled = true;

        document.getElementById(
          "screenButton"
        ).textContent =
          "⏹️ 画面共有OFF";

        updateMediaStatus();


        /*
          ブラウザ側で「共有を停止」した場合にも
          UIをOFFにする。
        */

        const videoTrack =
          screenStream.getVideoTracks()[0];

        if (videoTrack) {

          videoTrack.addEventListener(
            "ended",
            () => {

              stopScreenShare();

              updateMediaStatus();

            }
          );
        }

      } catch (error) {

        console.error(error);

        if (error.name !== "NotAllowedError") {

          alert(
            "画面共有を開始できませんでした。"
          );

        }
      }

    } else {

      stopScreenShare();

      updateMediaStatus();
    }
  }


  function stopScreenShare() {

    if (screenStream) {

      screenStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    screenStream = null;
    screenEnabled = false;

    const video =
      document.getElementById(
        "screenVideo"
      );

    video.srcObject = null;

    document.getElementById(
      "screenBox"
    ).style.display =
      "none";

    document.getElementById(
      "screenButton"
    ).textContent =
      "🖥️ 画面共有";
  }


  // ==========================================
  // 全メディア停止
  // ==========================================

  function stopAllMedia() {

    stopMicrophone();
    stopCamera();
    stopScreenShare();

    updateMediaStatus();
  }


  // ==========================================
  // メディア状態表示
  // ==========================================

  function updateMediaStatus() {

    const states = [];

    if (micEnabled) {
      states.push("🎤 マイクON");
    }

    if (cameraEnabled) {
      states.push("📷 カメラON");
    }

    if (screenEnabled) {
      states.push("🖥️ 画面共有ON");
    }

    document.getElementById(
      "status"
    ).textContent =
      states.length > 0
        ? states.join("　")
        : "すべてOFF";
  }


  // ==========================================
  // フレンド検索
  // ==========================================

  async function searchFriend() {

    if (!currentUser || guestMode) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    const name =
      document.getElementById(
        "friendSearch"
      ).value.trim();

    if (!name) {

      alert(
        "検索する名前を入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("id, username")
        .ilike(
          "username",
          "%" + name + "%"
        )
        .limit(10);

    const result =
      document.getElementById(
        "searchResult"
      );

    result.innerHTML = "";

    if (error) {

      console.error(error);

      result.innerHTML =
        '<div class="empty">検索に失敗しました。Supabaseのprofilesテーブルを確認してください。</div>';

      return;
    }

    const users =
      (data || []).filter(
        user =>
          user.id !== currentUser.id
      );

    if (users.length === 0) {

      result.innerHTML =
        '<div class="empty">プレイヤーが見つかりません。</div>';

      return;
    }

    users.forEach(user => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      div.innerHTML = `
        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">
          <strong>
            ${escapeHTML(user.username)}
          </strong>

          <span class="offline">
            プレイヤー
          </span>
        </div>

        <button
          class="green"
          onclick="sendFriendRequest('${user.id}')"
        >
          ＋ 追加
        </button>
      `;

      result.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請
  // ==========================================

  async function sendFriendRequest(userId) {

    if (!currentUser || guestMode) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    if (userId === currentUser.id) {

      alert(
        "自分自身にはフレンド申請できません。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .insert({
          sender_id:
            currentUser.id,

          receiver_id:
            userId,

          status:
            "pending"
        });

    if (error) {

      alert(
        "フレンド申請エラー:\n" +
        error.message
      );

      return;
    }

    alert(
      "フレンド申請を送りました！"
    );
  }


  // ==========================================
  // フレンド一覧
  // ==========================================

  async function loadFriends() {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("friendships")
        .select(`
          friend_id,
          profiles!friendships_friend_id_fkey (
            id,
            username,
            online
          )
        `)
        .eq(
          "user_id",
          currentUser.id
        );

    if (error) {

      console.error(error);

      document.getElementById(
        "friendList"
      ).innerHTML =
        '<div class="empty">フレンドはいません。</div>';

      return;
    }

    const list =
      document.getElementById(
        "friendList"
      );

    list.innerHTML = "";

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">フレンドはいません。</div>';

      return;
    }

    data.forEach(row => {

      const friend =
        row.profiles;

      if (!friend) {
        return;
      }

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      div.innerHTML = `
        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">

          <strong>
            ${escapeHTML(friend.username)}
          </strong>

          <span class="${
            friend.online
              ? "online"
              : "offline"
          }">

            ● ${
              friend.online
                ? "オンライン"
                : "オフライン"
            }

          </span>

        </div>

        ${
          friend.online
            ? `
              <button
                class="green"
                onclick="joinFriend('${friend.id}')"
              >
                参加
              </button>
            `
            : ""
        }

        <button
          class="red"
          onclick="removeFriend('${friend.id}')"
        >
          削除
        </button>
      `;

      list.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請一覧
  // ==========================================

  async function loadFriendRequests() {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .select(`
          id,
          sender_id,
          profiles!friend_requests_sender_id_fkey (
            username
          )
        `)
        .eq(
          "receiver_id",
          currentUser.id
        )
        .eq(
          "status",
          "pending"
        );

    if (error) {

      console.error(error);

      return;
    }

    const list =
      document.getElementById(
        "requestList"
      );

    list.innerHTML = "";

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">フレンド申請はありません。</div>';

      return;
    }

    data.forEach(request => {

      const name =
        request.profiles
          ? request.profiles.username
          : "Unknown";

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "request";

      div.innerHTML = `
        <strong>
          ${escapeHTML(name)}
        </strong>

        <p>
          フレンド申請が届いています。
        </p>

        <button
          class="green"
          onclick="acceptFriend(
            '${request.id}',
            '${request.sender_id}'
          )"
        >
          ✓ 承認
        </button>

        <button
          class="red"
          onclick="rejectFriend(
            '${request.id}'
          )"
        >
          ✕ 拒否
        </button>
      `;

      list.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請承認
  // ==========================================

  async function acceptFriend(
    requestId,
    senderId
  ) {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      error: requestError
    } =
      await supabaseClient
        .from("friend_requests")
        .update({
          status:
            "accepted"
        })
        .eq(
          "id",
          requestId
        );

    if (requestError) {

      alert(
        "申請処理に失敗しました。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friendships")
        .insert([
          {
            user_id:
              currentUser.id,

            friend_id:
              senderId
          },

          {
            user_id:
              senderId,

            friend_id:
              currentUser.id
          }
        ]);

    if (error) {

      alert(
        "フレンド登録に失敗しました:\n" +
        error.message
      );

      return;
    }

    alert(
      "フレンドになりました！"
    );

    await loadFriends();
    await loadFriendRequests();
  }


  // ==========================================
  // フレンド申請拒否
  // ==========================================

  async function rejectFriend(
    requestId
  ) {

    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .update({
          status:
            "rejected"
        })
        .eq(
          "id",
          requestId
        );

    if (error) {

      alert(
        "申請の拒否に失敗しました。"
      );

      return;
    }

    await loadFriendRequests();
  }


  // ==========================================
  // フレンド削除
  // ==========================================

  async function removeFriend(
    friendId
  ) {

    if (!currentUser || guestMode) {
      return;
    }

    if (!confirm(
      "このフレンドを削除しますか？"
    )) {
      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friendships")
        .delete()
        .or(
          `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
        );

    if (error) {

      alert(
        "フレンド削除エラー:\n" +
        error.message
      );

      return;
    }

    await loadFriends();
  }


  // ==========================================
  // フレンドのパーティー参加
  // ==========================================

  function joinFriend(
    friendId
  ) {

    alert(
      "このフレンドのパーティー参加機能を準備中です。"
    );
  }


  // ==========================================
  // パーティー作成
  // ==========================================

  async function createParty() {

    if (!currentUser) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    if (guestMode) {

      alert(
        "仮アカウントではパーティーを保存できません。"
      );

      return;
    }

    const partyCode =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    const {
      data,
      error
    } =
      await supabaseClient
        .from("parties")
        .insert({
          owner_id:
            currentUser.id,

          party_code:
            partyCode
        })
        .select()
        .single();

    if (error) {

      alert(
        "パーティー作成エラー:\n" +
        error.message
      );

      return;
    }

    document.getElementById(
      "partyArea"
    ).innerHTML = `

      <div class="partyBox">

        <h3>
          🎉 パーティー作成済み
        </h3>

        <p>
          パーティーコード
        </p>

        <strong style="font-size:24px;">
          ${escapeHTML(
            data.party_code
          )}
        </strong>

        <br>

        <button
          class="red"
          onclick="leaveParty('${data.id}')"
        >
          パーティーを解散
        </button>

      </div>
    `;
  }


  // ==========================================
  // パーティー退出
  // ==========================================

  async function leaveParty(
    partyId
  ) {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("parties")
        .delete()
        .eq(
          "id",
          partyId
        )
        .eq(
          "owner_id",
          currentUser.id
        );

    if (error) {

      alert(
        "パーティーを解散できませんでした。"
      );

      return;
    }

    document.getElementById(
      "partyArea"
    ).innerHTML =
      '<div class="empty">パーティーに参加していません。</div>';
  }


  // ==========================================
  // HTMLエスケープ
  // ==========================================

  function escapeHTML(
    value
  ) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );
  }


  // ==========================================
  // ログイン状態確認
  // ==========================================

  async function checkUser() {

    try {

      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();

      if (user) {

        currentUser =
          user;

        guestMode = false;

        setLoggedInUI(
          user.email
        );

        await loadFriends();
        await loadFriendRequests();

      } else {

        setLoggedOutUI();

      }

    } catch (error) {

      console.error(
        "checkUser error:",
        error
      );

      setLoggedOutUI();
    }
  }


  // ==========================================
  // 認証状態変更監視
  // ==========================================

  supabaseClient.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      /*
        SIGNED_INなどでログインした場合だけ
        UIを更新する。

        SIGNED_OUTならログアウト状態にする。
      */

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        guestMode = false;

        setLoggedInUI(
          session.user.email
        );

        await loadFriends();
        await loadFriendRequests();

      } else if (!guestMode) {

        currentUser =
          null;

        setLoggedOutUI();

      }
    }
  );


  // ==========================================
  // 初期化
  // ==========================================

  checkUser();

</script>

</body>
</html>
