<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カスタム・レティクル画面</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #0f172a;
    color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
  }

  /* コントロールパネル（設定用UI） */
  .control-panel {
    position: relative;
    z-index: 10;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(10px);
    padding: 20px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    display: flex;
    gap: 20px;
    align-items: center;
    margin-bottom: 30px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
  }

  label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: bold;
  }

  select, input {
    background: #0f172a;
    color: white;
    border: 1px solid #334155;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  input[type="color"] {
    padding: 0;
    width: 40px;
    height: 35px;
    cursor: pointer;
  }

  /* 画面中央に絶対配置するレティクル本体 */
  #reticle {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; /* マウス操作を透過させる */
    z-index: 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* レティクルの形状スタイル */
  .reticle-dot {
    border-radius: 50%;
  }

  .reticle-cross {
    position: relative;
  }
  .reticle-cross::before,
  .reticle-cross::after {
    content: '';
    position: absolute;
    background-color: var(--reticle-color, #22c55e);
  }
  /* 横線 */
  .reticle-cross::before {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: var(--reticle-size, 20px);
    height: 2px;
  }
  /* 縦線 */
  .reticle-cross::after {
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: var(--reticle-size, 20px);
  }

  .reticle-circle {
    border: 2px solid var(--reticle-color, #22c55e);
    border-radius: 50%;
    box-sizing: border-box;
  }
</style>
</head>
<body>

  <!-- 画面中央のレティクル -->
  <div id="reticle" class="reticle-cross"></div>

  <!-- 設定パネル -->
  <div class="control-panel">
    <div class="control-group">
      <label for="shapeSelect">形状</label>
      <select id="shapeSelect" onchange="updateReticle()">
        <option value="cross">十字 (Cross)</option>
        <option value="dot">ドット (Dot)</option>
        <option value="circle">サークル (Circle)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="colorPicker">カラー</label>
      <input type="color" id="colorPicker" value="#22c55e" oninput="updateReticle()">
    </div>

    <div class="control-group">
      <label for="sizeRange">サイズ: <span id="sizeVal">20</span>px</label>
      <input type="range" id="sizeRange" min="6" max="60" value="20" oninput="updateReticle()">
    </div>
  </div>

<script>
  function updateReticle() {
    const shape = document.getElementById("shapeSelect").value;
    const color = document.getElementById("colorPicker").value;
    const size = document.getElementById("sizeRange").value;
    
    document.getElementById("sizeVal").textContent = size;

    const reticle = document.getElementById("reticle");
    
    // クラスを一旦リセット
    reticle.className = "";
    reticle.style = "";
    
    // カスタムプロパティ・サイズの適用
    reticle.style.setProperty('--reticle-color', color);
    reticle.style.setProperty('--reticle-size', size + 'px');

    if (shape === "cross") {
      reticle.classList.add("reticle-cross");
      reticle.style.width = size + 'px';
      reticle.style.height = size + 'px';
    } 
    else if (shape === "dot") {
      reticle.classList.add("reticle-dot");
      reticle.style.width = size + 'px';
      reticle.style.height = size + 'px';
      reticle.style.backgroundColor = color;
    } 
    else if (shape === "circle") {
      reticle.classList.add("reticle-circle");
      reticle.style.width = size + 'px';
      reticle.style.height = size + 'px';
    }
  }

  // 初期化実行
  updateReticle();
</script>

</body>
</html>
