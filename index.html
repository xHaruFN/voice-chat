/* =========================================
   アカウント作成
========================================= */

async function signUp() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!email || !password) {

    alert(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }

  if (password.length < 6) {

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {

      alert(
        "アカウント作成エラー:\n" +
        error.message
      );

      return;
    }

    /*
      メール確認がOFFなら
      data.session が存在するため
      そのままログインできる。
    */

    if (
      data.session &&
      data.user
    ) {

      currentUser =
        data.user;

      guestMode = false;

      await createProfile();

      await showUser();

      alert(
        "アカウントを作成してログインしました！"
      );

      return;
    }

    /*
      メール確認ONの場合
    */

    if (data.user) {

      alert(
        "アカウントは作成されました。\n\n" +
        "Supabaseのメール確認がONになっているため、" +
        "確認メールを確認してからログインしてください。"
      );

    }

  } catch (error) {

    alert(
      "通信エラー:\n" +
      error.message
    );

  }

}


/* =========================================
   プロフィール作成
========================================= */

async function createProfile() {

  if (
    !currentUser ||
    guestMode
  ) {
    return;
  }

  const email =
    currentUser.email || "User";

  const defaultName =
    email.split("@")[0];

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username: defaultName,
        online: true,
        status: "online"
      });

  if (error) {

    console.warn(
      "profiles作成:",
      error
    );

  }

}

async function signIn() {

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!email || !password) {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if (error) {

      alert(
        "ログインエラー:\n" +
        error.message
      );

      return;
    }

    currentUser =
      data.user;

    guestMode = false;

    await createProfile();

    await showUser();

  } catch (error) {

    alert(
      "ログイン通信エラー:\n" +
      error.message
    );

  }

}

   ユーザー表示

async function showUser() {

  if (!currentUser) {
    return;
  }

  let name =
    currentUser.email ||
    "User";

  if (!guestMode) {

    const {
      data
    } =
      await supabaseClient
        .from("profiles")
        .select("username")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();

    if (
      data &&
      data.username
    ) {

      name =
        data.username;

    }

  setLoggedInUI(name);

  await loadFriends();

  await loadFriendRequests();

}

      "すでにログインしています。"

  const saved =
    localStorage.getItem(

    );

  );

  currentUser = {

    email:

  };

/* =========================================
   名前変更
========================================= */

async function changeUsername() {

  if (!currentUser) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  const input =
    document.getElementById(
      "newUsername"
    );

  const name =
    input.value.trim();

  if (!name) {

    alert(
      "新しい名前を入力してください。"
    );

    return;
  }

  if (name.length > 30) {

    alert(
      "名前は30文字以内にしてください。"
    );

  }

  */

  if (guestMode) {

    );

    setLoggedInUI(name);

    if (currentRoomName) {

    }

  }

  /*

  */

  } =

        username: name,

  document.getElementById(

  }

/* =========================================
   マイク
========================================= */

async function toggleMic() {

  if (!micEnabled) {

    try {

      if (!microphone) {

        microphone =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });

      }

      micEnabled = true;

      setAudioTracksEnabled(true);

      document.getElementById(
        "micButton"
      ).textContent =
        "🔇 マイクOFF";

      updatePeerTracks();

    } catch (error) {

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );

    }

  } else {

    micEnabled = false;

    setAudioTracksEnabled(false);

    document.getElementById(
      "micButton"
    ).textContent =
      "🎤 マイクON";

    updatePeerTracks();

  }

}


function setAudioTracksEnabled(enabled) {

  if (!microphone) {
    return;
  }

  microphone
    .getAudioTracks()
    .forEach(
      track => {
        track.enabled = enabled;
      }
    );

}


/* =========================================
   カメラ
========================================= */

async function toggleCamera() {

  if (!cameraEnabled) {

    try {

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true
          });

      cameraEnabled = true;

      document.getElementById(
        "cameraButton"
      ).textContent =
        "📷 カメラOFF";

      addLocalVideo(
        cameraStream
      );

      updatePeerTracks();

    } catch (error) {

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );

    }

  } else {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      cameraStream = null;

    }

    cameraEnabled = false;

    document.getElementById(
      "cameraButton"
    ).textContent =
      "📷 カメラON";

    removeLocalVideo();

    updatePeerTracks();

  }

}


/* =========================================
   画面共有
========================================= */

async function toggleScreen() {

  if (!screenEnabled) {

    try {

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video: true,
            audio: true
          });

      screenEnabled = true;

      document.getElementById(
        "screenButton"
      ).textContent =
        "⛶ 画面共有OFF";

      addLocalVideo(
        screenStream,
        "🖥️ 画面共有"
      );

      screenStream
        .getVideoTracks()[0]
        .addEventListener(
          "ended",
          () => {
            stopScreenShare();
          }
        );

      updatePeerTracks();

    } catch (error) {

      console.log(
        "画面共有キャンセル",
        error
      );

    }

  } else {

    stopScreenShare();

  }

}


function stopScreenShare() {

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    screenStream = null;

  }

  screenEnabled = false;

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";

  if (cameraStream) {

    addLocalVideo(
      cameraStream
    );

  } else {

    removeLocalVideo();

  }

  updatePeerTracks();

}

/* =========================================
   WebRTC
========================================= */

function createPeerConnection(
  peerId
) {

  const pc =
    new RTCPeerConnection({

      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]

    });

  peerConnections[peerId] =
    pc;

  /*
    マイク
  */

  if (microphone) {

    microphone
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            microphone
          );

        }
      );

  }

  /*
    カメラ
  */

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            cameraStream
          );

        }
      );

  }

  /*
    画面共有
  */

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            screenStream
          );

        }
      );

  }

  /*
    ICE
  */

  pc.onicecandidate =
    event => {

      if (
        event.candidate &&
        roomChannel
      ) {

        roomChannel.send({

          type:
            "broadcast",

          event:
            "ice",

          payload: {

            from:
              getClientId(),

            to:
              peerId,

            candidate:
              event.candidate

          }

        });

      }

    };


  /*
    リモート映像
  */

  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) {
        return;
      }

      remoteStreams[peerId] =
        stream;

      addRemoteVideo(
        peerId,
        stream
      );

    };


  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
          "failed" ||
        pc.connectionState ===
          "closed" ||
        pc.connectionState ===
          "disconnected"
      ) {

        removePeer(
          peerId
        );

      }

    };


  return pc;

}


/* =========================================
   Offer
========================================= */

async function createOffer(
  peerId
) {

  let pc =
    peerConnections[peerId];

  if (!pc) {

    pc =
      createPeerConnection(
        peerId
      );

  }

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  if (roomChannel) {

    await roomChannel.send({

      type:
        "broadcast",

      event:
        "offer",

      payload: {

        from:
          getClientId(),

        to:
          peerId,

        offer

      }

    });

  }

}


/* =========================================
   Answer
========================================= */

async function handleOffer(
  payload
) {

  if (
    payload.to !==
    getClientId()
  ) {
    return;
  }

  const peerId =
    payload.from;

  let pc =
    peerConnections[peerId];

  if (!pc) {

    pc =
      createPeerConnection(
        peerId
      );

  }

  await pc.setRemoteDescription(
    payload.offer
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  await roomChannel.send({

    type:
      "broadcast",

    event:
      "answer",

    payload: {

      from:
        getClientId(),

      to:
        peerId,

      answer

    }

  });

}


/* =========================================
   Answer受信
========================================= */

async function handleAnswer(
  payload
) {

  if (
    payload.to !==
    getClientId()
  ) {
    return;
  }

  const pc =
    peerConnections[
      payload.from
    ];

  if (!pc) {
    return;
  }

  await pc.setRemoteDescription(
    payload.answer
  );

}


/* =========================================
   ICE
========================================= */

async function handleIce(
  payload
) {

  if (
    payload.to !==
    getClientId()
  ) {
    return;
  }

  const pc =
    peerConnections[
      payload.from
    ];

  if (!pc) {
    return;
  }

  try {

    await pc.addIceCandidate(
      payload.candidate
    );

  } catch (error) {

    console.warn(
      "ICE error",
      error
    );

  }

}


/* =========================================
   部屋参加
========================================= */

async function joinRoom() {

  const name =
    document.getElementById(
      "roomNameInput"
    ).value.trim();

  if (!name) {

    alert(
      "部屋名を入力してください。"
    );

    return;
  }

  await leaveRoom();

  currentRoomName =
    name;

  const channelName =
    "voice-room-" +
    encodeURIComponent(name);

  roomChannel =
    supabaseClient.channel(
      channelName,
      {
        config: {
          broadcast: {
            self: false
          },
          presence: {
            key: getClientId()
          }
        }
      }
    );


  /*
    シグナリング
  */

  roomChannel.on(
    "broadcast",
    {
      event: "hello"
    },
    async ({ payload }) => {

      if (
        payload.from ===
        getClientId()
      ) {
        return;
      }

      roomMembers[
        payload.from
      ] = {
        name:
          payload.name
      };

      updateRoomUserList();


      /*
        IDの小さい側を
        Offer側にする
      */

      if (
        String(getClientId()) <
        String(payload.from)
      ) {

        await createOffer(
          payload.from
        );

      }

    }
  );


  roomChannel.on(
    "broadcast",
    {
      event: "offer"
    },
    async ({ payload }) => {

      await handleOffer(
        payload
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {
      event: "answer"
    },
    async ({ payload }) => {

      await handleAnswer(
        payload
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {
      event: "ice"
    },
    async ({ payload }) => {

      await handleIce(
        payload
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {
      event: "chat"
    },
    ({ payload }) => {

      addChatMessage(
        payload.name,
        payload.message
      );

    }
  );


  roomChannel.on(
    "broadcast",
    {
      event: "user-left"
    },
    ({ payload }) => {

      removePeer(
        payload.id
      );

      delete roomMembers[
        payload.id
      ];

      updateRoomUserList();

    }
  );


  roomChannel.on(
    "presence",
    {
      event: "sync"
    },
    () => {

      const state =
        roomChannel.presenceState();

      roomMembers = {};

      Object.keys(state)
        .forEach(key => {

          const entries =
            state[key];

          if (
            entries &&
            entries.length
          ) {

            roomMembers[key] =
              entries[0];

          }

        });

      updateRoomUserList();

    }
  );


  roomChannel.on(
    "presence",
    {
      event: "join"
    },
    ({ key, newPresences }) => {

      newPresences.forEach(
        presence => {

          if (
            key !==
            getClientId()
          ) {

            roomMembers[key] =
              presence;

          }

        }
      );

      updateRoomUserList();

    }
  );


  roomChannel.on(
    "presence",
    {
      event: "leave"
    },
    ({ key }) => {

      removePeer(key);

      delete roomMembers[key];

      updateRoomUserList();

    }
  );


  await roomChannel.subscribe(
    async status => {

      if (
        status !==
        "SUBSCRIBED"
      ) {
        return;
      }

      await roomChannel.track({

        id:
          getClientId(),

        name:
          getCurrentName()

      });

      sendRoomHello();

      document.getElementById(
        "currentRoom"
      ).innerHTML =
        `
        <span class="roomName">
          🟢 ${escapeHTML(name)}
        </span>
        `;

      document.getElementById(
        "status"
      ).textContent =
        "🟢 「" +
        name +
        "」に参加中";

      addChatMessage(
        "SYSTEM",
        "「" +
        name +
        "」に参加しました。"
      );

    }
  );

}


function sendRoomHello() {

  if (!roomChannel) {
    return;
  }

  roomChannel.send({

    type:
      "broadcast",

    event:
      "hello",

    payload: {

      from:
        getClientId(),

      name:
        getCurrentName()

    }

  });

}


/* =========================================
   部屋退出
========================================= */

async function leaveRoom() {

  if (!roomChannel) {

    currentRoomName =
      null;

    return;

  }

  try {

    await roomChannel.send({

      type:
        "broadcast",

      event:
        "user-left",

      payload: {

        id:
          getClientId()

      }

    });

  } catch {}

  Object.keys(
    peerConnections
  )
    .forEach(
      peerId => {

        try {

          peerConnections[
            peerId
          ].close();

        } catch {}

      }
    );

  peerConnections = {};

  remoteStreams = {};

  roomMembers = {};

  try {

    await roomChannel.untrack();

  } catch {}

  try {

    await supabaseClient.removeChannel(
      roomChannel
    );

  } catch {}

  roomChannel = null;

  currentRoomName =
    null;

  document.getElementById(
    "participants"
  ).innerHTML =
    "";

  document.getElementById(
    "roomUserList"
  ).textContent =
    "部屋に参加していません。";

  document.getElementById(
    "currentRoom"
  ).innerHTML =
    `
    <span class="roomName">
      未参加
    </span>
    `;

}


/* =========================================
   Peer削除
========================================= */

function removePeer(
  peerId
) {

  const pc =
    peerConnections[
      peerId
    ];

  if (pc) {

    try {
      pc.close();
    } catch {}

  }

  delete peerConnections[
    peerId
  ];

  delete remoteStreams[
    peerId
  ];

  const box =
    document.getElementById(
      "remote-" + peerId
    );

  if (box) {
    box.remove();
  }

}


/* =========================================
   Peerのトラック更新
========================================= */

function updatePeerTracks() {

  Object.keys(
    peerConnections
  )
    .forEach(
      async peerId => {

        const pc =
          peerConnections[
            peerId
          ];

        if (!pc) {
          return;
        }

        /*
          現在の映像トラックを取得
        */

        const videoTrack =
          screenStream
            ?.getVideoTracks()[0] ||
          cameraStream
            ?.getVideoTracks()[0];

        const videoSender =
          pc.getSenders()
            .find(
              sender =>
                sender.track &&
                sender.track.kind ===
                "video"
            );

        if (
          videoTrack &&
          videoSender
        ) {

          await videoSender.replaceTrack(
            videoTrack
          );

        }


        /*
          音声
        */

        if (microphone) {

          const audioTrack =
            microphone
              .getAudioTracks()[0];

          const audioSender =
            pc.getSenders()
              .find(
                sender =>
                  sender.track &&
                  sender.track.kind ===
                  "audio"
              );

          if (
            audioTrack &&
            audioSender
          ) {

            await audioSender.replaceTrack(
              audioTrack
            );

          }

        }

      }
    );

}

    );

    return;
  }

  const name =
    document.getElementById(
      "friendSearch"
    ).value.trim();

  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,online"
      )
      .ilike(
        "username",
        "%" + name + "%"
      )
      .limit(10);

    document.getElementById(
      "searchResult"
    );

      );

  if (!users.length) {

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    user => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      div.innerHTML =
        `
        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">

          <strong>
            ${escapeHTML(user.username)}
          </strong>

          <span class="${
            user.online
              ? "online"
              : "offline"
          }">
            ● ${
              user.online
                ? "オンライン"
                : "オフライン"
            }
          </span>

        </div>

        <button
          class="green"
          onclick="sendFriendRequest('${user.id}')"
        >

        `;

      result.appendChild(
        div
      );

    }
  );

/* =========================================
   承認
========================================= */

async function acceptFriend(
  requestId,
  senderId
) {

  if (
    !currentUser ||
    guestMode
  ) {
    return;
  }

  const {
    error:
      requestError
  } =
    await supabaseClient
      .from("friend_requests")
      .update({
        status:
          "accepted"
      })
      .eq(
        "id",
        requestId
      );

  if (requestError) {

    alert(
      "申請処理に失敗しました。"
    );

    return;

  }

  const {
    error
  } =
    await supabaseClient
      .from("friendships")
      .insert([
        {
          user_id:
            currentUser.id,

          friend_id:
            senderId
        },
        {
          user_id:
            senderId,

          friend_id:
            currentUser.id
        }
      ]);

  if (error) {

    alert(
      "フレンド登録に失敗しました:\n" +
      error.message
    );

    return;

  }

  await loadFriends();

  await loadFriendRequests();

  alert(
    "フレンドになりました！"
  );

}


/* =========================================
   拒否
========================================= */

async function rejectFriend(
  requestId
) {

  const {
    error
  } =
    await supabaseClient
      .from("friend_requests")
      .update({
        status:
          "rejected"
      })
      .eq(
        "id",
        requestId
      );

  if (error) {

    alert(
      "申請の拒否に失敗しました。"
    );

    return;

  }

  await loadFriendRequests();

}


/* =========================================
   フレンド削除
========================================= */

async function removeFriend(
  friendId
) {

  if (
    !currentUser ||
    guestMode
  ) {
    return;
  }

  if (
    !confirm(
      "このフレンドを削除しますか？"
    )
  ) {
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("friendships")
      .delete()
      .or(
        `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
      );

  if (error) {

    alert(
      "フレンド削除エラー:\n" +
      error.message
    );

    return;

  }

  await loadFriends();

}


/* =========================================
   パーティー
========================================= */

async function createParty() {

  if (
    !currentUser ||
    guestMode
  ) {

    alert(
      "仮アカウントではパーティー保存機能を利用できません。\n" +
      "部屋機能は仮アカウントでも利用できます。"
    );

    return;

  }

  const code =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("parties")
      .insert({
        owner_id:
          currentUser.id,

        party_code:
          code
      })
      .select()
      .single();

  if (error) {

    alert(
      "パーティー作成エラー:\n" +
      error.message
    );

    return;

  }

  document.getElementById(
    "partyArea"
  ).innerHTML =
    `
    <div class="partyBox">

      <h3>
        🎉 パーティー作成済み
      </h3>

      <p>
        パーティーコード
      </p>

      <strong
        style="font-size:24px;"
      >
        ${escapeHTML(data.party_code)}
      </strong>

      <br>

      <button
        class="red"
        onclick="leaveParty('${data.id}')"
      >
        パーティーを解散
      </button>

    </div>
    `;

}


/* =========================================
   パーティー解散
========================================= */

async function leaveParty(
  partyId
) {

  if (
    !currentUser ||
    guestMode
  ) {
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("parties")
      .delete()
      .eq(
        "id",
        partyId
      )
      .eq(
        "owner_id",
        currentUser.id
      );

  if (error) {

    alert(
      "パーティーを解散できませんでした。"
    );

    return;

  }

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';

}


/* =========================================
   メディア停止
========================================= */

function stopAllMedia() {

  if (microphone) {

    microphone
      .getTracks()
      .forEach(
        track => track.stop()
      );

    microphone = null;

  }

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    cameraStream = null;

  }

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    screenStream = null;

  }

  micEnabled = false;

  cameraEnabled = false;

  screenEnabled = false;

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   ログイン状態確認
========================================= */

async function checkUser() {

  try {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth
        .getUser();

    if (!user) {

      setLoggedOutUI();

      return;

    }

    currentUser =
      user;

    guestMode = false;

    await createProfile();

    await showUser();

  } catch (error) {

    console.error(
      error
    );

    setLoggedOutUI();

  }

}


/* =========================================
   Auth監視
========================================= */

supabaseClient.auth
  .onAuthStateChange(
    async (
      event,
      session
    ) => {

      if (
        session &&
        session.user
      ) {

        currentUser =
          session.user;

        guestMode = false;

        await createProfile();

        await showUser();

      }

      else if (
        !guestMode
      ) {

        currentUser =
          null;

        setLoggedOutUI();

      }

    }
  );


/* =========================================
   初期化
========================================= */

checkUser();
