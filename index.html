<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice & Screen Share Party Room</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --bg-input: #334155;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --danger: #ef4444;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
header { height: 60px; background: var(--bg-card); border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.room-info { display: flex; align-items: center; gap: 12px; background: var(--bg-dark); padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; }
.copy-btn { background: var(--primary); border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; }

.app-container { flex: 1; display: grid; grid-template-columns: 1fr 320px; height: calc(100vh - 60px - 72px); }
.stage-container { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; align-items: center; }

.spotlight-area { width: 100%; max-width: 1100px; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 2px solid var(--primary); display: none; }
.spotlight-area.active { display: block; }
.spotlight-area video { width: 100%; max-height: 500px; object-fit: contain; }
.spotlight-header { position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85); padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; color: var(--primary); }

.video-grid { width: 100%; max-width: 1100px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.user-tile { background: var(--bg-card); border-radius: 12px; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.user-tile video { width: 100%; height: 100%; object-fit: cover; }
.avatar-placeholder { width: 60px; height: 60px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
.tile-overlay { position: absolute; bottom: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; background: rgba(15, 23, 42, 0.75); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }

.sidebar { background: var(--bg-card); border-left: 1px solid #334155; display: flex; flex-direction: column; }
.sidebar-section { padding: 16px; border-bottom: 1px solid #334155; }
.join-box { display: flex; flex-direction: column; gap: 8px; }
input[type="text"] { background: var(--bg-input); border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }

.chat-container { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow: hidden; }
.chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.msg { background: var(--bg-input); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 90%; word-break: break-word; }
.msg.mine { align-self: flex-end; background: var(--primary); }
.msg .author { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; }

.controls-bar { height: 72px; background: var(--bg-card); border-top: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 16px; }
.control-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--bg-input); color: white; font-size: 1.2rem; cursor: pointer; }
.control-btn.active { background: var(--primary); }
.control-btn.off { background: var(--danger); }
#remoteAudioContainer { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">🎙️ VoiceParty</div>
  <div class="room-info">
    <span>ルームID: <strong id="currentRoomDisplay">未参加</strong></span>
    <button class="copy-btn" onclick="copyRoomId()">コピー</button>
  </div>
</header>

<div class="app-container">
  <div class="stage-container">
    <div id="spotlightArea" class="spotlight-area">
      <div id="spotlightTitle" class="spotlight-header">🖥️ 画面共有中</div>
      <video id="spotlightVideo" autoplay playsinline muted></video>
    </div>
    <div id="videoGrid" class="video-grid"></div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <h3 style="font-size:0.9rem; color:var(--text-muted); margin-bottom:8px;">ルーム設定</h3>
      <div class="join-box">
        <input type="text" id="usernameInput" placeholder="表示名" value="ユーザー">
        <input type="text" id="roomIdInput" placeholder="ルームIDを入力">
        <button id="joinBtn" class="btn" onclick="startJoinProcess()">🚪 ルームに参加</button>
      </div>
    </div>

    <div class="chat-container">
      <h3 style="font-size:0.9rem; color:var(--text-muted); margin-bottom:8px;">ログ & チャット</h3>
      <div id="chatMessages" class="chat-messages"></div>
      <div style="display: flex; gap: 6px;">
        <input type="text" id="chatInput" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendChatMessage()">
        <button class="btn" onclick="sendChatMessage()">送信</button>
      </div>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button id="micBtn" class="control-btn active" onclick="toggleMic()">🎤</button>
  <button id="camBtn" class="control-btn off" onclick="toggleCamera()">📷</button>
  <button id="screenBtn" class="control-btn off" onclick="toggleScreenShare()">🖥️</button>
  <button class="control-btn off" style="background:#dc2626;" onclick="leaveRoom()">🚪</button>
</div>

<div id="remoteAudioContainer"></div>

<script>
let myPeer = null;
let myPeerId = '';
let currentRoomId = '';
let myName = 'ユーザー';
let localStream = null;
let screenStream = null;

let isMicOn = true;
let isCamOn = false;
let isScreenSharing = false;

const peers = {}; // peerId -> { conn, call, stream, name }

const videoGrid = document.getElementById('videoGrid');
const spotlightArea = document.getElementById('spotlightArea');
const spotlightVideo = document.getElementById('spotlightVideo');
const spotlightTitle = document.getElementById('spotlightTitle');
const remoteAudioContainer = document.getElementById('remoteAudioContainer');

async function initLocalStream() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    addSystemMessage("⚠️ マイクを取得できませんでした（無音で開始します）。");
    localStream = new MediaStream();
    isMicOn = false;
    updateControlsUI();
  }
}

function startJoinProcess() {
  myName = document.getElementById('usernameInput').value.trim() || 'ユーザー';
  currentRoomId = document.getElementById('roomIdInput').value.trim();

  if (!currentRoomId) return alert("ルームIDを入力してください。");

  if (myPeer) myPeer.destroy();

  // ランダムな自身のIDを発行（ID衝突防止）
  myPeer = new Peer();

  addSystemMessage("📡 ネットワークへ接続中...");

  myPeer.on('open', (id) => {
    myPeerId = id;
    document.getElementById('currentRoomDisplay').textContent = currentRoomId;
    renderUserTile(myPeerId, myName, getActiveStream(), true);

    const hubId = `room-${currentRoomId}-hub`;
    
    // ハブ（部屋の仲介役）への接続を試みる
    addSystemMessage(`🔍 ルーム [${currentRoomId}] を検索中...`);
    tryConnectHub(hubId);
  });

  myPeer.on('connection', (conn) => setupDataConnection(conn));
  myPeer.on('call', (call) => {
    call.answer(getActiveStream());
    setupCallEvents(call);
  });

  myPeer.on('error', (err) => {
    addSystemMessage(`❌ Peerエラー: ${err.type}`);
  });
}

function tryConnectHub(hubId) {
  const conn = myPeer.connect(hubId);
  let connected = false;

  const timer = setTimeout(() => {
    if (!connected) {
      // 応答がなければ自分が最初のハブ（親）になる
      conn.close();
      becomeHub(hubId);
    }
  }, 2000);

  conn.on('open', () => {
    connected = true;
    clearTimeout(timer);
    addSystemMessage("✅ ルームに参加しました（ゲスト）");
    setupDataConnection(conn);
  });
}

function becomeHub(hubId) {
  addSystemMessage("👑 ルームを作成しました（ホスト）");
  const hubPeer = new Peer(hubId);
  
  hubPeer.on('open', () => {
    hubPeer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'REQ_PEERS') {
          // 既存の全参加者リストを新規参加者に返信
          const memberList = Object.keys(peers).concat([myPeerId]);
          conn.send({ type: 'RES_PEERS', members: memberList });
        }
      });
    });
  });

  hubPeer.on('error', () => {
    // 競合した場合は再度通常接続
    setTimeout(() => tryConnectHub(hubId), 1000);
  });
}

function connectToPeer(targetPeerId) {
  if (peers[targetPeerId] || targetPeerId === myPeerId) return;

  const conn = myPeer.connect(targetPeerId);
  setupDataConnection(conn);

  const call = myPeer.call(targetPeerId, getActiveStream());
  setupCallEvents(call);
}

function setupDataConnection(conn) {
  const targetId = conn.peer;

  conn.on('open', () => {
    if (!peers[targetId]) peers[targetId] = {};
    peers[targetId].conn = conn;

    conn.send({ type: 'HANDSHAKE', name: myName, peerId: myPeerId });
    conn.send({ type: 'REQ_PEERS' });
  });

  conn.on('data', (data) => {
    if (data.type === 'HANDSHAKE') {
      if (!peers[data.peerId]) peers[data.peerId] = {};
      peers[data.peerId].name = data.name;
    } else if (data.type === 'RES_PEERS') {
      data.members.forEach(id => {
        if (id !== myPeerId) connectToPeer(id);
      });
    } else if (data.type === 'CHAT') {
      appendChatMessage(data.name, data.text, false);
    } else if (data.type === 'SCREEN') {
      if (data.isSharing) setSpotlight(data.peerId, `${data.name} の画面`, peers[data.peerId]?.stream);
      else removeSpotlight();
    }
  });

  conn.on('close', () => cleanupPeer(targetId));
}

function setupCallEvents(call) {
  const targetId = call.peer;
  if (!peers[targetId]) peers[targetId] = {};
  peers[targetId].call = call;

  call.on('stream', (remoteStream) => {
    peers[targetId].stream = remoteStream;

    let audioEl = document.getElementById(`audio-${targetId}`);
    if (!audioEl) {
      audioEl = document.createElement('audio');
      audioEl.id = `audio-${targetId}`;
      audioEl.autoplay = true;
      remoteAudioContainer.appendChild(audioEl);
    }
    audioEl.srcObject = remoteStream;

    renderUserTile(targetId, peers[targetId].name || '参加者', remoteStream, false);
  });

  call.on('close', () => cleanupPeer(targetId));
}

function cleanupPeer(id) {
  const tile = document.getElementById(`tile-${id}`);
  if (tile) tile.remove();
  const audio = document.getElementById(`audio-${id}`);
  if (audio) audio.remove();
  delete peers[id];
}

function getActiveStream() {
  return isScreenSharing && screenStream ? screenStream : localStream;
}

function toggleMic() {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (t) {
    isMicOn = !isMicOn;
    t.enabled = isMicOn;
    updateControlsUI();
  }
}

async function toggleCamera() {
  if (!isCamOn) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      const vt = s.getVideoTracks()[0];
      localStream.addTrack(vt);
      isCamOn = true;
      replaceTracks(vt);
    } catch { alert("カメラを起動できません"); }
  } else {
    const vt = localStream.getVideoTracks()[0];
    if (vt) { vt.stop(); localStream.removeTrack(vt); }
    isCamOn = false;
    replaceTracks(null);
  }
  updateControlsUI();
  renderUserTile(myPeerId, myName, getActiveStream(), true);
}

async function toggleScreenShare() {
  if (!isScreenSharing) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const st = screenStream.getVideoTracks()[0];
      st.onended = () => stopScreenShare();
      isScreenSharing = true;
      replaceTracks(st);
      setSpotlight(myPeerId, `${myName} の画面`, screenStream);
      broadcast({ type: 'SCREEN', isSharing: true, name: myName });
    } catch { return; }
  } else stopScreenShare();
  updateControlsUI();
}

function stopScreenShare() {
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  isScreenSharing = false;
  replaceTracks(isCamOn ? localStream.getVideoTracks()[0] : null);
  removeSpotlight();
  broadcast({ type: 'SCREEN', isSharing: false, name: myName });
  renderUserTile(myPeerId, myName, getActiveStream(), true);
  updateControlsUI();
}

function replaceTracks(track) {
  Object.values(peers).forEach(p => {
    if (p.call && p.call.peerConnection) {
      const s = p.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (s) s.replaceTrack(track);
      else if (track) p.call.peerConnection.addTrack(track, getActiveStream());
    }
  });
}

function setSpotlight(id, title, stream) {
  spotlightTitle.textContent = `🖥️ ${title}`;
  spotlightVideo.srcObject = stream;
  spotlightArea.classList.add('active');
}
function removeSpotlight() { spotlightArea.classList.remove('active'); }

function broadcast(data) {
  Object.values(peers).forEach(p => p.conn && p.conn.open && p.conn.send(data));
}

function updateControlsUI() {
  document.getElementById('micBtn').className = `control-btn ${isMicOn ? 'active' : 'off'}`;
  document.getElementById('camBtn').className = `control-btn ${isCamOn ? 'active' : 'off'}`;
  document.getElementById('screenBtn').className = `control-btn ${isScreenSharing ? 'active' : 'off'}`;
}

function renderUserTile(id, name, stream, isSelf) {
  let tile = document.getElementById(`tile-${id}`);
  if (!tile) {
    tile = document.createElement('div');
    tile.id = `tile-${id}`;
    tile.className = 'user-tile';
    videoGrid.appendChild(tile);
  }
  const hasVideo = stream && stream.getVideoTracks().length > 0 && stream.getVideoTracks()[0].enabled;
  tile.innerHTML = `
    ${hasVideo ? `<video id="v-${id}" autoplay playsinline muted></video>` : `<div class="avatar-placeholder">${name.charAt(0)}</div>`}
    <div class="tile-overlay"><span>${name} ${isSelf ? '(自分)' : ''}</span></div>
  `;
  if (hasVideo) tile.querySelector(`#v-${id}`).srcObject = stream;
}

function sendChatMessage() {
  const input = document.getElementById('chatInput');
  if (!input.value.trim()) return;
  broadcast({ type: 'CHAT', name: myName, text: input.value.trim() });
  appendChatMessage(myName, input.value.trim(), true);
  input.value = '';
}

function appendChatMessage(name, text, isMine) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${isMine ? 'mine' : ''}`;
  div.innerHTML = `<div class="author">${name}</div><div>${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function addSystemMessage(text) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.style.cssText = "font-size:0.75rem; color:#94a3b8; text-align:center; margin:2px 0;";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function copyRoomId() {
  navigator.clipboard.writeText(currentRoomId);
  alert("コピーしました: " + currentRoomId);
}
function leaveRoom() { location.reload(); }

initLocalStream();
</script>
</body>
</html>
