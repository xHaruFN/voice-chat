  <style>

    }

    .friend button {
      padding: 8px 14px;
      margin: 0 0 0 5px;
    }

    .request {

    .partyBox {

  </style>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

  <!-- ==========================================
       アカウント
       ========================================== -->

  <div class="card">

    <h2>👤 アカウント</h2>

    <input

  <div class="card">

        👤

        <h3>

          id="screenVideo"

          muted
          playsinline

  <div
    class="card"

  >

    <h2>👥 フレンド</h2>

    <input
      id="friendSearch"
      type="text"
      placeholder="🔍 プレイヤーを検索"
    >

    <button onclick="searchFriend()">
      🔍 検索
    </button>

    <div id="searchResult"></div>

    <div id="friendList">

  </div>


  <!-- ==========================================
       パーティー
       ========================================== -->

  <div
    class="card"
    id="partyCard"
  >

    <h2>🎉 パーティー</h2>

    <button
      class="green"
      onclick="createParty()"
    >
      ＋ パーティー作成
    </button>

    <div id="partyArea">
      <div class="empty">
        パーティーに参加していません。
      </div>
    </div>

  </div>

</main>


<script>

  // ==========================================
  // Supabase設定
  // ==========================================

  const SUPABASE_URL =
    "https://znzwsbumfqderjoehrwd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_HbZtKu-et14XUIGwIegw0g_ltLcrBhl";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // 状態
  // ==========================================

  let currentUser = null;
  let guestMode = false;

  // マイク
  let microphone = null;
  let micEnabled = false;

  // カメラ
  let cameraStream = null;
  let cameraEnabled = false;

  // 画面共有
  let screenStream = null;
  let screenEnabled = false;


  // ==========================================
  // UI更新
  // ==========================================

  function setLoggedInUI(name) {

    document.getElementById(
      "username"
    ).textContent = name;

    document.getElementById(
      "onlineStatus"
    ).textContent = "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent = "✅ ログイン中";

    document.getElementById(
      "logoutButton"
    ).style.display = "inline-block";

    document.getElementById(
      "settingsCard"
    ).style.display = "block";

    document.getElementById(
      "friendCard"
    ).style.display = "block";

    document.getElementById(
      "partyCard"
    ).style.display = "block";
  }


  function setLoggedOutUI() {

    document.getElementById(
      "username"
    ).textContent = "未ログイン";

    document.getElementById(
      "onlineStatus"
    ).textContent = "⚪ オフライン";

    document.getElementById(
      "accountStatus"
    ).textContent = "ログインしていません";

    document.getElementById(
      "logoutButton"
    ).style.display = "none";

    document.getElementById(
      "settingsCard"
    ).style.display = "none";

    document.getElementById(
      "friendCard"
    ).style.display = "none";

    document.getElementById(
      "partyCard"
    ).style.display = "none";
  }


  // ==========================================
  // アカウント作成
  // ==========================================

  async function signUp() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    if (password.length < 6) {

      alert(
        "パスワードは6文字以上にしてください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "アカウント作成エラー: " +
        error.message
      );

      return;
    }

    alert(
      "アカウントを作成しました！\n\n" +
      "メール確認が有効の場合はメールを確認してください。"
    );
  }


  // ==========================================
  // ログイン
  // ==========================================

  async function signIn() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();

    const password =
      document.getElementById(
        "password"
      ).value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "ログインエラー: " +
        error.message
      );

      return;
    }

    currentUser = data.user;
    guestMode = false;

    setLoggedInUI(
      currentUser.email
    );

    await loadFriends();
    await loadFriendRequests();
  }


  // ==========================================
  // ログアウト
  // ==========================================

  async function signOut() {

    // メディアを全部停止
    stopMicrophone();
    stopCamera();
    stopScreenShare();

    if (guestMode) {

      currentUser = null;
      guestMode = false;

      setLoggedOutUI();

      alert(
        "仮アカウントからログアウトしました。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.signOut();

    if (error) {

      alert(
        "ログアウトに失敗しました: " +
        error.message
      );

      return;
    }

    currentUser = null;
    guestMode = false;

    setLoggedOutUI();

    document.getElementById(
      "friendList"
    ).innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    document.getElementById(
      "requestList"
    ).innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';
  }


  // ==========================================
  // 仮アカウント
  // ==========================================

  function createGuest() {

    if (currentUser) {

      alert(
        "すでにログインしています。"
      );

      return;
    }

    const guestName =
      "Guest_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    currentUser = {
      id: "guest_" + Date.now(),
      email: guestName
    };

    guestMode = true;

    setLoggedInUI(
      guestName
    );

    document.getElementById(
      "accountStatus"
    ).textContent =
      "👻 仮アカウント: " +
      guestName;

    document.getElementById(
      "friendList"
    ).innerHTML =
      '<div class="empty">仮アカウントではフレンド機能を利用できません。</div>';

    document.getElementById(
      "requestList"
    ).innerHTML =
      '<div class="empty">仮アカウントではフレンド申請を利用できません。</div>';

    alert(
      "仮アカウントを作成しました！\n\n" +
      guestName
    );
  }


  // ==========================================
  // メールアドレス変更
  // ==========================================

  async function changeEmail() {

    if (guestMode) {

      alert(
        "仮アカウントでは変更できません。"
      );

      return;
    }

    const newEmail =
      document.getElementById(
        "newEmail"
      ).value.trim();

    if (!newEmail) {

      alert(
        "新しいメールアドレスを入力してください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        email: newEmail
      });

    if (error) {

      alert(
        "メールアドレス変更エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ メールアドレス変更を受け付けました。";

    document.getElementById(
      "newEmail"
    ).value = "";
  }


  // ==========================================
  // パスワード変更
  // ==========================================

  async function changePassword() {

    if (guestMode) {

      alert(
        "仮アカウントでは変更できません。"
      );

      return;
    }

    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;

    if (!newPassword) {

      alert(
        "新しいパスワードを入力してください。"
      );

      return;
    }

    if (newPassword.length < 6) {

      alert(
        "パスワードは6文字以上にしてください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) {

      alert(
        "パスワード変更エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ パスワードを変更しました。";

    document.getElementById(
      "newPassword"
    ).value = "";
  }


  // ==========================================
  // マイクON/OFF
  // ==========================================

  async function toggleMic() {

    if (!micEnabled) {

      try {

        microphone =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        micEnabled = true;

        document.getElementById(
          "micButton"
        ).textContent =
          "🔇 マイクOFF";

        updateMediaStatus();

      } catch (error) {

        console.error(error);

        alert(
          "マイクへのアクセスが許可されませんでした。"
        );
      }

    } else {

      stopMicrophone();

      updateMediaStatus();
    }
  }


  function stopMicrophone() {

    if (microphone) {

      microphone
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    microphone = null;
    micEnabled = false;

    const button =
      document.getElementById(
        "micButton"
      );

    if (button) {

      button.textContent =
        "🎤 マイクON";
    }
  }


  // ==========================================
  // カメラON/OFF
  // ==========================================

  async function toggleCamera() {

    if (!cameraEnabled) {

      try {

        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        cameraEnabled = true;

        const video =
          document.getElementById(
            "cameraVideo"
          );

        video.srcObject =
          cameraStream;

        video.play().catch(() => {});

        document.getElementById(
          "cameraEmpty"
        ).style.display =
          "none";

        document.getElementById(
          "cameraButton"
        ).textContent =
          "📷 カメラOFF";

        updateMediaStatus();

      } catch (error) {

        console.error(error);

        alert(
          "カメラへのアクセスが許可されませんでした。\n\n" +
          "ブラウザのカメラ権限を確認してください。"
        );
      }

    } else {

      stopCamera();

      updateMediaStatus();
    }
  }


  function stopCamera() {

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    cameraStream = null;
    cameraEnabled = false;

    const video =
      document.getElementById(
        "cameraVideo"
      );

    video.srcObject = null;

    document.getElementById(
      "cameraEmpty"
    ).style.display =
      "flex";

    const button =
      document.getElementById(
        "cameraButton"
      );

    if (button) {

      button.textContent =
        "📷 カメラON";
    }
  }


  // ==========================================
  // 画面共有ON/OFF
  // ==========================================

  async function toggleScreenShare() {

    if (!screenEnabled) {

      try {

        if (!navigator.mediaDevices.getDisplayMedia) {

          alert(
            "このブラウザでは画面共有に対応していません。"
          );

          return;
        }

        screenStream =
          await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: true
          });

        screenEnabled = true;

        const video =
          document.getElementById(
            "screenVideo"
          );

        video.srcObject =
          screenStream;

        video.play().catch(() => {});

        document.getElementById(
          "screenEmpty"
        ).style.display =
          "none";

        document.getElementById(
          "screenButton"
        ).textContent =
          "🛑 画面共有OFF";

        updateMediaStatus();


        /*
          ユーザーがブラウザ側の
          「共有を停止」を押した場合
        */

        const videoTrack =
          screenStream.getVideoTracks()[0];

        if (videoTrack) {

          videoTrack.addEventListener(
            "ended",
            () => {

              stopScreenShare();

              updateMediaStatus();

            }
          );
        }

      } catch (error) {

        console.error(error);

        /*
          キャンセルした場合は
          エラー表示しない
        */

        if (
          error.name !==
          "AbortError"
        ) {

          alert(
            "画面共有を開始できませんでした。\n\n" +
            error.message
          );
        }
      }

    } else {

      stopScreenShare();

      updateMediaStatus();
    }
  }


  function stopScreenShare() {

    if (screenStream) {

      screenStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });
    }

    screenStream = null;
    screenEnabled = false;

    const video =
      document.getElementById(
        "screenVideo"
      );

    video.srcObject = null;

    document.getElementById(
      "screenEmpty"
    ).style.display =
      "flex";

    const button =
      document.getElementById(
        "screenButton"
      );

    if (button) {

      button.textContent =
        "🖥️ 画面共有";
    }
  }


  // ==========================================
  // メディア状態表示
  // ==========================================

  function updateMediaStatus() {

    const status = [];

    if (micEnabled) {
      status.push("🎤 マイクON");
    }

    if (cameraEnabled) {
      status.push("📷 カメラON");
    }

    if (screenEnabled) {
      status.push("🖥️ 画面共有ON");
    }

    document.getElementById(
      "status"
    ).textContent =
      status.length > 0
        ? status.join("　")
        : "すべてOFF";
  }


  // ==========================================
  // フレンド検索
  // ==========================================

  async function searchFriend() {

    if (!currentUser || guestMode) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    const name =
      document.getElementById(
        "friendSearch"
      ).value.trim();

    if (!name) {

      alert(
        "検索する名前を入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("id, username")
        .ilike(
          "username",
          "%" + name + "%"
        )
        .limit(10);

    if (error) {

      console.error(error);

      document.getElementById(
        "searchResult"
      ).innerHTML =
        '<div class="empty">検索に失敗しました。Supabaseのprofilesテーブルを確認してください。</div>';

      return;
    }

    const result =
      document.getElementById(
        "searchResult"
      );

    result.innerHTML = "";

    const users =
      (data || []).filter(
        user =>
          user.id !== currentUser.id
      );

    if (users.length === 0) {

      result.innerHTML =
        '<div class="empty">プレイヤーが見つかりません。</div>';

      return;
    }

    users.forEach(user => {

      const div =
        document.createElement("div");

      div.className = "friend";

      div.innerHTML = `
        <div class="friendAvatar">👤</div>

        <div class="friendInfo">
          <strong>${escapeHTML(user.username)}</strong>
          <span class="offline">プレイヤー</span>
        </div>

        <button
          class="green"
          onclick="sendFriendRequest('${user.id}')"
        >
          ＋ 追加
        </button>
      `;

      result.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請
  // ==========================================

  async function sendFriendRequest(userId) {

    if (!currentUser || guestMode) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    if (userId === currentUser.id) {

      alert(
        "自分自身にはフレンド申請できません。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .insert({
          sender_id: currentUser.id,
          receiver_id: userId,
          status: "pending"
        });

    if (error) {

      alert(
        "フレンド申請エラー: " +
        error.message
      );

      return;
    }

    alert(
      "フレンド申請を送りました！"
    );
  }


  // ==========================================
  // フレンド一覧
  // ==========================================

  async function loadFriends() {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("friendships")
        .select(`
          friend_id,
          profiles!friendships_friend_id_fkey (
            id,
            username,
            online
          )
        `)
        .eq(
          "user_id",
          currentUser.id
        );

    if (error) {

      console.error(error);

      document.getElementById(
        "friendList"
      ).innerHTML =
        '<div class="empty">フレンドはいません。</div>';

      return;
    }

    const list =
      document.getElementById(
        "friendList"
      );

    list.innerHTML = "";

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">フレンドはいません。</div>';

      return;
    }

    data.forEach(row => {

      const friend =
        row.profiles;

      if (!friend) {
        return;
      }

      const div =
        document.createElement("div");

      div.className = "friend";

      div.innerHTML = `
        <div class="friendAvatar">👤</div>

        <div class="friendInfo">
          <strong>${escapeHTML(friend.username)}</strong>

          <span class="${
            friend.online
              ? "online"
              : "offline"
          }">
            ● ${
              friend.online
                ? "オンライン"
                : "オフライン"
            }
          </span>
        </div>

        ${
          friend.online
            ? `<button
                 class="green"
                 onclick="joinFriend('${friend.id}')"
               >
                 参加
               </button>`
            : ""
        }

        <button
          class="red"
          onclick="removeFriend('${friend.id}')"
        >
          削除
        </button>
      `;

      list.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請一覧
  // ==========================================

  async function loadFriendRequests() {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .select(`
          id,
          sender_id,
          profiles!friend_requests_sender_id_fkey (
            username
          )
        `)
        .eq(
          "receiver_id",
          currentUser.id
        )
        .eq(
          "status",
          "pending"
        );

    if (error) {

      console.error(error);

      return;
    }

    const list =
      document.getElementById(
        "requestList"
      );

    list.innerHTML = "";

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">フレンド申請はありません。</div>';

      return;
    }

    data.forEach(request => {

      const name =
        request.profiles
          ? request.profiles.username
          : "Unknown";

      const div =
        document.createElement("div");

      div.className = "request";

      div.innerHTML = `
        <strong>
          ${escapeHTML(name)}
        </strong>

        <p>
          フレンド申請が届いています。
        </p>

        <button
          class="green"
          onclick="acceptFriend(
            '${request.id}',
            '${request.sender_id}'
          )"
        >
          ✓ 承認
        </button>

        <button
          class="red"
          onclick="rejectFriend(
            '${request.id}'
          )"
        >
          ✕ 拒否
        </button>
      `;

      list.appendChild(div);
    });
  }


  // ==========================================
  // フレンド申請承認
  // ==========================================

  async function acceptFriend(
    requestId,
    senderId
  ) {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      error: requestError
    } =
      await supabaseClient
        .from("friend_requests")
        .update({
          status: "accepted"
        })
        .eq(
          "id",
          requestId
        );

    if (requestError) {

      alert(
        "申請処理に失敗しました。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friendships")
        .insert([
          {
            user_id: currentUser.id,
            friend_id: senderId
          },
          {
            user_id: senderId,
            friend_id: currentUser.id
          }
        ]);

    if (error) {

      alert(
        "フレンド登録に失敗しました: " +
        error.message
      );

      return;
    }

    alert(
      "フレンドになりました！"
    );

    await loadFriends();
    await loadFriendRequests();
  }


  // ==========================================
  // フレンド申請拒否
  // ==========================================

  async function rejectFriend(requestId) {

    const {
      error
    } =
      await supabaseClient
        .from("friend_requests")
        .update({
          status: "rejected"
        })
        .eq(
          "id",
          requestId
        );

    if (error) {

      alert(
        "申請の拒否に失敗しました。"
      );

      return;
    }

    await loadFriendRequests();
  }


  // ==========================================
  // フレンド削除
  // ==========================================

  async function removeFriend(friendId) {

    if (!currentUser || guestMode) {
      return;
    }

    if (!confirm(
      "このフレンドを削除しますか？"
    )) {
      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("friendships")
        .delete()
        .or(
          `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
        );

    if (error) {

      alert(
        "フレンド削除エラー: " +
        error.message
      );

      return;
    }

    await loadFriends();
  }


  // ==========================================
  // フレンドのパーティー参加
  // ==========================================

  function joinFriend(friendId) {

    alert(
      "このフレンドのパーティー参加機能を準備中です。"
    );
  }


  // ==========================================
  // パーティー作成
  // ==========================================

  async function createParty() {

    if (!currentUser) {

      alert(
        "ログインしてください。"
      );

      return;
    }

    if (guestMode) {

      alert(
        "仮アカウントではパーティーを保存できません。"
      );

      return;
    }

    const partyCode =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    const {
      data,
      error
    } =
      await supabaseClient
        .from("parties")
        .insert({
          owner_id: currentUser.id,
          party_code: partyCode
        })
        .select()
        .single();

    if (error) {

      alert(
        "パーティー作成エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "partyArea"
    ).innerHTML = `
      <div class="partyBox">

        <h3>🎉 パーティー作成済み</h3>

        <p>
          パーティーコード
        </p>

        <strong style="font-size:24px;">
          ${escapeHTML(data.party_code)}
        </strong>

        <br>

        <button
          class="red"
          onclick="leaveParty('${data.id}')"
        >
          パーティーを解散
        </button>

      </div>
    `;
  }


  // ==========================================
  // パーティー退出
  // ==========================================

  async function leaveParty(partyId) {

    if (!currentUser || guestMode) {
      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("parties")
        .delete()
        .eq(
          "id",
          partyId
        )
        .eq(
          "owner_id",
          currentUser.id
        );

    if (error) {

      alert(
        "パーティーを解散できませんでした。"
      );

      return;
    }

    document.getElementById(
      "partyArea"
    ).innerHTML =
      '<div class="empty">パーティーに参加していません。</div>';
  }


  // ==========================================
  // HTMLエスケープ
  // ==========================================

  function escapeHTML(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // ==========================================
  // ログイン状態確認
  // ==========================================

  async function checkUser() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();

    if (user) {

      currentUser = user;
      guestMode = false;

      setLoggedInUI(
        user.email
      );

      await loadFriends();
      await loadFriendRequests();

    } else {

      setLoggedOutUI();
    }
  }


  // ==========================================
  // 認証状態変更監視
  // ==========================================

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (session && session.user) {

        currentUser =
          session.user;

        guestMode = false;

        setLoggedInUI(
          session.user.email
        );

        await loadFriends();
        await loadFriendRequests();

      } else if (!guestMode) {

        currentUser = null;

        setLoggedOutUI();
      }
    }
  );


  // ==========================================
  // 初期化
  // ==========================================

  checkUser();

</script>

</body>
</html>
