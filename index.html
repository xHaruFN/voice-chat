<script>

/* =========================
   データ
========================= */

let accounts =
  JSON.parse(
    localStorage.getItem("voicechat_accounts") || "{}"
  );

let friendships =
  JSON.parse(
    localStorage.getItem("voicechat_friends") || "{}"
  );

let requests =
  JSON.parse(
    localStorage.getItem("voicechat_requests") || "[]"
  );

let messages =
  JSON.parse(
    localStorage.getItem("voicechat_messages") || "{}"
  );

let parties =
  JSON.parse(
    localStorage.getItem("voicechat_parties") || "{}"
  );

let currentUser = null;
let guestMode = false;
let awayMode = false;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let dmUser = null;


/* =========================
   保存
========================= */

function saveAll(){

  localStorage.setItem(
    "voicechat_accounts",
    JSON.stringify(accounts)
  );

  localStorage.setItem(
    "voicechat_friends",
    JSON.stringify(friendships)
  );

  localStorage.setItem(
    "voicechat_requests",
    JSON.stringify(requests)
  );

  localStorage.setItem(
    "voicechat_messages",
    JSON.stringify(messages)
  );

  localStorage.setItem(
    "voicechat_parties",
    JSON.stringify(parties)
  );
}


/* =========================
   UI
========================= */

function setLoggedInUI(){

  document.getElementById("username").textContent =
    currentUser.username;

  document.getElementById("onlineStatus").textContent =
    awayMode
      ? "🟡 離席"
      : "🟢 オンライン";

  document.getElementById("accountStatus").textContent =
    guestMode
      ? "👻 仮アカウントでログイン中"
      : "✅ ログイン中";

  document.getElementById("logoutButton").style.display =
    "inline-block";

  document.getElementById("settingsCard").style.display =
    "block";

  document.getElementById("friendCard").style.display =
    "block";

  document.getElementById("partyCard").style.display =
    "block";

  document.getElementById("awayButton").style.display =
    "inline-block";

  loadFriends();
  loadRequests();
}


function setLoggedOutUI(){

  document.getElementById("username").textContent =
    "未ログイン";

  document.getElementById("onlineStatus").textContent =
    "⚪ オフライン";

  document.getElementById("accountStatus").textContent =
    "ログインしていません";

  document.getElementById("logoutButton").style.display =
    "none";

  document.getElementById("settingsCard").style.display =
    "none";

  document.getElementById("friendCard").style.display =
    "none";

  document.getElementById("partyCard").style.display =
    "none";

  document.getElementById("dmCard").style.display =
    "none";

  document.getElementById("awayButton").style.display =
    "none";
}


/* =========================
   アカウント作成
   作成後に自動ログイン
========================= */

function signUp(){

  const username =
    document.getElementById("usernameInput")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if(username.length < 3){

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  if(accounts[username]){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  accounts[username] = {

    username:username,

    password:password,

    status:"online",

    friends:[]

  };

  friendships[username] = [];

  saveAll();

  /* ★ここで自動ログイン */

  currentUser = accounts[username];

  guestMode = false;

  awayMode = false;

  setLoggedInUI();

  document.getElementById("usernameInput").value = "";
  document.getElementById("password").value = "";

  alert(
    "アカウントを作成しました！\n\n" +
    username +
    "\n\nそのままログインしました。"
  );
}


/* =========================
   ログイン
========================= */

function signIn(){

  const username =
    document.getElementById("usernameInput")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  const account =
    accounts[username];

  if(!account){

    alert(
      "そのアカウントは存在しません。"
    );

    return;
  }

  if(account.password !== password){

    alert(
      "パスワードが違います。"
    );

    return;
  }

  currentUser = account;

  guestMode = false;

  awayMode = false;

  account.status = "online";

  saveAll();

  setLoggedInUI();

  alert(
    "ログインしました！"
  );
}


/* =========================
   仮アカウント
========================= */

function createGuest(){

  if(currentUser){

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const name =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random()*900000
    );

  currentUser = {

    username:name,

    password:"",

    status:"online",

    friends:[]

  };

  guestMode = true;
  awayMode = false;

  setLoggedInUI();

  alert(
    "仮アカウントを作成しました！\n\n" +
    name
  );
}


/* =========================
   ログアウト
========================= */

function signOut(){

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if(!guestMode && currentUser){

    if(accounts[currentUser.username]){

      accounts[currentUser.username].status =
        "offline";
    }

    saveAll();
  }

  currentUser = null;
  guestMode = false;
  awayMode = false;
  dmUser = null;

  setLoggedOutUI();
}


/* =========================
   ユーザー名変更
========================= */

function changeUsername(){

  if(!currentUser){
    return;
  }

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newName =
    document.getElementById("newUsername")
      .value.trim();

  if(!newName){

    alert(
      "新しいユーザー名を入力してください。"
    );

    return;
  }

  if(accounts[newName]){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const oldName =
    currentUser.username;

  accounts[newName] = accounts[oldName];

  accounts[newName].username =
    newName;

  delete accounts[oldName];

  friendships[newName] =
    friendships[oldName] || [];

  delete friendships[oldName];

  currentUser =
    accounts[newName];

  saveAll();

  document.getElementById("newUsername").value = "";

  setLoggedInUI();

  alert(
    "ユーザー名を変更しました。"
  );
}


/* =========================
   パスワード変更
========================= */

function changePassword(){

  if(!currentUser){
    return;
  }

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const password =
    document.getElementById("newPassword")
      .value;

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  accounts[currentUser.username].password =
    password;

  currentUser.password =
    password;

  saveAll();

  document.getElementById("newPassword").value = "";

  document.getElementById("settingsStatus").textContent =
    "✅ パスワードを変更しました。";
}


/* =========================
   アカウント削除
========================= */

function deleteAccount(){

  if(!currentUser || guestMode){

    alert(
      "仮アカウントはログアウトすると削除されます。"
    );

    return;
  }

  if(!confirm(
    "アカウントを完全に削除しますか？"
  )){
    return;
  }

  const name =
    currentUser.username;

  delete accounts[name];
  delete friendships[name];

  requests =
    requests.filter(
      r =>
        r.sender !== name &&
        r.receiver !== name
    );

  saveAll();

  currentUser = null;

  setLoggedOutUI();

  alert(
    "アカウントを削除しました。"
  );
}


/* =========================
   離席
========================= */

function toggleAway(){

  if(!currentUser){
    return;
  }

  awayMode = !awayMode;

  if(!guestMode){

    accounts[currentUser.username].status =
      awayMode
        ? "away"
        : "online";

    saveAll();
  }

  document.getElementById("onlineStatus").textContent =
    awayMode
      ? "🟡 離席"
      : "🟢 オンライン";

  document.getElementById("awayButton").textContent =
    awayMode
      ? "🟢 オンライン"
      : "🟡 離席";

  loadFriends();
}


/* =========================
   マイク
========================= */

async function toggleMic(){

  if(!micEnabled){

    try{

      microphone =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      micEnabled = true;

      document.getElementById("micButton").textContent =
        "🔇 マイクOFF";

      updateMediaStatus();

    }catch(e){

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );
    }

  }else{

    stopMicrophone();

    updateMediaStatus();
  }
}


function stopMicrophone(){

  if(microphone){

    microphone
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  microphone = null;
  micEnabled = false;

  const button =
    document.getElementById("micButton");

  if(button){
    button.textContent =
      "🎤 マイクON";
  }
}


/* =========================
   カメラ
========================= */

async function toggleCamera(){

  if(!cameraEnabled){

    try{

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video:true,
            audio:false
          });

      cameraEnabled = true;

      document.getElementById("cameraVideo")
        .srcObject =
        cameraStream;

      document.getElementById("cameraEmpty")
        .style.display =
        "none";

      document.getElementById("cameraButton")
        .textContent =
        "📷 カメラOFF";

      updateMediaStatus();

    }catch(e){

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );
    }

  }else{

    stopCamera();

    updateMediaStatus();
  }
}


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  cameraStream = null;
  cameraEnabled = false;

  document.getElementById("cameraVideo")
    .srcObject = null;

  document.getElementById("cameraEmpty")
    .style.display =
    "flex";

  document.getElementById("cameraButton")
    .textContent =
    "📷 カメラON";
}


/* =========================
   画面共有
========================= */

async function toggleScreenShare(){

  if(!screenEnabled){

    try{

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video:true,
            audio:true
          });

      screenEnabled = true;

      document.getElementById("screenVideo")
        .srcObject =
        screenStream;

      document.getElementById("screenEmpty")
        .style.display =
        "none";

      document.getElementById("screenButton")
        .textContent =
        "🛑 画面共有OFF";

      const track =
        screenStream.getVideoTracks()[0];

      if(track){

        track.addEventListener(
          "ended",
          () => {

            stopScreenShare();

            updateMediaStatus();
          }
        );
      }

      updateMediaStatus();

    }catch(e){

      if(e.name !== "AbortError"){

        alert(
          "画面共有を開始できませんでした。"
        );
      }
    }

  }else{

    stopScreenShare();

    updateMediaStatus();
  }
}


function stopScreenShare(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  screenStream = null;
  screenEnabled = false;

  document.getElementById("screenVideo")
    .srcObject = null;

  document.getElementById("screenEmpty")
    .style.display =
    "flex";

  document.getElementById("screenButton")
    .textContent =
    "🖥️ 画面共有";
}


/* =========================
   メディア状態
========================= */

function updateMediaStatus(){

  const status = [];

  if(micEnabled)
    status.push("🎤 マイクON");

  if(cameraEnabled)
    status.push("📷 カメラON");

  if(screenEnabled)
    status.push("🖥️ 画面共有ON");

  document.getElementById("status").textContent =
    status.length
      ? status.join("　")
      : "すべてOFF";
}


/* =========================
   フレンド検索
========================= */

function searchFriend(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const text =
    document.getElementById("friendSearch")
      .value.trim()
      .toLowerCase();

  if(!text){

    alert(
      "検索する名前を入力してください。"
    );

    return;
  }

  const result =
    document.getElementById("searchResult");

  result.innerHTML = "";

  const users =
    Object.values(accounts)
      .filter(
        u =>
          u.username
            .toLowerCase()
            .includes(text) &&
          u.username !== currentUser.username
      );

  if(users.length === 0){

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  users.forEach(user => {

    const div =
      document.createElement("div");

    div.className = "friend";

    div.innerHTML = `
      <div class="friendAvatar">👤</div>

      <div class="friendInfo">
        <strong>${escapeHTML(user.username)}</strong>
        <span class="${user.status === "online" ? "online" : user.status === "away" ? "away" : "offline"}">
          ● ${
            user.status === "online"
              ? "オンライン"
              : user.status === "away"
              ? "離席"
              : "オフライン"
          }
        </span>
      </div>

      <button
        class="green"
        onclick="sendFriendRequest('${escapeAttr(user.username)}')"
      >
        ＋ 追加
      </button>
    `;

    result.appendChild(div);
  });
}


/* =========================
   フレンド申請
========================= */

function sendFriendRequest(name){

  if(!currentUser){
    return;
  }

  if(name === currentUser.username){
    return;
  }

  const exists =
    requests.some(
      r =>
        r.sender === currentUser.username &&
        r.receiver === name &&
        r.status === "pending"
    );

  if(exists){

    alert(
      "すでに申請しています。"
    );

    return;
  }

  requests.push({

    id:Date.now(),

    sender:currentUser.username,

    receiver:name,

    status:"pending"

  });

  saveAll();

  alert(
    "フレンド申請を送りました！"
  );
}


/* =========================
   フレンド申請一覧
========================= */

function loadRequests(){

  if(!currentUser){
    return;
  }

  const list =
    document.getElementById("requestList");

  list.innerHTML = "";

  const mine =
    requests.filter(
      r =>
        r.receiver === currentUser.username &&
        r.status === "pending"
    );

  if(mine.length === 0){

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  mine.forEach(request => {

    const div =
      document.createElement("div");

    div.className = "request";

    div.innerHTML = `
      <strong>${escapeHTML(request.sender)}</strong>

      <p>フレンド申請が届いています。</p>

      <button
        class="green"
        onclick="acceptFriend(${request.id})"
      >
        ✓ 承認
      </button>

      <button
        class="red"
        onclick="rejectFriend(${request.id})"
      >
        ✕ 拒否
      </button>
    `;

    list.appendChild(div);
  });
}


/* =========================
   承認
========================= */

function acceptFriend(id){

  const request =
    requests.find(
      r => r.id === id
    );

  if(!request){
    return;
  }

  if(!friendships[currentUser.username])
    friendships[currentUser.username] = [];

  if(!friendships[request.sender])
    friendships[request.sender] = [];

  if(!friendships[currentUser.username]
    .includes(request.sender)){

    friendships[currentUser.username]
      .push(request.sender);
  }

  if(!friendships[request.sender]
    .includes(currentUser.username)){

    friendships[request.sender]
      .push(currentUser.username);
  }

  requests =
    requests.filter(
      r => r.id !== id
    );

  saveAll();

  loadFriends();
  loadRequests();

  alert(
    "フレンドになりました！"
  );
}


/* =========================
   拒否
========================= */

function rejectFriend(id){

  requests =
    requests.filter(
      r => r.id !== id
    );

  saveAll();

  loadRequests();
}


/* =========================
   フレンド一覧
========================= */

function loadFriends(){

  if(!currentUser){
    return;
  }

  const list =
    document.getElementById("friendList");

  list.innerHTML = "";

  const names =
    friendships[currentUser.username] || [];

  if(names.length === 0){

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    return;
  }

  names.forEach(name => {

    const friend =
      accounts[name];

    if(!friend){
      return;
    }

    const div =
      document.createElement("div");

    div.className = "friend";

    const status =
      friend.status || "offline";

    div.innerHTML = `
      <div class="friendAvatar">👤</div>

      <div class="friendInfo">
        <strong>${escapeHTML(friend.username)}</strong>

        <span class="${
          status === "online"
            ? "online"
            : status === "away"
            ? "away"
            : "offline"
        }">
          ● ${
            status === "online"
              ? "オンライン"
              : status === "away"
              ? "離席"
              : "オフライン"
          }
        </span>
      </div>

      <button
        onclick="openDM('${escapeAttr(friend.username)}')"
      >
        💬 DM
      </button>

      <button
        class="red"
        onclick="removeFriend('${escapeAttr(friend.username)}')"
      >
        🗑️ 削除
      </button>
    `;

    list.appendChild(div);
  });
}


/* =========================
   フレンド削除
========================= */

function removeFriend(name){

  if(!confirm(
    name + " をフレンドから削除しますか？"
  )){
    return;
  }

  friendships[currentUser.username] =
    (friendships[currentUser.username] || [])
      .filter(
        n => n !== name
      );

  if(friendships[name]){

    friendships[name] =
      friendships[name]
        .filter(
          n =>
            n !== currentUser.username
        );
  }

  saveAll();

  loadFriends();
}


/* =========================
   DM
========================= */

function openDM(name){

  dmUser = name;

  document.getElementById("dmCard")
    .style.display =
    "block";

  document.getElementById("dmTarget")
    .textContent =
    "💬 " + name;

  loadDM();

  document.getElementById("dmInput")
    .focus();
}


function closeDM(){

  dmUser = null;

  document.getElementById("dmCard")
    .style.display =
    "none";
}


function getDMKey(){

  return [
    currentUser.username,
    dmUser
  ].sort().join("__");
}


function loadDM(){

  const box =
    document.getElementById("dmMessages");

  box.innerHTML = "";

  const key =
    getDMKey();

  const list =
    messages[key] || [];

  if(list.length === 0){

    box.innerHTML =
      '<div class="empty">まだメッセージはありません。</div>';

    return;
  }

  list.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (
        message.sender ===
        currentUser.username
          ? "me"
          : ""
      );

    div.innerHTML = `
      <strong>
        ${escapeHTML(message.sender)}
      </strong>

      <br>

      ${escapeHTML(message.text)}
    `;

    box.appendChild(div);
  });

  box.scrollTop =
    box.scrollHeight;
}


function sendDM(){

  if(!currentUser || !dmUser){
    return;
  }

  const input =
    document.getElementById("dmInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const key =
    getDMKey();

  if(!messages[key])
    messages[key] = [];

  messages[key].push({

    sender:currentUser.username,

    text:text,

    time:Date.now()

  });

  saveAll();

  input.value = "";

  loadDM();
}


/* =========================
   パーティー作成
========================= */

function createParty(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  parties[code] = {

    code:code,

    owner:currentUser.username,

    members:[
      currentUser.username
    ]

  };

  saveAll();

  showParty(parties[code]);
}


/* =========================
   パーティー参加
========================= */

function joinParty(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const input =
    document.getElementById("partyCodeInput");

  const code =
    input.value.trim().toUpperCase();

  if(!code){

    alert(
      "パーティーコードを入力してください。"
    );

    return;
  }

  const party =
    parties[code];

  if(!party){

    alert(
      "パーティーが見つかりません。"
    );

    return;
  }

  if(!party.members.includes(
    currentUser.username
  )){

    party.members.push(
      currentUser.username
    );
  }

  saveAll();

  showParty(party);

  input.value = "";

  alert(
    "パーティーに参加しました！"
  );
}


/* =========================
   パーティー表示
========================= */

function showParty(party){

  const area =
    document.getElementById("partyArea");

  area.innerHTML = `
    <div class="partyBox">

      <h3>🎉 パーティー参加中</h3>

      <p>パーティーコード</p>

      <strong style="font-size:24px;">
        ${escapeHTML(party.code)}
      </strong>

      <p>
        👑 オーナー：
        ${escapeHTML(party.owner)}
      </p>

      <p>
        👥 参加者：
        ${party.members
          .map(
            name =>
              escapeHTML(name)
          )
          .join("、")}
      </p>

      <button
        class="red"
        onclick="leaveParty('${escapeAttr(party.code)}')"
      >
        パーティー退出
      </button>

    </div>
  `;
}


/* =========================
   パーティー退出
========================= */

function leaveParty(code){

  const party =
    parties[code];

  if(!party){
    return;
  }

  party.members =
    party.members.filter(
      name =>
        name !== currentUser.username
    );

  if(
    party.owner ===
    currentUser.username
  ){

    delete parties[code];

  }else if(
    party.members.length === 0
  ){

    delete parties[code];
  }

  saveAll();

  document.getElementById("partyArea")
    .innerHTML =
      '<div class="empty">パーティーに参加していません。</div>';
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}

const savedLogin =
