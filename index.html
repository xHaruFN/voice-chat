<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      height: 64px;
      background: #1f2937;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-top: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 6px 4px 6px 0;
      font-size: 16px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #dc2626;
      display: none;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #374151;
      padding: 15px;
      border-radius: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    #status {
      margin-top: 15px;
      color: #9ca3af;
    }

    #accountStatus,
    #settingsStatus {
      color: #9ca3af;
    }

    #settingsCard {
      display: none;
    }

    /* =========================
       フレンド欄
    ========================= */

    .friend-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .friend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #374151;
      padding: 12px;
      border-radius: 10px;
      transition: 0.15s;
    }

    .friend:hover {
      background: #4b5563;
      transform: translateX(3px);
    }

    .friend-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .friend-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .friend-name {
      font-weight: bold;
    }

    .friend-status {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 3px;
    }

    .online {
      color: #22c55e;
    }

    .away {
      color: #facc15;
    }

    .offline {
      color: #9ca3af;
    }

    .friend-button {
      padding: 8px 14px;
      margin: 0;
      font-size: 14px;
      background: #2563eb;
    }

    .friend-button.remove {
      background: #4b5563;
    }

    .empty-friends {
      color: #9ca3af;
      padding: 15px 0;
    }
  </style>
</head>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

  <!-- =========================
       アカウント
  ========================== -->

  <div class="card" id="accountCard">

    <h2>👤 アカウント</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      アカウント作成
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

    <button onclick="createGuest()">
      👻 仮アカウント
    </button>

    <button
      id="logoutButton"
      class="logout"
      onclick="signOut()"
    >
      ログアウト
    </button>

    <p id="accountStatus">
      ログインしていません
    </p>

  </div>


  <!-- =========================
       アカウント設定
  ========================== -->

  <div
    class="card"
    id="settingsCard"
  >

    <h2>⚙️ アカウント設定</h2>

    <h3>📧 メールアドレス変更</h3>

    <input
      id="newEmail"
      type="email"
      placeholder="新しいメールアドレス"
    >

    <button onclick="changeEmail()">
      メールアドレス変更
    </button>

    <h3>🔑 パスワード変更</h3>

    <input
      id="newPassword"
      type="password"
      placeholder="新しいパスワード"
    >

    <button onclick="changePassword()">
      パスワード変更
    </button>

    <p id="settingsStatus"></p>

  </div>


  <!-- =========================
       自分
  ========================== -->

  <div class="card">

    <h2>自分</h2>

    <div class="user">

      <div class="avatar">
        👤
      </div>

      <div>

        <strong id="username">
          未ログイン
        </strong>

        <div id="onlineStatus">
          ⚪ オフライン
        </div>

      </div>

    </div>

    <br>

    <button
      id="micButton"
      onclick="toggleMic()"
    >
      🎤 マイクON
    </button>

    <div id="status">
      マイクをONにするとここに状態が表示されます。
    </div>

  </div>


  <!-- =========================
       フレンド
  ========================== -->

  <div class="card">

    <h2>👥 フレンド</h2>

    <input
      id="friendSearch"
      type="text"
      placeholder="フレンドを検索"
      oninput="searchFriends()"
    >

    <div
      id="friendList"
      class="friend-list"
    >

      <div
        class="friend"
        data-name="NekoPlayer"
      >

        <div class="friend-left">

          <div class="friend-avatar">
            🐱
          </div>

          <div>

            <div class="friend-name">
              NekoPlayer
            </div>

            <div class="friend-status online">
              ● オンライン
            </div>

          </div>

        </div>

        <button
          class="friend-button"
          onclick="alert('NekoPlayerをパーティーに招待しました！')"
        >
          招待
        </button>

      </div>


      <div
        class="friend"
        data-name="TrainMaster"
      >

        <div class="friend-left">

          <div class="friend-avatar">
            🚆
          </div>

          <div>

            <div class="friend-name">
              TrainMaster
            </div>

            <div class="friend-status away">
              ● 離席中
            </div>

          </div>

        </div>

        <button
          class="friend-button"
          onclick="alert('TrainMasterをパーティーに招待しました！')"
        >
          招待
        </button>

      </div>


      <div
        class="friend"
        data-name="xHaruFriend"
      >

        <div class="friend-left">

          <div class="friend-avatar">
            🎮
          </div>

          <div>

            <div class="friend-name">
              xHaruFriend
            </div>

            <div class="friend-status offline">
              ● オフライン
            </div>

          </div>

        </div>

        <button
          class="friend-button remove"
          onclick="alert('このフレンドはオフラインです。')"
        >
          オフライン
        </button>

      </div>

    </div>

    <button onclick="addFriend()">
      ＋ フレンド追加
    </button>

  </div>


  <!-- =========================
       パーティー
  ========================== -->

  <div class="card">

    <h2>🎉 パーティー</h2>

    <p>
      フレンドとパーティーを作成できます。
    </p>

    <button onclick="createParty()">
      ＋ パーティー作成
    </button>

  </div>

</main>


<script>

  // ==========================================
  // Supabase設定
  // ==========================================

  const SUPABASE_URL =
    "https://znzwsbumfqderjoehrwd.supabase.co";

  const SUPABASE_KEY =
    "ここに自分のPublishable key";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // アカウント作成
  // ==========================================

  async function signUp() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "アカウント作成エラー: " +
        error.message
      );

      return;
    }

    alert(
      "アカウントを作成しました！\n" +
      "メール確認が必要な設定の場合はメールを確認してください。"
    );
  }


  // ==========================================
  // ログイン
  // ==========================================

  async function signIn() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "ログインエラー: " +
        error.message
      );

      return;
    }

    updateUserUI(data.user);
  }


  // ==========================================
  // ログアウト
  // ==========================================

  async function signOut() {

    const {
      error
    } =
      await supabaseClient.auth.signOut();

    if (error) {

      alert(
        "ログアウトに失敗しました: " +
        error.message
      );

      return;
    }

    resetUserUI();

    document.getElementById(
      "accountStatus"
    ).textContent =
      "ログアウトしました";
  }


  // ==========================================
  // UIを未ログイン状態に戻す
  // ==========================================

  function resetUserUI() {

    document.getElementById(
      "username"
    ).textContent =
      "未ログイン";

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "⚪ オフライン";

    document.getElementById(
      "settingsCard"
    ).style.display =
      "none";

    document.getElementById(
      "logoutButton"
    ).style.display =
      "none";
  }


  // ==========================================
  // 仮アカウント
  // ==========================================

  function createGuest() {

    const guestName =
      "Guest_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    document.getElementById(
      "username"
    ).textContent =
      guestName;

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent =
      "👻 仮アカウント: " +
      guestName;

    document.getElementById(
      "logoutButton"
    ).style.display =
      "inline-block";

    document.getElementById(
      "settingsCard"
    ).style.display =
      "none";

    alert(
      "仮アカウントを作成しました！\n\n" +
      guestName
    );
  }


  // ==========================================
  // ユーザー表示
  // ==========================================

  function updateUserUI(user) {

    if (!user) {
      return;
    }

    document.getElementById(
      "username"
    ).textContent =
      user.email;

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent =
      "✅ ログイン中";

    document.getElementById(
      "settingsCard"
    ).style.display =
      "block";

    document.getElementById(
      "logoutButton"
    ).style.display =
      "inline-block";
  }


  // ==========================================
  // メールアドレス変更
  // ==========================================

  async function changeEmail() {

    const newEmail =
      document.getElementById(
        "newEmail"
      ).value.trim();

    if (!newEmail) {

      alert(
        "新しいメールアドレスを入力してください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        email: newEmail
      });

    if (error) {

      alert(
        "メールアドレス変更エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ メールアドレス変更を受け付けました。";

    document.getElementById(
      "newEmail"
    ).value =
      "";
  }


  // ==========================================
  // パスワード変更
  // ==========================================

  async function changePassword() {

    const newPassword =
      document.getElementById(
        "newPassword"
      ).value;

    if (!newPassword) {

      alert(
        "新しいパスワードを入力してください。"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password: newPassword
      });

    if (error) {

      alert(
        "パスワード変更エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "settingsStatus"
    ).textContent =
      "✅ パスワードを変更しました。";

    document.getElementById(
      "newPassword"
    ).value =
      "";
  }


  // ==========================================
  // フレンド検索
  // ==========================================

  function searchFriends() {

    const keyword =
      document.getElementById(
        "friendSearch"
      ).value
        .trim()
        .toLowerCase();

    const friends =
      document.querySelectorAll(
        ".friend"
      );

    friends.forEach(friend => {

      const name =
        friend
          .getAttribute("data-name")
          .toLowerCase();

      if (name.includes(keyword)) {
        friend.style.display =
          "flex";
      } else {
        friend.style.display =
          "none";
      }

    });
  }


  // ==========================================
  // フレンド追加
  // ==========================================

  function addFriend() {

    const name =
      prompt(
        "追加したいフレンドの名前を入力してください。"
      );

    if (!name) {
      return;
    }

    alert(
      name +
      " にフレンド申請を送りました！"
    );
  }


  // ==========================================
  // パーティー
  // ==========================================

  function createParty() {

    alert(
      "🎉 パーティーを作成しました！"
    );
  }


  // ==========================================
  // マイク
  // ==========================================

  let microphone = null;
  let micEnabled = false;

  async function toggleMic() {

    if (!micEnabled) {

      try {

        microphone =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });

        micEnabled = true;

        document.getElementById(
          "micButton"
        ).textContent =
          "🔇 マイクOFF";

        document.getElementById(
          "status"
        ).textContent =
          "🎤 マイクON";

      } catch (error) {

        alert(
          "マイクへのアクセスが許可されませんでした。"
        );

      }

    } else {

      microphone
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      microphone = null;
      micEnabled = false;

      document.getElementById(
        "micButton"
      ).textContent =
        "🎤 マイクON";

      document.getElementById(
        "status"
      ).textContent =
        "🔇 マイクOFF";
    }
  }


  // ==========================================
  // ログイン状態確認
  // ==========================================

  async function checkUser() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();

    if (user) {

      updateUserUI(user);

    } else {

      resetUserUI();

    }
  }

  checkUser();

</script>

</body>
</html>
