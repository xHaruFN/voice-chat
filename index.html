<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

header {
  height: 64px;
  background: #1f2937;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 22px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-top: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  margin: 6px 4px 6px 0;
  font-size: 16px;
  cursor: pointer;
  background: #4f46e5;
  color: white;
}

button:hover {
  opacity: .9;
}

.logout,
.red {
  background: #dc2626;
}

.green {
  background: #22c55e;
}

.gray {
  background: #4b5563;
}

.yellow {
  background: #ca8a04;
}

.user {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #374151;
  padding: 15px;
  border-radius: 12px;
}

.avatar,
.friendAvatar {
  width: 50px;
  height: 50px;
  background: #4f46e5;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

#status,
#accountStatus,
#settingsStatus {
  color: #9ca3af;
}

#settingsCard,
#friendCard,
#partyCard {
  display: none;
}

.friend {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #374151;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.friendAvatar {
  width: 45px;
  height: 45px;
  border-radius: 8px;
}

.friendInfo {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.online {
  color: #22c55e;
  font-size: 13px;
}

.away {
  color: #eab308;
  font-size: 13px;
}

.offline {
  color: #9ca3af;
  font-size: 13px;
}

.friend button {
  padding: 8px 14px;
  margin: 0 0 0 5px;
}

.request,
.partyBox {
  background: #374151;
  padding: 15px;
  margin: 8px 0;
  border-radius: 12px;
}

.empty {
  color: #9ca3af;
  padding: 15px 0;
}

.mediaArea {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.videoBox {
  background: #111827;
  border-radius: 12px;
  padding: 10px;
  min-height: 220px;
}

.videoBox h3 {
  margin: 5px 0 10px;
}

video {
  width: 100%;
  max-height: 400px;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}

.noVideo {
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  background: #030712;
  border-radius: 10px;
}

.dmBox {
  background: #111827;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.dmMessages {
  height: 250px;
  overflow-y: auto;
  background: #030712;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
}

.dmMessage {
  background: #374151;
  padding: 9px 12px;
  border-radius: 10px;
  margin: 6px 0;
}

.dmMe {
  background: #4f46e5;
  text-align: right;
}

.dmInputArea {
  display: flex;
  gap: 5px;
}

.dmInputArea input {
  margin: 0;
  flex: 1;
}

.dmInputArea button {
  margin: 0;
}

.hidden {
  display: none !important;
}

@media (max-width: 700px) {
  .mediaArea {
    grid-template-columns: 1fr;
  }

  .friend {
    flex-wrap: wrap;
  }
}
</style>

</head>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

<!-- ==========================================
     アカウント
========================================== -->

<div class="card">

<h2>👤 アカウント</h2>

<input
id="usernameInput"
maxlength="30"
placeholder="ユーザー名"

>

<input
id="password"
type="password"
placeholder="パスワード"

>

<button onclick="signUp()">
  アカウント作成
</button>

<button onclick="signIn()">
  ログイン
</button>

<button
class="gray"
onclick="createGuest()"

>

👻 仮アカウント </button>

<button
id="logoutButton"
class="red"
onclick="signOut()"
style="display:none"

>

ログアウト </button>

<p id="accountStatus">
  ログインしていません
</p>

</div>

<!-- ==========================================
     アカウント設定
========================================== -->

<div
  class="card"
  id="settingsCard"
>

<h2>⚙️ アカウント設定</h2>

<h3>👤 ユーザー名変更</h3>

<input
id="newUsername"
maxlength="30"
placeholder="新しいユーザー名"

>

<button onclick="changeUsername()">
  ユーザー名変更
</button>

<h3>🔑 パスワード変更</h3>

<input
id="newPassword"
type="password"
placeholder="新しいパスワード"

>

<button onclick="changePassword()">
  パスワード変更
</button>

<h3>🗑️ アカウント</h3>

<button
class="red"
onclick="deleteAccount()"

>

🗑️ アカウント削除 </button>

<p id="settingsStatus"></p>

</div>

<!-- ==========================================
     自分
========================================== -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">
  👤
</div>

<div>

<strong id="username">
  未ログイン
</strong>

<div id="onlineStatus">
  ⚪ オフライン
</div>

</div>

</div>

<br>

<button
id="micButton"
onclick="toggleMic()"

>

🎤 マイクON </button>

<button
id="cameraButton"
class="green"
onclick="toggleCamera()"

>

📷 カメラON </button>

<button
id="screenButton"
class="gray"
onclick="toggleScreenShare()"

>

🖥️ 画面共有 </button>

<button
id="awayButton"
class="yellow"
onclick="toggleAway()"
style="display:none"

>

🟡 離席 </button>

<div id="status">
  マイク・カメラ・画面共有を操作できます。
</div>

<div class="mediaArea">

<div class="videoBox">

<h3>
  📷 カメラ
</h3>

<video
id="cameraVideo"
autoplay
muted
playsinline

> </video>

<div
  id="cameraEmpty"
  class="noVideo"
>
  カメラOFF
</div>

</div>

<div class="videoBox">

<h3>
  🖥️ 画面共有
</h3>

<video
id="screenVideo"
autoplay
muted
playsinline

> </video>

<div
  id="screenEmpty"
  class="noVideo"
>
  画面共有OFF
</div>

</div>

</div>

</div>

<!-- ==========================================
     フレンド
========================================== -->

<div
  class="card"
  id="friendCard"
>

<h2>👥 フレンド</h2>

<input
id="friendSearch"
placeholder="🔍 プレイヤーを検索"

>

<button onclick="searchFriend()">
  🔍 検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
  <div class="empty">
    フレンドはいません。
  </div>
</div>

<h3>📨 フレンド申請</h3>

<div id="requestList">
  <div class="empty">
    フレンド申請はありません。
  </div>
</div>

<!-- ==========================================
     DM
========================================== -->

<div
  id="dmBox"
  class="dmBox"
  style="display:none"
>

<h3 id="dmTitle">
  💬 DM
</h3>

<div
  id="dmMessages"
  class="dmMessages"
></div>

<div class="dmInputArea">

<input
id="dmInput"
placeholder="メッセージを入力"
onkeydown="if(event.key==='Enter')sendDM()"

>

<button onclick="sendDM()">
  送信
</button>

</div>

<button
class="gray"
onclick="closeDM()"

>

DMを閉じる </button>

</div>

</div>

<!-- ==========================================
     パーティー
========================================== -->

<div
  class="card"
  id="partyCard"
>

<h2>🎉 パーティー</h2>

<button
class="green"
onclick="createParty()"

>

＋ パーティー作成 </button>

<div id="partyArea">
  <div class="empty">
    パーティーに参加していません。
  </div>
</div>

</div>

</main>

<script>

/* ==========================================
   データ
========================================== */

let currentUser = null;
let guestMode = false;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let away = false;

let currentDMUser = null;


/* ==========================================
   localStorage
========================================== */

function getAccounts() {
  return JSON.parse(
    localStorage.getItem("voiceChatAccounts") || "{}"
  );
}

function saveAccounts(accounts) {
  localStorage.setItem(
    "voiceChatAccounts",
    JSON.stringify(accounts)
  );
}

function getFriends() {
  return JSON.parse(
    localStorage.getItem("voiceChatFriends") || "{}"
  );
}

function saveFriends(data) {
  localStorage.setItem(
    "voiceChatFriends",
    JSON.stringify(data)
  );
}

function getRequests() {
  return JSON.parse(
    localStorage.getItem("voiceChatRequests") || "[]"
  );
}

function saveRequests(data) {
  localStorage.setItem(
    "voiceChatRequests",
    JSON.stringify(data)
  );
}

function getMessages() {
  return JSON.parse(
    localStorage.getItem("voiceChatDMs") || "{}"
  );
}

function saveMessages(data) {
  localStorage.setItem(
    "voiceChatDMs",
    JSON.stringify(data)
  );
}


/* ==========================================
   UI
========================================== */

function setLoggedInUI(name) {

  document.getElementById("username").textContent = name;

  document.getElementById("onlineStatus").textContent =
    away ? "🟡 離席" : "🟢 オンライン";

  document.getElementById("accountStatus").textContent =
    guestMode
      ? "👻 仮アカウント: " + name
      : "✅ ログイン中";

  document.getElementById("logoutButton").style.display =
    "inline-block";

  document.getElementById("settingsCard").style.display =
    "block";

  document.getElementById("friendCard").style.display =
    "block";

  document.getElementById("partyCard").style.display =
    "block";

  document.getElementById("awayButton").style.display =
    guestMode ? "none" : "inline-block";

  updateAwayButton();
}


function setLoggedOutUI() {

  document.getElementById("username").textContent =
    "未ログイン";

  document.getElementById("onlineStatus").textContent =
    "⚪ オフライン";

  document.getElementById("accountStatus").textContent =
    "ログインしていません";

  document.getElementById("logoutButton").style.display =
    "none";

  document.getElementById("settingsCard").style.display =
    "none";

  document.getElementById("friendCard").style.display =
    "none";

  document.getElementById("partyCard").style.display =
    "none";

  document.getElementById("awayButton").style.display =
    "none";
}


/* ==========================================
   アカウント作成
========================================== */

function signUp() {

  const username =
    document.getElementById("usernameInput")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if (!username || !password) {
    alert("ユーザー名とパスワードを入力してください。");
    return;
  }

  if (username.length < 3) {
    alert("ユーザー名は3文字以上にしてください。");
    return;
  }

  if (password.length < 6) {
    alert("パスワードは6文字以上にしてください。");
    return;
  }

  const accounts = getAccounts();

  if (accounts[username]) {
    alert("そのユーザー名はすでに使用されています。");
    return;
  }

  accounts[username] = {
    username: username,
    password: password,
    status: "offline"
  };

  saveAccounts(accounts);

  alert("アカウントを作成しました！");

  document.getElementById("usernameInput").value = "";
  document.getElementById("password").value = "";
}


/* ==========================================
   ログイン
========================================== */

function signIn() {

  const username =
    document.getElementById("usernameInput")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const accounts = getAccounts();

  if (!accounts[username]) {
    alert("ユーザー名またはパスワードが違います。");
    return;
  }

  if (accounts[username].password !== password) {
    alert("ユーザー名またはパスワードが違います。");
    return;
  }

  currentUser = {
    username: username
  };

  guestMode = false;
  away = false;

  accounts[username].status = "online";
  saveAccounts(accounts);

  localStorage.setItem(
    "voiceChatCurrentUser",
    username
  );

  setLoggedInUI(username);

  loadFriends();
  loadFriendRequests();
}


/* ==========================================
   仮アカウント
========================================== */

function createGuest() {

  if (currentUser) {
    alert("すでにログインしています。");
    return;
  }

  const guestName =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  currentUser = {
    username: guestName
  };

  guestMode = true;
  away = false;

  setLoggedInUI(guestName);

  document.getElementById("friendList").innerHTML =
    '<div class="empty">仮アカウントではフレンド機能を利用できません。</div>';

  document.getElementById("requestList").innerHTML =
    '<div class="empty">仮アカウントではフレンド申請を利用できません。</div>';

  alert(
    "仮アカウントを作成しました！\n\n" +
    guestName
  );
}


/* ==========================================
   ログアウト
========================================== */

function signOut() {

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if (!guestMode && currentUser) {

    const accounts = getAccounts();

    if (accounts[currentUser.username]) {
      accounts[currentUser.username].status =
        "offline";
      saveAccounts(accounts);
    }
  }

  localStorage.removeItem(
    "voiceChatCurrentUser"
  );

  currentUser = null;
  guestMode = false;
  away = false;
  currentDMUser = null;

  closeDM();
  setLoggedOutUI();

  alert("ログアウトしました。");
}


/* ==========================================
   ユーザー名変更
========================================== */

function changeUsername() {

  if (!currentUser || guestMode) {
    alert("通常アカウントでログインしてください。");
    return;
  }

  const newUsername =
    document.getElementById("newUsername")
      .value.trim();

  if (!newUsername) {
    alert("新しいユーザー名を入力してください。");
    return;
  }

  if (newUsername.length < 3) {
    alert("ユーザー名は3文字以上にしてください。");
    return;
  }

  const accounts = getAccounts();

  if (accounts[newUsername]) {
    alert("そのユーザー名はすでに使用されています。");
    return;
  }

  const oldUsername = currentUser.username;

  accounts[newUsername] = {
    ...accounts[oldUsername],
    username: newUsername
  };

  delete accounts[oldUsername];

  saveAccounts(accounts);

  currentUser.username = newUsername;

  localStorage.setItem(
    "voiceChatCurrentUser",
    newUsername
  );

  document.getElementById("settingsStatus").textContent =
    "✅ ユーザー名を変更しました。";

  document.getElementById("newUsername").value = "";

  setLoggedInUI(newUsername);

  loadFriends();
}


/* ==========================================
   パスワード変更
========================================== */

function changePassword() {

  if (!currentUser || guestMode) {
    alert("通常アカウントでログインしてください。");
    return;
  }

  const password =
    document.getElementById("newPassword")
      .value;

  if (!password) {
    alert("新しいパスワードを入力してください。");
    return;
  }

  if (password.length < 6) {
    alert("パスワードは6文字以上にしてください。");
    return;
  }

  const accounts = getAccounts();

  accounts[currentUser.username].password =
    password;

  saveAccounts(accounts);

  document.getElementById("newPassword").value = "";

  document.getElementById("settingsStatus").textContent =
    "✅ パスワードを変更しました。";
}


/* ==========================================
   アカウント削除
========================================== */

function deleteAccount() {

  if (!currentUser) {
    alert("ログインしてください。");
    return;
  }

  if (!confirm(
    "本当にアカウントを削除しますか？\n\n" +
    "この操作は取り消せません。"
  )) {
    return;
  }

  if (guestMode) {

    currentUser = null;
    guestMode = false;

    stopMicrophone();
    stopCamera();
    stopScreenShare();

    setLoggedOutUI();

    alert("仮アカウントを削除しました。");
    return;
  }

  const username = currentUser.username;

  const accounts = getAccounts();

  delete accounts[username];

  saveAccounts(accounts);

  let friends = getFriends();

  delete friends[username];

  for (const user in friends) {
    friends[user] =
      friends[user].filter(
        name => name !== username
      );
  }

  saveFriends(friends);

  let requests = getRequests();

  requests = requests.filter(
    r =>
      r.from !== username &&
      r.to !== username
  );

  saveRequests(requests);

  currentUser = null;
  guestMode = false;

  localStorage.removeItem(
    "voiceChatCurrentUser"
  );

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  setLoggedOutUI();

  alert("アカウントを削除しました。");
}


/* ==========================================
   マイク
========================================== */

async function toggleMic() {

  if (!micEnabled) {

    try {

      microphone =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

      micEnabled = true;

      document.getElementById("micButton").textContent =
        "🔇 マイクOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopMicrophone();
    updateMediaStatus();
  }
}


function stopMicrophone() {

  if (microphone) {

    microphone.getTracks().forEach(
      track => track.stop()
    );
  }

  microphone = null;
  micEnabled = false;

  const button =
    document.getElementById("micButton");

  if (button) {
    button.textContent = "🎤 マイクON";
  }
}


/* ==========================================
   カメラ
========================================== */

async function toggleCamera() {

  if (!cameraEnabled) {

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      cameraEnabled = true;

      const video =
        document.getElementById("cameraVideo");

      video.srcObject = cameraStream;

      document.getElementById("cameraEmpty")
        .style.display = "none";

      document.getElementById("cameraButton")
        .textContent = "📷 カメラOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopCamera();
    updateMediaStatus();
  }
}


function stopCamera() {

  if (cameraStream) {

    cameraStream.getTracks().forEach(
      track => track.stop()
    );
  }

  cameraStream = null;
  cameraEnabled = false;

  document.getElementById("cameraVideo")
    .srcObject = null;

  document.getElementById("cameraEmpty")
    .style.display = "flex";

  document.getElementById("cameraButton")
    .textContent = "📷 カメラON";
}


/* ==========================================
   画面共有
========================================== */

async function toggleScreenShare() {

  if (!screenEnabled) {

    try {

      if (!navigator.mediaDevices.getDisplayMedia) {
        alert("このブラウザでは画面共有に対応していません。");
        return;
      }

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

      screenEnabled = true;

      const video =
        document.getElementById("screenVideo");

      video.srcObject = screenStream;

      document.getElementById("screenEmpty")
        .style.display = "none";

      document.getElementById("screenButton")
        .textContent = "🛑 画面共有OFF";

      const track =
        screenStream.getVideoTracks()[0];

      if (track) {

        track.addEventListener(
          "ended",
          () => {
            stopScreenShare();
            updateMediaStatus();
          }
        );
      }

      updateMediaStatus();

    } catch (error) {

      if (error.name !== "AbortError") {
        alert(
          "画面共有を開始できませんでした。"
        );
      }
    }

  } else {

    stopScreenShare();
    updateMediaStatus();
  }
}


function stopScreenShare() {

  if (screenStream) {

    screenStream.getTracks().forEach(
      track => track.stop()
    );
  }

  screenStream = null;
  screenEnabled = false;

  document.getElementById("screenVideo")
    .srcObject = null;

  document.getElementById("screenEmpty")
    .style.display = "flex";

  document.getElementById("screenButton")
    .textContent = "🖥️ 画面共有";
}


/* ==========================================
   メディア状態
========================================== */

function updateMediaStatus() {

  const status = [];

  if (micEnabled)
    status.push("🎤 マイクON");

  if (cameraEnabled)
    status.push("📷 カメラON");

  if (screenEnabled)
    status.push("🖥️ 画面共有ON");

  document.getElementById("status").textContent =
    status.length
      ? status.join("　")
      : "すべてOFF";
}


/* ==========================================
   離席
========================================== */

function toggleAway() {

  if (!currentUser || guestMode) {
    return;
  }

  away = !away;

  const accounts = getAccounts();

  if (accounts[currentUser.username]) {

    accounts[currentUser.username].status =
      away ? "away" : "online";

    saveAccounts(accounts);
  }

  document.getElementById("onlineStatus").textContent =
    away
      ? "🟡 離席"
      : "🟢 オンライン";

  updateAwayButton();

  loadFriends();
}


function updateAwayButton() {

  const button =
    document.getElementById("awayButton");

  if (!button || !currentUser || guestMode)
    return;

  button.textContent =
    away
      ? "🟢 オンラインに戻る"
      : "🟡 離席";
}


/* ==========================================
   フレンド検索
========================================== */

function searchFriend() {

  if (!currentUser || guestMode) {
    alert("通常アカウントでログインしてください。");
    return;
  }

  const name =
    document.getElementById("friendSearch")
      .value.trim()
      .toLowerCase();

  if (!name) {
    alert("検索する名前を入力してください。");
    return;
  }

  const accounts = getAccounts();

  const users =
    Object.values(accounts).filter(
      user =>
        user.username
          .toLowerCase()
          .includes(name) &&
        user.username !== currentUser.username
    );

  const result =
    document.getElementById("searchResult");

  result.innerHTML = "";

  if (!users.length) {

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  const friends = getFriends();

  users.forEach(user => {

    const alreadyFriend =
      (friends[currentUser.username] || [])
        .includes(user.username);

    const div =
      document.createElement("div");

    div.className = "friend";

    div.innerHTML = `
      <div class="friendAvatar">👤</div>

      <div class="friendInfo">
        <strong>${escapeHTML(user.username)}</strong>
        <span class="offline">プレイヤー</span>
      </div>

      ${
        alreadyFriend
        ? '<span class="online">✓ フレンド</span>'
        : `
          <button
            class="green"
            onclick="sendFriendRequest('${escapeJS(user.username)}')"
          >
            ＋ 追加
          </button>
        `
      }
    `;

    result.appendChild(div);
  });
}


/* ==========================================
   フレンド申請
========================================== */

function sendFriendRequest(username) {

  if (!currentUser || guestMode)
    return;

  if (username === currentUser.username)
    return;

  const requests = getRequests();

  const exists =
    requests.some(
      r =>
        r.from === currentUser.username &&
        r.to === username &&
        r.status === "pending"
    );

  if (exists) {
    alert("すでに申請しています。");
    return;
  }

  requests.push({
    id: Date.now(),
    from: currentUser.username,
    to: username,
    status: "pending"
  });

  saveRequests(requests);

  alert("フレンド申請を送りました！");
}


/* ==========================================
   フレンド一覧
========================================== */

function loadFriends() {

  if (!currentUser || guestMode)
    return;

  const friends =
    getFriends()[currentUser.username] || [];

  const accounts = getAccounts();

  const list =
    document.getElementById("friendList");

  list.innerHTML = "";

  if (!friends.length) {

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    return;
  }

  friends.forEach(name => {

    const friend = accounts[name];

    if (!friend)
      return;

    let statusText = "⚪ オフライン";
    let statusClass = "offline";

    if (friend.status === "online") {
      statusText = "🟢 オンライン";
      statusClass = "online";
    }

    if (friend.status === "away") {
      statusText = "🟡 離席";
      statusClass = "away";
    }

    const div =
      document.createElement("div");

    div.className = "friend";

    div.innerHTML = `
      <div class="friendAvatar">👤</div>

      <div class="friendInfo">
        <strong>${escapeHTML(name)}</strong>

        <span class="${statusClass}">
          ${statusText}
        </span>
      </div>

      <button
        onclick="openDM('${escapeJS(name)}')"
      >
        💬 DM
      </button>

      <button
        class="red"
        onclick="removeFriend('${escapeJS(name)}')"
      >
        🗑️ 削除
      </button>
    `;

    list.appendChild(div);
  });
}


/* ==========================================
   フレンド申請一覧
========================================== */

function loadFriendRequests() {

  if (!currentUser || guestMode)
    return;

  const requests =
    getRequests().filter(
      r =>
        r.to === currentUser.username &&
        r.status === "pending"
    );

  const list =
    document.getElementById("requestList");

  list.innerHTML = "";

  if (!requests.length) {

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  requests.forEach(request => {

    const div =
      document.createElement("div");

    div.className = "request";

    div.innerHTML = `
      <strong>
        ${escapeHTML(request.from)}
      </strong>

      <p>
        フレンド申請が届いています。
      </p>

      <button
        class="green"
        onclick="acceptFriend(${request.id})"
      >
        ✓ 承認
      </button>

      <button
        class="red"
        onclick="rejectFriend(${request.id})"
      >
        ✕ 拒否
      </button>
    `;

    list.appendChild(div);
  });
}


/* ==========================================
   フレンド承認
========================================== */

function acceptFriend(requestId) {

  const requests = getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if (!request)
    return;

  const friends = getFriends();

  if (!friends[currentUser.username])
    friends[currentUser.username] = [];

  if (!friends[request.from])
    friends[request.from] = [];

  if (
    !friends[currentUser.username]
      .includes(request.from)
  ) {
    friends[currentUser.username]
      .push(request.from);
  }

  if (
    !friends[request.from]
      .includes(currentUser.username)
  ) {
    friends[request.from]
      .push(currentUser.username);
  }

  saveFriends(friends);

  request.status = "accepted";

  saveRequests(requests);

  loadFriends();
  loadFriendRequests();

  alert("フレンドになりました！");
}


/* ==========================================
   フレンド申請拒否
========================================== */

function rejectFriend(requestId) {

  let requests = getRequests();

  requests =
    requests.filter(
      r => r.id !== requestId
    );

  saveRequests(requests);

  loadFriendRequests();
}


/* ==========================================
   フレンド削除
========================================== */

function removeFriend(friendName) {

  if (!currentUser || guestMode)
    return;

  if (!confirm(
    friendName +
    " をフレンドから削除しますか？"
  )) {
    return;
  }

  const friends = getFriends();

  if (friends[currentUser.username]) {

    friends[currentUser.username] =
      friends[currentUser.username]
        .filter(
          name => name !== friendName
        );
  }

  if (friends[friendName]) {

    friends[friendName] =
      friends[friendName]
        .filter(
          name => name !== currentUser.username
        );
  }

  saveFriends(friends);

  if (currentDMUser === friendName) {
    closeDM();
  }

  loadFriends();

  alert("フレンドを削除しました。");
}


/* ==========================================
   DMを開く
========================================== */

function openDM(friendName) {

  if (!currentUser || guestMode)
    return;

  currentDMUser = friendName;

  document.getElementById("dmBox")
    .style.display = "block";

  document.getElementById("dmTitle")
    .textContent =
      "💬 " + friendName + " とのDM";

  loadDM();

  document.getElementById("dmInput")
    .focus();
}


/* ==========================================
   DM読み込み
========================================== */

function getDMKey(a, b) {

  return [a, b]
    .sort()
    .join("___");
}


function loadDM() {

  if (!currentUser || !currentDMUser)
    return;

  const messages = getMessages();

  const key =
    getDMKey(
      currentUser.username,
      currentDMUser
    );

  const list =
    messages[key] || [];

  const box =
    document.getElementById("dmMessages");

  box.innerHTML = "";

  list.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "dmMessage " +
      (
        message.from === currentUser.username
          ? "dmMe"
          : ""
      );

    div.innerHTML = `
      <strong>
        ${escapeHTML(message.from)}
      </strong>
      <br>
      ${escapeHTML(message.text)}
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}


/* ==========================================
   DM送信
========================================== */

function sendDM() {

  if (!currentUser || !currentDMUser)
    return;

  const input =
    document.getElementById("dmInput");

  const text =
    input.value.trim();

  if (!text)
    return;

  const messages = getMessages();

  const key =
    getDMKey(
      currentUser.username,
      currentDMUser
    );

  if (!messages[key])
    messages[key] = [];

  messages[key].push({
    from: currentUser.username,
    to: currentDMUser,
    text: text,
    time: Date.now()
  });

  saveMessages(messages);

  input.value = "";

  loadDM();
}


/* ==========================================
   DMを閉じる
========================================== */

function closeDM() {

  currentDMUser = null;

  document.getElementById("dmBox")
    .style.display = "none";

  document.getElementById("dmMessages")
    .innerHTML = "";
}


/* ==========================================
   パーティー
========================================== */

function createParty() {

  if (!currentUser) {
    alert("ログインしてください。");
    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  document.getElementById("partyArea")
    .innerHTML = `

      <div class="partyBox">

        <h3>
          🎉 パーティー作成済み
        </h3>

        <p>
          パーティーコード
        </p>

        <strong
          style="font-size:24px;"
        >
          ${code}
        </strong>

        <br>

        <button
          class="red"
          onclick="leaveParty()"
        >
          パーティーを解散
        </button>

      </div>
    `;
}


/* ==========================================
   パーティー退出
========================================== */

function leaveParty() {

  document.getElementById("partyArea")
    .innerHTML =
      '<div class="empty">パーティーに参加していません。</div>';
}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeJS(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}


/* ==========================================
   初期ログイン
========================================== */

function checkUser() {

  const username =
    localStorage.getItem(
      "voiceChatCurrentUser"
    );

  if (!username) {

    setLoggedOutUI();
    return;
  }

  const accounts = getAccounts();

  if (!accounts[username]) {

    localStorage.removeItem(
      "voiceChatCurrentUser"
    );

    setLoggedOutUI();
    return;
  }

  currentUser = {
    username: username
  };

  guestMode = false;

  accounts[username].status = "online";

  saveAccounts(accounts);

  setLoggedInUI(username);

  loadFriends();
  loadFriendRequests();
}


/* ==========================================
   ページを閉じるとオフライン
========================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      currentUser &&
      !guestMode
    ) {

      const accounts = getAccounts();

      if (accounts[currentUser.username]) {

        accounts[currentUser.username].status =
          "offline";

        saveAccounts(accounts);
      }
    }
  }
);


/* ==========================================
   初期化
========================================== */

checkUser();

</script>

</body>
</html>
