<!-- アカウント作成・ログイン部分 -->

<div id="authScreen" class="card">

  <h2>🔐 アカウント</h2>

  <input
    id="usernameInput"
    type="text"
    placeholder="ユーザー名"
    maxlength="20"
    autocomplete="username"
  >

  <input
    id="passwordInput"
    type="password"
    placeholder="パスワード"
    maxlength="72"
    autocomplete="current-password"
  >

  <button id="loginButton">
    ログイン
  </button>

  <button id="createAccountButton">
    アカウント作成
  </button>

  <button id="guestButton" class="gray">
    仮アカウントで始める
  </button>

  <div id="message"></div>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   DOM
========================= */

const usernameInput =
  document.getElementById("usernameInput");

const passwordInput =
  document.getElementById("passwordInput");

const loginButton =
  document.getElementById("loginButton");

const createAccountButton =
  document.getElementById("createAccountButton");

const guestButton =
  document.getElementById("guestButton");

const message =
  document.getElementById("message");


/* =========================
   メッセージ
========================= */

function showMessage(text, error = false) {

  message.textContent = text;

  message.style.color =
    error ? "#ef4444" : "#22c55e";

}


/* =========================
   ユーザー名チェック
========================= */

function validUsername(username) {

  return /^[a-zA-Z0-9_ぁ-んァ-ヶ一-龠]{3,20}$/
    .test(username);

}


/* =========================
   アカウント作成
========================= */

createAccountButton.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if (!validUsername(username)) {

      showMessage(
        "ユーザー名は3～20文字で入力してください。",
        true
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "パスワードは6文字以上にしてください。",
        true
      );

      return;
    }


    createAccountButton.disabled = true;


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "create_user_account",
        {
          p_username: username,
          p_password: password
        }
      );


      if (error) {

        console.error(error);

        showMessage(
          "アカウント作成に失敗しました。",
          true
        );

        return;
      }


      if (!data) {

        showMessage(
          "そのユーザー名は既に使用されています。",
          true
        );

        return;
      }


      showMessage(
        "アカウントを作成しました！"
      );

      passwordInput.value = "";


    } catch (error) {

      console.error(error);

      showMessage(
        "エラーが発生しました。",
        true
      );

    } finally {

      createAccountButton.disabled = false;

    }

  }
);


/* =========================
   ログイン
========================= */

loginButton.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if (!username || !password) {

      showMessage(
        "ユーザー名とパスワードを入力してください。",
        true
      );

      return;
    }


    loginButton.disabled = true;


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "login_user",
        {
          p_username: username,
          p_password: password
        }
      );


      if (error) {

        console.error(error);

        showMessage(
          "ログインに失敗しました。",
          true
        );

        return;
      }


      if (!data) {

        showMessage(
          "ユーザー名またはパスワードが違います。",
          true
        );

        return;
      }


      const user =
        typeof data === "string"
          ? JSON.parse(data)
          : data;


      const account = {
        id: user.id,
        username: user.username,
        is_guest: false,
        status: "online"
      };


      localStorage.setItem(
        "browser_vc_user",
        JSON.stringify(account)
      );


      showMessage(
        "ログインしました！"
      );


      /*
        既存のメイン画面がある場合
      */

      if (typeof enterMainScreen === "function") {

        currentUser = account;

        await enterMainScreen();

      }


    } catch (error) {

      console.error(error);

      showMessage(
        "ログインエラーが発生しました。",
        true
      );

    } finally {

      loginButton.disabled = false;

    }

  }
);


/* =========================
   仮アカウント
========================= */

guestButton.addEventListener(
  "click",
  async () => {

    guestButton.disabled = true;


    try {

      const random =
        Math.random()
          .toString(36)
          .substring(2, 8);


      const account = {

        id:
          "guest_" +
          crypto.randomUUID(),

        username:
          "Guest_" + random,

        is_guest: true,

        status: "online"

      };


      localStorage.setItem(
        "browser_vc_user",
        JSON.stringify(account)
      );


      currentUser = account;


      if (
        typeof enterMainScreen === "function"
      ) {

        await enterMainScreen();

      }


    } catch (error) {

      console.error(error);

      showMessage(
        "仮アカウントの作成に失敗しました。",
        true
      );

    } finally {

      guestButton.disabled = false;

    }

  }
);

</script>
