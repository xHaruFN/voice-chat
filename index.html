<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>簡易ボイスチャット</title>
<style>
  body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #2f3136; color: #dcddde; }
  button { padding: 12px 24px; font-size: 16px; background: #5865f2; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 10px; }
  button:hover { background: #4752c4; }
  .card { background: #36393f; display: inline-block; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
</style>
</head>
<body>

  <div class="card">
    <h2>🎙️ ブラウザ音声通話テスト</h2>
    <p>自分のマイクの音声をスピーカーからループ再生してテストします。</p>
    <button onclick="startVoiceChat()">通話（マイク）開始</button>
    <button onclick="stopVoiceChat()" style="background: #ed4245;">停止</button>
  </div>

  <!-- 相手の音声や自分のテスト音声を鳴らすための音声要素 -->
  <audio id="remoteAudio" autoplay></audio>

<script>
let localStream;

async function startVoiceChat() {
  try {
    // 1. マイクの権限を取得して音声ストリームを取得
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    
    // 2. 音声出力先の設定（本来はWebRTCで相手のストリームをここに入れます）
    const audioEl = document.getElementById('remoteAudio');
    audioEl.srcObject = localStream;
    
    alert("マイクが正常に接続され、音声の入出力テストが開始されました！");
  } catch (err) {
    alert("マイクへのアクセスが拒否されたか、エラーが発生しました: " + err.message);
  }
}

function stopVoiceChat() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    document.getElementById('remoteAudio').srcObject = null;
    alert("通話を停止しました。");
  }
}
</script>

</body>
</html>
