<script>

/* ==========================================
   データ
========================================== */

let users =
  JSON.parse(
    localStorage.getItem("voicechat_users") || "[]"
  );

let friendships =
  JSON.parse(
    localStorage.getItem("voicechat_friendships") || "[]"
  );

let requests =
  JSON.parse(
    localStorage.getItem("voicechat_requests") || "[]"
  );

let messages =
  JSON.parse(
    localStorage.getItem("voicechat_messages") || "[]"
  );

let parties =
  JSON.parse(
    localStorage.getItem("voicechat_parties") || "[]"
  );

let currentUser = null;
let guestMode = false;
let currentDMUser = null;
let currentParty = null;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;


/* ==========================================
   保存
========================================== */

function saveAll() {

  localStorage.setItem(
    "voicechat_users",
    JSON.stringify(users)
  );

  localStorage.setItem(
    "voicechat_friendships",
    JSON.stringify(friendships)
  );

  localStorage.setItem(
    "voicechat_requests",
    JSON.stringify(requests)
  );

  localStorage.setItem(
    "voicechat_messages",
    JSON.stringify(messages)
  );

  localStorage.setItem(
    "voicechat_parties",
    JSON.stringify(parties)
  );
}


/* ==========================================
   ID
========================================== */

function makeId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2)
  );
}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==========================================
   UIログイン
========================================== */

function setLoggedInUI(name) {

  document.getElementById(
    "username"
  ).textContent = name;

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "🟢 オンライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    guestMode
      ? "👻 仮アカウント: " + name
      : "✅ ログイン中";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "inline-block";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "block";

  document.getElementById(
    "friendCard"
  ).style.display =
    "block";

  document.getElementById(
    "partyCard"
  ).style.display =
    "block";

  document.getElementById(
    "awayButton"
  ).style.display =
    "inline-block";
}


function setLoggedOutUI() {

  document.getElementById(
    "username"
  ).textContent =
    "未ログイン";

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "⚪ オフライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    "ログインしていません";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "none";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "none";

  document.getElementById(
    "friendCard"
  ).style.display =
    "none";

  document.getElementById(
    "dmCard"
  ).style.display =
    "none";

  document.getElementById(
    "partyCard"
  ).style.display =
    "none";

  document.getElementById(
    "awayButton"
  ).style.display =
    "none";
}


/* ==========================================
   アカウント作成
========================================== */

function signUp() {

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!username || !password) {

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if (username.length < 3) {

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if (password.length < 6) {

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  const exists =
    users.some(
      user =>
        user.username.toLowerCase() ===
        username.toLowerCase()
    );

  if (exists) {

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const user = {

    id: makeId(),

    username: username,

    password: password,

    status: "online",

    guest: false,

    createdAt: Date.now()

  };

  users.push(user);

  saveAll();

  currentUser = user;
  guestMode = false;

  setLoggedInUI(
    user.username
  );

  document.getElementById(
    "usernameInput"
  ).value = "";

  document.getElementById(
    "password"
  ).value = "";

  alert(
    "アカウントを作成しました！"
  );
}


/* ==========================================
   ログイン
========================================== */

function signIn() {

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!username || !password) {

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  const user =
    users.find(
      item =>
        item.username.toLowerCase() ===
          username.toLowerCase() &&
        item.password === password
    );

  if (!user) {

    alert(
      "ユーザー名またはパスワードが違います。"
    );

    return;
  }

  currentUser = user;
  guestMode = false;

  user.status = "online";

  saveAll();

  setLoggedInUI(
    user.username
  );

  loadFriends();
  loadFriendRequests();

  document.getElementById(
    "usernameInput"
  ).value = "";

  document.getElementById(
    "password"
  ).value = "";

  alert("ログインしました！");
}


/* ==========================================
   仮アカウント
========================================== */

function createGuest() {

  if (currentUser) {

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const guestName =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  currentUser = {

    id: "guest_" + makeId(),

    username: guestName,

    password: "",

    status: "online",

    guest: true

  };

  guestMode = true;

  setLoggedInUI(
    guestName
  );

  alert(
    "仮アカウントを作成しました！\n\n" +
    guestName
  );
}


/* ==========================================
   ログアウト
========================================== */

function signOut() {

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if (
    currentUser &&
    !guestMode
  ) {

    const user =
      users.find(
        u =>
          u.id === currentUser.id
      );

    if (user) {

      user.status =
        "offline";
    }

    saveAll();
  }

  currentUser = null;
  guestMode = false;
  currentDMUser = null;
  currentParty = null;

  setLoggedOutUI();

  document.getElementById(
    "friendList"
  ).innerHTML =
    '<div class="empty">フレンドはいません。</div>';

  document.getElementById(
    "requestList"
  ).innerHTML =
    '<div class="empty">フレンド申請はありません。</div>';

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';
}


/* ==========================================
   ユーザー名変更
========================================== */

function changeUsername() {

  if (!currentUser) {
    return;
  }

  if (guestMode) {

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newName =
    document.getElementById(
      "newUsername"
    ).value.trim();

  if (!newName) {

    alert(
      "新しいユーザー名を入力してください。"
    );

    return;
  }

  const exists =
    users.some(
      user =>
        user.id !== currentUser.id &&
        user.username.toLowerCase() ===
          newName.toLowerCase()
    );

  if (exists) {

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const user =
    users.find(
      u =>
        u.id === currentUser.id
    );

  if (!user) {
    return;
  }

  user.username =
    newName;

  currentUser =
    user;

  saveAll();

  setLoggedInUI(
    newName
  );

  document.getElementById(
    "newUsername"
  ).value = "";

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ ユーザー名を変更しました。";
}


/* ==========================================
   パスワード変更
========================================== */

function changePassword() {

  if (!currentUser) {
    return;
  }

  if (guestMode) {

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;

  if (newPassword.length < 6) {

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  const user =
    users.find(
      u =>
        u.id === currentUser.id
    );

  if (!user) {
    return;
  }

  user.password =
    newPassword;

  currentUser =
    user;

  saveAll();

  document.getElementById(
    "newPassword"
  ).value = "";

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ パスワードを変更しました。";
}


/* ==========================================
   アカウント削除
========================================== */

function deleteAccount() {

  if (!currentUser) {
    return;
  }

  if (guestMode) {

    currentUser = null;
    guestMode = false;

    setLoggedOutUI();

    alert(
      "仮アカウントを削除しました。"
    );

    return;
  }

  if (
    !confirm(
      "本当にアカウントを削除しますか？\nこの操作は元に戻せません。"
    )
  ) {
    return;
  }

  const id =
    currentUser.id;

  users =
    users.filter(
      user =>
        user.id !== id
    );

  friendships =
    friendships.filter(
      f =>
        f.a !== id &&
        f.b !== id
    );

  requests =
    requests.filter(
      r =>
        r.sender !== id &&
        r.receiver !== id
    );

  messages =
    messages.filter(
      m =>
        m.sender !== id &&
        m.receiver !== id
    );

  parties =
    parties.filter(
      p =>
        p.owner !== id &&
        !p.members.includes(id)
    );

  saveAll();

  currentUser = null;
  guestMode = false;

  setLoggedOutUI();

  alert(
    "アカウントを削除しました。"
  );
}


/* ==========================================
   離席
========================================== */

function toggleAway() {

  if (!currentUser) {
    return;
  }

  if (guestMode) {

    if (
      currentUser.status ===
      "away"
    ) {

      currentUser.status =
        "online";

      document.getElementById(
        "awayButton"
      ).textContent =
        "🟡 離席";

      document.getElementById(
        "onlineStatus"
      ).textContent =
        "🟢 オンライン";

    } else {

      currentUser.status =
        "away";

      document.getElementById(
        "awayButton"
      ).textContent =
        "🟢 オンラインに戻る";

      document.getElementById(
        "onlineStatus"
      ).textContent =
        "🟡 離席中";
    }

    return;
  }

  const user =
    users.find(
      u =>
        u.id === currentUser.id
    );

  if (!user) {
    return;
  }

  if (
    user.status ===
    "away"
  ) {

    user.status =
      "online";

    currentUser =
      user;

    document.getElementById(
      "awayButton"
    ).textContent =
      "🟡 離席";

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟢 オンライン";

  } else {

    user.status =
      "away";

    currentUser =
      user;

    document.getElementById(
      "awayButton"
    ).textContent =
      "🟢 オンラインに戻る";

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟡 離席中";
  }

  saveAll();

  loadFriends();
}


/* ==========================================
   マイク
========================================== */

async function toggleMic() {

  if (!micEnabled) {

    try {

      microphone =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      micEnabled = true;

      document.getElementById(
        "micButton"
      ).textContent =
        "🔇 マイクOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopMicrophone();

    updateMediaStatus();
  }
}


function stopMicrophone() {

  if (microphone) {

    microphone
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }

  microphone = null;
  micEnabled = false;

  const button =
    document.getElementById(
      "micButton"
    );

  if (button) {

    button.textContent =
      "🎤 マイクON";
  }
}


/* ==========================================
   カメラ
========================================== */

async function toggleCamera() {

  if (!cameraEnabled) {

    try {

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true,
            audio: false
          });

      cameraEnabled = true;

      document.getElementById(
        "cameraVideo"
      ).srcObject =
        cameraStream;

      document.getElementById(
        "cameraEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "cameraButton"
      ).textContent =
        "📷 カメラOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopCamera();

    updateMediaStatus();
  }
}


function stopCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }

  cameraStream = null;
  cameraEnabled = false;

  document.getElementById(
    "cameraVideo"
  ).srcObject =
    null;

  document.getElementById(
    "cameraEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "cameraButton"
  ).textContent =
    "📷 カメラON";
}


/* ==========================================
   画面共有
========================================== */

async function toggleScreenShare() {

  if (!screenEnabled) {

    try {

      if (
        !navigator.mediaDevices
          .getDisplayMedia
      ) {

        alert(
          "このブラウザでは画面共有に対応していません。"
        );

        return;
      }

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video: true,
            audio: true
          });

      screenEnabled = true;

      document.getElementById(
        "screenVideo"
      ).srcObject =
        screenStream;

      document.getElementById(
        "screenEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "screenButton"
      ).textContent =
        "🛑 画面共有OFF";

      const track =
        screenStream
          .getVideoTracks()[0];

      if (track) {

        track.addEventListener(
          "ended",
          () => {

            stopScreenShare();

            updateMediaStatus();
          }
        );
      }

      updateMediaStatus();

    } catch (error) {

      if (
        error.name !==
        "AbortError"
      ) {

        alert(
          "画面共有を開始できませんでした。"
        );
      }
    }

  } else {

    stopScreenShare();

    updateMediaStatus();
  }
}


function stopScreenShare() {

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );
  }

  screenStream = null;
  screenEnabled = false;

  document.getElementById(
    "screenVideo"
  ).srcObject =
    null;

  document.getElementById(
    "screenEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";
}


/* ==========================================
   メディア状態
========================================== */

function updateMediaStatus() {

  const status = [];

  if (micEnabled) {
    status.push("🎤 マイクON");
  }

  if (cameraEnabled) {
    status.push("📷 カメラON");
  }

  if (screenEnabled) {
    status.push("🖥️ 画面共有ON");
  }

  document.getElementById(
    "status"
  ).textContent =
    status.length
      ? status.join("　")
      : "すべてOFF";
}


/* ==========================================
   フレンド検索
========================================== */

function searchFriend() {

  if (!currentUser) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  const name =
    document.getElementById(
      "friendSearch"
    ).value.trim();

  if (!name) {

    alert(
      "検索する名前を入力してください。"
    );

    return;
  }

  const result =
    document.getElementById(
      "searchResult"
    );

  result.innerHTML = "";

  const found =
    users.filter(
      user =>
        user.id !== currentUser.id &&
        user.username
          .toLowerCase()
          .includes(
            name.toLowerCase()
          )
    );

  if (!found.length) {

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  found.forEach(
    user => {

      const alreadyFriend =
        isFriend(user.id);

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      div.innerHTML = `

        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">

          <strong>
            ${escapeHTML(user.username)}
          </strong>

          <span class="${
            user.status === "online"
              ? "online"
              : user.status === "away"
              ? "away"
              : "offline"
          }">
            ${statusText(user.status)}
          </span>

        </div>

        ${
          alreadyFriend
            ? `<button
                 class="gray"
                 disabled
               >
                 ✓ フレンド
               </button>`
            : `<button
                 class="green"
                 onclick="sendFriendRequest('${user.id}')"
               >
                 ＋ 追加
               </button>`
        }

      `;

      result.appendChild(div);
    }
  );
}


/* ==========================================
   ステータス
========================================== */

function statusText(status) {

  if (status === "online") {
    return "● オンライン";
  }

  if (status === "away") {
    return "● 離席";
  }

  return "● オフライン";
}


/* ==========================================
   フレンド判定
========================================== */

function isFriend(id) {

  return friendships.some(
    f =>
      (f.a === currentUser.id &&
       f.b === id) ||
      (f.a === id &&
       f.b === currentUser.id)
  );
}


/* ==========================================
   フレンド申請
========================================== */

function sendFriendRequest(
  userId
) {

  if (!currentUser) {
    return;
  }

  if (isFriend(userId)) {

    alert(
      "すでにフレンドです。"
    );

    return;
  }

  const exists =
    requests.some(
      r =>
        r.sender ===
          currentUser.id &&
        r.receiver ===
          userId &&
        r.status ===
          "pending"
    );

  if (exists) {

    alert(
      "すでにフレンド申請を送っています。"
    );

    return;
  }

  requests.push({

    id: makeId(),

    sender:
      currentUser.id,

    receiver:
      userId,

    status:
      "pending"

  });

  saveAll();

  alert(
    "フレンド申請を送りました！"
  );
}


/* ==========================================
   フレンド一覧
========================================== */

function loadFriends() {

  if (!currentUser) {
    return;
  }

  const list =
    document.getElementById(
      "friendList"
    );

  list.innerHTML = "";

  const myFriends =
    friendships
      .filter(
        f =>
          f.a === currentUser.id ||
          f.b === currentUser.id
      )
      .map(
        f =>
          f.a === currentUser.id
            ? f.b
            : f.a
      );

  if (!myFriends.length) {

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    return;
  }

  myFriends.forEach(
    id => {

      const friend =
        users.find(
          u =>
            u.id === id
        );

      if (!friend) {
        return;
      }

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      div.innerHTML = `

        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">

          <strong>
            ${escapeHTML(friend.username)}
          </strong>

          <span class="${
            friend.status === "online"
              ? "online"
              : friend.status === "away"
              ? "away"
              : "offline"
          }">
            ${statusText(friend.status)}
          </span>

        </div>

        <button
          onclick="openDM('${friend.id}')"
        >
          💬 DM
        </button>

        <button
          class="red"
          onclick="removeFriend('${friend.id}')"
        >
          🗑️ 削除
        </button>

      `;

      list.appendChild(div);
    }
  );
}


/* ==========================================
   申請一覧
========================================== */

function loadFriendRequests() {

  if (!currentUser) {
    return;
  }

  const list =
    document.getElementById(
      "requestList"
    );

  list.innerHTML = "";

  const incoming =
    requests.filter(
      r =>
        r.receiver ===
          currentUser.id &&
        r.status ===
          "pending"
    );

  if (!incoming.length) {

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  incoming.forEach(
    request => {

      const sender =
        users.find(
          u =>
            u.id ===
            request.sender
        );

      if (!sender) {
        return;
      }

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "request";

      div.innerHTML = `

        <strong>
          ${escapeHTML(sender.username)}
        </strong>

        <p>
          フレンド申請が届いています。
        </p>

        <button
          class="green"
          onclick="acceptFriend('${request.id}')"
        >
          ✓ 承認
        </button>

        <button
          class="red"
          onclick="rejectFriend('${request.id}')"
        >
          ✕ 拒否
        </button>

      `;

      list.appendChild(div);
    }
  );
}


/* ==========================================
   申請承認
========================================== */

function acceptFriend(
  requestId
) {

  const request =
    requests.find(
      r =>
        r.id ===
        requestId
    );

  if (!request) {
    return;
  }

  const already =
    isFriend(
      request.sender
    );

  if (!already) {

    friendships.push({

      a:
        currentUser.id,

      b:
        request.sender

    });
  }

  request.status =
    "accepted";

  saveAll();

  loadFriends();
  loadFriendRequests();

  alert(
    "フレンドになりました！"
  );
}


/* ==========================================
   申請拒否
========================================== */

function rejectFriend(
  requestId
) {

  const request =
    requests.find(
      r =>
        r.id ===
        requestId
    );

  if (!request) {
    return;
  }

  request.status =
    "rejected";

  saveAll();

  loadFriendRequests();
}


/* ==========================================
   フレンド削除
========================================== */

function removeFriend(
  friendId
) {

  if (
    !confirm(
      "このフレンドを削除しますか？"
    )
  ) {
    return;
  }

  friendships =
    friendships.filter(
      f =>
        !(
          (f.a === currentUser.id &&
           f.b === friendId) ||
          (f.a === friendId &&
           f.b === currentUser.id)
        )
    );

  saveAll();

  loadFriends();

  alert(
    "フレンドを削除しました。"
  );
}


/* ==========================================
   DM
========================================== */

function openDM(
  friendId
) {

  const friend =
    users.find(
      u =>
        u.id === friendId
    );

  if (!friend) {
    return;
  }

  currentDMUser =
    friendId;

  document.getElementById(
    "dmCard"
  ).style.display =
    "block";

  document.getElementById(
    "dmTitle"
  ).textContent =
    " - " +
    friend.username;

  loadDM();

  document.getElementById(
    "dmInput"
  ).focus();
}


function closeDM() {

  currentDMUser =
    null;

  document.getElementById(
    "dmCard"
  ).style.display =
    "none";
}


function sendDM() {

  if (
    !currentUser ||
    !currentDMUser
  ) {
    return;
  }

  const input =
    document.getElementById(
      "dmInput"
    );

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  messages.push({

    id:
      makeId(),

    sender:
      currentUser.id,

    receiver:
      currentDMUser,

    text:
      text,

    time:
      Date.now()

  });

  saveAll();

  input.value = "";

  loadDM();
}


function loadDM() {

  if (
    !currentUser ||
    !currentDMUser
  ) {
    return;
  }

  const box =
    document.getElementById(
      "dmMessages"
    );

  box.innerHTML = "";

  const dm =
    messages.filter(
      m =>
        (m.sender ===
           currentUser.id &&
         m.receiver ===
           currentDMUser) ||
        (m.sender ===
           currentDMUser &&
         m.receiver ===
           currentUser.id)
    )
    .sort(
      (a, b) =>
        a.time - b.time
    );

  if (!dm.length) {

    box.innerHTML =
      '<div class="empty">まだメッセージはありません。</div>';

    return;
  }

  dm.forEach(
    message => {

      const sender =
        users.find(
          u =>
            u.id ===
            message.sender
        );

      const div =
        document.createElement(
          "div"
        );

      const mine =
        message.sender ===
        currentUser.id;

      div.className =
        "dmMessage " +
        (mine
          ? "me"
          : "other");

      div.innerHTML = `

        <div class="dmName">
          ${mine
            ? "自分"
            : escapeHTML(
                sender
                  ? sender.username
                  : "Unknown"
              )}
        </div>

        <div>
          ${escapeHTML(
            message.text
          )}
        </div>

      `;

      box.appendChild(div);
    }
  );

  box.scrollTop =
    box.scrollHeight;
}


/* ==========================================
   パーティー作成
========================================== */

function createParty() {

  if (!currentUser) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  const party = {

    id:
      makeId(),

    code:
      code,

    owner:
      currentUser.id,

    members:
      [
        currentUser.id
      ],

    createdAt:
      Date.now()

  };

  parties.push(
    party
  );

  currentParty =
    party.id;

  saveAll();

  showParty(
    party
  );
}


/* ==========================================
   パーティーコード参加
========================================== */

function joinPartyByCode() {

  if (!currentUser) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    document.getElementById(
      "partyCodeInput"
    ).value
      .trim()
      .toUpperCase();

  if (!code) {

    alert(
      "パーティーコードを入力してください。"
    );

    return;
  }

  const party =
    parties.find(
      p =>
        p.code ===
        code
    );

  if (!party) {

    alert(
      "そのパーティーは存在しません。"
    );

    return;
  }

  if (
    !party.members.includes(
      currentUser.id
    )
  ) {

    party.members.push(
      currentUser.id
    );
  }

  currentParty =
    party.id;

  saveAll();

  showParty(
    party
  );

  document.getElementById(
    "partyCodeInput"
  ).value = "";

  alert(
    "パーティーに参加しました！"
  );
}


/* ==========================================
   パーティー表示
========================================== */

function showParty(
  party
) {

  const owner =
    party.owner ===
    currentUser.id;

  const memberNames =
    party.members
      .map(
        id =>
          users.find(
            u =>
              u.id === id
          )
      )
      .filter(Boolean);

  document.getElementById(
    "partyArea"
  ).innerHTML = `

    <div class="partyBox">

      <h3>
        🎉 パーティー参加中
      </h3>

      <p>
        パーティーコード
      </p>

      <strong
        style="font-size:24px;"
      >
        ${escapeHTML(
          party.code
        )}
      </strong>

      <h3>
        👥 メンバー
      </h3>

      ${
        memberNames.length
          ? memberNames
              .map(
                user =>
                  `<div>
                    👤 ${escapeHTML(
                      user.username
                    )}
                    ${
                      user.id ===
                      party.owner
                        ? " 👑"
                        : ""
                    }
                  </div>`
              )
              .join("")
          : '<div class="empty">メンバーなし</div>'
      }

      <br>

      ${
        owner
          ? `
            <button
              class="red"
              onclick="disbandParty('${party.id}')"
            >
              🗑️ パーティー解散
            </button>
          `
          : `
            <button
              class="red"
              onclick="leaveParty('${party.id}')"
            >
              🚪 パーティー退出
            </button>
          `
      }

    </div>
  `;
}


/* ==========================================
   パーティー退出
========================================== */

function leaveParty(
  partyId
) {

  const party =
    parties.find(
      p =>
        p.id ===
        partyId
    );

  if (!party) {
    return;
  }

  party.members =
    party.members.filter(
      id =>
        id !==
        currentUser.id
    );

  currentParty =
    null;

  saveAll();

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';

  alert(
    "パーティーから退出しました。"
  );
}


/* ==========================================
   パーティー解散
========================================== */

function disbandParty(
  partyId
) {

  if (
    !confirm(
      "パーティーを解散しますか？"
    )
  ) {
    return;
  }

  parties =
    parties.filter(
      p =>
        p.id !==
        partyId
    );

  currentParty =
    null;

  saveAll();

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';

  alert(
    "パーティーを解散しました。"
  );
}


/* ==========================================
   初期化
========================================== */

function init() {

  setLoggedOutUI();

  document.getElementById(
    "cameraEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "screenEmpty"
  ).style.display =
    "flex";
}

init();

</script>

</body>
</html>
