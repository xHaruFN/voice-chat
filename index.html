<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Large Scale WebRTC Party Room</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-dark: #090d16;
  --bg-card: #131b2e;
  --bg-input: #1c273e;
  --border: #2d3d5a;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --danger: #ef4444;
  --success: #10b981;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ヘッダー */
header { height: 56px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.logo { font-weight: 800; font-size: 1.1rem; background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.room-badge { display: flex; align-items: center; gap: 10px; background: var(--bg-dark); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
.copy-btn { background: var(--primary); border: none; color: white; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

/* メインレイアウト */
.app-container { flex: 1; display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 56px - 64px); }
.stage-area { padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

/* スポットライト（画面共有 & アクティブスピーカー） */
.spotlight { width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); display: none; }
.spotlight.active { display: block; }
.spotlight video { width: 100%; max-height: 480px; object-fit: contain; display: block; }
.spotlight-info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; color: #a5b4fc; }

/* アクティブビデオグリッド (最大6画面まで自動抽出) */
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.video-card { background: var(--bg-card); border-radius: 10px; aspect-ratio: 16/9; position: relative; overflow: hidden; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.video-card video { width: 100%; height: 100%; object-fit: cover; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #a855f7, var(--primary)); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
.card-label { position: absolute; bottom: 6px; left: 6px; right: 6px; background: rgba(10,15,26,0.85); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }

/* 右側サイドバー (参加者リスト & チャット) */
.sidebar { background: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: bold; color: var(--text-muted); display: flex; justify-content: space-between; }
.member-list { max-height: 180px; overflow-y: auto; padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.member-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; background: var(--bg-input); padding: 6px 10px; border-radius: 6px; }

/* チャット */
.chat-section { flex: 1; display: flex; flex-direction: column; padding: 12px 16px; overflow: hidden; }
.chat-logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.msg { background: var(--bg-input); padding: 6px 10px; border-radius: 8px; font-size: 0.8rem; max-width: 85%; word-break: break-word; }
.msg.mine { align-self: flex-end; background: var(--primary); }
.msg .name { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 2px; }

/* 入力・コントロール */
.join-box { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
input[type="text"] { background: var(--bg-input); border: 1px solid var(--border); color: white; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
.btn { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

.controls-bar { height: 64px; background: var(--bg-card); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 12px; }
.control-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-input); color: white; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
.control-btn.active { background: var(--primary); border-color: transparent; }
.control-btn.off { background: var(--danger); border-color: transparent; }

#remoteAudioContainer { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">👥 MultiParty WebRTC</div>
  <div class="room-badge">
    <span>ROOM: <strong id="roomDisp">未参加</strong></span>
    <button class="copy-btn" onclick="copyRoomId()">コピー</button>
  </div>
</header>

<div class="app-container">
  <div class="stage-area">
    <div id="spotlight" class="spotlight">
      <div id="spotlightTitle" class="spotlight-info">画面共有</div>
      <video id="spotlightVideo" autoplay playsinline muted></video>
    </div>
    <div id="videoGrid" class="video-grid"></div>
  </div>

  <div class="sidebar">
    <div class="join-box">
      <input type="text" id="usernameInput" placeholder="名前" value="ユーザー">
      <input type="text" id="roomIdInput" placeholder="ルームID">
      <button class="btn" onclick="joinRoom()">参加 / ルーム作成</button>
    </div>

    <div class="sidebar-header">
      <span>参加者一覧</span>
      <span id="memberCount">0名</span>
    </div>
    <div id="memberList" class="member-list"></div>

    <div class="chat-section">
      <div id="chatLogs" class="chat-logs"></div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="chatInput" placeholder="メッセージ..." style="flex:1;" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" onclick="sendChat()">送信</button>
      </div>
    </div>
  </div>
</div>

<div class="controls-bar">
  <button id="micBtn" class="control-btn active" onclick="toggleMic()">🎤</button>
  <button id="camBtn" class="control-btn off" onclick="toggleCam()">📷</button>
  <button id="screenBtn" class="control-btn off" onclick="toggleScreen()">🖥️</button>
  <button class="control-btn off" style="background:#dc2626;" onclick="location.reload()">🚪</button>
</div>

<div id="remoteAudioContainer"></div>

<script>
let peer = null;
let myId = '';
let myName = 'ユーザー';
let currentRoom = '';
let localStream = null;
let screenStream = null;

let isMicOn = true;
let isCamOn = false;
let isScreenOn = false;

// 全参加者の状態管理
const members = {}; // peerId -> { name, isCam, stream, conn, call }

async function initMedia() {
  try {
    // 大人数対応：音声のみ＋解像度・帯域抑制設定
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });
  } catch (e) {
    localStream = new MediaStream();
    isMicOn = false;
    updateControls();
  }
}

function joinRoom() {
  myName = document.getElementById('usernameInput').value.trim() || 'ユーザー';
  currentRoom = document.getElementById('roomIdInput').value.trim();
  if (!currentRoom) return alert("ルームIDを入力してください");

  if (peer) peer.destroy();

  peer = new Peer();

  peer.on('open', (id) => {
    myId = id;
    document.getElementById('roomDisp').textContent = currentRoom;
    addMember(myId, myName, isCamOn, true);
    
    // シグナリング・ハブへ接続
    const hubId = `room-hub-${currentRoom}`;
    connectHub(hubId);
  });

  peer.on('connection', (conn) => setupConnection(conn));
  peer.on('call', (call) => {
    call.answer(getActiveStream());
    setupCall(call);
  });
}

function connectHub(hubId) {
  const conn = peer.connect(hubId);
  let isConnected = false;

  const timer = setTimeout(() => {
    if (!isConnected) {
      conn.close();
      createHub(hubId); // 自分がホストになる
    }
  }, 1500);

  conn.on('open', () => {
    isConnected = true;
    clearTimeout(timer);
    setupConnection(conn);
  });
}

function createHub(hubId) {
  const hubPeer = new Peer(hubId);
  hubPeer.on('open', () => {
    hubPeer.on('connection', (c) => {
      c.on('data', (d) => {
        if (d.type === 'GET_MEMBERS') {
          const list = Object.keys(members);
          c.send({ type: 'MEMBER_LIST', list });
        }
      });
    });
  });
}

function connectToPeer(targetId) {
  if (members[targetId] || targetId === myId) return;
  const conn = peer.connect(targetId);
  setupConnection(conn);
  const call = peer.call(targetId, getActiveStream());
  setupCall(call);
}

function setupConnection(conn) {
  const targetId = conn.peer;

  conn.on('open', () => {
    if (!members[targetId]) members[targetId] = {};
    members[targetId].conn = conn;

    conn.send({ type: 'JOIN', name: myName, isCam: isCamOn, id: myId });
    conn.send({ type: 'GET_MEMBERS' });
  });

  conn.on('data', (data) => {
    if (data.type === 'JOIN') {
      members[data.id] = members[data.id] || {};
      members[data.id].name = data.name;
      members[data.id].isCam = data.isCam;
      addMember(data.id, data.name, data.isCam, false);
    } else if (data.type === 'MEMBER_LIST') {
      data.list.forEach(id => { if (id !== myId) connectToPeer(id); });
    } else if (data.type === 'CHAT') {
      appendChat(data.name, data.text, false);
    } else if (data.type === 'STATE') {
      if (members[data.id]) members[data.id].isCam = data.isCam;
      updateMemberUI(data.id, data.name, data.isCam);
    } else if (data.type === 'SCREEN') {
      if (data.isSharing) {
        showSpotlight(data.name + ' の画面', members[data.id]?.stream);
      } else {
        hideSpotlight();
      }
    }
  });

  conn.on('close', () => removeMember(targetId));
}

function setupCall(call) {
  const targetId = call.peer;
  members[targetId] = members[targetId] || {};
  members[targetId].call = call;

  call.on('stream', (remoteStream) => {
    members[targetId].stream = remoteStream;

    // 音声再生（バックグラウンド生成）
    let a = document.getElementById(`aud-${targetId}`);
    if (!a) {
      a = document.createElement('audio');
      a.id = `aud-${targetId}`;
      a.autoplay = true;
      document.getElementById('remoteAudioContainer').appendChild(a);
    }
    a.srcObject = remoteStream;

    updateMemberUI(targetId, members[targetId].name || '参加者', members[targetId].isCam);
  });

  call.on('close', () => removeMember(targetId));
}

function getActiveStream() {
  return isScreenOn && screenStream ? screenStream : localStream;
}

function toggleMic() {
  const t = localStream.getAudioTracks()[0];
  if (t) {
    isMicOn = !isMicOn;
    t.enabled = isMicOn;
    updateControls();
  }
}

async function toggleCam() {
  if (!isCamOn) {
    try {
      // 大人数向け：低解像度設定(QVGA/VGA)で帯域削減
      const vStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { max: 480 }, height: { max: 360 }, frameRate: { max: 15 } }
      });
      const vt = vStream.getVideoTracks()[0];
      localStream.addTrack(vt);
      isCamOn = true;
      replaceTrack(vt);
    } catch { alert("カメラが取得できません"); return; }
  } else {
    const vt = localStream.getVideoTracks()[0];
    if (vt) { vt.stop(); localStream.removeTrack(vt); }
    isCamOn = false;
    replaceTrack(null);
  }
  updateControls();
  broadcast({ type: 'STATE', id: myId, name: myName, isCam: isCamOn });
  updateMemberUI(myId, myName, isCamOn);
}

async function toggleScreen() {
  if (!isScreenOn) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const st = screenStream.getVideoTracks()[0];
      st.onended = () => stopScreen();
      isScreenOn = true;
      replaceTrack(st);
      showSpotlight(myName + ' の画面', screenStream);
      broadcast({ type: 'SCREEN', id: myId, name: myName, isSharing: true });
    } catch { return; }
  } else stopScreen();
  updateControls();
}

function stopScreen() {
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  isScreenOn = false;
  replaceTrack(isCamOn ? localStream.getVideoTracks()[0] : null);
  hideSpotlight();
  broadcast({ type: 'SCREEN', id: myId, name: myName, isSharing: false });
  updateControls();
}

function replaceTrack(track) {
  Object.values(members).forEach(m => {
    if (m.call && m.call.peerConnection) {
      const senders = m.call.peerConnection.getSenders();
      const s = senders.find(sd => sd.track && sd.track.kind === 'video');
      if (s) s.replaceTrack(track);
      else if (track) m.call.peerConnection.addTrack(track, getActiveStream());
    }
  });
}

function addMember(id, name, isCam, isSelf) {
  members[id] = members[id] || {};
  members[id].name = name;
  members[id].isCam = isCam;
  updateMemberListUI();
  updateMemberUI(id, name, isCam, isSelf);
}

function removeMember(id) {
  delete members[id];
  const el = document.getElementById(`card-${id}`);
  if (el) el.remove();
  const aud = document.getElementById(`aud-${id}`);
  if (aud) aud.remove();
  updateMemberListUI();
}

function updateMemberListUI() {
  const list = document.getElementById('memberList');
  list.innerHTML = '';
  const all = Object.keys(members);
  document.getElementById('memberCount').textContent = `${all.length + 1}名`;

  // 自分の表示
  list.innerHTML += `<div class="member-item"><span>${myName} (自分)</span><span>🎤</span></div>`;

  // 他の参加者
  Object.keys(members).forEach(id => {
    if (id === myId) return;
    const m = members[id];
    list.innerHTML += `<div class="member-item"><span>${m.name || '参加者'}</span><span>${m.isCam ? '📷' : ''} 🎤</span></div>`;
  });
}

function updateMemberUI(id, name, isCam, isSelf) {
  const grid = document.getElementById('videoGrid');
  let card = document.getElementById(`card-${id}`);

  // カメラがOFFの場合はグリッド領域を圧迫しないよう表示を整理
  if (!isCam && !(isSelf && isScreenOn)) {
    if (card) card.remove();
    return;
  }

  if (!card) {
    card = document.createElement('div');
    card.id = `card-${id}`;
    card.className = 'video-card';
    grid.appendChild(card);
  }

  const stream = isSelf ? getActiveStream() : members[id]?.stream;

  card.innerHTML = `
    <video id="v-${id}" autoplay playsinline ${isSelf ? 'muted' : ''}></video>
    <div class="card-label">
      <span>${name}</span>
    </div>
  `;

  if (stream) {
    const v = card.querySelector(`#v-${id}`);
    if (v) v.srcObject = stream;
  }
}

function showSpotlight(title, stream) {
  const sp = document.getElementById('spotlight');
  document.getElementById('spotlightTitle').textContent = title;
  document.getElementById('spotlightVideo').srcObject = stream;
  sp.classList.add('active');
}

function hideSpotlight() {
  const sp = document.getElementById('spotlight');
  sp.classList.remove('active');
  document.getElementById('spotlightVideo').srcObject = null;
}

function broadcast(data) {
  Object.values(members).forEach(m => m.conn && m.conn.open && m.conn.send(data));
}

function updateControls() {
  document.getElementById('micBtn').className = `control-btn ${isMicOn ? 'active' : 'off'}`;
  document.getElementById('camBtn').className = `control-btn ${isCamOn ? 'active' : 'off'}`;
  document.getElementById('screenBtn').className = `control-btn ${isScreenOn ? 'active' : 'off'}`;
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const val = input.value.trim();
  if (!val) return;
  broadcast({ type: 'CHAT', name: myName, text: val });
  appendChat(myName, val, true);
  input.value = '';
}

function appendChat(name, text, isMine) {
  const logs = document.getElementById('chatLogs');
  const div = document.createElement('div');
  div.className = `msg ${isMine ? 'mine' : ''}`;
  div.innerHTML = `<div class="name">${name}</div><div>${text}</div>`;
  logs.appendChild(div);
  logs.scrollTop = logs.scrollHeight;
}

function copyRoomId() {
  if (!currentRoom) return alert("ルームに参加していません");
  navigator.clipboard.writeText(currentRoom);
  alert("ルームIDをコピーしました: " + currentRoom);
}

initMedia();
</script>
</body>
</html>
