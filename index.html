<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Ultimate Discord Style Voice Changer</title>
<style>
  :root {
    --bg-dark: #36393f;
    --bg-darker: #2f3136;
    --bg-deep: #202225;
    --accent: #5865f2;
    --text-main: #dcddde;
    --text-muted: #8e9297;
    --green: #3ba55d;
    --red: #ed4245;
  }
  body {
    margin: 0;
    background: var(--bg-darker);
    color: var(--text-main);
    font-family: sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  
  .sidebar {
    width: 290px;
    background: var(--bg-dark);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 1px solid var(--bg-deep);
    overflow-y: auto;
  }
  h3 { font-size: 13px; color: var(--text-muted); margin: 8px 0 4px; text-transform: uppercase; }
  select, button {
    width: 100%;
    padding: 10px;
    background: var(--bg-deep);
    border: 1px solid #202225;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #40444b; }
  
  .effect-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .effect-btn {
    background: var(--bg-deep);
    border: 1px solid #4f545c;
    padding: 8px;
    text-align: center;
    border-radius: 4px;
    font-size: 12px;
    transition: 0.1s;
  }
  .effect-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    font-weight: bold;
  }

  .main {
    flex: 1;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  .card {
    background: var(--bg-dark);
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #202225;
  }
  .slider-group { margin: 15px 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>

  <div class="sidebar">
    <h3>🎙️ 入力マイク (自分の声)</h3>
    <select id="micInputSelect"></select>

    <h3>🎧 出力先 (仮想マイク)</h3>
    <select id="audioOutputSelect"></select>
    <p style="font-size:11px; color:var(--text-muted);">※VB-Cable等を指定するとフォートナイトへ流れます</p>

    <hr style="border:0; border-top:1px solid #4f545c; margin:5px 0;">

    <h3>🎛️ ボイスチェンジャー種類</h3>
    <div class="effect-grid">
      <button class="effect-btn active" onclick="setEffect('normal')">ノーマル</button>
      <button class="effect-btn" onclick="setEffect('female')">👩 女声風</button>
      <button class="effect-btn" onclick="setEffect('male')">👨 男声風</button>
      <button class="effect-btn" onclick="setEffect('chipmunk')">🐿️ シマリス</button>
      <button class="effect-btn" onclick="setEffect('demon')">😈 悪魔・低音</button>
      <button class="effect-btn" onclick="setEffect('robot')">🤖 ロボット</button>
      <button class="effect-btn" onclick="setEffect('radio')">📻 無線・無線機</button>
      <button class="effect-btn" onclick="setEffect('megaphone')">📢 メガホン</button>
      <button class="effect-btn" onclick="setEffect('cave')">🦇 洞窟・エコー</button>
      <button class="effect-btn" onclick="setEffect('telephone')">☎️ 古い電話</button>
    </div>

    <button id="powerBtn" style="background:var(--accent); margin-top:auto; font-weight:bold;" onclick="toggleVoiceChanger()">🟢 VC起動 / 停止</button>
  </div>

  <div class="main">
    <div class="card">
      <h2>🎮 フォートナイト・Discord連携ステータス</h2>
      <p id="vcStatus" style="color: var(--red);">🔴 停止中 ("VC起動" ボタンを押してください)</p>
    </div>
    
    <div class="card">
      <h3>⚙️ フィルター周波数微調整</h3>
      <div class="slider-group">
        <label>カットオフ周波数: <span id="freqVal">1000</span> Hz</label>
        <input type="range" id="freqRange" min="100" max="8000" step="100" value="1000" oninput="updateFreq(this.value)">
      </div>
    </div>
  </div>

<script>
let audioCtx;
let mediaStream;
let sourceNode;
let filterNode;
let gainNode;
let currentEffect = 'normal';

async function getDevices() {
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    const micSelect = document.getElementById("micInputSelect");
    const outSelect = document.getElementById("audioOutputSelect");
    
    micSelect.innerHTML = "";
    outSelect.innerHTML = "";

    devices.forEach(device => {
      const opt = document.createElement('option');
      opt.value = device.deviceId;
      opt.text = device.label || `${device.kind} (${device.deviceId.slice(0,5)})`;
      
      if (device.kind === 'audioinput') micSelect.appendChild(opt);
      else if (device.kind === 'audiooutput') outSelect.appendChild(opt);
    });
  } catch (e) {
    console.error("デバイス取得失敗:", e);
  }
}

async function toggleVoiceChanger() {
  const statusElem = document.getElementById("vcStatus");
  const powerBtn = document.getElementById("powerBtn");
  
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    statusElem.textContent = "🔴 停止中";
    statusElem.style.color = "var(--red)";
    powerBtn.style.background = "var(--accent)";
    return;
  }

  try {
    const micId = document.getElementById("micInputSelect").value;
    const outputId = document.getElementById("audioOutputSelect").value;

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { deviceId: micId ? { exact: micId } : undefined, echoCancellation: true, noiseSuppression: true }
    });

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaStreamSource(mediaStream);
    
    filterNode = audioCtx.createBiquadFilter();
    gainNode = audioCtx.createGain();

    sourceNode.connect(filterNode);
    filterNode.connect(gainNode);

    const dummyAudio = new Audio();
    const dest = audioCtx.createMediaStreamDestination();
    gainNode.connect(dest);
    dummyAudio.srcObject = dest.stream;
    
    if (typeof dummyAudio.setSinkId === 'function' && outputId) {
      await dummyAudio.setSinkId(outputId);
    }
    dummyAudio.play();

    applyEffectParameters(currentEffect);

    statusElem.textContent = "🟢 稼働中 (女声・男声フィルター適用中)";
    statusElem.style.color = "var(--green)";
    powerBtn.style.background = "var(--red)";
    powerBtn.textContent = "🔴 VC停止";

  } catch (err) {
    alert("エラー: " + err.message);
  }
}

function setEffect(type) {
  currentEffect = type;
  document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  
  applyEffectParameters(type);
}

function applyEffectParameters(type) {
  if (!filterNode || !audioCtx) return;
  
  filterNode.type = 'allpass';
  gainNode.gain.value = 1.0;

  switch(type) {
    case 'normal':
      filterNode.type = 'allpass';
      break;
    case 'female': // 女声風（高めの周波数帯域をブーストしつつこもりを排除）
      filterNode.type = 'highpass';
      filterNode.frequency.value = 450;
      gainNode.gain.value = 1.2;
      break;
    case 'male': // 男声風（太く落ち着いた低音域を強調）
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 550;
      gainNode.gain.value = 1.1;
      break;
    case 'chipmunk':
      filterNode.type = 'highpass';
      filterNode.frequency.value = 800;
      break;
    case 'demon':
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 350;
      break;
    case 'robot':
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 1000;
      filterNode.Q.value = 5;
      break;
    case 'radio':
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 1800;
      filterNode.Q.value = 3;
      break;
    case 'megaphone':
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 1500;
      filterNode.Q.value = 2;
      gainNode.gain.value = 1.5;
      break;
    case 'cave':
      filterNode.type = 'lowpass';
      filterNode.frequency.value = 600;
      break;
    case 'telephone':
      filterNode.type = 'bandpass';
      filterNode.frequency.value = 1200;
      filterNode.Q.value = 4;
      break;
  }
  document.getElementById('freqRange').value = filterNode.frequency.value || 1000;
  document.getElementById('freqVal').textContent = filterNode.frequency.value || 1000;
}

function updateFreq(val) {
  document.getElementById('freqVal').textContent = val;
  if (filterNode) {
    filterNode.frequency.value = parseFloat(val);
  }
}

getDevices();
</script>
</body>
</html>
