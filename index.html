<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINE Style Chat</title>
<style>
:root {
  --line-green: #06C755;
  --bg-chat: #8cabd9;
  --bubble-mine: #85e249;
  --border-color: #e2e8f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body, html { height: 100%; background: #1e1e1e; display: flex; justify-content: center; align-items: center; }

/* スマホ風コンテナ */
.app-container {
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 800px;
  background: white;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

/* 認証画面 */
.auth-screen {
  position: absolute;
  inset: 0;
  background: white;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 32px 24px;
}
.auth-screen h2 { color: var(--line-green); text-align: center; margin-bottom: 24px; font-size: 1.5rem; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 6px; }
.input-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; }
.input-group input:focus { border-color: var(--line-green); }
.btn-primary { width: 100%; padding: 12px; background: var(--line-green); border: none; color: white; font-weight: bold; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
.btn-primary:hover { opacity: 0.9; }
.btn-link { background: none; border: none; color: #64748b; text-decoration: underline; font-size: 0.85rem; margin-top: 16px; cursor: pointer; width: 100%; text-align: center; }
.error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 12px; text-align: center; }

/* チャット画面 */
.chat-screen {
  display: none;
  flex-direction: column;
  height: 100%;
  background: var(--bg-chat);
}

header {
  height: 56px;
  background: rgba(0, 0, 0, 0.15);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: white;
}
header h3 { font-size: 1.05rem; }
.user-info { font-size: 0.8rem; opacity: 0.9; margin-right: 8px; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.btn-small { background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; }

/* メッセージリスト */
.message-list {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message-group { display: flex; gap: 8px; max-width: 80%; }
.message-group.mine { align-self: flex-end; flex-direction: row-reverse; }
.message-group.other { align-self: flex-start; }

.avatar {
  width: 36px; height: 36px; border-radius: 14px; background: #94a3b8;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: white; font-size: 0.85rem; flex-shrink: 0;
}

.content { display: flex; flex-direction: column; gap: 4px; }
.user-name { font-size: 0.75rem; color: rgba(255, 255, 255, 0.9); }
.bubble-row { display: flex; align-items: flex-end; gap: 6px; }
.mine .bubble-row { flex-direction: row-reverse; }

.bubble {
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 0.95rem;
  line-height: 1.4;
  word-break: break-word;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.mine .bubble { background: var(--bubble-mine); color: #000; border-top-right-radius: 2px; }
.other .bubble { background: white; color: #000; border-top-left-radius: 2px; }

.time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.85); flex-shrink: 0; }

/* 入力エリア */
.input-area {
  background: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  background: #f8fafc;
  outline: none;
  font-size: 0.95rem;
}
.send-btn {
  background: var(--line-green);
  border: none;
  color: white;
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1rem; font-weight: bold;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- 認証画面 -->
  <div id="auth-screen" class="auth-screen">
    <h2 id="auth-title">ログイン</h2>
    
    <div id="name-field" class="input-group" style="display: none;">
      <label>表示名（ニックネーム）</label>
      <input type="text" id="name-input" placeholder="例: たろう">
    </div>

    <div class="input-group">
      <label>ユーザーID</label>
      <input type="text" id="userid-input" placeholder="ユーザーIDを入力">
    </div>

    <div class="input-group">
      <label>パスワード</label>
      <input type="password" id="password-input" placeholder="パスワードを入力">
    </div>

    <button id="auth-submit-btn" class="btn-primary">ログイン</button>
    <button id="toggle-auth-btn" class="btn-link">新規登録はこちら</button>

    <div id="auth-error" class="error-msg"></div>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen" class="chat-screen">
    <header>
      <h3>グループトーク</h3>
      <div class="header-actions">
        <span id="current-user-display" class="user-info"></span>
        <button id="logout-btn" class="btn-small">ログアウト</button>
      </div>
    </header>

    <div id="message-list" class="message-list"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="メッセージを入力">
      <button id="send-btn" class="send-btn">▲</button>
    </div>
  </div>
</div>

<script>
  // ローカルストレージ管理
  const STORAGE_USERS = 'chat_app_users';
  const STORAGE_MESSAGES = 'chat_app_messages';
  const STORAGE_CURRENT_USER = 'chat_app_current_user';

  function getUsers() {
    return JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
  }
  function saveUsers(users) {
    localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
  }
  function getMessages() {
    return JSON.parse(localStorage.getItem(STORAGE_MESSAGES) || '[]');
  }
  function saveMessages(msgs) {
    localStorage.setItem(STORAGE_MESSAGES, JSON.stringify(msgs));
  }

  // UI 要素
  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const authTitle = document.getElementById('auth-title');
  const nameField = document.getElementById('name-field');
  const nameInput = document.getElementById('name-input');
  const useridInput = document.getElementById('userid-input');
  const passwordInput = document.getElementById('password-input');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const toggleAuthBtn = document.getElementById('toggle-auth-btn');
  const authError = document.getElementById('auth-error');
  const currentUserDisplay = document.getElementById('current-user-display');
  const messageList = document.getElementById('message-list');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const logoutBtn = document.getElementById('logout-btn');

  let isSignUpMode = false;
  let currentUser = null;

  // 初期読み込み時の認証チェック
  function initAuth() {
    const savedUser = localStorage.getItem(STORAGE_CURRENT_USER);
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      showChatScreen();
    } else {
      showAuthScreen();
    }
  }

  function showAuthScreen() {
    authScreen.style.display = 'flex';
    chatScreen.style.display = 'none';
  }

  function showChatScreen() {
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    currentUserDisplay.textContent = currentUser.name;
    loadMessages();
  }

  // 画面切り替え（ログイン / 新規登録）
  toggleAuthBtn.addEventListener('click', () => {
    isSignUpMode = !isSignUpMode;
    authError.textContent = '';
    if (isSignUpMode) {
      authTitle.textContent = '新規登録';
      nameField.style.display = 'block';
      authSubmitBtn.textContent = '登録して始める';
      toggleAuthBtn.textContent = 'すでにアカウントをお持ちの方（ログイン）';
    } else {
      authTitle.textContent = 'ログイン';
      nameField.style.display = 'none';
      authSubmitBtn.textContent = 'ログイン';
      toggleAuthBtn.textContent = '新規登録はこちら';
    }
  });

  // ログイン / アカウント作成 処理
  authSubmitBtn.addEventListener('click', () => {
    const userid = useridInput.value.trim();
    const password = passwordInput.value.trim();
    const name = nameInput.value.trim();
    authError.textContent = '';

    if (!userid || !password) {
      authError.textContent = 'IDとパスワードを入力してください。';
      return;
    }

    const users = getUsers();

    if (isSignUpMode) {
      if (!name) {
        authError.textContent = '表示名を入力してください。';
        return;
      }
      if (users[userid]) {
        authError.textContent = 'このユーザーIDは既に使用されています。';
        return;
      }
      users[userid] = { password: password, name: name };
      saveUsers(users);

      currentUser = { id: userid, name: name };
      localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
      showChatScreen();
    } else {
      if (!users[userid] || users[userid].password !== password) {
        authError.textContent = 'ユーザーIDまたはパスワードが正しくありません。';
        return;
      }
      currentUser = { id: userid, name: users[userid].name };
      localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
      showChatScreen();
    }
  });

  // ログアウト
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem(STORAGE_CURRENT_USER);
    currentUser = null;
    useridInput.value = '';
    passwordInput.value = '';
    nameInput.value = '';
    showAuthScreen();
  });

  // メッセージ送信
  function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;

    const messages = getMessages();
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

    const newMsg = {
      id: Date.now(),
      userId: currentUser.id,
      userName: currentUser.name,
      text: text,
      time: timeStr
    };

    messages.push(newMsg);
    saveMessages(messages);
    messageInput.value = '';
    loadMessages();
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // メッセージ読み込み・描画
  function loadMessages() {
    const messages = getMessages();
    messageList.innerHTML = '';

    messages.forEach(msg => {
      const isMine = currentUser && msg.userId === currentUser.id;
      const msgDiv = document.createElement('div');
      msgDiv.className = `message-group ${isMine ? 'mine' : 'other'}`;

      if (isMine) {
        msgDiv.innerHTML = `
          <div class="bubble-row">
            <div class="bubble">${escapeHTML(msg.text)}</div>
            <span class="time">${msg.time}</span>
          </div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="avatar">${escapeHTML(msg.userName.charAt(0))}</div>
          <div class="content">
            <div class="user-name">${escapeHTML(msg.userName)}</div>
            <div class="bubble-row">
              <div class="bubble">${escapeHTML(msg.text)}</div>
              <span class="time">${msg.time}</span>
            </div>
          </div>
        `;
      }
      messageList.appendChild(msgDiv);
    });

    messageList.scrollTop = messageList.scrollHeight;
  }

  // 他のタブでの変更をリアルタイム同期
  window.addEventListener('storage', (e) => {
    if (e.key === STORAGE_MESSAGES && currentUser) {
      loadMessages();
    }
  });

  function escapeHTML(str) {
    return (str || '').replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // 起動
  initAuth();
</script>

</body>
</html>
