<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Voice Room</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --speaking-color: #10b981;
  --danger: #ef4444;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* ログイン・ルーム参加画面 */
.join-container { background: var(--card-bg); border-radius: 16px; padding: 32px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
.join-container h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--primary); }
.input-group { margin-bottom: 16px; text-align: left; }
.input-group label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 6px; }
.input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 1rem; }
.input-group input:focus { border-color: var(--primary); }
.join-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
.join-btn:hover { background: var(--primary-hover); }

/* 通話ルーム画面 */
.room-container { display: none; width: 100%; max-width: 800px; height: 100vh; flex-direction: column; justify-content: space-between; padding: 24px; }
.room-header { text-align: center; }
.room-title { font-size: 1.2rem; font-weight: bold; background: #334155; display: inline-block; padding: 6px 16px; border-radius: 20px; }

/* アバター一覧エリア */
.members-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 24px; margin: auto 0; justify-items: center; align-items: center; width: 100%; }
.user-card { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.avatar { width: 90px; height: 90px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; color: white; position: relative; border: 4px solid transparent; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
/* 話者ハイライト */
.avatar.speaking { border-color: var(--speaking-color); box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
.avatar.muted::after { content: '🔇'; position: absolute; bottom: 0; right: 0; background: var(--danger); font-size: 0.8rem; padding: 4px; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
.user-name { font-size: 0.9rem; font-weight: 500; }

/* フッターコントロール */
.controls-bar { display: flex; justify-content: center; gap: 20px; padding: 16px 0; }
.icon-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: var(--card-bg); color: white; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
.icon-btn.off { background: var(--danger); }
.icon-btn:hover { transform: scale(1.05); }

#audioContainer { display: none; }
</style>
</head>
<body>

<!-- 入室画面 -->
<div id="joinArea" class="join-container">
  <h1>🎙️ ボイスチャット</h1>
  <div class="input-group">
    <label for="usernameInput">表示名</label>
    <input type="text" id="usernameInput" placeholder="例: たろう" value="ユーザー1">
  </div>
  <div class="input-group">
    <label for="roomInput">合言葉（ルーム名）</label>
    <input type="text" id="roomInput" placeholder="例: secret-room-123" value="test-room">
  </div>
  <button class="join-btn" onclick="joinRoom()">部屋に入る</button>
</div>

<!-- ルーム画面 -->
<div id="roomArea" class="room-container">
  <div class="room-header">
    <span class="room-title">部屋: <span id="roomNameDisplay"></span></span>
  </div>

  <div id="membersGrid" class="members-grid">
    <!-- 自分のアバター -->
    <div class="user-card">
      <div id="myAvatar" class="avatar">自</div>
      <span id="myNameDisplay" class="user-name">自分</span>
    </div>
    <!-- 相手のアバター -->
    <div id="peerCard" class="user-card" style="display:none;">
      <div id="peerAvatar" class="avatar">対</div>
      <span id="peerNameDisplay" class="user-name">相手</span>
    </div>
  </div>

  <div class="controls-bar">
    <button id="micBtn" class="icon-btn" onclick="toggleMic()" title="マイクON/OFF">🎤</button>
    <button class="icon-btn off" onclick="leaveRoom()" title="退出">🚪</button>
  </div>
</div>

<div id="audioContainer">
  <audio id="remoteAudio" autoplay></audio>
</div>

<script>
let peer = null;
let myStream = null;
let mediaCall = null;
let dataConn = null;

let myName = '';
let roomName = '';
let isMicOn = true;

let audioContext = null;
let analyser = null;
let microphone = null;

// 入室処理
async function joinRoom() {
  myName = document.getElementById('usernameInput').value.trim() || '名無し';
  roomName = document.getElementById('roomInput').value.trim();

  if (!roomName) return alert('合言葉（ルーム名）を入力してください');

  try {
    // 高音質マイク設定
    myStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    setupAudioAnalysis(myStream);
  } catch (e) {
    alert('マイクのアクセス許可が必要です');
    return;
  }

  // ハッシュ（または決定論的プレフィックス）を用いたルームID生成の模倣
  // 部屋の「ホスト」判定（簡易ルール: 先に入っているPeerへ接続を試みる）
  const peerIdHost = `bvchat-${roomName}-host`;
  const peerIdGuest = `bvchat-${roomName}-guest-${Math.floor(Math.random()*1000)}`;

  peer = new Peer(peerIdHost);

  peer.on('open', (id) => {
    // 自分がホストとして部屋を作成
    initUIInRoom();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      // 既にホストが存在する場合はゲストとして接続
      peer = new Peer(peerIdGuest);
      peer.on('open', () => {
        initUIInRoom();
        connectToHost(peerIdHost);
      });
    } else {
      console.error(err);
    }
  });

  peer.on('call', (call) => {
    mediaCall = call;
    call.answer(myStream);
    handleStream(call);
  });

  peer.on('connection', (conn) => {
    dataConn = conn;
    setupDataConnection();
  });
}

function initUIInRoom() {
  document.getElementById('joinArea').style.display = 'none';
  document.getElementById('roomArea').style.display = 'flex';
  document.getElementById('roomNameDisplay').textContent = roomName;
  document.getElementById('myNameDisplay').textContent = myName;
  document.getElementById('myAvatar').textContent = myName.charAt(0);
}

function connectToHost(hostId) {
  dataConn = peer.connect(hostId);
  setupDataConnection();

  mediaCall = peer.call(hostId, myStream);
  handleStream(mediaCall);
}

function setupDataConnection() {
  dataConn.on('open', () => {
    dataConn.send({ type: 'NAME', name: myName });
  });

  dataConn.on('data', (data) => {
    if (data.type === 'NAME') {
      showPeer(data.name);
    } else if (data.type === 'MUTED') {
      const avatar = document.getElementById('peerAvatar');
      if (data.isMuted) avatar.classList.add('muted');
      else avatar.classList.remove('muted');
    }
  });
}

function handleStream(call) {
  call.on('stream', (remoteStream) => {
    document.getElementById('remoteAudio').srcObject = remoteStream;
    showPeer("接続中...");
  });
}

function showPeer(name) {
  const card = document.getElementById('peerCard');
  card.style.display = 'flex';
  document.getElementById('peerNameDisplay').textContent = name;
  document.getElementById('peerAvatar').textContent = name.charAt(0);
}

// 自分の音量検知（話している時の枠線点灯）
function setupAudioAnalysis(stream) {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();
  microphone = audioContext.createMediaStreamSource(stream);
  microphone.connect(analyser);

  analyser.fftSize = 256;
  const bufferLength = analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);

  function checkVolume() {
    if (!isMicOn) {
      document.getElementById('myAvatar').classList.remove('speaking');
      requestAnimationFrame(checkVolume);
      return;
    }

    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < bufferLength; i++) {
      sum += dataArray[i];
    }
    const average = sum / bufferLength;

    // 音量が一定を超えたら緑枠をつける
    const myAvatar = document.getElementById('myAvatar');
    if (average > 25) {
      myAvatar.classList.add('speaking');
    } else {
      myAvatar.classList.remove('speaking');
    }
    requestAnimationFrame(checkVolume);
  }
  checkVolume();
}

// マイク制御
function toggleMic() {
  if (!myStream) return;
  const audioTrack = myStream.getAudioTracks()[0];
  if (audioTrack) {
    isMicOn = !isMicOn;
    audioTrack.enabled = isMicOn;

    const btn = document.getElementById('micBtn');
    const myAvatar = document.getElementById('myAvatar');

    if (isMicOn) {
      btn.classList.remove('off');
      myAvatar.classList.remove('muted');
    } else {
      btn.classList.add('off');
      myAvatar.classList.add('muted');
    }

    if (dataConn && dataConn.open) {
      dataConn.send({ type: 'MUTED', isMuted: !isMicOn });
    }
  }
}

// 退出処理
function leaveRoom() {
  if (myStream) myStream.getTracks().forEach(t => t.stop());
  if (peer) peer.destroy();
  location.reload();
}
</script>
</body>
</html>
