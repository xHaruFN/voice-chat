<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "YOUR_SUPABASE_URL";

const SUPABASE_KEY =
  "YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   DOM
================================================== */

const authScreen =
  document.getElementById("authScreen");

const mainScreen =
  document.getElementById("mainScreen");

const usernameInput =
  document.getElementById("usernameInput");

const passwordInput =
  document.getElementById("passwordInput");

const loginButton =
  document.getElementById("loginButton");

const createAccountButton =
  document.getElementById("createAccountButton");

const logoutButton =
  document.getElementById("logoutButton");

const message =
  document.getElementById("message");

const displayUsername =
  document.getElementById("displayUsername");

const displayStatus =
  document.getElementById("displayStatus");

const micButton =
  document.getElementById("micButton");

const micIcon =
  document.getElementById("micIcon");

const micStatus =
  document.getElementById("micStatus");

const voiceLeaveButton =
  document.getElementById("voiceLeaveButton");

const friendUsernameInput =
  document.getElementById(
    "friendUsernameInput"
  );

const friendRequestButton =
  document.getElementById(
    "friendRequestButton"
  );

const friendList =
  document.getElementById("friendList");

const createPartyButton =
  document.getElementById(
    "createPartyButton"
  );

const joinPartyButton =
  document.getElementById(
    "joinPartyButton"
  );

const leavePartyButton =
  document.getElementById(
    "leavePartyButton"
  );

const partyStatus =
  document.getElementById(
    "partyStatus"
  );

const partyMembers =
  document.getElementById(
    "partyMembers"
  );


/* ==================================================
   STATE
================================================== */

let currentUser = null;

let microphoneStream = null;

let microphoneEnabled = false;

let currentPartyId = null;

let partyChannel = null;


/* ==================================================
   MESSAGE
================================================== */

function setMessage(
  text,
  error = false
) {

  message.textContent = text;

  message.style.color =
    error
      ? "#ef4444"
      : "#22c55e";
}


/* ==================================================
   USERNAME VALIDATION
================================================== */

function isValidUsername(username) {

  return /^[a-zA-Z0-9_ぁ-んァ-ヶ一-龠]{3,20}$/
    .test(username);

}


/* ==================================================
   ACCOUNT CREATE
================================================== */

createAccountButton.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if (!isValidUsername(username)) {

      setMessage(
        "ユーザー名は3～20文字で入力してください。",
        true
      );

      return;
    }


    if (password.length < 6) {

      setMessage(
        "パスワードは6文字以上にしてください。",
        true
      );

      return;
    }


    createAccountButton.disabled = true;


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "create_user_account",
            {
              p_username: username,
              p_password: password
            }
          );


      if (error) {

        console.error(error);

        setMessage(
          "アカウント作成に失敗しました。",
          true
        );

        return;
      }


      if (!data) {

        setMessage(
          "そのユーザー名は既に使用されています。",
          true
        );

        return;
      }


      setMessage(
        "アカウントを作成しました！ログインしてください。"
      );


      passwordInput.value = "";


    } finally {

      createAccountButton.disabled = false;

    }

  }
);


/* ==================================================
   LOGIN
================================================== */

loginButton.addEventListener(
  "click",
  async () => {

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;


    if (!username || !password) {

      setMessage(
        "ユーザー名とパスワードを入力してください。",
        true
      );

      return;
    }


    loginButton.disabled = true;


    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "login_user",
            {
              p_username: username,
              p_password: password
            }
          );


      if (error) {

        console.error(error);

        setMessage(
          "ログインに失敗しました。",
          true
        );

        return;
      }


      if (!data) {

        setMessage(
          "ユーザー名またはパスワードが違います。",
          true
        );

        return;
      }


      currentUser =
        typeof data === "string"
          ? JSON.parse(data)
          : data;


      localStorage.setItem(
        "browser_vc_user",
        JSON.stringify(currentUser)
      );


      await enterMainScreen();


    } finally {

      loginButton.disabled = false;

    }

  }
);


/* ==================================================
   MAIN SCREEN
================================================== */

async function enterMainScreen() {

  authScreen.classList.add(
    "hidden"
  );

  mainScreen.classList.remove(
    "hidden"
  );


  displayUsername.textContent =
    currentUser.username;


  await updateOnlineStatus(
    "online"
  );


  await loadFriends();

}


/* ==================================================
   ONLINE STATUS
================================================== */

async function updateOnlineStatus(
  status
) {

  if (!currentUser) return;


  const {
    error
  } =
    await supabaseClient
      .from("users")
      .update({
        status: status,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        currentUser.id
      );


  if (error) {

    console.error(
      "status error:",
      error
    );

  }


  if (status === "online") {

    displayStatus.textContent =
      "● オンライン";

    displayStatus.className =
      "online";

  } else {

    displayStatus.textContent =
      "● オフライン";

    displayStatus.className =
      "offline";

  }

}


/* ==================================================
   LOGOUT
================================================== */

logoutButton.addEventListener(
  "click",
  async () => {

    await stopMicrophone();

    await leaveParty();

    await updateOnlineStatus(
      "offline"
    );


    localStorage.removeItem(
      "browser_vc_user"
    );


    currentUser = null;


    mainScreen.classList.add(
      "hidden"
    );

    authScreen.classList.remove(
      "hidden"
    );


    usernameInput.value = "";
    passwordInput.value = "";

    setMessage("");

  }
);


/* ==================================================
   MICROPHONE
================================================== */

async function startMicrophone() {

  try {

    microphoneStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    microphoneEnabled = true;


    micIcon.textContent =
      "🎙️";

    micStatus.textContent =
      "マイクON";

    micButton.textContent =
      "🔇 マイクOFF";


  } catch (error) {

    console.error(error);

    micStatus.textContent =
      "マイクを使用できません。";

  }

}


async function stopMicrophone() {

  if (microphoneStream) {

    microphoneStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    microphoneStream = null;

  }


  microphoneEnabled = false;


  micIcon.textContent =
    "🔇";

  micStatus.textContent =
    "マイクOFF";

  micButton.textContent =
    "🎙️ マイクON";

}


micButton.addEventListener(
  "click",
  async () => {

    if (microphoneEnabled) {

      await stopMicrophone();

    } else {

      await startMicrophone();

    }

  }
);


voiceLeaveButton.addEventListener(
  "click",
  async () => {

    await stopMicrophone();

    alert(
      "VCから退出しました。"
    );

  }
);


/* ==================================================
   FRIEND REQUEST
================================================== */

friendRequestButton.addEventListener(
  "click",
  async () => {

    if (!currentUser) return;


    const username =
      friendUsernameInput
        .value
        .trim();


    if (!username) {

      alert(
        "ユーザー名を入力してください。"
      );

      return;
    }


    if (
      username ===
      currentUser.username
    ) {

      alert(
        "自分自身には申請できません。"
      );

      return;
    }


    const {
      data: target,
      error
    } =
      await supabaseClient
        .from("users")
        .select(
          "id,username"
        )
        .eq(
          "username",
          username
        )
        .maybeSingle();


    if (error || !target) {

      alert(
        "ユーザーが見つかりません。"
      );

      return;
    }


    const {
      error: requestError
    } =
      await supabaseClient
        .from("friend_requests")
        .insert({

          sender_id:
            currentUser.id,

          receiver_id:
            target.id,

          status:
            "pending"

        });


    if (requestError) {

      console.error(
        requestError
      );

      alert(
        "フレンド申請に失敗しました。"
      );

      return;
    }


    friendUsernameInput.value = "";


    alert(
      `${target.username} さんにフレンド申請を送りました！`
    );

  }
);


/* ==================================================
   FRIEND LIST
================================================== */

async function loadFriends() {

  if (!currentUser) return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("friendships")
      .select(`
        friend_id,
        users:friend_id(
          username,
          status
        )
      `)
      .eq(
        "user_id",
        currentUser.id
      );


  if (error) {

    console.error(error);

    friendList.innerHTML =
      "<p>フレンドを読み込めませんでした。</p>";

    return;
  }


  friendList.innerHTML = "";


  if (!data || data.length === 0) {

    friendList.innerHTML =
      '<p class="small">フレンドはいません。</p>';

    return;
  }


  for (const friend of data) {

    const user =
      friend.users;


    const div =
      document.createElement(
        "div"
      );


    div.className =
      "user-item";


    const name =
      document.createElement(
        "strong"
      );

    name.textContent =
      user.username;


    const status =
      document.createElement(
        "span"
      );


    status.textContent =
      user.status === "online"
        ? " ● オンライン"
        : " ● オフライン";


    status.className =
      user.status === "online"
        ? "online"
        : "offline";


    div.appendChild(name);

    div.appendChild(status);

    friendList.appendChild(div);

  }

}


/* ==================================================
   PARTY CREATE
================================================== */

createPartyButton.addEventListener(
  "click",
  async () => {

    if (!currentUser) return;


    await leaveParty();


    currentPartyId =
      crypto.randomUUID()
        .replaceAll("-", "")
        .substring(0, 8)
        .toUpperCase();


    await joinPartyChannel(
      currentPartyId
    );


    partyStatus.innerHTML =
      `
      <div>パーティー作成済み</div>
      <div class="party-id">
        ${currentPartyId}
      </div>
      <div class="small">
        このIDをフレンドに共有してください。
      </div>
      `;

  }
);


/* ==================================================
   PARTY JOIN
================================================== */

joinPartyButton.addEventListener(
  "click",
  async () => {

    const id =
      prompt(
        "パーティーIDを入力してください。"
      );


    if (!id) return;


    const partyId =
      id.trim().toUpperCase();


    if (!/^[A-Z0-9]{4,20}$/.test(partyId)) {

      alert(
        "正しいパーティーIDを入力してください。"
      );

      return;
    }


    await leaveParty();


    currentPartyId =
      partyId;


    await joinPartyChannel(
      currentPartyId
    );


    partyStatus.innerHTML =
      `
      <div>パーティー参加中</div>
      <div class="party-id">
        ${currentPartyId}
      </div>
      `;

  }
);


/* ==================================================
   PARTY CHANNEL
================================================== */

async function joinPartyChannel(
  partyId
) {

  if (!currentUser) return;


  partyChannel =
    supabaseClient.channel(
      "party-" + partyId,
      {
        config: {
          presence: {
            key:
              currentUser.id
          }
        }
      }
    );


  partyChannel
    .on(
      "presence",
      {
        event: "sync"
      },
      () => {

        updatePartyMembers();

      }
    );


  partyChannel
    .on(
      "presence",
      {
        event: "join"
      },
      () => {

        updatePartyMembers();

      }
    );


  partyChannel
    .on(
      "presence",
      {
        event: "leave"
      },
      () => {

        updatePartyMembers();

      }
    );


  await partyChannel.subscribe(
    async status => {

      if (
        status === "SUBSCRIBED"
      ) {

        await partyChannel.track({

          username:
            currentUser.username,

          user_id:
            currentUser.id,

          online_at:
            new Date().toISOString()

        });

      }

    }
  );

}


/* ==================================================
   PARTY MEMBERS
================================================== */

function updatePartyMembers() {

  if (!partyChannel) return;


  const state =
    partyChannel.presenceState();


  const members = [];


  Object.values(state)
    .forEach(
      entries => {

        entries.forEach(
          entry => {

            members.push(entry);

          }
        );

      }
    );


  partyMembers.classList.remove(
    "hidden"
  );


  partyMembers.innerHTML =
    "<strong>参加者</strong><br>";


  members.forEach(
    member => {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        "🟢 " +
        member.username;


      partyMembers.appendChild(
        div
      );

    }
  );

}


/* ==================================================
   PARTY LEAVE
================================================== */

async function leaveParty() {

  if (partyChannel) {

    try {

      await partyChannel.untrack();

    } catch {}

    try {

      await supabaseClient.removeChannel(
        partyChannel
      );

    } catch {}

    partyChannel = null;

  }


  currentPartyId = null;


  partyMembers.classList.add(
    "hidden"
  );


  partyStatus.textContent =
    "パーティーに参加していません。";

}


leavePartyButton.addEventListener(
  "click",
  async () => {

    await leaveParty();

  }
);


/* ==================================================
   SESSION RESTORE
================================================== */

async function restoreSession() {

  const saved =
    localStorage.getItem(
      "browser_vc_user"
    );


  if (!saved) return;


  try {

    currentUser =
      JSON.parse(saved);


    if (
      !currentUser ||
      !currentUser.id ||
      !currentUser.username
    ) {

      throw new Error(
        "Invalid session"
      );

    }


    /*
      DBにユーザーが存在するか確認
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("users")
        .select(
          "id,username,status"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (
      error ||
      !data
    ) {

      localStorage.removeItem(
        "browser_vc_user"
      );

      currentUser = null;

      return;
    }


    currentUser =
      data;


    localStorage.setItem(
      "browser_vc_user",
      JSON.stringify(
        currentUser
      )
    );


    await enterMainScreen();


  } catch (error) {

    console.error(error);

    localStorage.removeItem(
      "browser_vc_user"
    );

    currentUser = null;

  }

}


/* ==================================================
   PAGE CLOSE
================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if (microphoneStream) {

      microphoneStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);


/* ==================================================
   START
================================================== */

restoreSession();

</script>

</body>
</html>
