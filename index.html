<!-- UIイメージの断片 -->
<div class="vc-container">
  <div class="sidebar">
    <h3>エフェクト選択</h3>
    <button class="effect-btn" onclick="setEffect('pitch', 0.5)">低い声</button>
    <button class="effect-btn" onclick="setEffect('pitch', 2.0)">高い声</button>
    <button class="effect-btn" onclick="setEffect('robot')">ロボット</button>
  </div>
  <div class="main-panel">
    <div class="visualizer">（ここに音声波形を表示）</div>
    <div class="controls">
      <button class="mic-toggle" onclick="toggleMic()">🎤 マイクON/OFF</button>
    </div>
  </div>
</div>
