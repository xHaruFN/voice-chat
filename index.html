async function signUp() {

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if (!email || !password) {
    alert(
      "メールアドレスとパスワードを入力してください。"
    );
    return;
  }

  if (password.length < 6) {
    alert(
      "パスワードは6文字以上にしてください。"
    );
    return;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if (error) {

      alert(
        "アカウント作成エラー:\n" +
        error.message
      );

      return;
    }

    /*
      Supabaseでメール確認がOFFなら

    if (data.session && data.user) {

      currentUser = data.user;
      guestMode = false;

      await createProfile(
        data.user
      );

      setLoggedInUI(
        data.user.email
      );

      await loadFriends();
      await loadFriendRequests();

      alert(
        "アカウントを作成してログインしました！"
      );

    } else {

      alert(
        "アカウントを作成しました！\n\n" +
        "メール確認が有効になっている場合は、メールを確認してからログインしてください。"
      );
    }

  } catch (error) {

    alert(
      "通信エラー:\n" +
      error.message
    );
  }
}


/* =====================================================
   PROFILE
===================================================== */

async function createProfile(user) {

  const username =
    user.email
      ? user.email.split("@")[0]
      : "User";

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert({
        id: user.id,
        username,
        online: true,
        status: "online"
      });

  if (error) {
    console.warn(
      "プロフィール作成:",
      error
    );
  }
}


/* =====================================================
   SIGN IN
===================================================== */

async function signIn() {

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if (!email || !password) {

    alert(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if (error) {

      alert(
        "ログインエラー:\n" +
        error.message
      );

      return;
    }

    currentUser = data.user;
    guestMode = false;

    await createProfile(
      currentUser
    );

    setLoggedInUI(
      currentUser.email
    );

    await loadFriends();
    await loadFriendRequests();

  } catch (error) {

    alert(
      "ログイン通信エラー:\n" +
      error.message
    );
  }
}

async function signOut() {

  if (guestMode) {

    await leaveRoom();

    currentUser = null;
    guestMode = false;

    setLoggedOutUI();

    alert(
      "仮アカウントからログアウトしました。"
    );

    return;
  }

  await leaveRoom();

  const {
    error
  } =
    await supabaseClient.auth.signOut();

  if (error) {

    alert(
      "ログアウトに失敗しました:\n" +
      error.message
    );

    return;
  }

  currentUser = null;
  guestMode = false;

  setLoggedOutUI();
}
