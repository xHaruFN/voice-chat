<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Chat</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

header {
  height: 64px;
  background: #1f2937;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 22px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-top: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  margin: 6px 4px 6px 0;
  font-size: 16px;
  cursor: pointer;
  background: #4f46e5;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.green {
  background: #22c55e;
}

.red {
  background: #dc2626;
}

.gray {
  background: #4b5563;
}

.yellow {
  background: #eab308;
  color: #111827;
}

.user {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #374151;
  padding: 15px;
  border-radius: 12px;
}

.avatar {
  width: 50px;
  height: 50px;
  background: #4f46e5;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

#status,
#accountStatus,
#settingsStatus {
  color: #9ca3af;
}

#settingsCard,
#friendCard,
#partyCard,
#dmCard {
  display: none;
}

.friend {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #374151;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.friendAvatar {
  width: 45px;
  height: 45px;
  background: #4f46e5;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.friendInfo {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.online {
  color: #22c55e;
  font-size: 13px;
}

.away {
  color: #eab308;
  font-size: 13px;
}

.offline {
  color: #9ca3af;
  font-size: 13px;
}

.friend button {
  padding: 8px 14px;
  margin: 0 0 0 5px;
}

.request {
  background: #374151;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.partyBox {
  background: #374151;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

.empty {
  color: #9ca3af;
  padding: 15px 0;
}

.mediaArea {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.videoBox {
  background: #111827;
  border-radius: 12px;
  padding: 10px;
  min-height: 220px;
}

.videoBox h3 {
  margin: 5px 0 10px;
}

video {
  width: 100%;
  max-height: 400px;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}

.noVideo {
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  background: #030712;
  border-radius: 10px;
}

.message {
  background: #374151;
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
}

.message.me {
  background: #4f46e5;
}

.dmHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

@media (max-width: 700px) {

  .mediaArea {
    grid-template-columns: 1fr;
  }

  .friend {
    flex-wrap: wrap;
  }

}

</style>
</head>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

<!-- =========================
     アカウント
========================= -->

<div class="card">

<h2>👤 アカウント</h2>

<input
  id="usernameInput"
  maxlength="30"
  placeholder="ユーザー名"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button
  class="gray"
  onclick="createGuest()"
>
👻 仮アカウント
</button>

<button
  id="logoutButton"
  class="red"
  onclick="signOut()"
  style="display:none"
>
ログアウト
</button>

<p id="accountStatus">
ログインしていません
</p>

</div>


<!-- =========================
     アカウント設定
========================= -->

<div
  class="card"
  id="settingsCard"
>

<h2>⚙️ アカウント設定</h2>

<h3>👤 ユーザー名変更</h3>

<input
  id="newUsername"
  maxlength="30"
  placeholder="新しいユーザー名"
>

<button onclick="changeUsername()">
ユーザー名変更
</button>


<h3>🔑 パスワード変更</h3>

<input
  id="newPassword"
  type="password"
  placeholder="新しいパスワード"
>

<button onclick="changePassword()">
パスワード変更
</button>


<h3>🗑️ アカウント削除</h3>

<button
  class="red"
  onclick="deleteAccount()"
>
アカウントを削除
</button>

<p id="settingsStatus"></p>

</div>


<!-- =========================
     自分
========================= -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">
👤
</div>

<div>

<strong id="username">
未ログイン
</strong>

<div id="onlineStatus">
⚪ オフライン
</div>

</div>

</div>

<br>

<button
  id="micButton"
  onclick="toggleMic()"
>
🎤 マイクON
</button>

<button
  id="cameraButton"
  class="green"
  onclick="toggleCamera()"
>
📷 カメラON
</button>

<button
  id="screenButton"
  class="gray"
  onclick="toggleScreenShare()"
>
🖥️ 画面共有
</button>

<button
  id="awayButton"
  class="yellow"
  onclick="toggleAway()"
  style="display:none"
>
🟡 離席
</button>

<div id="status">
マイク・カメラ・画面共有を操作できます。
</div>


<div class="mediaArea">

<div class="videoBox">

<h3>
📷 カメラ
</h3>

<video
  id="cameraVideo"
  autoplay
  muted
  playsinline
></video>

<div
  id="cameraEmpty"
  class="noVideo"
>
カメラOFF
</div>

</div>


<div class="videoBox">

<h3>
🖥️ 画面共有
</h3>

<video
  id="screenVideo"
  autoplay
  muted
  playsinline
></video>

<div
  id="screenEmpty"
  class="noVideo"
>
画面共有OFF
</div>

</div>

</div>

</div>


<!-- =========================
     フレンド
========================= -->

<div
  class="card"
  id="friendCard"
>

<h2>👥 フレンド</h2>

<input
  id="friendSearch"
  placeholder="🔍 プレイヤーを検索"
>

<button onclick="searchFriend()">
🔍 検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
<div class="empty">
フレンドはいません。
</div>
</div>


<h3>📨 フレンド申請</h3>

<div id="requestList">
<div class="empty">
フレンド申請はありません。
</div>
</div>

</div>


<!-- =========================
     DM
========================= -->

<div
  class="card"
  id="dmCard"
>

<div class="dmHeader">

<h2>
💬 フレンドDM
</h2>

<button
  class="gray"
  onclick="closeDM()"
>
DMを閉じる
</button>

</div>

<strong id="dmFriendName">
フレンド
</strong>

<div
  id="dmMessages"
  style="margin-top:15px;"
></div>

<input
  id="dmInput"
  placeholder="メッセージを入力"
  onkeydown="if(event.key==='Enter')sendDM()"
>

<button
  onclick="sendDM()"
>
送信
</button>

</div>


<!-- =========================
     パーティー
========================= -->

<div
  class="card"
  id="partyCard"
>

<h2>🎉 パーティー</h2>

<button
  class="green"
  onclick="createParty()"
>
＋ パーティー作成
</button>

<div id="partyArea">

<div class="empty">
パーティーに参加していません。
</div>

</div>

</div>

</main>


<script>

/* =====================================================
   ローカルデータ
===================================================== */

const USERS_KEY = "voicechat_users";
const CURRENT_KEY = "voicechat_current";

let users =
  JSON.parse(
    localStorage.getItem(USERS_KEY) || "{}"
  );

let currentUser = null;

let guestMode = false;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let away = false;

let dmFriend = null;


/* =====================================================
   保存
===================================================== */

function saveUsers() {

  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );
}


/* =====================================================
   ログインUI
===================================================== */

function setLoggedInUI(name) {

  document.getElementById(
    "username"
  ).textContent = name;

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "🟢 オンライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    guestMode
      ? "👻 仮アカウント"
      : "✅ ログイン中";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "inline-block";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "block";

  document.getElementById(
    "friendCard"
  ).style.display =
    "block";

  document.getElementById(
    "partyCard"
  ).style.display =
    "block";

  document.getElementById(
    "awayButton"
  ).style.display =
    guestMode
      ? "none"
      : "inline-block";
}


function setLoggedOutUI() {

  document.getElementById(
    "username"
  ).textContent =
    "未ログイン";

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "⚪ オフライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    "ログインしていません";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "none";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "none";

  document.getElementById(
    "friendCard"
  ).style.display =
    "none";

  document.getElementById(
    "partyCard"
  ).style.display =
    "none";

  document.getElementById(
    "dmCard"
  ).style.display =
    "none";
}


/* =====================================================
   アカウント作成
===================================================== */

function signUp() {

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!username || !password) {

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if (username.length < 3) {

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if (password.length < 6) {

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  if (users[username]) {

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  users[username] = {

    username: username,

    password: password,

    status: "online",

    friends: [],

    requests: [],

    sentRequests: [],

    messages: {},

    party: null

  };

  saveUsers();

  currentUser = username;

  guestMode = false;

  localStorage.setItem(
    CURRENT_KEY,
    username
  );

  setLoggedInUI(username);

  alert(
    "アカウントを作成しました！"
  );

  renderFriends();
}


/* =====================================================
   ログイン
===================================================== */

function signIn() {

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if (!username || !password) {

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if (
    !users[username] ||
    users[username].password !== password
  ) {

    alert(
      "ユーザー名またはパスワードが違います。"
    );

    return;
  }

  currentUser = username;

  guestMode = false;

  users[username].status =
    "online";

  saveUsers();

  localStorage.setItem(
    CURRENT_KEY,
    username
  );

  setLoggedInUI(username);

  renderFriends();
}


/* =====================================================
   仮アカウント
===================================================== */

function createGuest() {

  if (currentUser) {

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const name =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  currentUser = name;

  guestMode = true;

  setLoggedInUI(name);

  document.getElementById(
    "accountStatus"
  ).textContent =
    "👻 仮アカウント: " +
    name;

  document.getElementById(
    "friendList"
  ).innerHTML =
    '<div class="empty">仮アカウントではフレンド機能を利用できません。</div>';

  document.getElementById(
    "requestList"
  ).innerHTML =
    '<div class="empty">仮アカウントではフレンド申請を利用できません。</div>';

  alert(
    "仮アカウントを作成しました！\n\n" +
    name
  );
}


/* =====================================================
   ログアウト
===================================================== */

function signOut() {

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if (
    !guestMode &&
    users[currentUser]
  ) {

    users[currentUser].status =
      "offline";

    saveUsers();
  }

  currentUser = null;

  guestMode = false;

  localStorage.removeItem(
    CURRENT_KEY
  );

  setLoggedOutUI();
}


/* =====================================================
   ユーザー名変更
===================================================== */

function changeUsername() {

  if (guestMode) {

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newName =
    document.getElementById(
      "newUsername"
    ).value.trim();

  if (!newName) {

    alert(
      "新しいユーザー名を入力してください。"
    );

    return;
  }

  if (newName.length < 3) {

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if (users[newName]) {

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const oldName =
    currentUser;

  users[newName] =
    users[oldName];

  users[newName].username =
    newName;

  delete users[oldName];

  currentUser =
    newName;

  saveUsers();

  localStorage.setItem(
    CURRENT_KEY,
    newName
  );

  setLoggedInUI(newName);

  document.getElementById(
    "newUsername"
  ).value = "";

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ ユーザー名を変更しました。";
}


/* =====================================================
   パスワード変更
===================================================== */

function changePassword() {

  if (guestMode) {

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const password =
    document.getElementById(
      "newPassword"
    ).value;

  if (!password) {

    alert(
      "新しいパスワードを入力してください。"
    );

    return;
  }

  if (password.length < 6) {

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  users[currentUser].password =
    password;

  saveUsers();

  document.getElementById(
    "newPassword"
  ).value = "";

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ パスワードを変更しました。";
}


/* =====================================================
   アカウント削除
===================================================== */

function deleteAccount() {

  if (guestMode) {

    currentUser = null;

    guestMode = false;

    setLoggedOutUI();

    alert(
      "仮アカウントを削除しました。"
    );

    return;
  }

  if (!currentUser) {
    return;
  }

  const ok =
    confirm(
      "本当にアカウントを削除しますか？\nこの操作は元に戻せません。"
    );

  if (!ok) {
    return;
  }

  const deletedName =
    currentUser;

  delete users[deletedName];

  Object.keys(users).forEach(
    name => {

      users[name].friends =
        users[name].friends.filter(
          f => f !== deletedName
        );

      users[name].requests =
        users[name].requests.filter(
          f => f !== deletedName
        );

      users[name].sentRequests =
        users[name].sentRequests.filter(
          f => f !== deletedName
        );

      delete users[name].messages[
        deletedName
      ];

    }
  );

  saveUsers();

  currentUser = null;

  localStorage.removeItem(
    CURRENT_KEY
  );

  setLoggedOutUI();

  alert(
    "アカウントを削除しました。"
  );
}


/* =====================================================
   マイク
===================================================== */

async function toggleMic() {

  if (!micEnabled) {

    try {

      microphone =
        await navigator.mediaDevices.getUserMedia({
          audio: true
        });

      micEnabled = true;

      document.getElementById(
        "micButton"
      ).textContent =
        "🔇 マイクOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopMicrophone();

    updateMediaStatus();
  }
}


function stopMicrophone() {

  if (microphone) {

    microphone
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  microphone = null;

  micEnabled = false;

  const button =
    document.getElementById(
      "micButton"
    );

  if (button) {

    button.textContent =
      "🎤 マイクON";
  }
}


/* =====================================================
   カメラ
===================================================== */

async function toggleCamera() {

  if (!cameraEnabled) {

    try {

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      cameraEnabled = true;

      document.getElementById(
        "cameraVideo"
      ).srcObject =
        cameraStream;

      document.getElementById(
        "cameraEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "cameraButton"
      ).textContent =
        "📷 カメラOFF";

      updateMediaStatus();

    } catch (error) {

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );
    }

  } else {

    stopCamera();

    updateMediaStatus();
  }
}


function stopCamera() {

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  cameraStream = null;

  cameraEnabled = false;

  document.getElementById(
    "cameraVideo"
  ).srcObject =
    null;

  document.getElementById(
    "cameraEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "cameraButton"
  ).textContent =
    "📷 カメラON";
}


/* =====================================================
   画面共有
===================================================== */

async function toggleScreenShare() {

  if (!screenEnabled) {

    try {

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

      screenEnabled = true;

      document.getElementById(
        "screenVideo"
      ).srcObject =
        screenStream;

      document.getElementById(
        "screenEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "screenButton"
      ).textContent =
        "🛑 画面共有OFF";

      const track =
        screenStream.getVideoTracks()[0];

      if (track) {

        track.onended =
          () => {

            stopScreenShare();

            updateMediaStatus();

          };
      }

      updateMediaStatus();

    } catch (error) {

      if (
        error.name !==
        "AbortError"
      ) {

        alert(
          "画面共有を開始できませんでした。"
        );
      }
    }

  } else {

    stopScreenShare();

    updateMediaStatus();
  }
}


function stopScreenShare() {

  if (screenStream) {

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  screenStream = null;

  screenEnabled = false;

  document.getElementById(
    "screenVideo"
  ).srcObject =
    null;

  document.getElementById(
    "screenEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";
}


/* =====================================================
   メディア状態
===================================================== */

function updateMediaStatus() {

  const status = [];

  if (micEnabled) {
    status.push("🎤 マイクON");
  }

  if (cameraEnabled) {
    status.push("📷 カメラON");
  }

  if (screenEnabled) {
    status.push("🖥️ 画面共有ON");
  }

  document.getElementById(
    "status"
  ).textContent =
    status.length
      ? status.join("　")
      : "すべてOFF";
}


/* =====================================================
   離席
===================================================== */

function toggleAway() {

  if (!currentUser || guestMode) {
    return;
  }

  away = !away;

  users[currentUser].status =
    away
      ? "away"
      : "online";

  saveUsers();

  updateOwnStatus();

  renderFriends();
}


function updateOwnStatus() {

  const element =
    document.getElementById(
      "onlineStatus"
    );

  if (away) {

    element.textContent =
      "🟡 離席";

    document.getElementById(
      "awayButton"
    ).textContent =
      "🟢 オンラインに戻る";

  } else {

    element.textContent =
      "🟢 オンライン";

    document.getElementById(
      "awayButton"
    ).textContent =
      "🟡 離席";
  }
}


/* =====================================================
   フレンド検索
===================================================== */

function searchFriend() {

  if (!currentUser || guestMode) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  const search =
    document.getElementById(
      "friendSearch"
    ).value
      .trim()
      .toLowerCase();

  const result =
    document.getElementById(
      "searchResult"
    );

  result.innerHTML = "";

  if (!search) {

    result.innerHTML =
      '<div class="empty">検索する名前を入力してください。</div>';

    return;
  }

  const found =
    Object.values(users)
      .filter(
        user =>
          user.username
            .toLowerCase()
            .includes(search) &&
          user.username !== currentUser
      );

  if (!found.length) {

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  found.forEach(
    user => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "friend";

      const isFriend =
        users[currentUser].friends
          .includes(user.username);

      div.innerHTML = `

        <div class="friendAvatar">
          👤
        </div>

        <div class="friendInfo">

          <strong>
            ${escapeHTML(user.username)}
          </strong>

          <span class="${statusClass(user.status)}">
            ${statusText(user.status)}
          </span>

        </div>

        ${
          isFriend
            ? `<span class="online">✓ フレンド</span>`
            : `<button
                class="green"
                onclick="sendFriendRequest('${escapeJS(user.username)}')"
              >
                ＋ 追加
              </button>`
        }

      `;

      result.appendChild(div);
    }
  );
}


/* =====================================================
   フレンド申請
===================================================== */

function sendFriendRequest(name) {

  if (!users[name]) {
    return;
  }

  if (
    users[currentUser]
      .friends
      .includes(name)
  ) {

    alert(
      "すでにフレンドです。"
    );

    return;
  }

  if (
    users[name]
      .requests
      .includes(currentUser)
  ) {

    alert(
      "すでに申請しています。"
    );

    return;
  }

  users[name].requests.push(
    currentUser
  );

  users[currentUser]
    .sentRequests
    .push(name);

  saveUsers();

  alert(
    "フレンド申請を送りました！"
  );

  searchFriend();
}


/* =====================================================
   フレンド一覧
===================================================== */

function renderFriends() {

  if (!currentUser || guestMode) {
    return;
  }

  const list =
    document.getElementById(
      "friendList"
    );

  list.innerHTML = "";

  const friends =
    users[currentUser].friends;

  if (!friends.length) {

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

  } else {

    friends.forEach(
      name => {

        const friend =
          users[name];

        if (!friend) {
          return;
        }

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "friend";

        div.innerHTML = `

          <div class="friendAvatar">
            👤
          </div>

          <div class="friendInfo">

            <strong>
              ${escapeHTML(name)}
            </strong>

            <span class="${statusClass(friend.status)}">
              ${statusText(friend.status)}
            </span>

          </div>

          <button
            class="gray"
            onclick="openDM('${escapeJS(name)}')"
          >
            💬 DM
          </button>

          <button
            class="red"
            onclick="removeFriend('${escapeJS(name)}')"
          >
            🗑️ 削除
          </button>

        `;

        list.appendChild(div);
      }
    );
  }

  renderRequests();
}


/* =====================================================
   フレンド申請一覧
===================================================== */

function renderRequests() {

  const list =
    document.getElementById(
      "requestList"
    );

  list.innerHTML = "";

  const requests =
    users[currentUser].requests;

  if (!requests.length) {

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  requests.forEach(
    name => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "request";

      div.innerHTML = `

        <strong>
          ${escapeHTML(name)}
        </strong>

        <p>
          フレンド申請が届いています。
        </p>

        <button
          class="green"
          onclick="acceptFriend('${escapeJS(name)}')"
        >
          ✓ 承認
        </button>

        <button
          class="red"
          onclick="rejectFriend('${escapeJS(name)}')"
        >
          ✕ 拒否
        </button>

      `;

      list.appendChild(div);
    }
  );
}


/* =====================================================
   フレンド承認
===================================================== */

function acceptFriend(name) {

  if (!users[name]) {
    return;
  }

  users[currentUser].requests =
    users[currentUser].requests
      .filter(
        n => n !== name
      );

  users[currentUser].friends
    .push(name);

  if (
    !users[name].friends
      .includes(currentUser)
  ) {

    users[name].friends
      .push(currentUser);
  }

  users[name].sentRequests =
    users[name].sentRequests
      .filter(
        n => n !== currentUser
      );

  saveUsers();

  renderFriends();
}


/* =====================================================
   フレンド拒否
===================================================== */

function rejectFriend(name) {

  users[currentUser].requests =
    users[currentUser].requests
      .filter(
        n => n !== name
      );

  if (users[name]) {

    users[name].sentRequests =
      users[name].sentRequests
        .filter(
          n => n !== currentUser
        );
  }

  saveUsers();

  renderFriends();
}


/* =====================================================
   フレンド削除
===================================================== */

function removeFriend(name) {

  if (!confirm(
    name +
    " をフレンドから削除しますか？"
  )) {
    return;
  }

  users[currentUser].friends =
    users[currentUser].friends
      .filter(
        n => n !== name
      );

  if (users[name]) {

    users[name].friends =
      users[name].friends
        .filter(
          n => n !== currentUser
        );
  }

  saveUsers();

  renderFriends();

  closeDM();
}


/* =====================================================
   DM
===================================================== */

function openDM(name) {

  if (!users[name]) {
    return;
  }

  dmFriend = name;

  document.getElementById(
    "dmCard"
  ).style.display =
    "block";

  document.getElementById(
    "dmFriendName"
  ).textContent =
    "💬 " + name;

  renderDM();

  document.getElementById(
    "dmInput"
  ).focus();
}


function closeDM() {

  dmFriend = null;

  document.getElementById(
    "dmCard"
  ).style.display =
    "none";
}


function getConversation() {

  const me =
    users[currentUser];

  if (!me.messages) {
    me.messages = {};
  }

  if (!me.messages[dmFriend]) {
    me.messages[dmFriend] = [];
  }

  return me.messages[dmFriend];
}


function sendDM() {

  if (
    !currentUser ||
    guestMode ||
    !dmFriend
  ) {
    return;
  }

  const input =
    document.getElementById(
      "dmInput"
    );

  const text =
    input.value.trim();

  if (!text) {
    return;
  }

  if (!users[dmFriend]) {
    return;
  }

  if (
    !users[currentUser]
      .friends
      .includes(dmFriend)
  ) {

    alert(
      "フレンドとのDMのみ利用できます。"
    );

    return;
  }

  const message = {

    from: currentUser,

    text: text,

    time:
      new Date()
        .toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        )

  };

  if (
    !users[currentUser].messages
  ) {
    users[currentUser].messages = {};
  }

  if (
    !users[dmFriend].messages
  ) {
    users[dmFriend].messages = {};
  }

  if (
    !users[currentUser]
      .messages[dmFriend]
  ) {

    users[currentUser]
      .messages[dmFriend] = [];
  }

  if (
    !users[dmFriend]
      .messages[currentUser]
  ) {

    users[dmFriend]
      .messages[currentUser] = [];
  }

  users[currentUser]
    .messages[dmFriend]
    .push(message);

  users[dmFriend]
    .messages[currentUser]
    .push(message);

  saveUsers();

  input.value = "";

  renderDM();
}


function renderDM() {

  if (
    !currentUser ||
    !dmFriend
  ) {
    return;
  }

  const messages =
    users[currentUser]
      .messages[dmFriend] || [];

  const box =
    document.getElementById(
      "dmMessages"
    );

  box.innerHTML = "";

  if (!messages.length) {

    box.innerHTML =
      '<div class="empty">まだメッセージはありません。</div>';

    return;
  }

  messages.forEach(
    message => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message" +
        (
          message.from ===
          currentUser
            ? " me"
            : ""
        );

      div.innerHTML = `

        <strong>
          ${escapeHTML(message.from)}
        </strong>

        <div>
          ${escapeHTML(message.text)}
        </div>

        <small>
          ${escapeHTML(message.time)}
        </small>

      `;

      box.appendChild(div);
    }
  );

  box.scrollTop =
    box.scrollHeight;
}


/* =====================================================
   パーティー
===================================================== */

function createParty() {

  if (!currentUser) {

    alert(
      "ログインしてください。"
    );

    return;
  }

  if (guestMode) {

    alert(
      "仮アカウントではパーティーを保存できません。"
    );

    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  users[currentUser].party =
    code;

  saveUsers();

  document.getElementById(
    "partyArea"
  ).innerHTML = `

    <div class="partyBox">

      <h3>
        🎉 パーティー作成済み
      </h3>

      <p>
        パーティーコード
      </p>

      <strong style="font-size:24px;">
        ${escapeHTML(code)}
      </strong>

      <br>

      <button
        class="red"
        onclick="leaveParty()"
      >
        パーティーを解散
      </button>

    </div>

  `;
}


function leaveParty() {

  if (
    !currentUser ||
    guestMode
  ) {
    return;
  }

  users[currentUser].party =
    null;

  saveUsers();

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';
}


/* =====================================================
   ステータス
===================================================== */

function statusText(status) {

  if (status === "online") {
    return "🟢 オンライン";
  }

  if (status === "away") {
    return "🟡 離席";
  }

  return "⚪ オフライン";
}


function statusClass(status) {

  if (status === "online") {
    return "online";
  }

  if (status === "away") {
    return "away";
  }

  return "offline";
}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeJS(value) {

  return String(value)
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'");
}


/* =====================================================
   初期化
===================================================== */

function init() {

  const saved =
    localStorage.getItem(
      CURRENT_KEY
    );

  if (
    saved &&
    users[saved]
  ) {

    currentUser =
      saved;

    guestMode = false;

    users[saved].status =
      "online";

    saveUsers();

    setLoggedInUI(saved);

    renderFriends();

  } else {

    setLoggedOutUI();
  }
}

init();

</script>
