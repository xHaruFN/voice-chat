<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SkyWay ビデオ通話サンプル</title>
    <!-- SkyWayのSDK（Roomライブラリ）を読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@skyway-sdk/room@latest/dist/skyway_room.js"></script>
</head>
<body>
    <h1>簡単ビデオ通話</h1>
    
    <div>
        <label>部屋名: <input type="text" id="room-name" value="test-room"></label>
        <button id="join-button">参加する</button>
    </div>

    <!-- 映像を表示するエリア -->
    <div style="display: flex; gap: 10px; margin-top: 20px;">
        <div>
            <h3>自分の映像</h3>
            <video id="my-video" autoplay muted playsinline style="width: 300px; background: #000;"></video>
        </div>
        <div>
            <h3>相手の映像</h3>
            <div id="their-videos" style="display: flex; gap: 10px;"></div>
        </div>
    </div>

    <script>
        // ※注意: 本番運用時はサーバー側でトークンを発行しますが、開発・テスト用にフロントエンドで直接生成します
        const { SkyWayContext, SkyWayStreamFactory, SkyWayRoom, SkyWayAuthToken } = skyway_room;

        // 1. あなたのSkyWayダッシュボードで取得したApp IDとシークレットキーに書き換えてください
        const appId = '54583150-e051-43fc-89bf-c2aa0ae968ad';
        const secretKey = '00Xwdlc3gMFhQzNO1UX55xNM5VNQrQBTN72Wmb0frMQ=';

        // 開発用の認証トークンを作成
        const token = new SkyWayAuthToken({
            jti: uuidV4(),
            iat: nowInSec(),
            exp: nowInSec() + 60 * 60 * 24, // 24時間有効
            scope: {
                app: {
                    id: appId,
                    actions: ['read'],
                    channels: [
                        {
                            id: '*',
                            name: '*',
                            actions: ['write'],
                            members: [
                                {
                                    id: '*',
                                    name: '*',
                                    actions: ['write'],
                                    publication: { actions: ['write'] },
                                    subscription: { actions: ['write'] }
                                }
                            ]
                        }
                    ]
                }
            }
        }).encode(secretKey);

        document.getElementById('join-button').onclick = async () => {
            const roomName = document.getElementById('room-name').value;
            if (!roomName) return alert('部屋名を入力してください');

            // 2. カメラとマイクの映像を取得
            const localAudio = await SkyWayStreamFactory.createMicrophoneAudioStream();
            const localVideo = await SkyWayStreamFactory.createCameraVideoStream();

            // 自分の映像を画面に表示
            const myVideo = document.getElementById('my-video');
            localVideo.attach(myVideo);

            // 3. SkyWayに接続してルーム（部屋）に参加
            const context = await SkyWayContext.Create(token);
            const room = await SkyWayRoom.FindOrCreate(context, {
                type: 'p2p', // 少人数ならP2P、大人数なら 'sfu' に変更可能
                name: roomName,
            });

            const me = await room.join();
            console.log('部屋に参加しました:', me.id);

            // 自分の映像と音声を部屋に公開（Publish）
            await me.publish(localAudio);
            await me.publish(localVideo);

            // 4. 部屋にいる他の人（または後から入ってきた人）の映像を受信して表示する処理
            room.onStreamPublished.add(async (e) => {
                // 自分が公開した映像でなければ受信する
                if (e.publication.publisher.id === me.id) return;

                const { stream } = await me.subscribe(e.publication.id);
                
                if (stream.contentType === 'video') {
                    const theirVideosContainer = document.getElementById('their-videos');
                    const videoElement = document.createElement('video');
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;
                    videoElement.style.width = '300px';
                    videoElement.style.background = '#000';
                    
                    stream.attach(videoElement);
                    theirVideosContainer.appendChild(videoElement);
                }
            });

            alert('部屋に参加しました！別タブや別端末で同じ部屋名で参加してください。');
        };
    </script>
</body>
</html>
