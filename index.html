<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINE Style Chat</title>
<!-- Firebase Web SDK (v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signOut, 
    onAuthStateChanged,
    updateProfile 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    addDoc, 
    query, 
    orderBy, 
    onSnapshot, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ★★★ Firebase コンソールから取得した設定情報をここに貼り付けてください ★★★
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Firebase の初期化
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;

  // --- UI 要素の取得 ---
  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const authTitle = document.getElementById('auth-title');
  const nameField = document.getElementById('name-field');
  const nameInput = document.getElementById('name-input');
  const emailInput = document.getElementById('email-input');
  const passwordInput = document.getElementById('password-input');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const toggleAuthBtn = document.getElementById('toggle-auth-btn');
  const authError = document.getElementById('auth-error');
  const messageList = document.getElementById('message-list');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const logoutBtn = document.getElementById('logout-btn');

  let isSignUpMode = false;

  // --- 画面切り替え（新規登録 / ログイン） ---
  toggleAuthBtn.addEventListener('click', () => {
    isSignUpMode = !isSignUpMode;
    authError.textContent = '';
    if (isSignUpMode) {
      authTitle.textContent = 'アカウント新規登録';
      nameField.style.display = 'block';
      authSubmitBtn.textContent = '登録する';
      toggleAuthBtn.textContent = 'すでにアカウントをお持ちの方（ログイン）';
    } else {
      authTitle.textContent = 'ログイン';
      nameField.style.display = 'none';
      authSubmitBtn.textContent = 'ログイン';
      toggleAuthBtn.textContent = '新規登録はこちら';
    }
  });

  // --- アカウント作成 / ログイン 処理 ---
  authSubmitBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    const displayName = nameInput.value.trim();
    authError.textContent = '';

    if (!email || !password) {
      authError.textContent = 'メールアドレスとパスワードを入力してください。';
      return;
    }

    try {
      if (isSignUpMode) {
        if (!displayName) {
          authError.textContent = '表示名を入力してください。';
          return;
        }
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(userCredential.user, { displayName: displayName });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (error) {
      authError.textContent = 'エラー: ' + error.message;
    }
  });

  // --- ログアウト処理 ---
  logoutBtn.addEventListener('click', () => {
    signOut(auth);
  });

  // --- 認証状態の監視 ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      loadMessages();
    } else {
      currentUser = null;
      chatScreen.style.display = 'none';
      authScreen.style.display = 'flex';
      messageList.innerHTML = '';
    }
  });

  // --- メッセージ送信 ---
  async function sendMessage() {
    const text = messageInput.value.trim();
    if (!text || !currentUser) return;

    try {
      await addDoc(collection(db, "messages"), {
        text: text,
        uid: currentUser.uid,
        userName: currentUser.displayName || "名無し",
        createdAt: serverTimestamp()
      });
      messageInput.value = '';
    } catch (error) {
      console.error("メッセージ送信エラー:", error);
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // --- メッセージ受信・同期（リアルタイム） ---
  function loadMessages() {
    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      messageList.innerHTML = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        const isMine = currentUser && data.uid === currentUser.uid;
        appendMessageUI(data.userName, data.text, isMine, data.createdAt);
      });
      messageList.scrollTop = messageList.scrollHeight;
    });
  }

  // LINE風吹き出しのDOM構築
  function appendMessageUI(userName, text, isMine, timestamp) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message-group ${isMine ? 'mine' : 'other'}`;

    let timeStr = '';
    if (timestamp && timestamp.toDate) {
      const date = timestamp.toDate();
      timeStr = date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0');
    }

    if (isMine) {
      msgDiv.innerHTML = `
        <div class="message-meta">
          <span class="time">${timeStr}</span>
        </div>
        <div class="bubble">${escapeHTML(text)}</div>
      `;
    } else {
      msgDiv.innerHTML = `
        <div class="avatar">${userName ? userName.charAt(0) : 'ユーザー'}</div>
        <div class="content">
          <div class="user-name">${escapeHTML(userName)}</div>
          <div class="bubble-row">
            <div class="bubble">${escapeHTML(text)}</div>
            <span class="time">${timeStr}</span>
          </div>
        </div>
      `;
    }
    messageList.appendChild(msgDiv);
  }

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }
</script>

<style>
:root {
  --line-green: #06C755;
  --bg-chat: #8cabd9;
  --bubble-mine: #85e249;
  --bg-card: #ffffff;
  --border-color: #e2e8f0;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
body, html { height: 100%; background: #111; display: flex; justify-content: center; align-items: center; }

/* スマホ枠風コンテナ */
.app-container {
  width: 100%;
  max-width: 440px;
  height: 100%;
  max-height: 850px;
  background: white;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* ログイン / 新規登録画面 */
.auth-screen {
  position: absolute;
  inset: 0;
  background: white;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 32px 24px;
}
.auth-screen h2 { color: var(--line-green); text-align: center; margin-bottom: 24px; font-size: 1.5rem; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 0.85rem; color: #64748b; margin-bottom: 6px; }
.input-group input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; }
.input-group input:focus { border-color: var(--line-green); }
.btn-primary { width: 100%; padding: 12px; background: var(--line-green); border: none; color: white; font-weight: bold; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 8px; }
.btn-primary:hover { opacity: 0.9; }
.btn-link { background: none; border: none; color: #64748b; text-decoration: underline; font-size: 0.85rem; margin-top: 16px; cursor: pointer; width: 100%; text-align: center; }
.error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 8px; text-align: center; }

/* メインチャット画面 */
.chat-screen {
  display: none;
  flex-direction: column;
  height: 100%;
  background: var(--bg-chat);
}

/* ヘッダー */
header {
  height: 60px;
  background: rgba(0, 0, 0, 0.15);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  color: white;
}
header h3 { font-size: 1.1rem; }
.logout-btn { background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; }

/* メッセージエリア */
.message-list {
  flex: 1;
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* メッセージ（共通） */
.message-group { display: flex; gap: 8px; max-width: 80%; }
.message-group.mine { align-self: flex-end; flex-direction: row; }
.message-group.other { align-self: flex-start; }

/* アバター */
.avatar {
  width: 36px; height: 36px; border-radius: 14px; background: #cbd5e1;
  display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: white; font-size: 0.9rem; flex-shrink: 0;
}

.content { display: flex; flex-direction: column; gap: 4px; }
.user-name { font-size: 0.75rem; color: rgba(255, 255, 255, 0.9); }
.bubble-row { display: flex; align-items: flex-end; gap: 6px; }

/* 吹き出し */
.bubble {
  padding: 8px 12px;
  border-radius: 16px;
  font-size: 0.95rem;
  line-height: 1.4;
  word-break: break-word;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.mine .bubble { background: var(--bubble-mine); color: #000; border-top-right-radius: 2px; }
.other .bubble { background: white; color: #000; border-top-left-radius: 2px; }

.message-meta { display: flex; align-items: flex-end; }
.time { font-size: 0.65rem; color: rgba(255, 255, 255, 0.8); flex-shrink: 0; }

/* 入力エリア */
.input-area {
  background: white;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: 20px;
  background: #f8fafc;
  outline: none;
  font-size: 0.95rem;
}
.send-btn {
  background: var(--line-green);
  border: none;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1rem;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- 認証画面 -->
  <div id="auth-screen" class="auth-screen">
    <h2 id="auth-title">ログイン</h2>
    
    <div id="name-field" class="input-group" style="display: none;">
      <label>表示名（ニックネーム）</label>
      <input type="text" id="name-input" placeholder="例: たろう">
    </div>

    <div class="input-group">
      <label>メールアドレス</label>
      <input type="email" id="email-input" placeholder="example@mail.com">
    </div>

    <div class="input-group">
      <label>パスワード</label>
      <input type="password" id="password-input" placeholder="6文字以上">
    </div>

    <button id="auth-submit-btn" class="btn-primary">ログイン</button>
    <button id="toggle-auth-btn" class="btn-link">新規登録はこちら</button>

    <div id="auth-error" class="error-msg"></div>
  </div>

  <!-- チャット画面 -->
  <div id="chat-screen" class="chat-screen">
    <header>
      <h3>トーク</h3>
      <button id="logout-btn" class="logout-btn">ログアウト</button>
    </header>

    <div id="message-list" class="message-list"></div>

    <div class="input-area">
      <input type="text" id="message-input" placeholder="メッセージを入力">
      <button id="send-btn" class="send-btn">▲</button>
    </div>
  </div>
</div>

</body>
</html>
