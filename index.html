<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スーパーマリオ風 2Dアクション</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #111;
    color: #fff;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas {
    background: #5c94fc;
    display: block;
  }
  .ui-overlay {
    position: absolute;
    top: 10px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }
  /* スマホ用コントローラー */
  .touch-controls {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 800px;
    padding: 10px 20px;
    margin-top: 10px;
  }
  .btn-group { display: flex; gap: 10px; }
  .btn {
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.2);
    border: 2px solid #fff;
    border-radius: 50%;
    color: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .btn:active { background: rgba(255,255,255,0.5); }
</style>
</head>
<body>

<div id="game-container">
  <div class="ui-overlay">
    <div>MARIO: <span id="score">000000</span></div>
    <div>COINS: ★<span id="coins">0</span></div>
  </div>
  <canvas id="canvas" width="800" height="450"></canvas>
</div>

<!-- スマホ向け操作パネル -->
<div class="touch-controls">
  <div class="btn-group">
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-right">▶</div>
  </div>
  <div class="btn-group">
    <div class="btn" id="btn-jump" style="width:80px; border-radius:30px;">JUMP</div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ゲーム設定
const GRAVITY = 0.55;
const TILE_SIZE = 32;

// 入力状態
const keys = { left: false, right: false, jump: false };

// ゲーム変数
let cameraX = 0;
let score = 0;
let coins = 0;
let gameOver = false;
let gameWon = false;

// マリオ（プレイヤー）
const mario = {
  x: 50,
  y: 300,
  w: 28,
  h: 36,
  vx: 0,
  vy: 0,
  speed: 4.5,
  jumpPower: -12,
  grounded: false,
  facing: 'right'
};

// マップデータ (1:地面, 2:レンガ, 3:ハテナブロック, 4:土管, 5:ゴール旗)
const map = [
  "                                                                                    ",
  "                                                                                    ",
  "                                                                                    ",
  "                                                                                    ",
  "                                                                                    ",
  "                                 3                                                  ",
  "                            23232                                                   ",
  "                                                                                    ",
  "                                             44                                  5  ",
  "                       44                    44                                  5  ",
  "                3      44            232     44                                  5  ",
  "                       44                    44                                  5  ",
  "111111111111111111111111111111  1111111111111111111111111111111111111111111111111111",
  "111111111111111111111111111111  1111111111111111111111111111111111111111111111111111"
];

// ブロック & 敵 & コインオブジェクトの生成
const blocks = [];
const enemies = [];
const collectibles = [];

function initMap() {
  blocks.length = 0;
  enemies.length = 0;
  collectibles.length = 0;

  for (let r = 0; r < map.length; r++) {
    for (let c = 0; c < map[r].length; c++) {
      const type = map[r][c];
      const x = c * TILE_SIZE;
      const y = r * TILE_SIZE;

      if (type === '1') blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, type: 'ground' });
      else if (type === '2') blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
      else if (type === '3') blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, type: 'question', hit: false });
      else if (type === '4') blocks.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, type: 'pipe' });
      else if (type === '5') blocks.push({ x, y, w: TILE_SIZE / 2, h: TILE_SIZE, type: 'flag' });
    }
  }

  // 敵（クリボー風）の配置
  enemies.push({ x: 450, y: 350, w: 28, h: 28, vx: -1.2, alive: true });
  enemies.push({ x: 800, y: 350, w: 28, h: 28, vx: -1.2, alive: true });
  enemies.push({ x: 1250, y: 350, w: 28, h: 28, vx: -1.2, alive: true });
}

// キーイベント
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') && mario.grounded) {
    mario.vy = mario.jumpPower;
    mario.grounded = false;
  }
  if ((gameOver || gameWon) && e.key === ' ') resetGame();
});

window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// スマホ操作のバインド
function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; if(key==='jump'&&mario.grounded){mario.vy=mario.jumpPower;mario.grounded=false;} });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'jump');

// 当たり判定
function checkAABB(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ゲームリセット
function resetGame() {
  mario.x = 50;
  mario.y = 300;
  mario.vx = 0;
  mario.vy = 0;
  score = 0;
  coins = 0;
  gameOver = false;
  gameWon = false;
  initMap();
}

// 更新処理
function update() {
  if (gameOver || gameWon) return;

  // 移動制御
  if (keys.left) {
    mario.vx = -mario.speed;
    mario.facing = 'left';
  } else if (keys.right) {
    mario.vx = mario.speed;
    mario.facing = 'right';
  } else {
    mario.vx = 0;
  }

  // 重力追加
  mario.vy += GRAVITY;

  // X軸の移動と衝突チェック
  mario.x += mario.vx;
  for (let b of blocks) {
    if (checkAABB(mario, b)) {
      if (b.type === 'flag') { gameWon = true; return; }
      if (mario.vx > 0) mario.x = b.x - mario.w;
      else if (mario.vx < 0) mario.x = b.x + b.w;
    }
  }

  // Y軸の移動と衝突チェック
  mario.y += mario.vy;
  mario.grounded = false;

  for (let b of blocks) {
    if (checkAABB(mario, b)) {
      if (b.type === 'flag') { gameWon = true; return; }
      if (mario.vy > 0) { // 着地
        mario.y = b.y - mario.h;
        mario.vy = 0;
        mario.grounded = true;
      } else if (mario.vy < 0) { // 天井への衝突
        mario.y = b.y + b.h;
        mario.vy = 0;

        // ハテナブロックを叩いた時
        if (b.type === 'question' && !b.hit) {
          b.hit = true;
          coins++;
          score += 200;
        }
      }
    }
  }

  // 落下死チェック
  if (mario.y > canvas.height) {
    gameOver = true;
  }

  // 敵の移動と衝突
  for (let e of enemies) {
    if (!e.alive) continue;
    e.x += e.vx;

    // 敵のブロック反転
    for (let b of blocks) {
      if (checkAABB(e, b)) {
        e.vx *= -1;
        break;
      }
    }

    // マリオと敵の衝突
    if (checkAABB(mario, e)) {
      if (mario.vy > 0 && mario.y + mario.h - mario.vy <= e.y + 10) {
        // 踏みつけ成功
        e.alive = false;
        mario.vy = -8;
        score += 100;
      } else {
        // マリオがダメージを受ける
        gameOver = true;
      }
    }
  }

  // カメラ追従
  cameraX = mario.x - 200;
  if (cameraX < 0) cameraX = 0;

  // UI更新
  document.getElementById('score').textContent = String(score).padStart(6, '0');
  document.getElementById('coins').textContent = coins;
}

// 描画処理
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(-cameraX, 0);

  // ブロック描画
  for (let b of blocks) {
    if (b.type === 'ground') {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else if (b.type === 'brick') {
      ctx.fillStyle = '#b84418';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else if (b.type === 'question') {
      ctx.fillStyle = b.hit ? '#808080' : '#fcb42c';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#000';
      if (!b.hit) {
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText('?', b.x + 10, b.y + 24);
      }
    } else if (b.type === 'pipe') {
      ctx.fillStyle = '#00a800';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    } else if (b.type === 'flag') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(b.x, b.y, 4, canvas.height);
      ctx.fillStyle = '#fc2c00';
      ctx.fillRect(b.x + 4, b.y, 24, 16);
    }
  }

  // 敵描画（クリボー風）
  for (let e of enemies) {
    if (!e.alive) continue;
    ctx.fillStyle = '#a81000';
    ctx.beginPath();
    ctx.arc(e.x + e.w/2, e.y + e.h/2, e.w/2, 0, Math.PI * 2);
    ctx.fill();
    // 目
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + 6, e.y + 8, 4, 8);
    ctx.fillRect(e.x + 18, e.y + 8, 4, 8);
  }

  // マリオ描画
  ctx.fillStyle = '#fc2c00'; // 赤シャツ/帽子
  ctx.fillRect(mario.x, mario.y, mario.w, mario.h);
  ctx.fillStyle = '#002cfc'; // 青オーバーオール
  ctx.fillRect(mario.x, mario.y + 18, mario.w, 18);
  ctx.fillStyle = '#fcbc3c'; // 顔
  ctx.fillRect(mario.facing === 'right' ? mario.x + 12 : mario.x, mario.y + 4, 16, 12);

  ctx.restore();

  // ゲームオーバー / クリア 画面
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
    ctx.font = '20px sans-serif';
    ctx.fillText('Press SPACE to Restart', canvas.width / 2, canvas.height / 2 + 50);
  } else if (gameWon) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fce400';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('STAGE CLEAR!', canvas.width / 2, canvas.height / 2);
    ctx.font = '20px sans-serif';
    ctx.fillText('Press SPACE to Play Again', canvas.width / 2, canvas.height / 2 + 50);
  }
}

// メインゲームループ
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ゲーム開始
initMap();
loop();
</script>
</body>
</html>
