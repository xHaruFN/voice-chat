<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

header {
  height: 64px;
  background: #1f2937;
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-size: 22px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  border-radius: 16px;
  padding: 25px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-top: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  margin: 6px 4px 6px 0;
  font-size: 16px;
  cursor: pointer;
  background: #4f46e5;
  color: white;
}

button:hover {
  opacity: 0.9;
}

.logout,
.red {
  background: #dc2626;
}

.green {
  background: #22c55e;
}

.gray {
  background: #4b5563;
}

.yellow {
  background: #eab308;
  color: #111827;
}

.user {
  display: flex;
  align-items: center;
  gap: 15px;
  background: #374151;
  padding: 15px;
  border-radius: 12px;
}

.avatar {
  width: 50px;
  height: 50px;
  background: #4f46e5;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

#status {
  margin-top: 15px;
  color: #9ca3af;
}

#accountStatus,
#settingsStatus {
  color: #9ca3af;
}

#settingsCard,
#friendCard,
#partyCard {
  display: none;
}

.friend {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #374151;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.friendAvatar {
  width: 45px;
  height: 45px;
  background: #4f46e5;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.friendInfo {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.online {
  color: #22c55e;
  font-size: 13px;
}

.away {
  color: #eab308;
  font-size: 13px;
}

.offline {
  color: #9ca3af;
  font-size: 13px;
}

.friend button {
  padding: 8px 14px;
  margin: 0 0 0 5px;
}

.request {
  background: #374151;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
}

.partyBox {
  background: #374151;
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

.empty {
  color: #9ca3af;
  padding: 15px 0;
}

.mediaArea {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 20px;
}

.videoBox {
  background: #111827;
  border-radius: 12px;
  padding: 10px;
  min-height: 220px;
}

.videoBox h3 {
  margin: 5px 0 10px;
}

video {
  width: 100%;
  max-height: 400px;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}

.noVideo {
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  background: #030712;
  border-radius: 10px;
}

.dmBox {
  background: #111827;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.dmMessages {
  height: 250px;
  overflow-y: auto;
  background: #030712;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
}

.message {
  background: #374151;
  padding: 9px 12px;
  border-radius: 10px;
  margin: 6px 0;
  max-width: 80%;
}

.message.mine {
  margin-left: auto;
  background: #4f46e5;
}

.messageName {
  font-size: 12px;
  color: #d1d5db;
  margin-bottom: 3px;
}

@media (max-width: 700px) {
  .mediaArea {
    grid-template-columns: 1fr;
  }

  .friend {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<header>
🎙️ Voice Chat
</header>

<main>

<!-- =========================
     アカウント
========================= -->

<div class="card">

<h2>👤 アカウント</h2>

<input
  id="usernameInput"
  maxlength="30"
  placeholder="ユーザー名"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button
  class="gray"
  onclick="createGuest()"
>
👻 仮アカウント
</button>

<button
  id="logoutButton"
  class="red"
  onclick="signOut()"
  style="display:none"
>
ログアウト
</button>

<button
  id="deleteAccountButton"
  class="red"
  onclick="deleteAccount()"
  style="display:none"
>
🗑️ アカウント削除
</button>

<p id="accountStatus">
ログインしていません
</p>

</div>


<!-- =========================
     アカウント設定
========================= -->

<div
  class="card"
  id="settingsCard"
>

<h2>⚙️ アカウント設定</h2>

<h3>👤 ユーザー名変更</h3>

<input
  id="newUsername"
  maxlength="30"
  placeholder="新しいユーザー名"
>

<button onclick="changeUsername()">
ユーザー名変更
</button>

<h3>🔑 パスワード変更</h3>

<input
  id="newPassword"
  type="password"
  placeholder="新しいパスワード"
>

<button onclick="changePassword()">
パスワード変更
</button>

<p id="settingsStatus"></p>

</div>


<!-- =========================
     自分
========================= -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">
👤
</div>

<div>

<strong id="username">
未ログイン
</strong>

<div id="onlineStatus">
⚪ オフライン
</div>

</div>

</div>

<br>

<button
id="awayButton"
class="yellow"
onclick="toggleAway()"
style="display:none"
>
🟡 離席
</button>

<button
id="micButton"
onclick="toggleMic()"
>
🎤 マイクON
</button>

<button
id="cameraButton"
class="green"
onclick="toggleCamera()"
>
📷 カメラON
</button>

<button
id="screenButton"
class="gray"
onclick="toggleScreenShare()"
>
🖥️ 画面共有
</button>

<div id="status">
マイク・カメラ・画面共有を操作できます。
</div>


<div class="mediaArea">

<div class="videoBox">

<h3>
📷 カメラ
</h3>

<video
id="cameraVideo"
autoplay
muted
playsinline
></video>

<div
id="cameraEmpty"
class="noVideo"
>
カメラOFF
</div>

</div>


<div class="videoBox">

<h3>
🖥️ 画面共有
</h3>

<video
id="screenVideo"
autoplay
muted
playsinline
></video>

<div
id="screenEmpty"
class="noVideo"
>
画面共有OFF
</div>

</div>

</div>

</div>


<!-- =========================
     フレンド
========================= -->

<div
class="card"
id="friendCard"
>

<h2>👥 フレンド</h2>

<input
id="friendSearch"
placeholder="🔍 プレイヤーを検索"
>

<button onclick="searchFriend()">
🔍 検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
<div class="empty">
フレンドはいません。
</div>
</div>

<h3>📨 フレンド申請</h3>

<div id="requestList">
<div class="empty">
フレンド申請はありません。
</div>
</div>


<!-- =========================
     DM
========================= -->

<div
id="dmArea"
class="dmBox"
style="display:none"
>

<h3 id="dmTitle">
💬 DM
</h3>

<div
id="dmMessages"
class="dmMessages"
></div>

<input
id="dmInput"
placeholder="メッセージを入力"
onkeydown="if(event.key==='Enter')sendDM()"
>

<button onclick="sendDM()">
送信
</button>

<button
class="gray"
onclick="closeDM()"
>
DMを閉じる
</button>

</div>

</div>


<!-- =========================
     パーティー
========================= -->

<div
class="card"
id="partyCard"
>

<h2>🎉 パーティー</h2>

<input
id="partyNameInput"
maxlength="30"
placeholder="部屋名を入力 (例: room123)"
>

<button
class="green"
onclick="createOrJoinParty()"
>
🚪 パーティー作成・参加
</button>

<div id="partyArea">

<div class="empty">
パーティーに参加していません。
</div>

</div>

</div>

</main>


<script>

/* ==========================================
   ローカルデータ
========================================== */

const DB_KEY = "voice_chat_database_v1";
const SESSION_KEY = "voice_chat_session_v1";

let db =
JSON.parse(
localStorage.getItem(DB_KEY) ||
'{"users":[],"friendRequests":[],"friendships":[],"messages":[],"parties":[]}'
);

let currentUser = null;
let guestMode = false;
let currentDMUser = null;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let away = false;


/* ==========================================
   DB保存
========================================== */

function saveDB() {

localStorage.setItem(
DB_KEY,
JSON.stringify(db)
);

}


/* ==========================================
   ID
========================================== */

function randomID(prefix="id") {

return prefix +
"_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2,8);

}


/* ==========================================
   ログインUI
========================================== */

function setLoggedInUI(name) {

document.getElementById(
"username"
).textContent = name;

document.getElementById(
"accountStatus"
).textContent =
guestMode
? "👻 仮アカウント: " + name
: "✅ ログイン中";

document.getElementById(
"logoutButton"
).style.display =
"inline-block";

document.getElementById(
"deleteAccountButton"
).style.display =
"inline-block";

document.getElementById(
"settingsCard"
).style.display =
"block";

document.getElementById(
"friendCard"
).style.display =
"block";

document.getElementById(
"partyCard"
).style.display =
"block";

document.getElementById(
"awayButton"
).style.display =
"inline-block";

setStatus("online");

}


function setLoggedOutUI() {

document.getElementById(
"username"
).textContent =
"未ログイン";

document.getElementById(
"onlineStatus"
).textContent =
"⚪ オフライン";

document.getElementById(
"accountStatus"
).textContent =
"ログインしていません";

document.getElementById(
"logoutButton"
).style.display =
"none";

document.getElementById(
"deleteAccountButton"
).style.display =
"none";

document.getElementById(
"settingsCard"
).style.display =
"none";

document.getElementById(
"friendCard"
).style.display =
"none";

document.getElementById(
"partyCard"
).style.display =
"none";

document.getElementById(
"awayButton"
).style.display =
"none";

}


/* ==========================================
   アカウント作成
========================================== */

function signUp() {

const username =
document.getElementById(
"usernameInput"
).value.trim();

const password =
document.getElementById(
"password"
).value;

if (!username || !password) {

alert(
"ユーザー名とパスワードを入力してください。"
);

return;
}

if (username.length < 2) {

alert(
"ユーザー名は2文字以上にしてください。"
);

return;
}

if (password.length < 6) {

alert(
"パスワードは6文字以上にしてください。"
);

return;
}

const exists =
db.users.find(
u =>
u.username.toLowerCase() ===
username.toLowerCase()
);

if (exists) {

alert(
"そのユーザー名はすでに使用されています。"
);

return;
}

const user = {

id: randomID("user"),

username: username,

password: password,

status: "offline",

createdAt: Date.now()

};

db.users.push(user);

saveDB();

alert(
"アカウントを作成しました！"
);

document.getElementById(
"usernameInput"
).value = "";

document.getElementById(
"password"
).value = "";

}


/* ==========================================
   ログイン
========================================== */

function signIn() {

const username =
document.getElementById(
"usernameInput"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const user =
db.users.find(
u =>
u.username.toLowerCase() ===
username.toLowerCase() &&
u.password === password
);

if (!user) {

alert(
"ユーザー名またはパスワードが違います。"
);

return;
}

currentUser = user;
guestMode = false;
away = false;

localStorage.setItem(
SESSION_KEY,
user.id
);

user.status = "online";

saveDB();

setLoggedInUI(
user.username
);

loadFriends();
loadFriendRequests();
renderParty();

alert(
"ログインしました！"
);

}


/* ==========================================
   仮アカウント
========================================== */

function createGuest() {

if (currentUser) {

alert(
"すでにログインしています。"
);

return;
}

const guestName =
"Guest_" +
Math.floor(
100000 +
Math.random() * 900000
);

currentUser = {

id: randomID("guest"),

username: guestName,

password: "",

status: "online",

guest: true

};

guestMode = true;
away = false;

setLoggedInUI(
guestName
);

loadFriends();
loadFriendRequests();
renderParty();

alert(
"仮アカウントを作成しました！\n\n" +
guestName
);

}


/* ==========================================
   ログアウト
========================================== */

function signOut() {

stopMicrophone();
stopCamera();
stopScreenShare();

if (!guestMode) {

const user =
db.users.find(
u => u.id === currentUser.id
);

if (user) {

user.status = "offline";

}

saveDB();

}

currentUser = null;
guestMode = false;
away = false;
currentDMUser = null;

localStorage.removeItem(
SESSION_KEY
);

document.getElementById(
"dmArea"
).style.display =
"none";

setLoggedOutUI();

}


/* ==========================================
   アカウント削除
========================================== */

function deleteAccount() {

if (!currentUser) {
return;
}

if (!confirm(
"本当にアカウントを削除しますか？"
)) {
return;
}

if (guestMode) {

signOut();

alert(
"仮アカウントを終了しました。"
);

return;
}

const id =
currentUser.id;

db.users =
db.users.filter(
u => u.id !== id
);

db.friendRequests =
db.friendRequests.filter(
r =>
r.senderId !== id &&
r.receiverId !== id
);

db.friendships =
db.friendships.filter(
f =>
f.userId !== id &&
f.friendId !== id
);

db.messages =
db.messages.filter(
m =>
m.senderId !== id &&
m.receiverId !== id
);

db.parties =
db.parties.filter(
p => p.ownerId !== id
);

saveDB();

currentUser = null;

localStorage.removeItem(
SESSION_KEY
);

setLoggedOutUI();

alert(
"アカウントを削除しました。"
);

}


/* ==========================================
   ユーザー名変更
========================================== */

function changeUsername() {

if (!currentUser) {
return;
}

if (guestMode) {

alert(
"仮アカウントではユーザー名を変更できません。"
);

return;
}

const name =
document.getElementById(
"newUsername"
).value.trim();

if (!name) {

alert(
"新しいユーザー名を入力してください。"
);

return;
}

const exists =
db.users.find(
u =>
u.username.toLowerCase() ===
name.toLowerCase() &&
u.id !== currentUser.id
);

if (exists) {

alert(
"そのユーザー名はすでに使用されています。"
);

return;
}

const user =
db.users.find(
u => u.id === currentUser.id
);

user.username = name;

currentUser = user;

saveDB();

document.getElementById(
"username"
).textContent =
name;

document.getElementById(
"settingsStatus"
).textContent =
"✅ ユーザー名を変更しました。";

document.getElementById(
"newUsername"
).value = "";

}


/* ==========================================
   パスワード変更
========================================== */

function changePassword() {

if (!currentUser) {
return;
}

if (guestMode) {

alert(
"仮アカウントではパスワードを変更できません。"
);

return;
}

const password =
document.getElementById(
"newPassword"
).value;

if (password.length < 6) {

alert(
"パスワードは6文字以上にしてください。"
);

return;
}

const user =
db.users.find(
u => u.id === currentUser.id
);

user.password = password;

saveDB();

document.getElementById(
"settingsStatus"
).textContent =
"✅ パスワードを変更しました。";

document.getElementById(
"newPassword"
).value = "";

}


/* ==========================================
   離席
========================================== */

function toggleAway() {

if (!currentUser) {
return;
}

away = !away;

setStatus(
away
? "away"
: "online"
);

}


function setStatus(status) {

if (!currentUser) {
return;
}

away =
status === "away";

const statusText =
status === "online"
? "🟢 オンライン"
: status === "away"
? "🟡 離席"
: "⚪ オフライン";

document.getElementById(
"onlineStatus"
).textContent =
statusText;

const button =
document.getElementById(
"awayButton"
);

button.textContent =
away
? "🟢 オンラインに戻る"
: "🟡 離席";

if (!guestMode) {

const user =
db.users.find(
u => u.id === currentUser.id
);

if (user) {

user.status = status;

saveDB();

}

}

loadFriends();

}


/* ==========================================
   マイク
========================================== */

async function toggleMic() {

if (!currentUser) {

alert(
"ログインしてください。"
);

return;
}

if (!micEnabled) {

try {

microphone =
await navigator.mediaDevices.getUserMedia({
audio: true
});

micEnabled = true;

document.getElementById(
"micButton"
).textContent =
"🔇 マイクOFF";

updateMediaStatus();

} catch (error) {

alert(
"マイクへのアクセスが許可されませんでした。"
);

}

} else {

stopMicrophone();

updateMediaStatus();

}

}


function stopMicrophone() {

if (microphone) {

microphone
.getTracks()
.forEach(
track => track.stop()
);

}

microphone = null;
micEnabled = false;

const button =
document.getElementById(
"micButton"
);

if (button) {

button.textContent =
"🎤 マイクON";

}

}


/* ==========================================
   カメラ
========================================== */

async function toggleCamera() {

if (!currentUser) {

alert(
"ログインしてください。"
);

return;
}

if (!cameraEnabled) {

try {

cameraStream =
await navigator.mediaDevices.getUserMedia({
video: true,
audio: false
});

cameraEnabled = true;

document.getElementById(
"cameraVideo"
).srcObject =
cameraStream;

document.getElementById(
"cameraEmpty"
).style.display =
"none";

document.getElementById(
"cameraButton"
).textContent =
"📷 カメラOFF";

updateMediaStatus();

} catch (error) {

alert(
"カメラへのアクセスが許可されませんでした。"
);

}

} else {

stopCamera();

updateMediaStatus();

}

}


function stopCamera() {

if (cameraStream) {

cameraStream
.getTracks()
.forEach(
track => track.stop()
);

}

cameraStream = null;
cameraEnabled = false;

document.getElementById(
"cameraVideo"
).srcObject =
null;

document.getElementById(
"cameraEmpty"
).style.display =
"flex";

document.getElementById(
"cameraButton"
).textContent =
"📷 カメラON";

}


/* ==========================================
   画面共有
========================================== */

async function toggleScreenShare() {

if (!currentUser) {

alert(
"ログインしてください。"
);

return;
}

if (!screenEnabled) {

try {

if (!navigator.mediaDevices.getDisplayMedia) {

alert(
"このブラウザでは画面共有に対応していません。"
);

return;

}

screenStream =
await navigator.mediaDevices.getDisplayMedia({
video: true,
audio: true
});

screenEnabled = true;

document.getElementById(
"screenVideo"
).srcObject =
screenStream;

document.getElementById(
"screenEmpty"
).style.display =
"none";

document.getElementById(
"screenButton"
).textContent =
"🛑 画面共有OFF";

updateMediaStatus();

const track =
screenStream.getVideoTracks()[0];

if (track) {

track.addEventListener(
"ended",
() => {

stopScreenShare();
updateMediaStatus();

}
);

}

} catch (error) {

if (
error.name !== "AbortError"
) {

alert(
"画面共有を開始できませんでした。"
);

}

}

} else {

stopScreenShare();

updateMediaStatus();

}

}


function stopScreenShare() {

if (screenStream) {

screenStream
.getTracks()
.forEach(
track => track.stop()
);

}

screenStream = null;
screenEnabled = false;

document.getElementById(
"screenVideo"
).srcObject =
null;

document.getElementById(
"screenEmpty"
).style.display =
"flex";

document.getElementById(
"screenButton"
).textContent =
"🖥️ 画面共有";

}


/* ==========================================
   メディア状態
========================================== */

function updateMediaStatus() {

const status = [];

if (micEnabled)
status.push("🎤 マイクON");

if (cameraEnabled)
status.push("📷 カメラON");

if (screenEnabled)
status.push("🖥️ 画面共有ON");

document.getElementById(
"status"
).textContent =
status.length
? status.join(" ")
: "すべてOFF";

}


/* ==========================================
   フレンド検索
========================================== */

function searchFriend() {

if (!currentUser) {

alert(
"ログインしてください。"
);

return;
}

const text =
document.getElementById(
"friendSearch"
).value.trim()
.toLowerCase();

if (!text) {

alert(
"検索する名前を入力してください。"
);

return;
}

const users =
db.users.filter(
u =>
u.username.toLowerCase()
.includes(text) &&
u.id !== currentUser.id
);

const result =
document.getElementById(
"searchResult"
);

result.innerHTML = "";

if (!users.length) {

result.innerHTML =
'<div class="empty">プレイヤーが見つかりません。</div>';

return;
}

users.forEach(
user => {

const div =
document.createElement("div");

div.className =
"friend";

div.innerHTML = `

<div class="friendAvatar">
👤
</div>

<div class="friendInfo">

<strong>
${escapeHTML(user.username)}
</strong>

<span class="${
user.status === "online"
? "online"
: user.status === "away"
? "away"
: "offline"
}">
● ${
user.status === "online"
? "オンライン"
: user.status === "away"
? "離席"
: "オフライン"
}
</span>

</div>

<button
class="green"
onclick="sendFriendRequest('${user.id}')"
>
＋ 追加
</button>

`;

result.appendChild(div);

});

}


/* ==========================================
   フレンド申請
========================================== */

function sendFriendRequest(userId) {

if (!currentUser) {
return;
}

if (userId === currentUser.id) {
return;
}

const already =
db.friendships.some(
f =>
f.userId === currentUser.id &&
f.friendId === userId
);

if (already) {

alert(
"すでにフレンドです。"
);

return;
}

const pending =
db.friendRequests.some(
r =>
r.senderId === currentUser.id &&
r.receiverId === userId &&
r.status === "pending"
);

if (pending) {

alert(
"すでに申請しています。"
);

return;
}

db.friendRequests.push({

id: randomID("request"),

senderId:
currentUser.id,

receiverId:
userId,

status: "pending"

});

saveDB();

alert(
"フレンド申請を送りました！"
);

loadFriendRequests();

}


/* ==========================================
   フレンド一覧
========================================== */

function loadFriends() {

if (!currentUser)
return;

const list =
document.getElementById(
"friendList"
);

list.innerHTML = "";

const friends =
db.friendships.filter(
f =>
f.userId === currentUser.id
);

if (!friends.length) {

list.innerHTML =
'<div class="empty">フレンドはいません。</div>';

return;
}

friends.forEach(
relation => {

const friend =
db.users.find(
u => u.id === relation.friendId
);

if (!friend)
return;

const div =
document.createElement("div");

div.className =
"friend";

const status =
friend.status || "offline";

div.innerHTML = `

<div class="friendAvatar">
👤
</div>

<div class="friendInfo">

<strong>
${escapeHTML(friend.username)}
</strong>

<span class="${
status === "online"
? "online"
: status === "away"
? "away"
: "offline"
}">
● ${
status === "online"
? "オンライン"
: status === "away"
? "離席"
: "オフライン"
}
</span>

</div>

<button
onclick="openDM('${friend.id}')"
>
💬 DM
</button>

<button
class="red"
onclick="removeFriend('${friend.id}')"
>
🗑️ 削除
</button>

`;

list.appendChild(div);

});

}


/* ==========================================
   フレンド削除
========================================== */

function removeFriend(friendId) {

if (!currentUser)
return;

if (!confirm(
"このフレンドを削除しますか？"
)) {
return;
}

db.friendships =
db.friendships.filter(
f =>
!(
(
f.userId === currentUser.id &&
f.friendId === friendId
) ||
(
f.userId === friendId &&
f.friendId === currentUser.id
)
)
);

saveDB();

loadFriends();

alert(
"フレンドを削除しました。"
);

}


/* ==========================================
   申請一覧
========================================== */

function loadFriendRequests() {

if (!currentUser)
return;

const list =
document.getElementById(
"requestList"
);

list.innerHTML = "";

const requests =
db.friendRequests.filter(
r =>
r.receiverId === currentUser.id &&
r.status === "pending"
);

if (!requests.length) {

list.innerHTML =
'<div class="empty">フレンド申請はありません。</div>';

return;
}

requests.forEach(
request => {

const sender =
db.users.find(
u => u.id === request.senderId
);

if (!sender)
return;

const div =
document.createElement("div");

div.className =
"request";

div.innerHTML = `

<strong>
${escapeHTML(sender.username)}
</strong>

<p>
フレンド申請が届いています。
</p>

<button
class="green"
onclick="acceptFriend('${request.id}')"
>
✓ 承認
</button>

<button
class="red"
onclick="rejectFriend('${request.id}')"
>
✕ 拒否
</button>

`;

list.appendChild(div);

});

}


/* ==========================================
   承認
========================================== */

function acceptFriend(requestId) {

const request =
db.friendRequests.find(
r => r.id === requestId
);

if (!request)
return;

request.status =
"accepted";

db.friendships.push({

userId:
request.receiverId,

friendId:
request.senderId

});

db.friendships.push({

userId:
request.senderId,

friendId:
request.receiverId

});

saveDB();

loadFriends();
loadFriendRequests();

alert(
"フレンドになりました！"
);

}


/* ==========================================
   拒否
========================================== */

function rejectFriend(requestId) {

const request =
db.friendRequests.find(
r => r.id === requestId
);

if (!request)
return;

request.status =
"rejected";

saveDB();

loadFriendRequests();

}


/* ==========================================
   DMを開く
========================================== */

function openDM(friendId) {

if (!currentUser)
return;

currentDMUser =
db.users.find(
u => u.id === friendId
);

if (!currentDMUser)
return;

document.getElementById(
"dmArea"
).style.display =
"block";

document.getElementById(
"dmTitle"
).textContent =
"💬 " +
currentDMUser.username +
" とのDM";

loadDM();

}


/* ==========================================
   DM表示
========================================== */

function loadDM() {

if (!currentDMUser)
return;

const box =
document.getElementById(
"dmMessages"
);

const messages =
db.messages.filter(
m =>
(
m.senderId === currentUser.id &&
m.receiverId === currentDMUser.id
) ||
(
m.senderId === currentDMUser.id &&
m.receiverId === currentUser.id
)
);

box.innerHTML = "";

messages.forEach(
message => {

const mine =
message.senderId ===
currentUser.id;

const div =
document.createElement("div");

div.className =
"message" +
(
mine
? " mine"
: ""
);

div.innerHTML = `

<div class="messageName">
${escapeHTML(
mine
? "自分"
: currentDMUser.username
)}
</div>

<div>
${escapeHTML(message.text)}
</div>

`;

box.appendChild(div);

});

box.scrollTop =
box.scrollHeight;

}


/* ==========================================
   DM送信
========================================== */

function sendDM() {

if (!currentUser) {
return;
}

if (!currentDMUser) {

alert(
"DMするフレンドを選択してください。"
);

return;
}

const input =
document.getElementById(
"dmInput"
);

const text =
input.value.trim();

if (!text)
return;

db.messages.push({

id: randomID("message"),

senderId:
currentUser.id,

receiverId:
currentDMUser.id,

text: text,

createdAt: Date.now()

});

saveDB();

input.value = "";

loadDM();

}


/* ==========================================
   DM閉じる
========================================== */

function closeDM() {

currentDMUser =
null;

document.getElementById(
"dmArea"
).style.display =
"none";

}


/* ==========================================
   パーティー作成・参加（部屋名ベース）
========================================== */

function createOrJoinParty() {

if (!currentUser) {

alert(
"ログインしてください。"
);

return;
}

const partyName =
document.getElementById(
"partyNameInput"
).value.trim();

if (!partyName) {

alert(
"部屋名を入力してください。"
);

return;
}

// 既に自分がどこかのパーティーに参加している場合は一度抜ける
db.parties.forEach(p => {
  p.members = p.members.filter(id => id !== currentUser.id);
});
db.parties = db.parties.filter(p => p.members.length > 0);

// 該当する部屋名がすでに存在するか探す
let party = db.parties.find(
  p => p.partyName.toLowerCase() === partyName.toLowerCase()
);

if (party) {
  // すでに存在する場合は参加
  if (!party.members.includes(currentUser.id)) {
    party.members.push(currentUser.id);
  }
} else {
  // 存在しない場合は新しく作成して参加
  party = {
    id: randomID("party"),
    ownerId: currentUser.id,
    partyName: partyName,
    members: [currentUser.id]
  };
  db.parties.push(party);
}

saveDB();
renderParty();

document.getElementById(
"partyNameInput"
).value = "";

alert(
"部屋「" + partyName + "」に参加しました！"
);

}


/* ==========================================
   パーティー表示
========================================== */

function renderParty() {

if (!currentUser)
return;

const area =
document.getElementById(
"partyArea"
);

const party =
db.parties.find(
p =>
p.members.includes(
currentUser.id
)
);

if (!party) {

area.innerHTML =
'<div class="empty">パーティーに参加していません。</div>';

return;

}

const owner =
db.users.find(
u => u.id === party.ownerId
);

const members =
party.members.map(
id =>
db.users.find(
u => u.id === id
)
).filter(Boolean);

area.innerHTML = `

<div class="partyBox">

<h3>
🎉 パーティー参加中
</h3>

<p>
部屋名
</p>

<strong style="font-size:22px;">
${escapeHTML(party.partyName)}
</strong>

<p style="margin-top:8px;">
👑 ホスト:
${escapeHTML(
owner
? owner.username
: "Unknown"
)}
</p>

<p>
👥 メンバー: ${members.length}人
</p>

${members.map(
member =>
`
<div>
👤 ${escapeHTML(member.username)}
</div>
`
).join("")}

<br>

<button
class="red"
onclick="leaveParty('${party.id}')"
>
🚪 パーティー退出
</button>

${
party.ownerId === currentUser.id
?
`
<button
class="red"
onclick="deleteParty('${party.id}')"
>
🗑️ パーティー解散
</button>
`
:
""
}

</div>

`;

}


/* ==========================================
   パーティー退出
========================================== */

function leaveParty(partyId) {

const party =
db.parties.find(
p => p.id === partyId
);

if (!party)
return;

party.members =
party.members.filter(
id =>
id !== currentUser.id
);

if (
party.members.length === 0
) {

db.parties =
db.parties.filter(
p => p.id !== partyId
);

}

saveDB();

renderParty();

}


/* ==========================================
   パーティー解散
========================================== */

function deleteParty(partyId) {

const party =
db.parties.find(
p => p.id === partyId
);

if (!party)
return;

if (
party.ownerId !==
currentUser.id
) {

return;

}

if (!confirm(
"パーティーを解散しますか？"
)) {

return;

}

db.parties =
db.parties.filter(
p => p.id !== partyId
);

saveDB();

renderParty();

}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(value) {

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ==========================================
   セッション復元
========================================== */

function checkSession() {

const id =
localStorage.getItem(
SESSION_KEY
);

if (!id) {

setLoggedOutUI();

return;

}

const user =
db.users.find(
u => u.id === id
);

if (!user) {

localStorage.removeItem(
SESSION_KEY
);

setLoggedOutUI();

return;

}

currentUser =
user;

guestMode = false;

user.status =
"online";

saveDB();

setLoggedInUI(
user.username
);

loadFriends();
loadFriendRequests();
renderParty();

}


/* ==========================================
   ページを閉じたとき
========================================== */

window.addEventListener(
"beforeunload",
() => {

if (
currentUser &&
!guestMode
) {

const user =
db.users.find(
u => u.id === currentUser.id
);

if (user) {

user.status =
"offline";

saveDB();

}

}

}
);


/* ==========================================
   初期化
========================================== */

checkSession();

</script>

</body>
</html>
