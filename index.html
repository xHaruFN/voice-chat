<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Browser VC</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:#fff;
}

.container{
    width:min(950px,94%);
    margin:30px auto;
}

.card{
    background:#1e293b;
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #334155;
    border-radius:9px;
    background:#020617;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#3b82f6;
}

button{
    padding:11px 16px;
    margin:4px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#1d4ed8;
}

button.gray{background:#475569}
button.red{background:#dc2626}
button.green{background:#16a34a}

.hidden{
    display:none!important;
}

#message{
    min-height:24px;
    margin-top:10px;
}

.status{
    background:#020617;
    padding:12px;
    border-radius:9px;
    margin:8px 0;
}

.online{
    color:#22c55e;
}

.center{
    text-align:center;
}

.mic{
    font-size:60px;
    margin:15px;
}

.chat{
    height:300px;
    overflow-y:auto;
    background:#020617;
    padding:12px;
    border-radius:10px;
}

.chat-message{
    background:#1e293b;
    padding:9px;
    margin:6px 0;
    border-radius:8px;
    word-break:break-word;
}

.chat-name{
    color:#60a5fa;
    font-weight:bold;
}

.chat-time{
    color:#64748b;
    font-size:11px;
    margin-left:6px;
}

.chat-row{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.chat-row input{
    margin:0;
    flex:1;
}

.chat-row button{
    margin:0;
}

.media-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:12px;
    margin-top:12px;
}

.media-box{
    background:#020617;
    border-radius:10px;
    padding:10px;
}

.media-title{
    margin-bottom:8px;
    color:#94a3b8;
}

video{
    width:100%;
    max-height:350px;
    background:#000;
    border-radius:8px;
    object-fit:contain;
}

.user{
    background:#020617;
    padding:12px;
    border-radius:9px;
    margin:7px 0;
}

.party-id{
    font-size:24px;
    font-weight:bold;
    letter-spacing:3px;
}

.small{
    color:#94a3b8;
    font-size:13px;
}

hr{
    border:0;
    border-top:1px solid #334155;
    margin:18px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
    <h1>🎙️ Browser VC</h1>
    <p>Supabaseなし・ブラウザだけで動作するVC</p>
</div>


<!-- =========================
     AUTH
========================= -->

<div id="authScreen" class="card">

    <h2>🔐 アカウント</h2>

    <input
        id="usernameInput"
        type="text"
        placeholder="ユーザー名"
        maxlength="20"
        autocomplete="username"
    >

    <input
        id="passwordInput"
        type="password"
        placeholder="パスワード"
        maxlength="72"
        autocomplete="current-password"
    >

    <button id="loginButton" type="button">
        ログイン
    </button>

    <button id="createAccountButton" type="button">
        アカウント作成
    </button>

    <button id="guestButton" class="gray" type="button">
        🟡 仮アカウント作成
    </button>

    <div id="message"></div>

    <p class="small">
        メールアドレスは使用しません。
    </p>

</div>


<!-- =========================
     MAIN
========================= -->

<div id="mainScreen" class="hidden">


<!-- ACCOUNT -->

<div class="card">

    <h2>👤 アカウント</h2>

    <div class="status">
        ユーザー名：
        <strong id="displayUsername"></strong>
    </div>

    <div class="status">
        アカウント：
        <span id="accountType"></span>
    </div>

    <div class="status">
        状態：
        <span class="online">● オンライン</span>
    </div>

    <button id="logoutButton" class="red" type="button">
        ログアウト
    </button>

</div>


<!-- =========================
     CHAT
========================= -->

<div class="card">

    <h2>💬 チャット</h2>

    <div id="chatMessages" class="chat"></div>

    <div class="chat-row">

        <input
            id="chatInput"
            type="text"
            placeholder="メッセージを入力..."
            maxlength="500"
        >

        <button id="sendChatButton" type="button">
            送信
        </button>

    </div>

    <button id="clearChatButton" class="gray" type="button">
        チャット履歴を消去
    </button>

</div>


<!-- =========================
     VOICE
========================= -->

<div class="card">

    <h2>🎤 ボイスチャット</h2>

    <div class="center">

        <div id="micIcon" class="mic">
            🔇
        </div>

        <p id="micStatus">
            マイクOFF
        </p>

        <button id="micButton" type="button">
            🎙️ マイクON
        </button>

        <button id="micStopButton" class="red" type="button">
            🔇 マイク停止
        </button>

    </div>

    <p class="small">
        ※Supabase等の通信サーバーがないため、
        マイク音声はこの端末内で取得するだけです。
    </p>

</div>


<!-- =========================
     CAMERA / SCREEN
========================= -->

<div class="card">

    <h2>📹 カメラ・画面共有</h2>

    <button id="cameraButton" type="button">
        📷 カメラON
    </button>

    <button id="cameraStopButton" class="red" type="button">
        カメラ停止
    </button>

    <button id="screenButton" type="button">
        🖥️ 画面共有
    </button>

    <button id="screenStopButton" class="red" type="button">
        画面共有停止
    </button>

    <div class="media-grid">

        <div class="media-box">

            <div class="media-title">
                📷 カメラ
            </div>

            <video
                id="cameraVideo"
                autoplay
                muted
                playsinline
            ></video>

        </div>

        <div class="media-box">

            <div class="media-title">
                🖥️ 画面共有
            </div>

            <video
                id="screenVideo"
                autoplay
                muted
                playsinline
            ></video>

        </div>

    </div>

</div>


<!-- =========================
     FRIEND
========================= -->

<div class="card">

    <h2>👥 フレンド</h2>

    <input
        id="friendInput"
        type="text"
        placeholder="ユーザー名"
        maxlength="20"
    >

    <button id="addFriendButton" type="button">
        フレンド追加
    </button>

    <div id="friendList"></div>

</div>


<!-- =========================
     PARTY
========================= -->

<div class="card">

    <h2>🎮 パーティー</h2>

    <button id="createPartyButton" type="button">
        パーティー作成
    </button>

    <button id="joinPartyButton" type="button">
        パーティー参加
    </button>

    <button id="leavePartyButton" class="red" type="button">
        パーティー退出
    </button>

    <div id="partyStatus" class="status">
        パーティーに参加していません。
    </div>

    <div id="partyMemberList"></div>

</div>


<!-- =========================
     LOCAL DATA
========================= -->

<div class="card">

    <h2>⚙️ データ</h2>

    <button id="exportButton" type="button">
        データを書き出す
    </button>

    <button id="resetButton" class="red" type="button">
        全データ削除
    </button>

    <p class="small">
        このページのデータはブラウザのlocalStorageに保存されます。
    </p>

</div>

</div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let microphoneStream = null;
let cameraStream = null;
let screenStream = null;

let partyId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
document.getElementById("authScreen");

const mainScreen =
document.getElementById("mainScreen");

const usernameInput =
document.getElementById("usernameInput");

const passwordInput =
document.getElementById("passwordInput");

const loginButton =
document.getElementById("loginButton");

const createAccountButton =
document.getElementById("createAccountButton");

const guestButton =
document.getElementById("guestButton");

const message =
document.getElementById("message");

const displayUsername =
document.getElementById("displayUsername");

const accountType =
document.getElementById("accountType");

const logoutButton =
document.getElementById("logoutButton");

const chatMessages =
document.getElementById("chatMessages");

const chatInput =
document.getElementById("chatInput");

const sendChatButton =
document.getElementById("sendChatButton");

const clearChatButton =
document.getElementById("clearChatButton");

const micButton =
document.getElementById("micButton");

const micStopButton =
document.getElementById("micStopButton");

const micIcon =
document.getElementById("micIcon");

const micStatus =
document.getElementById("micStatus");

const cameraButton =
document.getElementById("cameraButton");

const cameraStopButton =
document.getElementById("cameraStopButton");

const cameraVideo =
document.getElementById("cameraVideo");

const screenButton =
document.getElementById("screenButton");

const screenStopButton =
document.getElementById("screenStopButton");

const screenVideo =
document.getElementById("screenVideo");

const friendInput =
document.getElementById("friendInput");

const addFriendButton =
document.getElementById("addFriendButton");

const friendList =
document.getElementById("friendList");

const createPartyButton =
document.getElementById("createPartyButton");

const joinPartyButton =
document.getElementById("joinPartyButton");

const leavePartyButton =
document.getElementById("leavePartyButton");

const partyStatus =
document.getElementById("partyStatus");

const partyMemberList =
document.getElementById("partyMemberList");

const exportButton =
document.getElementById("exportButton");

const resetButton =
document.getElementById("resetButton");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,error=false){

    message.textContent = text;

    message.style.color =
        error
        ? "#ef4444"
        : "#22c55e";

}


/* =====================================================
   STORAGE
===================================================== */

function getAccounts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "browser_vc_accounts"
            ) || "{}"
        );

    }catch{

        return {};

    }

}


function saveAccounts(accounts){

    localStorage.setItem(
        "browser_vc_accounts",
        JSON.stringify(accounts)
    );

}


/* =====================================================
   USERNAME
===================================================== */

function validUsername(username){

    return /^[a-zA-Z0-9_ぁ-んァ-ヶ一-龠]{3,20}$/
        .test(username);

}


/* =====================================================
   CREATE ACCOUNT
===================================================== */

createAccountButton.addEventListener(
    "click",
    function(){

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if(!validUsername(username)){

            showMessage(
                "ユーザー名は3～20文字で入力してください。",
                true
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                "パスワードは6文字以上にしてください。",
                true
            );

            return;

        }


        const accounts =
            getAccounts();


        if(accounts[username]){

            showMessage(
                "そのユーザー名は既に使用されています。",
                true
            );

            return;

        }


        accounts[username] = {

            username:username,

            password:password,

            createdAt:
                Date.now()

        };


        saveAccounts(accounts);


        showMessage(
            "アカウントを作成しました！"
        );


        passwordInput.value = "";

    }
);


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    function(){

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if(!username || !password){

            showMessage(
                "ユーザー名とパスワードを入力してください。",
                true
            );

            return;

        }


        const accounts =
            getAccounts();


        const account =
            accounts[username];


        if(!account){

            showMessage(
                "アカウントが存在しません。",
                true
            );

            return;

        }


        if(account.password !== password){

            showMessage(
                "パスワードが違います。",
                true
            );

            return;

        }


        currentUser = {

            id:
                "user_" + username,

            username:
                username,

            isGuest:false

        };


        localStorage.setItem(
            "browser_vc_user",
            JSON.stringify(
                currentUser
            )
        );


        showMain();

    }
);


/* =====================================================
   TEMPORARY ACCOUNT
===================================================== */

guestButton.addEventListener(
    "click",
    function(){

        const random =
            Math.random()
            .toString(36)
            .substring(2,8)
            .toUpperCase();


        currentUser = {

            id:
                "guest_" +
                crypto.randomUUID(),

            username:
                "Guest_" + random,

            isGuest:true

        };


        localStorage.setItem(
            "browser_vc_user",
            JSON.stringify(
                currentUser
            )
        );


        showMain();

    }
);


/* =====================================================
   MAIN
===================================================== */

function showMain(){

    authScreen.classList.add(
        "hidden"
    );

    mainScreen.classList.remove(
        "hidden"
    );


    displayUsername.textContent =
        currentUser.username;


    accountType.textContent =
        currentUser.isGuest
        ? "🟡 仮アカウント"
        : "🟢 通常アカウント";


    loadChat();

    loadFriends();

    updatePartyMembers();

}


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    function(){

        stopMicrophone();

        stopCamera();

        stopScreen();


        currentUser = null;

        partyId = null;


        localStorage.removeItem(
            "browser_vc_user"
        );


        mainScreen.classList.add(
            "hidden"
        );

        authScreen.classList.remove(
            "hidden"
        );


        usernameInput.value = "";

        passwordInput.value = "";

        chatMessages.innerHTML = "";

        showMessage("");

    }
);


/* =====================================================
   MICROPHONE
===================================================== */

async function startMicrophone(){

    try{

        microphoneStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


        micIcon.textContent =
            "🎙️";


        micStatus.textContent =
            "マイクON";


        micButton.textContent =
            "🎙️ マイクON";


    }catch(error){

        console.error(error);

        alert(
            "マイクを使用できません。"
        );

    }

}


function stopMicrophone(){

    if(microphoneStream){

        microphoneStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        microphoneStream = null;

    }


    micIcon.textContent =
        "🔇";


    micStatus.textContent =
        "マイクOFF";


    micButton.textContent =
        "🎙️ マイクON";

}


micButton.addEventListener(
    "click",
    async function(){

        if(microphoneStream){

            stopMicrophone();

        }else{

            await startMicrophone();

        }

    }
);


micStopButton.addEventListener(
    "click",
    stopMicrophone
);


/* =====================================================
   CAMERA
===================================================== */

cameraButton.addEventListener(
    "click",
    async function(){

        if(cameraStream){

            stopCamera();

            return;

        }


        try{

            cameraStream =
                await navigator.mediaDevices
                .getUserMedia({
                    video:true,
                    audio:false
                });


            cameraVideo.srcObject =
                cameraStream;


            cameraButton.textContent =
                "📷 カメラOFF";


        }catch(error){

            console.error(error);

            alert(
                "カメラを使用できません。"
            );

        }

    }
);


function stopCamera(){

    if(cameraStream){

        cameraStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        cameraStream = null;

    }


    cameraVideo.srcObject = null;

    cameraButton.textContent =
        "📷 カメラON";

}


cameraStopButton.addEventListener(
    "click",
    stopCamera
);


/* =====================================================
   SCREEN SHARE
===================================================== */

screenButton.addEventListener(
    "click",
    async function(){

        if(screenStream){

            stopScreen();

            return;

        }


        try{

            screenStream =
                await navigator.mediaDevices
                .getDisplayMedia({
                    video:true,
                    audio:true
                });


            screenVideo.srcObject =
                screenStream;


            screenButton.textContent =
                "🖥️ 画面共有中";


            const track =
                screenStream
                .getVideoTracks()[0];


            track.addEventListener(
                "ended",
                stopScreen
            );


        }catch(error){

            console.error(error);

        }

    }
);


function stopScreen(){

    if(screenStream){

        screenStream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

        screenStream = null;

    }


    screenVideo.srcObject = null;


    screenButton.textContent =
        "🖥️ 画面共有";

}


screenStopButton.addEventListener(
    "click",
    stopScreen
);


/* =====================================================
   CHAT
===================================================== */

function getChat(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "browser_vc_chat"
            ) || "[]"
        );

    }catch{

        return [];

    }

}


function saveChat(messages){

    localStorage.setItem(
        "browser_vc_chat",
        JSON.stringify(messages)
    );

}


function loadChat(){

    const messages =
        getChat();


    chatMessages.innerHTML = "";


    messages.forEach(
        addChatMessage
    );

}


function addChatMessage(data){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "chat-message";


    const name =
        document.createElement(
            "span"
        );


    name.className =
        "chat-name";


    name.textContent =
        data.username;


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "chat-time";


    time.textContent =
        data.time || "";


    const text =
        document.createElement(
            "div"
        );


    text.textContent =
        data.message;


    div.appendChild(name);

    div.appendChild(time);

    div.appendChild(text);


    chatMessages.appendChild(
        div
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;

}


function sendChat(){

    const text =
        chatInput.value.trim();


    if(!text)
        return;


    const messages =
        getChat();


    const data = {

        username:
            currentUser.username,

        message:
            text,

        time:
            new Date()
            .toLocaleTimeString(
                "ja-JP",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

    };


    messages.push(data);


    if(messages.length > 500){

        messages.shift();

    }


    saveChat(messages);


    addChatMessage(data);


    chatInput.value = "";

}


sendChatButton.addEventListener(
    "click",
    sendChat
);


chatInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendChat();

        }

    }
);


clearChatButton.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "チャット履歴を削除しますか？"
            )
        )
            return;


        localStorage.removeItem(
            "browser_vc_chat"
        );


        chatMessages.innerHTML = "";

    }
);


/* =====================================================
   FRIENDS
===================================================== */

function getFriends(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "browser_vc_friends"
            ) || "[]"
        );

    }catch{

        return [];

    }

}


function saveFriends(friends){

    localStorage.setItem(
        "browser_vc_friends",
        JSON.stringify(
            friends
        )
    );

}


function loadFriends(){

    const friends =
        getFriends();


    friendList.innerHTML = "";


    if(
        friends.length === 0
    ){

        friendList.innerHTML =
            '<p class="small">フレンドはいません。</p>';

        return;

    }


    friends.forEach(
        username=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            div.textContent =
                "👤 " + username;


            friendList.appendChild(
                div
            );

        }
    );

}


addFriendButton.addEventListener(
    "click",
    function(){

        const username =
            friendInput.value.trim();


        if(!username){

            alert(
                "ユーザー名を入力してください。"
            );

            return;

        }


        if(
            username ===
            currentUser.username
        ){

            alert(
                "自分自身は追加できません。"
            );

            return;

        }


        const friends =
            getFriends();


        if(
            friends.includes(username)
        ){

            alert(
                "既にフレンドです。"
            );

            return;

        }


        friends.push(username);


        saveFriends(friends);


        friendInput.value = "";


        loadFriends();

    }
);


/* =====================================================
   PARTY
===================================================== */

function getPartyData(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "browser_vc_party"
            ) || "null"
        );

    }catch{

        return null;

    }

}


function savePartyData(data){

    localStorage.setItem(
        "browser_vc_party",
        JSON.stringify(data)
    );

}


createPartyButton.addEventListener(
    "click",
    function(){

        const id =
            Math.random()
            .toString(36)
            .substring(2,10)
            .toUpperCase();


        partyId = id;


        savePartyData({

            id:id,

            host:
                currentUser.username,

            members:[
                currentUser.username
            ]

        });


        partyStatus.innerHTML =
            `
            <div>🎮 パーティー作成済み</div>
            <div class="party-id">
                ${id}
            </div>
            <div class="small">
                このIDを共有してください。
            </div>
            `;


        updatePartyMembers();

    }
);


joinPartyButton.addEventListener(
    "click",
    function(){

        const id =
            prompt(
                "パーティーIDを入力してください。"
            );


        if(!id)
            return;


        const data =
            getPartyData();


        if(
            !data ||
            data.id !==
            id.trim().toUpperCase()
        ){

            alert(
                "そのパーティーは見つかりません。"
            );

            return;

        }


        partyId =
            data.id;


        if(
            !data.members.includes(
                currentUser.username
            )
        ){

            data.members.push(
                currentUser.username
            );

        }


        savePartyData(data);


        partyStatus.innerHTML =
            `
            <div>🎮 パーティー参加中</div>
            <div class="party-id">
                ${partyId}
            </div>
            `;


        updatePartyMembers();

    }
);


function updatePartyMembers(){

    partyMemberList.innerHTML = "";


    const data =
        getPartyData();


    if(
        !data ||
        !partyId ||
        data.id !== partyId
    )
        return;


    data.members.forEach(
        username=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            div.textContent =
                "🟢 " + username;


            partyMemberList.appendChild(
                div
            );

        }
    );

}


leavePartyButton.addEventListener(
    "click",
    function(){

        const data =
            getPartyData();


        if(data && partyId){

            data.members =
                data.members.filter(
                    username =>
                        username !==
                        currentUser.username
                );


            if(
                data.members.length === 0
            ){

                localStorage.removeItem(
                    "browser_vc_party"
                );

            }else{

                savePartyData(data);

            }

        }


        partyId = null;


        partyStatus.textContent =
            "パーティーに参加していません。";


        partyMemberList.innerHTML = "";

    }
);


/* =====================================================
   EXPORT
===================================================== */

exportButton.addEventListener(
    "click",
    function(){

        const data = {

            accounts:
                getAccounts(),

            chat:
                getChat(),

            friends:
                getFriends(),

            exportedAt:
                new Date().toISOString()

        };


        const blob =
            new Blob(
                [
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                ],
                {
                    type:"application/json"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        a.href = url;

        a.download =
            "browser-vc-data.json";


        a.click();


        URL.revokeObjectURL(url);

    }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
    "click",
    function(){

        if(
            !confirm(
                "このブラウザに保存されている全データを削除しますか？"
            )
        )
            return;


        localStorage.removeItem(
            "browser_vc_accounts"
        );

        localStorage.removeItem(
            "browser_vc_user"
        );

        localStorage.removeItem(
            "browser_vc_chat"
        );

        localStorage.removeItem(
            "browser_vc_friends"
        );

        localStorage.removeItem(
            "browser_vc_party"
        );


        stopMicrophone();

        stopCamera();

        stopScreen();


        location.reload();

    }
);


/* =====================================================
   RESTORE
===================================================== */

function restore(){

    const saved =
        localStorage.getItem(
            "browser_vc_user"
        );


    if(!saved)
        return;


    try{

        currentUser =
            JSON.parse(saved);


        if(
            currentUser &&
            currentUser.username
        ){

            showMain();

        }

    }catch{

        localStorage.removeItem(
            "browser_vc_user"
        );

    }

}


restore();

</script>

</body>
</html>
