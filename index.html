<input
  id="usernameInput"
  maxlength="30"
  placeholder="ユーザー名"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
  アカウント作成
</button>

<button onclick="signIn()">
  ログイン
</button>

<button
  class="gray"
  onclick="createGuest()"
>
  👻 仮アカウント
</button>

<button
  id="logoutButton"
  class="red"
  onclick="signOut()"
  style="display:none"
>
  ログアウト
</button>


<!-- アカウント設定 -->

<div id="settingsCard" style="display:none;">

  <input
    id="newUsername"
    maxlength="30"
    placeholder="新しいユーザー名"
  >

  <input
    id="newPassword"
    type="password"
    placeholder="新しいパスワード"
  >

  <button onclick="changeUsername()">
    ユーザー名変更
  </button>

  <button onclick="changePassword()">
    パスワード変更
  </button>

</div>


<!-- マイク -->

<button
  id="micButton"
  onclick="toggleMic()"
>
  🎤 マイクON
</button>


<!-- カメラ -->

<button
  id="cameraButton"
  class="green"
  onclick="toggleCamera()"
>
  📷 カメラON
</button>


<!-- 画面共有 -->

<button
  id="screenButton"
  class="gray"
  onclick="toggleScreenShare()"
>
  🖥️ 画面共有
</button>


<!-- 離席 -->

<button
  id="awayButton"
  class="yellow"
  onclick="toggleAway()"
  style="display:none"
>
  🟡 離席
</button>


<!-- カメラ映像 -->

<video
  id="cameraVideo"
  autoplay
  muted
  playsinline
></video>


<!-- 画面共有映像 -->

<video
  id="screenVideo"
  autoplay
  muted
  playsinline
></video>


<!-- フレンド検索 -->

<input
  id="friendSearch"
  placeholder="🔍 プレイヤーを検索"
>

<button onclick="searchFriend()">
  🔍 検索
</button>


<!-- DM -->

<div id="dmCard" style="display:none;">

  <h3>
    💬 <span id="dmFriendName"></span>
  </h3>

  <div
    id="dmMessages"
    style="
      background:#111827;
      border-radius:10px;
      padding:10px;
      min-height:150px;
      max-height:300px;
      overflow-y:auto;
    "
  ></div>

  <input
    id="dmInput"
    placeholder="メッセージを入力"
    onkeydown="if(event.key==='Enter')sendDM()"
  >

  <button onclick="sendDM()">
    送信
  </button>

  <button
    class="gray"
    onclick="closeDM()"
  >
    DMを閉じる
  </button>

</div>


<!-- パーティー -->

<button
  class="green"
  onclick="createParty()"
>
  ＋ パーティー作成
</button>
