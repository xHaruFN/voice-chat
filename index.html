```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Chat</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      height: 64px;
      background: #1f2937;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 6px 4px 6px 0;
      font-size: 16px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #dc2626;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #374151;
      padding: 15px;
      border-radius: 12px;
    }

    .avatar {
      width: 50px;
      height: 50px;
      background: #4f46e5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    #status {
      margin-top: 15px;
      color: #9ca3af;
    }

    #accountStatus {
      color: #9ca3af;
    }
  </style>
</head>

<body>

<header>
  🎙️ Voice Chat
</header>

<main>

  <!-- アカウント -->
  <div class="card" id="accountCard">
    <h2>👤 アカウント</h2>

    <input
      id="email"
      type="email"
      placeholder="メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button onclick="signUp()">
      アカウント作成
    </button>

    <button onclick="signIn()">
      ログイン
    </button>

    <button onclick="createGuest()">
      👻 仮アカウント
    </button>

    <button
      class="logout"
      onclick="signOut()"
    >
      ログアウト
    </button>

    <p id="accountStatus">
      ログインしていません
    </p>
  </div>


  <!-- 自分 -->
  <div class="card">

    <h2>自分</h2>

    <div class="user">

      <div class="avatar">
        👤
      </div>

      <div>

        <strong id="username">
          未ログイン
        </strong>

        <div id="onlineStatus">
          ⚪ オフライン
        </div>

      </div>

    </div>

    <br>

    <button
      id="micButton"
      onclick="toggleMic()"
    >
      🎤 マイクON
    </button>

    <div id="status">
      マイクをONにするとここに状態が表示されます。
    </div>

  </div>


  <!-- フレンド -->
  <div class="card">

    <h2>👥 フレンド</h2>

    <p>
      フレンド機能は次の段階で追加します。
    </p>

    <button onclick="addFriend()">
      ＋ フレンド追加
    </button>

  </div>


  <!-- パーティー -->
  <div class="card">

    <h2>🎉 パーティー</h2>

    <p>
      パーティーを作成してフレンドと遊ぼう！
    </p>

    <button onclick="createParty()">
      ＋ パーティー作成
    </button>

  </div>

</main>


<script>

  // ==========================================
  // Supabase設定
  // ==========================================

  const SUPABASE_URL =
    "https://znzwsbumfqderjoehrwd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_HbZtKu-et14XUIGwIegw0g_ltLcrBhl";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // アカウント作成
  // ==========================================

  async function signUp() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "アカウント作成エラー: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "accountStatus"
    ).textContent =
      "✅ アカウントを作成しました";

    alert(
      "アカウントを作成しました！"
    );
  }


  // ==========================================
  // ログイン
  // ==========================================

  async function signIn() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      alert(
        "メールアドレスとパスワードを入力してください。"
      );

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      alert(
        "ログインエラー: " +
        error.message
      );

      return;
    }

    updateUserUI(data.user);
  }


  // ==========================================
  // ログアウト
  // ==========================================

  async function signOut() {

    const {
      error
    } =
      await supabaseClient.auth.signOut();

    if (error) {

      alert(
        "ログアウトに失敗しました: " +
        error.message
      );

      return;
    }

    document.getElementById(
      "username"
    ).textContent =
      "未ログイン";

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "⚪ オフライン";

    document.getElementById(
      "accountStatus"
    ).textContent =
      "ログアウトしました";
  }


  // ==========================================
  // 仮アカウント
  // ==========================================

  function createGuest() {

    const guestName =
      "Guest_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    document.getElementById(
      "username"
    ).textContent =
      guestName;

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent =
      "👻 仮アカウント: " +
      guestName;

    alert(
      "仮アカウントを作成しました！\n\n" +
      guestName
    );
  }


  // ==========================================
  // ユーザー表示
  // ==========================================

  function updateUserUI(user) {

    if (!user) {
      return;
    }

    document.getElementById(
      "username"
    ).textContent =
      user.email;

    document.getElementById(
      "onlineStatus"
    ).textContent =
      "🟢 オンライン";

    document.getElementById(
      "accountStatus"
    ).textContent =
      "✅ ログイン中";
  }


  // ==========================================
  // ログイン状態確認
  // ==========================================

  async function checkUser() {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();

    if (user) {
      updateUserUI(user);
    }
  }

  checkUser();


  // ==========================================
  // マイク
  // ==========================================

  let microphone = null;
  let micEnabled = false;


  async function toggleMic() {

    if (!micEnabled) {

      try {

        microphone =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });

        micEnabled = true;

        document.getElementById(
          "micButton"
        ).textContent =
          "🔇 マイクOFF";

        document.getElementById(
          "status"
        ).textContent =
          "🎤 マイクON";

      } catch (error) {

        alert(
          "マイクへのアクセスが許可されませんでした。"
        );

      }

    } else {

      microphone
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      microphone = null;
      micEnabled = false;

      document.getElementById(
        "micButton"
      ).textContent =
        "🎤 マイクON";

      document.getElementById(
        "status"
      ).textContent =
        "🔇 マイクOFF";
    }
  }


  // ==========================================
  // フレンド
  // ==========================================

  function addFriend() {

    alert(
      "フレンド機能は次の段階で追加します！"
    );
  }


  // ==========================================
  // パーティー
  // ==========================================

  function createParty() {

    alert(
      "パーティー作成機能は次の段階で追加します！"
    );
  }

</script>

</body>
</html>
```
