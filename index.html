<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white
}

header{
  height:64px;
  background:#1f2937;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-size:22px;
  font-weight:bold
}

main{
  max-width:1000px;
  margin:30px auto;
  padding:20px
}

.card{
  background:#1f2937;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px
}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:0;
  border-radius:10px;
  font-size:16px
}

button{
  border:0;
  border-radius:10px;
  padding:11px 17px;
  margin:5px 4px 5px 0;
  font-size:15px;
  cursor:pointer;
  background:#4f46e5;
  color:white
}

button:hover{opacity:.88}
.green{background:#22c55e}
.red{background:#dc2626}
.gray{background:#4b5563}

.user{
  display:flex;
  align-items:center;
  gap:15px;
  background:#374151;
  padding:15px;
  border-radius:12px
}

.avatar{
  width:50px;
  height:50px;
  background:#4f46e5;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px
}

.status{
  color:#9ca3af;
  margin-top:10px
}

#settingsCard,
#friendCard,
#partyCard,
#roomCard{
  display:none
}

.friend{
  display:flex;
  align-items:center;
  gap:12px;
  background:#374151;
  padding:12px;
  margin:8px 0;
  border-radius:10px
}

.friendAvatar{
  width:45px;
  height:45px;
  background:#4f46e5;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center
}

.friendInfo{flex:1}
.online{color:#22c55e;font-size:13px}
.offline{color:#9ca3af;font-size:13px}

.request,.partyBox{
  background:#374151;
  padding:14px;
  margin:8px 0;
  border-radius:10px
}

.empty{
  color:#9ca3af;
  padding:12px 0
}

.roomHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

.roomName{
  font-size:24px;
  font-weight:bold
}

.participants{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:15px
}

.videoBox{
  background:#0b1220;
  border-radius:12px;
  padding:8px;
  min-height:170px
}

.videoBox video{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#000;
  border-radius:8px
}

.videoName{
  padding:6px;
  font-weight:bold
}

.controls{margin-top:10px}

.chat{
  background:#111827;
  border-radius:12px;
  padding:12px;
  margin-top:15px
}

.chatMessages{
  height:220px;
  overflow-y:auto;
  background:#0b1220;
  padding:10px;
  border-radius:8px
}

.chatMessage{
  margin:7px 0;
  padding:8px 10px;
  background:#374151;
  border-radius:8px
}

.chatInput{
  display:flex;
  gap:8px;
  margin-top:8px
}

.chatInput input{
  margin:0
}

.roomUsers{
  margin-top:15px;
  background:#374151;
  padding:12px;
  border-radius:10px
}

.error{color:#f87171}
.success{color:#4ade80}

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  background:#4f46e5;
  font-size:12px;
  margin-left:5px
}
</style>
</head>

<body>

<header>
🎙️ Voice Chat
</header>

<main>

<!-- =========================
     アカウント
========================= -->

<div class="card">

<h2>👤 アカウント</h2>

<input
  id="email"
  type="email"
  placeholder="メールアドレス"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button
  class="gray"
  onclick="createGuest()"
>
👻 仮アカウント作成
</button>

<button
  id="logoutButton"
  class="red"
  onclick="signOut()"
  style="display:none"
>
ログアウト
</button>

<p id="accountStatus">
ログインしていません
</p>

</div>


<!-- =========================
     設定
========================= -->

<div class="card" id="settingsCard">

<h2>⚙️ アカウント設定</h2>

<h3>👤 名前変更</h3>

<input
  id="newUsername"
  maxlength="30"
  placeholder="新しい名前"
>

<button onclick="changeUsername()">
名前を変更
</button>

<h3>📧 メールアドレス変更</h3>

<input
  id="newEmail"
  type="email"
  placeholder="新しいメールアドレス"
>

<button onclick="changeEmail()">
メールアドレス変更
</button>

<h3>🔑 パスワード変更</h3>

<input
  id="newPassword"
  type="password"
  placeholder="新しいパスワード"
>

<button onclick="changePassword()">
パスワード変更
</button>

<p id="settingsStatus" class="status"></p>

</div>


<!-- =========================
     自分
========================= -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">👤</div>

<div>

<strong id="username">
未ログイン
</strong>

<div id="onlineStatus">
⚪ オフライン
</div>

</div>

</div>

<div class="controls">

<button
  id="micButton"
  onclick="toggleMic()"
>
🎤 マイクON
</button>

<button
  id="cameraButton"
  onclick="toggleCamera()"
>
📷 カメラON
</button>

<button
  id="screenButton"
  onclick="toggleScreen()"
>
🖥️ 画面共有
</button>

</div>

<div id="status" class="status">
部屋に参加すると音声・カメラ・画面共有を利用できます。
</div>

</div>


<!-- =========================
     部屋
========================= -->

<div class="card" id="roomCard">

<h2>🏠 部屋</h2>

<input
  id="roomNameInput"
  maxlength="50"
  placeholder="部屋名を入力"
>

<button
  class="green"
  onclick="joinRoom()"
>
🚪 部屋に入る
</button>

<button
  class="red"
  onclick="leaveRoom()"
>
退出
</button>

<div
  id="currentRoom"
  class="roomHeader"
  style="margin-top:15px"
>
<span class="roomName">
未参加
</span>
</div>

<div
  id="participants"
  class="participants"
></div>

<div class="roomUsers">

<strong>👥 部屋の参加者</strong>

<div id="roomUserList">
部屋に参加していません。
</div>

</div>

<div class="chat">

<h3>💬 部屋チャット</h3>

<div
  id="chatMessages"
  class="chatMessages"
></div>

<div class="chatInput">

<input
  id="chatInput"
  maxlength="500"
  placeholder="メッセージを入力"
  onkeydown="if(event.key==='Enter')sendChat()"
>

<button onclick="sendChat()">
送信
</button>

</div>

</div>

</div>


<!-- =========================
     フレンド
========================= -->

<div class="card" id="friendCard">

<h2>👥 フレンド</h2>

<input
  id="friendSearch"
  placeholder="🔍 プレイヤーを検索"
>

<button onclick="searchFriend()">
検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
<div class="empty">
フレンドはいません。
</div>
</div>

<h3>📨 フレンド申請</h3>

<div id="requestList">
<div class="empty">
フレンド申請はありません。
</div>
</div>

</div>


<!-- =========================
     パーティー
========================= -->

<div class="card" id="partyCard">

<h2>🎉 パーティー</h2>

<button
  class="green"
  onclick="createParty()"
>
＋ パーティー作成
</button>

<div id="partyArea">
<div class="empty">
パーティーに参加していません。
</div>
</div>

</div>

</main>


<script>

/* =====================================
   Supabase
===================================== */

const SUPABASE_URL =
"https://znzwsbumfqderjoehrwd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HbZtKu-et14XUIGwIegw0g_ltLcrBhl";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   状態
===================================== */

let currentUser = null;
let guestMode = false;

let microphone = null;
let cameraStream = null;
let screenStream = null;

let micEnabled = false;
let cameraEnabled = false;
let screenEnabled = false;

let roomChannel = null;
let currentRoomName = null;

let peerConnections = {};
let remoteStreams = {};
let roomMembers = {};


/* =====================================
   ID
===================================== */

function getClientId(){

  if(currentUser?.id){
    return currentUser.id;
  }

  return "client_" +
    crypto.randomUUID();

}


/* =====================================
   現在の名前
===================================== */

function getCurrentName(){

  return document.getElementById(
    "username"
  ).textContent;

}


/* =====================================
   UI
===================================== */

function setLoggedInUI(name){

  document.getElementById(
    "username"
  ).textContent = name;

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "🟢 オンライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    guestMode
      ? "👻 仮アカウント: " + name
      : "✅ ログイン中";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "inline-block";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "block";

  document.getElementById(
    "friendCard"
  ).style.display =
    "block";

  document.getElementById(
    "partyCard"
  ).style.display =
    "block";

  document.getElementById(
    "roomCard"
  ).style.display =
    "block";

}


function setLoggedOutUI(){

  document.getElementById(
    "username"
  ).textContent =
    "未ログイン";

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "⚪ オフライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    "ログインしていません";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "none";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "none";

  document.getElementById(
    "friendCard"
  ).style.display =
    "none";

  document.getElementById(
    "partyCard"
  ).style.display =
    "none";

  document.getElementById(
    "roomCard"
  ).style.display =
    "none";

}


/* =====================================
   アカウント作成
===================================== */

async function signUp(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(!email || !password){

    alert(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email,
        password
      });

    if(error){

      alert(
        "アカウント作成エラー:\n" +
        error.message
      );

      return;
    }

    if(data.session && data.user){

      currentUser = data.user;
      guestMode = false;

      await createProfile();
      await showUser();

      alert(
        "アカウントを作成してログインしました！"
      );

      return;
    }

    if(data.user){

      alert(
        "アカウントを作成しました。\n" +
        "確認メールが必要な設定の場合は、メールを確認してください。"
      );

    }

  }catch(error){

    alert(
      "通信エラー:\n" +
      error.message
    );

  }

}


/* =====================================
   プロフィール
===================================== */

async function createProfile(){

  if(!currentUser){
    return;
  }

  let defaultName;

  if(guestMode){

    defaultName =
      sessionStorage.getItem(
        "voicechat_guest_name"
      ) ||
      "Guest_" +
      Math.floor(
        100000 +
        Math.random() * 900000
      );

  }else{

    defaultName =
      currentUser.email?.split("@")[0] ||
      "User";

  }

  const {
    data
  } =
    await supabaseClient
      .from("profiles")
      .select("username")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if(!data){

    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        username:defaultName,
        online:true,
        status:"online"
      });

  }

}


/* =====================================
   ログイン
===================================== */

async function signIn(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(!email || !password){

    alert(
      "メールアドレスとパスワードを入力してください。"
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({
          email,
          password
        });

    if(error){

      alert(
        "ログインエラー:\n" +
        error.message
      );

      return;
    }

    currentUser = data.user;
    guestMode = false;

    await createProfile();
    await showUser();

  }catch(error){

    alert(
      "ログイン通信エラー:\n" +
      error.message
    );

  }

}


/* =====================================
   ユーザー表示
===================================== */

async function showUser(){

  if(!currentUser){
    return;
  }

  const {
    data
  } =
    await supabaseClient
      .from("profiles")
      .select("username")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  let name =
    data?.username ||
    currentUser.email ||
    "User";

  setLoggedInUI(name);

  await loadFriends();
  await loadFriendRequests();

}


/* =====================================
   仮アカウント
===================================== */

async function createGuest(){

  if(currentUser){

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const inputName =
    prompt(
      "仮アカウントのユーザー名を入力してください。"
    );

  if(inputName === null){
    return;
  }

  const name =
    inputName.trim();

  if(!name){

    alert(
      "ユーザー名を入力してください。"
    );

    return;
  }

  if(name.length > 30){

    alert(
      "ユーザー名は30文字以内です。"
    );

    return;
  }

  try{

    /*
      Supabase匿名認証
    */

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInAnonymously();

    if(error){

      alert(
        "仮アカウント作成エラー:\n" +
        error.message
      );

      return;
    }

    currentUser = data.user;
    guestMode = true;

    /*
      sessionStorageなので
      タブを閉じると名前が消える
    */

    sessionStorage.setItem(
      "voicechat_guest_name",
      name
    );

    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        username:name,
        online:true,
        status:"online"
      });

    setLoggedInUI(name);

    document.getElementById(
      "accountStatus"
    ).textContent =
      "👻 仮アカウント: " + name;

    alert(
      "仮アカウントを作成しました！"
    );

  }catch(error){

    alert(
      "仮アカウント作成エラー:\n" +
      error.message
    );

  }

}


/* =====================================
   名前変更
===================================== */

async function changeUsername(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const input =
    document.getElementById(
      "newUsername"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "新しい名前を入力してください。"
    );

    return;
  }

  if(name.length > 30){

    alert(
      "名前は30文字以内です。"
    );

    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("profiles")
      .upsert({
        id:currentUser.id,
        username:name,
        online:true,
        status:"online"
      });

  if(error){

    alert(
      "名前変更エラー:\n" +
      error.message
    );

    return;
  }

  if(guestMode){

    sessionStorage.setItem(
      "voicechat_guest_name",
      name
    );

  }

  document.getElementById(
    "username"
  ).textContent = name;

  document.getElementById(
    "accountStatus"
  ).textContent =
    guestMode
      ? "👻 仮アカウント: " + name
      : "✅ ログイン中";

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ 名前を変更しました。";

  input.value = "";

  if(currentRoomName){

    await roomChannel.track({
      id:getClientId(),
      name:getCurrentName()
    });

    sendRoomHello();

  }

}


/* =====================================
   メール変更
===================================== */

async function changeEmail(){

  if(guestMode){

    alert(
      "仮アカウントではメールアドレスを変更できません。"
    );

    return;
  }

  const email =
    document.getElementById(
      "newEmail"
    ).value.trim();

  if(!email){
    return;
  }

  const {
    error
  } =
    await supabaseClient.auth
      .updateUser({
        email
      });

  if(error){

    alert(
      "メールアドレス変更エラー:\n" +
      error.message
    );

    return;
  }

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ メールアドレス変更を受け付けました。";

  document.getElementById(
    "newEmail"
  ).value = "";

}


/* =====================================
   パスワード変更
===================================== */

async function changePassword(){

  if(guestMode){

    alert(
      "仮アカウントではパスワード変更できません。"
    );

    return;
  }

  const password =
    document.getElementById(
      "newPassword"
    ).value;

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  const {
    error
  } =
    await supabaseClient.auth
      .updateUser({
        password
      });

  if(error){

    alert(
      "パスワード変更エラー:\n" +
      error.message
    );

    return;
  }

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ パスワードを変更しました。";

  document.getElementById(
    "newPassword"
  ).value = "";

}


/* =====================================
   ログアウト
===================================== */

async function signOut(){

  await leaveRoom();

  stopAllMedia();

  await supabaseClient.auth.signOut();

  currentUser = null;
  guestMode = false;

  sessionStorage.removeItem(
    "voicechat_guest_name"
  );

  setLoggedOutUI();

}


/* =====================================
   マイク
===================================== */

async function toggleMic(){

  if(!micEnabled){

    try{

      if(!microphone){

        microphone =
          await navigator.mediaDevices
            .getUserMedia({
              audio:true
            });

      }

      micEnabled = true;

      setAudioTracksEnabled(true);

      document.getElementById(
        "micButton"
      ).textContent =
        "🔇 マイクOFF";

      updatePeerTracks();

    }catch(error){

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );

    }

  }else{

    micEnabled = false;

    setAudioTracksEnabled(false);

    document.getElementById(
      "micButton"
    ).textContent =
      "🎤 マイクON";

    updatePeerTracks();

  }

}


function setAudioTracksEnabled(enabled){

  if(!microphone){
    return;
  }

  microphone
    .getAudioTracks()
    .forEach(
      track => {
        track.enabled = enabled;
      }
    );

}


/* =====================================
   カメラ
===================================== */

async function toggleCamera(){

  if(!cameraEnabled){

    try{

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video:true
          });

      cameraEnabled = true;

      document.getElementById(
        "cameraButton"
      ).textContent =
        "📷 カメラOFF";

      addLocalVideo(
        cameraStream,
        "📷 自分"
      );

      updatePeerTracks();

    }catch(error){

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );

    }

  }else{

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      cameraStream = null;

    }

    cameraEnabled = false;

    document.getElementById(
      "cameraButton"
    ).textContent =
      "📷 カメラON";

    if(screenStream){

      addLocalVideo(
        screenStream,
        "🖥️ 画面共有"
      );

    }else{

      removeLocalVideo();

    }

    updatePeerTracks();

  }

}


/* =====================================
   画面共有
===================================== */

async function toggleScreen(){

  if(!screenEnabled){

    try{

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video:true,
            audio:true
          });

      screenEnabled = true;

      document.getElementById(
        "screenButton"
      ).textContent =
        "⛶ 画面共有OFF";

      addLocalVideo(
        screenStream,
        "🖥️ 画面共有"
      );

      const track =
        screenStream
          .getVideoTracks()[0];

      if(track){

        track.addEventListener(
          "ended",
          stopScreenShare
        );

      }

      updatePeerTracks();

    }catch(error){

      console.log(
        "画面共有キャンセル",
        error
      );

    }

  }else{

    stopScreenShare();

  }

}


function stopScreenShare(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    screenStream = null;

  }

  screenEnabled = false;

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";

  if(cameraStream){

    addLocalVideo(
      cameraStream,
      "📷 自分"
    );

  }else{

    removeLocalVideo();

  }

  updatePeerTracks();

}

/* =====================================
   WebRTC
===================================== */

function createPeerConnection(peerId){

  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]

    });

  peerConnections[peerId] = pc;


  /*
    音声
  */

  if(microphone){

    microphone
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            microphone
          );

        }
      );

  }


  /*
    カメラ
  */

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            cameraStream
          );

        }
      );

  }


  /*
    画面共有
  */

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track => {

          pc.addTrack(
            track,
            screenStream
          );

        }
      );

  }


  /*
    ICE
  */

  pc.onicecandidate =
    event => {

      if(
        event.candidate &&
        roomChannel
      ){

        roomChannel.send({

          type:"broadcast",

          event:"ice",

          payload:{
            from:getClientId(),
            to:peerId,
            candidate:event.candidate
          }

        });

      }

    };


  /*
    相手の音声・映像
  */

  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if(!stream){
        return;
      }

      remoteStreams[peerId] =
        stream;

      addRemoteVideo(
        peerId,
        stream
      );

    };


  pc.onconnectionstatechange =
    () => {

      if(
        pc.connectionState === "failed" ||
        pc.connectionState === "closed" ||
        pc.connectionState === "disconnected"
      ){

        removePeer(peerId);

      }

    };


  return pc;

}


/* =====================================
   Offer
===================================== */

async function createOffer(peerId){

  let pc =
    peerConnections[peerId];

  if(!pc){

    pc =
      createPeerConnection(peerId);

  }

  const offer =
    await pc.createOffer();

  await pc.setLocalDescription(
    offer
  );

  await roomChannel.send({

    type:"broadcast",

    event:"offer",

    payload:{
      from:getClientId(),
      to:peerId,
      offer
    }

  });

}


/* =====================================
   Offer受信
===================================== */

async function handleOffer(payload){

  if(
    payload.to !== getClientId()
  ){
    return;
  }

  const peerId =
    payload.from;

  let pc =
    peerConnections[peerId];

  if(!pc){

    pc =
      createPeerConnection(peerId);

  }

  await pc.setRemoteDescription(
    payload.offer
  );

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  await roomChannel.send({

    type:"broadcast",

    event:"answer",

    payload:{
      from:getClientId(),
      to:peerId,
      answer
    }

  });

}


/* =====================================
   Answer
===================================== */

async function handleAnswer(payload){

  if(
    payload.to !== getClientId()
  ){
    return;
  }

  const pc =
    peerConnections[
      payload.from
    ];

  if(!pc){
    return;
  }

  await pc.setRemoteDescription(
    payload.answer
  );

}


/* =====================================
   ICE
===================================== */

async function handleIce(payload){

  if(
    payload.to !== getClientId()
  ){
    return;
  }

  const pc =
    peerConnections[
      payload.from
    ];

  if(!pc){
    return;
  }

  try{

    await pc.addIceCandidate(
      payload.candidate
    );

  }catch(error){

    console.warn(
      "ICE error",
      error
    );

  }

}


/* =====================================
   部屋参加
===================================== */

async function joinRoom(){

  if(!currentUser){

    alert(
      "先にログインしてください。"
    );

    return;
  }

  const name =
    document.getElementById(
      "roomNameInput"
    ).value.trim();

  if(!name){

    alert(
      "部屋名を入力してください。"
    );

    return;
  }

  await leaveRoom();

  currentRoomName = name;

  const channelName =
    "voice-room-" +
    encodeURIComponent(name);

  roomChannel =
    supabaseClient.channel(
      channelName,
      {
        config:{
          broadcast:{
            self:false
          },
          presence:{
            key:getClientId()
          }
        }
      }
    );


  /*
    HELLO
  */

  roomChannel.on(
    "broadcast",
    {event:"hello"},
    async ({payload}) => {

      if(
        payload.from ===
        getClientId()
      ){
        return;
      }

      roomMembers[
        payload.from
      ] = {
        id:payload.from,
        name:payload.name
      };

      updateRoomUserList();


      /*
        ID順でOffer側を決定
      */

      if(
        String(getClientId()) <
        String(payload.from)
      ){

        await createOffer(
          payload.from
        );

      }

    }
  );


  /*
    Offer
  */

  roomChannel.on(
    "broadcast",
    {event:"offer"},
    ({payload}) => {

      handleOffer(payload);

    }
  );


  /*
    Answer
  */

  roomChannel.on(
    "broadcast",
    {event:"answer"},
    ({payload}) => {

      handleAnswer(payload);

    }
  );


  /*
    ICE
  */

  roomChannel.on(
    "broadcast",
    {event:"ice"},
    ({payload}) => {

      handleIce(payload);

    }
  );


  /*
    チャット
  */

  roomChannel.on(
    "broadcast",
    {event:"chat"},
    ({payload}) => {

      addChatMessage(
        payload.name,
        payload.message
      );

    }
  );


  /*
    退出
  */

  roomChannel.on(
    "broadcast",
    {event:"user-left"},
    ({payload}) => {

      removePeer(
        payload.id
      );

      delete roomMembers[
        payload.id
      ];

      updateRoomUserList();

    }
  );


  /*
    Presence同期
  */

  roomChannel.on(
    "presence",
    {event:"sync"},
    () => {

      const state =
        roomChannel.presenceState();

      roomMembers = {};

      Object.keys(state)
        .forEach(key => {

          const entries =
            state[key];

          if(
            entries &&
            entries.length
          ){

            roomMembers[key] =
              entries[0];

          }

        });

      updateRoomUserList();

    }
  );


  /*
    Presence参加
  */

  roomChannel.on(
    "presence",
    {event:"join"},
    ({key,newPresences}) => {

      newPresences.forEach(
        presence => {

          if(
            key !== getClientId()
          ){

            roomMembers[key] =
              presence;

          }

        }
      );

      updateRoomUserList();

    }
  );


  /*
    Presence退出
  */

  roomChannel.on(
    "presence",
    {event:"leave"},
    ({key}) => {

      removePeer(key);

      delete roomMembers[key];

      updateRoomUserList();

    }
  );


  /*
    接続
  */

  await roomChannel.subscribe(
    async status => {

      if(
        status !== "SUBSCRIBED"
      ){
        return;
      }

      await roomChannel.track({

        id:getClientId(),

        name:getCurrentName()

      });

      sendRoomHello();

      document.getElementById(
        "currentRoom"
      ).innerHTML =
      `
        <span class="roomName">
          🟢 ${escapeHTML(name)}
        </span>
      `;

      document.getElementById(
        "status"
      ).textContent =
        "🟢 「" +
        name +
        "」に参加中";

      addChatMessage(
        "SYSTEM",
        "「" +
        name +
        "」に参加しました。"
      );

    }
  );

}


function sendRoomHello(){

  if(!roomChannel){
    return;
  }

  roomChannel.send({

    type:"broadcast",

    event:"hello",

    payload:{
      from:getClientId(),
      name:getCurrentName()
    }

  });

}


/* =====================================
   部屋退出
===================================== */

async function leaveRoom(){

  if(!roomChannel){

    currentRoomName = null;
    return;

  }

  try{

    await roomChannel.send({

      type:"broadcast",

      event:"user-left",

      payload:{
        id:getClientId()
      }

    });

  }catch{}


  Object.keys(peerConnections)
    .forEach(peerId => {

      try{
        peerConnections[
          peerId
        ].close();
      }catch{}

    });

  peerConnections = {};
  remoteStreams = {};
  roomMembers = {};


  try{
    await roomChannel.untrack();
  }catch{}


  try{
    await supabaseClient
      .removeChannel(
        roomChannel
      );
  }catch{}


  roomChannel = null;
  currentRoomName = null;

  document.getElementById(
    "participants"
  ).innerHTML = "";

  document.getElementById(
    "roomUserList"
  ).textContent =
    "部屋に参加していません。";

  document.getElementById(
    "currentRoom"
  ).innerHTML =
  `
    <span class="roomName">
      未参加
    </span>
  `;

}


/* =====================================
   Peer削除
===================================== */

function removePeer(peerId){

  const pc =
    peerConnections[peerId];

  if(pc){

    try{
      pc.close();
    }catch{}

  }

  delete peerConnections[peerId];
  delete remoteStreams[peerId];

  const box =
    document.getElementById(
      "remote-" + peerId
    );

  if(box){
    box.remove();
  }

}


/* =====================================
   トラック更新
===================================== */

function updatePeerTracks(){

  Object.keys(peerConnections)
    .forEach(async peerId => {

      const pc =
        peerConnections[peerId];

      if(!pc){
        return;
      }


      /*
        映像
      */

      const videoTrack =
        screenStream
          ?.getVideoTracks()[0] ||
        cameraStream
          ?.getVideoTracks()[0];

      const videoSender =
        pc.getSenders()
          .find(
            sender =>
              sender.track &&
              sender.track.kind ===
              "video"
          );

      if(videoSender){

        await videoSender.replaceTrack(
          videoTrack || null
        );

      }


      /*
        音声
      */

      const audioTrack =
        microphone
          ?.getAudioTracks()[0];

      const audioSender =
        pc.getSenders()
          .find(
            sender =>
              sender.track &&
              sender.track.kind ===
              "audio"
          );

      if(audioSender){

        await audioSender.replaceTrack(
          audioTrack || null
        );

      }

    });

}

      .substring(2,8)
      .toUpperCase();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("parties")
      .insert({
        owner_id:currentUser.id,
        party_code:code
      })
      .select()
      .single();

  if(error){

    alert(
      "パーティー作成エラー:\n" +
      error.message
    );

    return;
  }

  document.getElementById(
    "partyArea"
  ).innerHTML =
  `
    <div class="partyBox">

      <h3>
        🎉 パーティー作成済み
      </h3>

      <p>
        パーティーコード
      </p>

      <strong style="font-size:24px">
        ${escapeHTML(data.party_code)}
      </strong>

      <br>

      <button
        class="red"
        onclick="leaveParty('${data.id}')"
      >
        パーティーを解散
      </button>

    </div>
  `;

}


/* =====================================
   パーティー解散
===================================== */

async function leaveParty(
  partyId
){

  if(!currentUser){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("parties")
      .delete()
      .eq(
        "id",
        partyId
      )
      .eq(
        "owner_id",
        currentUser.id
      );

  if(error){

    alert(
      "パーティーを解散できませんでした。"
    );

    return;
  }

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';

}


/* =====================================
   メディア停止
===================================== */

function stopAllMedia(){

  if(microphone){

    microphone
      .getTracks()
      .forEach(
        track => track.stop()
      );

    microphone = null;

  }

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    cameraStream = null;

  }

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    screenStream = null;

  }

  micEnabled = false;
  cameraEnabled = false;
  screenEnabled = false;

  document.getElementById(
    "micButton"
  ).textContent =
    "🎤 マイクON";

  document.getElementById(
    "cameraButton"
  ).textContent =
    "📷 カメラON";

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";

}


/* =====================================
   HTMLエスケープ
===================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================
   ログイン状態確認
===================================== */

async function checkUser(){

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient.auth
        .getSession();

    /*
      仮アカウントは
      タブを閉じるとsessionStorageが消える。
      その場合、残っている匿名セッションを破棄。
    */

    if(
      session?.user?.is_anonymous &&
      !sessionStorage.getItem(
        "voicechat_guest_name"
      )
    ){

      await supabaseClient.auth.signOut();

      setLoggedOutUI();

      return;

    }


    if(!session?.user){

      setLoggedOutUI();

      return;

    }

    currentUser =
      session.user;

    guestMode =
      !!currentUser.is_anonymous;

    await createProfile();
    await showUser();

  }catch(error){

    console.error(error);

    setLoggedOutUI();

  }

}


/* =====================================
   Auth監視
===================================== */

supabaseClient.auth
.onAuthStateChange(
  async(
    event,
    session
  ) => {

    if(
      session?.user
    ){

      currentUser =
        session.user;

      guestMode =
        !!currentUser.is_anonymous;

      /*
        匿名ユーザーなのに
        仮アカウント情報が無ければ終了
      */

      if(
        guestMode &&
        !sessionStorage.getItem(
          "voicechat_guest_name"
        )
      ){

        await supabaseClient.auth.signOut();

        return;

      }

      await createProfile();
      await showUser();

    }else{

      currentUser = null;
      guestMode = false;

      setLoggedOutUI();

    }

  }
);


/* =====================================
   タブを閉じたら仮アカウント名をリセット
===================================== */

window.addEventListener(
  "pagehide",
  () => {

    if(guestMode){

      sessionStorage.removeItem(
        "voicechat_guest_name"
      );

    }

  }
);


/* =====================================
   初期化
===================================== */

checkUser();

</script>
