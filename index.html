<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg: #2f3136; --accent: #5865f2; }
  body { background: var(--bg); color: white; font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
  
  /* ランチャー用サイドバー */
  .launcher-sidebar { width: 260px; background: #202225; padding: 20px; border-right: 1px solid #000; }
  .btn { background: var(--accent); border: none; color: white; padding: 10px; width: 100%; margin-top: 10px; cursor: pointer; border-radius: 4px; }
  .file-input { background: #40444b; padding: 10px; margin-top: 5px; width: 100%; border-radius: 4px; }
  
  .main-area { flex: 1; padding: 30px; }
  .status-card { background: var(--bg); padding: 20px; border-radius: 8px; border: 1px solid #444; }
</style>
</head>
<body>

<div class="launcher-sidebar">
  <h3>⚙️ Reboot Launcher</h3>
  
  <label>シーズンファイル (フォルダ選択)</label>
  <input type="file" webkitdirectory class="file-input" id="seasonFolder">
  
  <label style="margin-top:20px; display:block;">カスタムDLL</label>
  <input type="file" accept=".dll" class="file-input" id="dllFile">
  
  <button class="btn" onclick="launchGame()">🚀 ゲーム起動</button>
</div>

<div class="main-area">
  <div class="status-card">
    <h2>状態: <span id="status">待機中</span></h2>
    <p id="log">DLLやシーズンを選択してください。</p>
  </div>
</div>

<script>
function launchGame() {
  const season = document.getElementById('seasonFolder').files;
  const dll = document.getElementById('dllFile').files[0];
  
  if(season.length === 0) return alert("シーズンファイルを選択してください！");
  
  document.getElementById('status').textContent = "起動中...";
  document.getElementById('log').innerHTML = 
    `シーズンデータ: ${season.length} ファイル読み込み完了<br>` +
    `カスタムDLL: ${dll ? dll.name : "なし"}<br>` +
    `<span style="color:var(--accent)">[System] インジェクション準備完了... 擬似実行中</span>`;
    
  setTimeout(() => {
    document.getElementById('status').textContent = "実行中";
    document.getElementById('log').innerHTML += "<br>✅ ゲームプロセスにフックしました。";
  }, 2000);
}
</script>
</body>
</html>
