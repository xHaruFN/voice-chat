<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

header{
  height:64px;
  background:#1f2937;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-size:22px;
  font-weight:bold;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#1f2937;
  border-radius:16px;
  padding:25px;
  margin-bottom:20px;
}

h2{margin-top:0}
h3{margin-top:25px}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  font-size:16px;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 20px;
  margin:6px 4px 6px 0;
  font-size:16px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

button:hover{opacity:.9}

.green{background:#22c55e}
.red{background:#dc2626}
.gray{background:#4b5563}
.yellow{background:#eab308;color:#111827}

#accountStatus,
#settingsStatus,
#status{
  color:#9ca3af;
}

#settingsCard,
#friendCard,
#partyCard{
  display:none;
}

.user{
  display:flex;
  align-items:center;
  gap:15px;
  background:#374151;
  padding:15px;
  border-radius:12px;
}

.avatar{
  width:50px;
  height:50px;
  background:#4f46e5;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.friend{
  display:flex;
  align-items:center;
  gap:12px;
  background:#374151;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  flex-wrap:wrap;
}

.friendAvatar{
  width:45px;
  height:45px;
  background:#4f46e5;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.friendInfo{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.online{
  color:#22c55e;
  font-size:13px;
}

.away{
  color:#eab308;
  font-size:13px;
}

.offline{
  color:#9ca3af;
  font-size:13px;
}

.request{
  background:#374151;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
}

.partyBox{
  background:#374151;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

.empty{
  color:#9ca3af;
  padding:15px 0;
}

.mediaArea{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.videoBox{
  background:#111827;
  border-radius:12px;
  padding:10px;
  min-height:220px;
}

.videoBox h3{
  margin:5px 0 10px;
}

video{
  width:100%;
  max-height:400px;
  background:#000;
  border-radius:10px;
  object-fit:contain;
}

.noVideo{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  background:#030712;
  border-radius:10px;
}

.dmBox{
  background:#111827;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.dmMessages{
  height:260px;
  overflow-y:auto;
  background:#030712;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}

.message{
  background:#374151;
  padding:8px 12px;
  border-radius:10px;
  margin:6px 0;
  max-width:80%;
}

.message.mine{
  margin-left:auto;
  background:#4f46e5;
}

.messageName{
  font-size:12px;
  color:#9ca3af;
  margin-bottom:3px;
}

.dmInputArea{
  display:flex;
  gap:5px;
}

.dmInputArea input{
  flex:1;
}

@media(max-width:700px){
  .mediaArea{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
🎙️ Voice Chat
</header>

<main>

<!-- ==========================================
     アカウント
========================================== -->

<div class="card">

<h2>👤 アカウント</h2>

<input
  id="usernameInput"
  maxlength="30"
  placeholder="ユーザー名"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button
  class="gray"
  onclick="createGuest()"
>
👻 仮アカウント
</button>

<button
  id="logoutButton"
  class="red"
  onclick="signOut()"
  style="display:none"
>
ログアウト
</button>

<p id="accountStatus">
ログインしていません
</p>

</div>


<!-- ==========================================
     アカウント設定
========================================== -->

<div
  class="card"
  id="settingsCard"
>

<h2>⚙️ アカウント設定</h2>

<h3>👤 ユーザー名変更</h3>

<input
  id="newUsername"
  maxlength="30"
  placeholder="新しいユーザー名"
>

<button onclick="changeUsername()">
ユーザー名変更
</button>

<h3>🔑 パスワード変更</h3>

<input
  id="newPassword"
  type="password"
  placeholder="新しいパスワード"
>

<button onclick="changePassword()">
パスワード変更
</button>

<h3>⚠️ アカウント</h3>

<button
  class="red"
  onclick="deleteAccount()"
>
🗑️ アカウント削除
</button>

<p id="settingsStatus"></p>

</div>


<!-- ==========================================
     自分
========================================== -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">
👤
</div>

<div>

<strong id="username">
未ログイン
</strong>

<div id="onlineStatus">
⚪ オフライン
</div>

</div>

</div>

<br>

<button
  id="micButton"
  onclick="toggleMic()"
>
🎤 マイクON
</button>

<button
  id="cameraButton"
  class="green"
  onclick="toggleCamera()"
>
📷 カメラON
</button>

<button
  id="screenButton"
  class="gray"
  onclick="toggleScreenShare()"
>
🖥️ 画面共有
</button>

<button
  id="awayButton"
  class="yellow"
  onclick="toggleAway()"
  style="display:none"
>
🟡 離席
</button>

<div id="status">
マイク・カメラ・画面共有を操作できます。
</div>

<div class="mediaArea">

<div class="videoBox">

<h3>
📷 カメラ
</h3>

<video
  id="cameraVideo"
  autoplay
  muted
  playsinline
></video>

<div
  id="cameraEmpty"
  class="noVideo"
>
カメラOFF
</div>

</div>

<div class="videoBox">

<h3>
🖥️ 画面共有
</h3>

<video
  id="screenVideo"
  autoplay
  muted
  playsinline
></video>

<div
  id="screenEmpty"
  class="noVideo"
>
画面共有OFF
</div>

</div>

</div>

</div>


<!-- ==========================================
     フレンド
========================================== -->

<div
  class="card"
  id="friendCard"
>

<h2>👥 フレンド</h2>

<input
  id="friendSearch"
  placeholder="🔍 プレイヤーを検索"
>

<button onclick="searchFriend()">
🔍 検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
<div class="empty">
フレンドはいません。
</div>
</div>

<h3>📨 フレンド申請</h3>

<div id="requestList">
<div class="empty">
フレンド申請はありません。
</div>
</div>


<!-- ==========================================
     DM
========================================== -->

<div
  id="dmBox"
  class="dmBox"
  style="display:none"
>

<h3>
💬 <span id="dmTitle">DM</span>
</h3>

<div
  id="dmMessages"
  class="dmMessages"
></div>

<div class="dmInputArea">

<input
  id="dmInput"
  placeholder="メッセージを入力"
  onkeydown="if(event.key==='Enter')sendDM()"
>

<button onclick="sendDM()">
送信
</button>

</div>

<button
  class="gray"
  onclick="closeDM()"
>
DMを閉じる
</button>

</div>

</div>


<!-- ==========================================
     パーティー
========================================== -->

<div
  class="card"
  id="partyCard"
>

<h2>🎉 パーティー</h2>

<button
  class="green"
  onclick="createParty()"
>
＋ パーティー作成
</button>

<br>

<input
  id="partyCodeInput"
  maxlength="8"
  placeholder="パーティーコード"
>

<button onclick="joinParty()">
🎮 パーティー参加
</button>

<div id="partyArea">

<div class="empty">
パーティーに参加していません。
</div>

</div>

</div>

</main>


<script>

/* ==========================================
   ローカルデータ
========================================== */

const USERS_KEY = "voicechat_users";
const SESSION_KEY = "voicechat_session";
const FRIENDS_KEY = "voicechat_friends";
const REQUESTS_KEY = "voicechat_requests";
const MESSAGES_KEY = "voicechat_messages";
const PARTIES_KEY = "voicechat_parties";

let currentUser = null;
let guestMode = false;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let awayMode = false;

let currentDMUser = null;


/* ==========================================
   データ取得
========================================== */

function getUsers(){
  return JSON.parse(
    localStorage.getItem(USERS_KEY) || "[]"
  );
}

function saveUsers(users){
  localStorage.setItem(
    USERS_KEY,
    JSON.stringify(users)
  );
}

function getFriends(){
  return JSON.parse(
    localStorage.getItem(FRIENDS_KEY) || "[]"
  );
}

function saveFriends(data){
  localStorage.setItem(
    FRIENDS_KEY,
    JSON.stringify(data)
  );
}

function getRequests(){
  return JSON.parse(
    localStorage.getItem(REQUESTS_KEY) || "[]"
  );
}

function saveRequests(data){
  localStorage.setItem(
    REQUESTS_KEY,
    JSON.stringify(data)
  );
}

function getMessages(){
  return JSON.parse(
    localStorage.getItem(MESSAGES_KEY) || "[]"
  );
}

function saveMessages(data){
  localStorage.setItem(
    MESSAGES_KEY,
    JSON.stringify(data)
  );
}

function getParties(){
  return JSON.parse(
    localStorage.getItem(PARTIES_KEY) || "[]"
  );
}

function saveParties(data){
  localStorage.setItem(
    PARTIES_KEY,
    JSON.stringify(data)
  );
}


/* ==========================================
   ID
========================================== */

function makeID(){
  return Date.now().toString(36) +
    Math.random().toString(36).substring(2,8);
}


/* ==========================================
   アカウント作成
========================================== */

function signUp(){

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if(username.length < 3){

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  const users = getUsers();

  if(
    users.some(
      user =>
        user.username.toLowerCase() ===
        username.toLowerCase()
    )
  ){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const user = {

    id: makeID(),

    username: username,

    password: password,

    status: "online",

    guest: false

  };

  users.push(user);

  saveUsers(users);

  loginUser(user);

  alert(
    "アカウントを作成しました！"
  );
}


/* ==========================================
   ログイン
========================================== */

function signIn(){

  const username =
    document.getElementById(
      "usernameInput"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  const users = getUsers();

  const user =
    users.find(
      u =>
        u.username.toLowerCase() ===
        username.toLowerCase() &&
        u.password === password
    );

  if(!user){

    alert(
      "ユーザー名またはパスワードが違います。"
    );

    return;
  }

  user.status = "online";

  saveUsers(users);

  loginUser(user);
}


/* ==========================================
   ログイン処理
========================================== */

function loginUser(user){

  currentUser = user;
  guestMode = false;
  awayMode = false;

  localStorage.setItem(
    SESSION_KEY,
    user.id
  );

  setLoggedInUI(
    user.username
  );

  loadFriends();
  loadFriendRequests();
}


/* ==========================================
   仮アカウント
========================================== */

function createGuest(){

  if(currentUser){

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const guestName =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  currentUser = {

    id:"guest_" + makeID(),

    username:guestName,

    password:"",

    status:"online",

    guest:true

  };

  guestMode = true;

  setLoggedInUI(
    guestName
  );

  document.getElementById(
    "accountStatus"
  ).textContent =
    "👻 仮アカウント: " +
    guestName;

  alert(
    "仮アカウントを作成しました！\n\n" +
    guestName
  );
}


/* ==========================================
   UI
========================================== */

function setLoggedInUI(name){

  document.getElementById(
    "username"
  ).textContent = name;

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "🟢 オンライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    "✅ ログイン中";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "inline-block";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "block";

  document.getElementById(
    "friendCard"
  ).style.display =
    "block";

  document.getElementById(
    "partyCard"
  ).style.display =
    "block";

  document.getElementById(
    "awayButton"
  ).style.display =
    "inline-block";
}


function setLoggedOutUI(){

  document.getElementById(
    "username"
  ).textContent =
    "未ログイン";

  document.getElementById(
    "onlineStatus"
  ).textContent =
    "⚪ オフライン";

  document.getElementById(
    "accountStatus"
  ).textContent =
    "ログインしていません";

  document.getElementById(
    "logoutButton"
  ).style.display =
    "none";

  document.getElementById(
    "settingsCard"
  ).style.display =
    "none";

  document.getElementById(
    "friendCard"
  ).style.display =
    "none";

  document.getElementById(
    "partyCard"
  ).style.display =
    "none";

  document.getElementById(
    "awayButton"
  ).style.display =
    "none";
}


/* ==========================================
   ログアウト
========================================== */

function signOut(){

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if(
    currentUser &&
    !guestMode
  ){

    const users = getUsers();

    const user =
      users.find(
        u => u.id === currentUser.id
      );

    if(user){

      user.status =
        "offline";

      saveUsers(users);
    }
  }

  currentUser = null;
  guestMode = false;
  awayMode = false;
  currentDMUser = null;

  localStorage.removeItem(
    SESSION_KEY
  );

  closeDM();

  setLoggedOutUI();
}


/* ==========================================
   ユーザー名変更
========================================== */

function changeUsername(){

  if(!currentUser){

    alert("ログインしてください。");
    return;
  }

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newName =
    document.getElementById(
      "newUsername"
    ).value.trim();

  if(!newName){

    alert(
      "新しいユーザー名を入力してください。"
    );

    return;
  }

  const users = getUsers();

  if(
    users.some(
      u =>
        u.id !== currentUser.id &&
        u.username.toLowerCase() ===
        newName.toLowerCase()
    )
  ){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const user =
    users.find(
      u => u.id === currentUser.id
    );

  if(!user)return;

  user.username = newName;

  currentUser.username = newName;

  saveUsers(users);

  document.getElementById(
    "username"
  ).textContent = newName;

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ ユーザー名を変更しました。";

  document.getElementById(
    "newUsername"
  ).value = "";
}


/* ==========================================
   パスワード変更
========================================== */

function changePassword(){

  if(!currentUser){

    alert("ログインしてください.");
    return;
  }

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;

  if(newPassword.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  const users = getUsers();

  const user =
    users.find(
      u => u.id === currentUser.id
    );

  if(!user)return;

  user.password =
    newPassword;

  saveUsers(users);

  document.getElementById(
    "settingsStatus"
  ).textContent =
    "✅ パスワードを変更しました。";

  document.getElementById(
    "newPassword"
  ).value = "";
}


/* ==========================================
   アカウント削除
========================================== */

function deleteAccount(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  if(guestMode){

    alert(
      "仮アカウントはログアウトで削除されます。"
    );

    return;
  }

  if(
    !confirm(
      "本当にアカウントを削除しますか？"
    )
  ){

    return;
  }

  let users = getUsers();

  users =
    users.filter(
      u => u.id !== currentUser.id
    );

  saveUsers(users);

  let friends = getFriends();

  friends =
    friends.filter(
      f =>
        f.userId !== currentUser.id &&
        f.friendId !== currentUser.id
    );

  saveFriends(friends);

  localStorage.removeItem(
    SESSION_KEY
  );

  currentUser = null;

  setLoggedOutUI();

  alert(
    "アカウントを削除しました。"
  );
}


/* ==========================================
   離席
========================================== */

function toggleAway(){

  if(!currentUser)return;

  if(guestMode){

    awayMode = !awayMode;

  }else{

    const users = getUsers();

    const user =
      users.find(
        u => u.id === currentUser.id
      );

    if(!user)return;

    if(user.status === "away"){

      user.status = "online";
      awayMode = false;

    }else{

      user.status = "away";
      awayMode = true;
    }

    saveUsers(users);
  }

  updateOwnStatus();
  loadFriends();
}


function updateOwnStatus(){

  const status =
    awayMode
      ? "away"
      : "online";

  document.getElementById(
    "onlineStatus"
  ).textContent =
    status === "away"
      ? "🟡 離席"
      : "🟢 オンライン";

  document.getElementById(
    "awayButton"
  ).textContent =
    status === "away"
      ? "🟢 オンラインに戻る"
      : "🟡 離席";
}


/* ==========================================
   マイク
========================================== */

async function toggleMic(){

  if(!micEnabled){

    try{

      microphone =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });

      micEnabled = true;

      document.getElementById(
        "micButton"
      ).textContent =
        "🔇 マイクOFF";

      updateMediaStatus();

    }catch(error){

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );
    }

  }else{

    stopMicrophone();
    updateMediaStatus();
  }
}


function stopMicrophone(){

  if(microphone){

    microphone
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  microphone = null;
  micEnabled = false;

  const button =
    document.getElementById(
      "micButton"
    );

  if(button){

    button.textContent =
      "🎤 マイクON";
  }
}


/* ==========================================
   カメラ
========================================== */

async function toggleCamera(){

  if(!cameraEnabled){

    try{

      cameraStream =
        await navigator.mediaDevices.getUserMedia({
          video:true,
          audio:false
        });

      cameraEnabled = true;

      const video =
        document.getElementById(
          "cameraVideo"
        );

      video.srcObject =
        cameraStream;

      document.getElementById(
        "cameraEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "cameraButton"
      ).textContent =
        "📷 カメラOFF";

      updateMediaStatus();

    }catch(error){

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );
    }

  }else{

    stopCamera();
    updateMediaStatus();
  }
}


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  cameraStream = null;
  cameraEnabled = false;

  document.getElementById(
    "cameraVideo"
  ).srcObject = null;

  document.getElementById(
    "cameraEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "cameraButton"
  ).textContent =
    "📷 カメラON";
}


/* ==========================================
   画面共有
========================================== */

async function toggleScreenShare(){

  if(!screenEnabled){

    try{

      screenStream =
        await navigator.mediaDevices.getDisplayMedia({
          video:true,
          audio:true
        });

      screenEnabled = true;

      const video =
        document.getElementById(
          "screenVideo"
        );

      video.srcObject =
        screenStream;

      document.getElementById(
        "screenEmpty"
      ).style.display =
        "none";

      document.getElementById(
        "screenButton"
      ).textContent =
        "🛑 画面共有OFF";

      const track =
        screenStream.getVideoTracks()[0];

      if(track){

        track.addEventListener(
          "ended",
          () => {

            stopScreenShare();
            updateMediaStatus();

          }
        );
      }

      updateMediaStatus();

    }catch(error){

      if(
        error.name !==
        "AbortError"
      ){

        alert(
          "画面共有を開始できませんでした。"
        );
      }
    }

  }else{

    stopScreenShare();
    updateMediaStatus();
  }
}


function stopScreenShare(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(
        track => track.stop()
      );
  }

  screenStream = null;
  screenEnabled = false;

  document.getElementById(
    "screenVideo"
  ).srcObject = null;

  document.getElementById(
    "screenEmpty"
  ).style.display =
    "flex";

  document.getElementById(
    "screenButton"
  ).textContent =
    "🖥️ 画面共有";
}


/* ==========================================
   メディア状態
========================================== */

function updateMediaStatus(){

  const status = [];

  if(micEnabled)
    status.push("🎤 マイクON");

  if(cameraEnabled)
    status.push("📷 カメラON");

  if(screenEnabled)
    status.push("🖥️ 画面共有ON");

  document.getElementById(
    "status"
  ).textContent =
    status.length
      ? status.join("　")
      : "すべてOFF";
}


/* ==========================================
   フレンド検索
========================================== */

function searchFriend(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  if(guestMode){

    alert(
      "仮アカウントではフレンド機能を利用できません。"
    );

    return;
  }

  const keyword =
    document.getElementById(
      "friendSearch"
    ).value.trim().toLowerCase();

  if(!keyword){

    alert(
      "検索する名前を入力してください。"
    );

    return;
  }

  const users = getUsers();

  const friends = getFriends();

  const results =
    users.filter(
      user =>
        user.id !== currentUser.id &&
        user.username
          .toLowerCase()
          .includes(keyword)
    );

  const result =
    document.getElementById(
      "searchResult"
    );

  result.innerHTML = "";

  if(!results.length){

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  results.forEach(user => {

    const alreadyFriend =
      friends.some(
        f =>
          f.userId === currentUser.id &&
          f.friendId === user.id
      );

    const div =
      document.createElement(
        "div"
      );

    div.className = "friend";

    div.innerHTML = `

      <div class="friendAvatar">
        👤
      </div>

      <div class="friendInfo">

        <strong>
          ${escapeHTML(user.username)}
        </strong>

        <span class="${statusClass(user.status)}">
          ${statusText(user.status)}
        </span>

      </div>

      ${
        alreadyFriend
          ? "<span>✓ フレンド</span>"
          : `
            <button
              class="green"
              onclick="sendFriendRequest('${user.id}')"
            >
              ＋ 追加
            </button>
          `
      }

    `;

    result.appendChild(div);
  });
}


/* ==========================================
   フレンド申請
========================================== */

function sendFriendRequest(userId){

  if(!currentUser || guestMode){

    alert(
      "ログインしてください。"
    );

    return;
  }

  if(userId === currentUser.id){

    alert(
      "自分自身には申請できません。"
    );

    return;
  }

  const friends = getFriends();

  if(
    friends.some(
      f =>
        f.userId === currentUser.id &&
        f.friendId === userId
    )
  ){

    alert(
      "すでにフレンドです。"
    );

    return;
  }

  const requests = getRequests();

  if(
    requests.some(
      r =>
        r.senderId === currentUser.id &&
        r.receiverId === userId &&
        r.status === "pending"
    )
  ){

    alert(
      "すでに申請しています。"
    );

    return;
  }

  requests.push({

    id:makeID(),

    senderId:currentUser.id,

    receiverId:userId,

    status:"pending"

  });

  saveRequests(requests);

  alert(
    "フレンド申請を送りました！"
  );
}


/* ==========================================
   申請一覧
========================================== */

function loadFriendRequests(){

  if(!currentUser || guestMode)
    return;

  const users = getUsers();

  const requests =
    getRequests().filter(
      r =>
        r.receiverId === currentUser.id &&
        r.status === "pending"
    );

  const list =
    document.getElementById(
      "requestList"
    );

  list.innerHTML = "";

  if(!requests.length){

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  requests.forEach(request => {

    const sender =
      users.find(
        u => u.id === request.senderId
      );

    if(!sender)return;

    const div =
      document.createElement(
        "div"
      );

    div.className = "request";

    div.innerHTML = `

      <strong>
        ${escapeHTML(sender.username)}
      </strong>

      <p>
        フレンド申請が届いています。
      </p>

      <button
        class="green"
        onclick="acceptFriend('${request.id}')"
      >
        ✓ 承認
      </button>

      <button
        class="red"
        onclick="rejectFriend('${request.id}')"
      >
        ✕ 拒否
      </button>
    `;

    list.appendChild(div);
  });
}


/* ==========================================
   申請承認
========================================== */

function acceptFriend(requestId){

  const requests = getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if(!request)return;

  const friends = getFriends();

  friends.push({

    userId:currentUser.id,

    friendId:request.senderId

  });

  friends.push({

    userId:request.senderId,

    friendId:currentUser.id

  });

  saveFriends(friends);

  request.status =
    "accepted";

  saveRequests(requests);

  alert(
    "フレンドになりました！"
  );

  loadFriends();
  loadFriendRequests();
}


/* ==========================================
   申請拒否
========================================== */

function rejectFriend(requestId){

  const requests = getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if(!request)return;

  request.status =
    "rejected";

  saveRequests(requests);

  loadFriendRequests();
}


/* ==========================================
   フレンド一覧
========================================== */

function loadFriends(){

  if(!currentUser || guestMode)
    return;

  const users = getUsers();

  const friends =
    getFriends().filter(
      f =>
        f.userId === currentUser.id
    );

  const list =
    document.getElementById(
      "friendList"
    );

  list.innerHTML = "";

  if(!friends.length){

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    loadFriendRequests();

    return;
  }

  friends.forEach(friendRow => {

    const friend =
      users.find(
        u =>
          u.id === friendRow.friendId
      );

    if(!friend)return;

    const div =
      document.createElement(
        "div"
      );

    div.className = "friend";

    div.innerHTML = `

      <div class="friendAvatar">
        👤
      </div>

      <div class="friendInfo">

        <strong>
          ${escapeHTML(friend.username)}
        </strong>

        <span class="${statusClass(friend.status)}">
          ${statusText(friend.status)}
        </span>

      </div>

      <button
        onclick="openDM('${friend.id}')"
      >
        💬 DM
      </button>

      <button
        class="red"
        onclick="removeFriend('${friend.id}')"
      >
        🗑️ 削除
      </button>

    `;

    list.appendChild(div);
  });

  loadFriendRequests();
}


/* ==========================================
   フレンド削除
========================================== */

function removeFriend(friendId){

  if(
    !confirm(
      "このフレンドを削除しますか？"
    )
  ){

    return;
  }

  let friends = getFriends();

  friends =
    friends.filter(
      f =>
        !(
          (
            f.userId === currentUser.id &&
            f.friendId === friendId
          ) ||
          (
            f.userId === friendId &&
            f.friendId === currentUser.id
          )
        )
    );

  saveFriends(friends);

  if(
    currentDMUser === friendId
  ){

    closeDM();
  }

  loadFriends();
}


/* ==========================================
   DMを開く
========================================== */

function openDM(friendId){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  currentDMUser =
    friendId;

  const users = getUsers();

  const friend =
    users.find(
      u => u.id === friendId
    );

  if(!friend)return;

  document.getElementById(
    "dmBox"
  ).style.display =
    "block";

  document.getElementById(
    "dmTitle"
  ).textContent =
    "💬 " + friend.username;

  loadDM();

  document.getElementById(
    "dmInput"
  ).focus();
}


/* ==========================================
   DM表示
========================================== */

function loadDM(){

  if(!currentDMUser)return;

  const messages =
    getMessages().filter(
      message =>
        (
          message.senderId === currentUser.id &&
          message.receiverId === currentDMUser
        ) ||
        (
          message.senderId === currentDMUser &&
          message.receiverId === currentUser.id
        )
    );

  const box =
    document.getElementById(
      "dmMessages"
    );

  box.innerHTML = "";

  const users = getUsers();

  messages.forEach(message => {

    const sender =
      message.senderId === currentUser.id
        ? currentUser.username
        : (
            users.find(
              u =>
                u.id === message.senderId
            )?.username || "Unknown"
          );

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "message" +
      (
        message.senderId === currentUser.id
          ? " mine"
          : ""
      );

    div.innerHTML = `

      <div class="messageName">
        ${escapeHTML(sender)}
      </div>

      <div>
        ${escapeHTML(message.text)}
      </div>

    `;

    box.appendChild(div);
  });

  box.scrollTop =
    box.scrollHeight;
}


/* ==========================================
   DM送信
========================================== */

function sendDM(){

  if(!currentUser || !currentDMUser){

    alert(
      "DMを開いてください。"
    );

    return;
  }

  const input =
    document.getElementById(
      "dmInput"
    );

  const text =
    input.value.trim();

  if(!text)return;

  const messages =
    getMessages();

  messages.push({

    id:makeID(),

    senderId:
      currentUser.id,

    receiverId:
      currentDMUser,

    text:text,

    time:
      Date.now()

  });

  saveMessages(messages);

  input.value = "";

  loadDM();
}


/* ==========================================
   DMを閉じる
========================================== */

function closeDM(){

  currentDMUser = null;

  document.getElementById(
    "dmBox"
  ).style.display =
    "none";

  document.getElementById(
    "dmMessages"
  ).innerHTML = "";

  document.getElementById(
    "dmInput"
  ).value = "";
}


/* ==========================================
   パーティー作成
========================================== */

function createParty(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  const parties =
    getParties();

  const party = {

    id:makeID(),

    code:code,

    ownerId:
      currentUser.id,

    members:[
      currentUser.id
    ]

  };

  parties.push(party);

  saveParties(parties);

  showParty(party);

  alert(
    "パーティーを作成しました！\n\n" +
    "コード: " + code
  );
}


/* ==========================================
   パーティー参加
========================================== */

function joinParty(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    document.getElementById(
      "partyCodeInput"
    ).value.trim().toUpperCase();

  if(!code){

    alert(
      "パーティーコードを入力してください。"
    );

    return;
  }

  const parties =
    getParties();

  const party =
    parties.find(
      p => p.code === code
    );

  if(!party){

    alert(
      "そのパーティーは見つかりません。"
    );

    return;
  }

  if(
    !party.members.includes(
      currentUser.id
    )
  ){

    party.members.push(
      currentUser.id
    );
  }

  saveParties(parties);

  showParty(party);

  alert(
    "パーティーに参加しました！"
  );
}


/* ==========================================
   パーティー表示
========================================== */

function showParty(party){

  const users =
    getUsers();

  const memberNames =
    party.members.map(
      id => {

        if(
          currentUser &&
          id === currentUser.id
        ){

          return currentUser.username;
        }

        const user =
          users.find(
            u => u.id === id
          );

        return user
          ? user.username
          : "Unknown";
      }
    );

  document.getElementById(
    "partyArea"
  ).innerHTML = `

    <div class="partyBox">

      <h3>
        🎉 パーティー参加中
      </h3>

      <p>
        パーティーコード
      </p>

      <strong
        style="font-size:24px"
      >
        ${escapeHTML(party.code)}
      </strong>

      <h3>
        👥 メンバー
      </h3>

      ${
        memberNames.length
          ? memberNames
              .map(
                name =>
                  `<div>👤 ${escapeHTML(name)}</div>`
              )
              .join("")
          : "<div>メンバーなし</div>"
      }

      <br>

      <button
        class="red"
        onclick="leaveParty('${party.id}')"
      >
        🚪 パーティー退出
      </button>

      ${
        party.ownerId === currentUser.id
          ? `
            <button
              class="red"
              onclick="deleteParty('${party.id}')"
            >
              🗑️ パーティー解散
            </button>
          `
          : ""
      }

    </div>

  `;
}


/* ==========================================
   パーティー退出
========================================== */

function leaveParty(partyId){

  const parties =
    getParties();

  const party =
    parties.find(
      p => p.id === partyId
    );

  if(!party)return;

  party.members =
    party.members.filter(
      id =>
        id !== currentUser.id
    );

  saveParties(parties);

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';
}


/* ==========================================
   パーティー解散
========================================== */

function deleteParty(partyId){

  if(
    !confirm(
      "パーティーを解散しますか？"
    )
  ){

    return;
  }

  let parties =
    getParties();

  parties =
    parties.filter(
      p => p.id !== partyId
    );

  saveParties(parties);

  document.getElementById(
    "partyArea"
  ).innerHTML =
    '<div class="empty">パーティーに参加していません。</div>';
}


/* ==========================================
   ステータス
========================================== */

function statusClass(status){

  if(status === "online")
    return "online";

  if(status === "away")
    return "away";

  return "offline";
}


function statusText(status){

  if(status === "online")
    return "🟢 オンライン";

  if(status === "away")
    return "🟡 離席";

  return "⚪ オフライン";
}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==========================================
   初期化
========================================== */

function checkUser(){

  const session =
    localStorage.getItem(
      SESSION_KEY
    );

  if(!session){

    setLoggedOutUI();
    return;
  }

  const users =
    getUsers();

  const user =
    users.find(
      u => u.id === session
    );

  if(!user){

    localStorage.removeItem(
      SESSION_KEY
    );

    setLoggedOutUI();
    return;
  }

  currentUser = user;

  user.status =
    "online";

  saveUsers(users);

  setLoggedInUI(
    user.username
  );

  loadFriends();
  loadFriendRequests();
}


/* ==========================================
   定期更新
========================================== */

setInterval(() => {

  if(!currentUser || guestMode)
    return;

  loadFriends();

  if(currentDMUser)
    loadDM();

},3000);


/* ==========================================
   開始
========================================== */

checkUser();

</script>
