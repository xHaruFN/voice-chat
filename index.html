```html
<div class="card">

<h2>👤 アカウント</h2>

<input
  id="usernameInput"
  type="text"
  maxlength="30"
  placeholder="ユーザー名"
>

<input
  id="password"
  type="password"
  placeholder="パスワード"
>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button onclick="createGuest()">
👻 仮アカウント
</button>

<button
  id="logoutButton"
  class="logout"
  onclick="signOut()"
  style="display:none;"
>
ログアウト
</button>

<p id="accountStatus">
ログインしていません
</p>

</div>
```
