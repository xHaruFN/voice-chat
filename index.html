<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chat</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

header{
  height:64px;
  background:#1f2937;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-size:22px;
  font-weight:bold;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:20px;
}

.card{
  background:#1f2937;
  border-radius:16px;
  padding:25px;
  margin-bottom:20px;
}

h2{margin-top:0}
h3{margin-top:25px}

input{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:10px;
  font-size:16px;
}

button{
  border:none;
  border-radius:10px;
  padding:12px 20px;
  margin:6px 4px 6px 0;
  font-size:16px;
  cursor:pointer;
  background:#4f46e5;
  color:white;
}

button:hover{opacity:.9}

.green{background:#22c55e}
.red{background:#dc2626}
.gray{background:#4b5563}
.yellow{background:#eab308;color:#111827}

#accountStatus,
#settingsStatus,
#status{
  color:#9ca3af;
}

#settingsCard,
#friendCard,
#partyCard{
  display:none;
}

.user{
  display:flex;
  align-items:center;
  gap:15px;
  background:#374151;
  padding:15px;
  border-radius:12px;
}

.avatar{
  width:50px;
  height:50px;
  background:#4f46e5;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.friend{
  display:flex;
  align-items:center;
  gap:12px;
  background:#374151;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
}

.friendAvatar{
  width:45px;
  height:45px;
  background:#4f46e5;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.friendInfo{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.online{
  color:#22c55e;
  font-size:13px;
}

.away{
  color:#eab308;
  font-size:13px;
}

.offline{
  color:#9ca3af;
  font-size:13px;
}

.friend button{
  padding:8px 14px;
  margin:0 0 0 5px;
}

.request{
  background:#374151;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
}

.partyBox{
  background:#374151;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

.empty{
  color:#9ca3af;
  padding:15px 0;
}

.mediaArea{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.videoBox{
  background:#111827;
  border-radius:12px;
  padding:10px;
  min-height:220px;
}

.videoBox h3{
  margin:5px 0 10px;
}

video{
  width:100%;
  max-height:400px;
  background:#000;
  border-radius:10px;
  object-fit:contain;
}

.noVideo{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  background:#030712;
  border-radius:10px;
}

.dmBox{
  background:#111827;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.dmMessages{
  height:220px;
  overflow-y:auto;
  background:#030712;
  border-radius:10px;
  padding:10px;
  margin-bottom:10px;
}

.message{
  background:#374151;
  padding:8px 12px;
  border-radius:10px;
  margin:6px 0;
  width:max-content;
  max-width:80%;
}

.myMessage{
  margin-left:auto;
  background:#4f46e5;
}

.dmInput{
  display:flex;
  gap:6px;
}

.dmInput input{
  margin:0;
  flex:1;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  .mediaArea{
    grid-template-columns:1fr;
  }

  .friend{
    flex-wrap:wrap;
  }
}
</style>

</head>

<body>

<header>
🎙️ Voice Chat
</header>

<main>

<!-- ==========================================
     アカウント
========================================== -->

<div class="card">

<h2>👤 アカウント</h2>

<input
id="usernameInput"
maxlength="30"
placeholder="ユーザー名"

>

<input
id="password"
type="password"
placeholder="パスワード"

>

<button onclick="signUp()">
アカウント作成
</button>

<button onclick="signIn()">
ログイン
</button>

<button
class="gray"
onclick="createGuest()"

>

👻 仮アカウント </button>

<button
id="logoutButton"
class="red"
onclick="signOut()"
style="display:none"

>

ログアウト </button>

<p id="accountStatus">
ログインしていません
</p>

</div>

<!-- ==========================================
     アカウント設定
========================================== -->

<div
  class="card"
  id="settingsCard"
>

<h2>⚙️ アカウント設定</h2>

<h3>👤 ユーザー名変更</h3>

<input
id="newUsername"
maxlength="30"
placeholder="新しいユーザー名"

>

<button onclick="changeUsername()">
ユーザー名変更
</button>

<h3>🔑 パスワード変更</h3>

<input
id="newPassword"
type="password"
placeholder="新しいパスワード"

>

<button onclick="changePassword()">
パスワード変更
</button>

<p id="settingsStatus"></p>

</div>

<!-- ==========================================
     自分
========================================== -->

<div class="card">

<h2>自分</h2>

<div class="user">

<div class="avatar">
👤
</div>

<div>

<strong id="username">
未ログイン
</strong>

<div id="onlineStatus">
⚪ オフライン
</div>

</div>

</div>

<br>

<button
id="micButton"
onclick="toggleMic()"

>

🎤 マイクON </button>

<button
id="cameraButton"
class="green"
onclick="toggleCamera()"

>

📷 カメラON </button>

<button
id="screenButton"
class="gray"
onclick="toggleScreenShare()"

>

🖥️ 画面共有 </button>

<button
id="awayButton"
class="yellow"
onclick="toggleAway()"
style="display:none"

>

🟡 離席 </button>

<div id="status">
マイク・カメラ・画面共有を操作できます。
</div>

<div class="mediaArea">

<div class="videoBox">

<h3>📷 カメラ</h3>

<video
id="cameraVideo"
autoplay
muted
playsinline

> </video>

<div
id="cameraEmpty"
class="noVideo"
>
カメラOFF
</div>

</div>

<div class="videoBox">

<h3>🖥️ 画面共有</h3>

<video
id="screenVideo"
autoplay
muted
playsinline

> </video>

<div
id="screenEmpty"
class="noVideo"
>
画面共有OFF
</div>

</div>

</div>

</div>

<!-- ==========================================
     フレンド
========================================== -->

<div
class="card"
id="friendCard"
>

<h2>👥 フレンド</h2>

<input
id="friendSearch"
placeholder="🔍 プレイヤーを検索"

>

<button onclick="searchFriend()">
🔍 検索
</button>

<div id="searchResult"></div>

<h3>フレンドリスト</h3>

<div id="friendList">
<div class="empty">
フレンドはいません。
</div>
</div>

<h3>📨 フレンド申請</h3>

<div id="requestList">
<div class="empty">
フレンド申請はありません。
</div>
</div>

<!-- ==========================================
     DM
========================================== -->

<div
id="dmBox"
class="dmBox"
style="display:none"
>

<h3>
💬 <span id="dmTitle"></span>
</h3>

<div
id="dmMessages"
class="dmMessages"
></div>

<div class="dmInput">

<input
id="dmInput"
placeholder="メッセージを入力"
onkeydown="if(event.key==='Enter')sendDM()"

>

<button
onclick="sendDM()"

>

送信 </button>

</div>

<button
class="gray"
onclick="closeDM()"

>

DMを閉じる </button>

</div>

</div>

<!-- ==========================================
     パーティー
========================================== -->

<div
class="card"
id="partyCard"
>

<h2>🎉 パーティー</h2>

<button
class="green"
onclick="createParty()"

>

＋ パーティー作成 </button>

<div id="partyArea">
<div class="empty">
パーティーに参加していません。
</div>
</div>

</div>

</main>

<script>

/* ==========================================
   データ
========================================== */

let accounts =
JSON.parse(
  localStorage.getItem("voicechat_accounts") || "{}"
);

let friendRequests =
JSON.parse(
  localStorage.getItem("voicechat_requests") || "[]"
);

let friendships =
JSON.parse(
  localStorage.getItem("voicechat_friendships") || "[]"
);

let messages =
JSON.parse(
  localStorage.getItem("voicechat_messages") || "[]"
);

let currentUser = null;
let guestMode = false;

let microphone = null;
let micEnabled = false;

let cameraStream = null;
let cameraEnabled = false;

let screenStream = null;
let screenEnabled = false;

let awayMode = false;

let currentDM = null;


/* ==========================================
   保存
========================================== */

function saveData(){

  localStorage.setItem(
    "voicechat_accounts",
    JSON.stringify(accounts)
  );

  localStorage.setItem(
    "voicechat_requests",
    JSON.stringify(friendRequests)
  );

  localStorage.setItem(
    "voicechat_friendships",
    JSON.stringify(friendships)
  );

  localStorage.setItem(
    "voicechat_messages",
    JSON.stringify(messages)
  );
}


/* ==========================================
   アカウント作成
========================================== */

function signUp(){

  const username =
    document
      .getElementById("usernameInput")
      .value.trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  if(username.length < 3){

    alert(
      "ユーザー名は3文字以上にしてください。"
    );

    return;
  }

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  if(accounts[username]){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  accounts[username] = {

    username:username,

    password:password,

    status:"online",

    createdAt:Date.now()

  };

  saveData();

  currentUser = accounts[username];
  guestMode = false;

  setLoggedInUI(username);

  alert(
    "アカウントを作成しました！"
  );

}


/* ==========================================
   ログイン
========================================== */

function signIn(){

  const username =
    document
      .getElementById("usernameInput")
      .value.trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!username || !password){

    alert(
      "ユーザー名とパスワードを入力してください。"
    );

    return;
  }

  const account =
    accounts[username];

  if(
    !account ||
    account.password !== password
  ){

    alert(
      "ユーザー名またはパスワードが違います。"
    );

    return;
  }

  currentUser = account;
  guestMode = false;

  account.status = "online";

  saveData();

  setLoggedInUI(username);

}


/* ==========================================
   仮アカウント
========================================== */

function createGuest(){

  if(currentUser){

    alert(
      "すでにログインしています。"
    );

    return;
  }

  const name =
    "Guest_" +
    Math.floor(
      100000 +
      Math.random() * 900000
    );

  currentUser = {

    username:name,

    status:"online"

  };

  guestMode = true;

  setLoggedInUI(name);

  document
    .getElementById("accountStatus")
    .textContent =
      "👻 仮アカウント: " + name;

  alert(
    "仮アカウントを作成しました！\n\n" +
    name
  );

}


/* ==========================================
   ログアウト
========================================== */

function signOut(){

  stopMicrophone();
  stopCamera();
  stopScreenShare();

  if(
    currentUser &&
    !guestMode &&
    accounts[currentUser.username]
  ){

    accounts[currentUser.username].status =
      "offline";

    saveData();

  }

  currentUser = null;
  guestMode = false;
  awayMode = false;

  closeDM();

  setLoggedOutUI();

}


/* ==========================================
   UI
========================================== */

function setLoggedInUI(name){

  document
    .getElementById("username")
    .textContent = name;

  document
    .getElementById("onlineStatus")
    .textContent =
      "🟢 オンライン";

  document
    .getElementById("accountStatus")
    .textContent =
      guestMode
        ? "👻 仮アカウント"
        : "✅ ログイン中";

  document
    .getElementById("logoutButton")
    .style.display =
      "inline-block";

  document
    .getElementById("settingsCard")
    .style.display =
      "block";

  document
    .getElementById("friendCard")
    .style.display =
      "block";

  document
    .getElementById("partyCard")
    .style.display =
      "block";

  document
    .getElementById("awayButton")
    .style.display =
      guestMode ? "none" : "inline-block";

  if(!guestMode){

    loadFriends();
    loadRequests();

  }

}


function setLoggedOutUI(){

  document
    .getElementById("username")
    .textContent =
      "未ログイン";

  document
    .getElementById("onlineStatus")
    .textContent =
      "⚪ オフライン";

  document
    .getElementById("accountStatus")
    .textContent =
      "ログインしていません";

  document
    .getElementById("logoutButton")
    .style.display =
      "none";

  document
    .getElementById("settingsCard")
    .style.display =
      "none";

  document
    .getElementById("friendCard")
    .style.display =
      "none";

  document
    .getElementById("partyCard")
    .style.display =
      "none";

  document
    .getElementById("awayButton")
    .style.display =
      "none";

}


/* ==========================================
   ユーザー名変更
========================================== */

function changeUsername(){

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const newName =
    document
      .getElementById("newUsername")
      .value.trim();

  if(!newName){

    alert(
      "新しいユーザー名を入力してください。"
    );

    return;
  }

  if(accounts[newName]){

    alert(
      "そのユーザー名はすでに使用されています。"
    );

    return;
  }

  const oldName =
    currentUser.username;

  accounts[newName] =
    accounts[oldName];

  accounts[newName].username =
    newName;

  delete accounts[oldName];

  currentUser =
    accounts[newName];

  saveData();

  document
    .getElementById("username")
    .textContent =
      newName;

  document
    .getElementById("settingsStatus")
    .textContent =
      "✅ ユーザー名を変更しました。";

  document
    .getElementById("newUsername")
    .value = "";

  loadFriends();

}


/* ==========================================
   パスワード変更
========================================== */

function changePassword(){

  if(guestMode){

    alert(
      "仮アカウントでは変更できません。"
    );

    return;
  }

  const password =
    document
      .getElementById("newPassword")
      .value;

  if(password.length < 6){

    alert(
      "パスワードは6文字以上にしてください。"
    );

    return;
  }

  accounts[currentUser.username].password =
    password;

  currentUser =
    accounts[currentUser.username];

  saveData();

  document
    .getElementById("newPassword")
    .value = "";

  document
    .getElementById("settingsStatus")
    .textContent =
      "✅ パスワードを変更しました。";

}


/* ==========================================
   離席
========================================== */

function toggleAway(){

  if(!currentUser || guestMode)
    return;

  awayMode = !awayMode;

  currentUser.status =
    awayMode
      ? "away"
      : "online";

  accounts[currentUser.username].status =
    currentUser.status;

  saveData();

  updateOwnStatus();

  loadFriends();

}


function updateOwnStatus(){

  const status =
    currentUser.status;

  const element =
    document.getElementById(
      "onlineStatus"
    );

  const button =
    document.getElementById(
      "awayButton"
    );

  if(status === "away"){

    element.textContent =
      "🟡 離席";

    button.textContent =
      "🟢 オンラインに戻る";

  }else{

    element.textContent =
      "🟢 オンライン";

    button.textContent =
      "🟡 離席";

  }

}


/* ==========================================
   マイク
========================================== */

async function toggleMic(){

  if(!micEnabled){

    try{

      microphone =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      micEnabled = true;

      document
        .getElementById("micButton")
        .textContent =
          "🔇 マイクOFF";

      updateMediaStatus();

    }catch(error){

      alert(
        "マイクへのアクセスが許可されませんでした。"
      );

    }

  }else{

    stopMicrophone();
    updateMediaStatus();

  }

}


function stopMicrophone(){

  if(microphone){

    microphone
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  microphone = null;
  micEnabled = false;

  const button =
    document.getElementById(
      "micButton"
    );

  if(button){

    button.textContent =
      "🎤 マイクON";

  }

}


/* ==========================================
   カメラ
========================================== */

async function toggleCamera(){

  if(!cameraEnabled){

    try{

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video:true,
            audio:false
          });

      cameraEnabled = true;

      document
        .getElementById("cameraVideo")
        .srcObject =
          cameraStream;

      document
        .getElementById("cameraEmpty")
        .style.display =
          "none";

      document
        .getElementById("cameraButton")
        .textContent =
          "📷 カメラOFF";

      updateMediaStatus();

    }catch(error){

      alert(
        "カメラへのアクセスが許可されませんでした。"
      );

    }

  }else{

    stopCamera();
    updateMediaStatus();

  }

}


function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  cameraStream = null;
  cameraEnabled = false;

  document
    .getElementById("cameraVideo")
    .srcObject =
      null;

  document
    .getElementById("cameraEmpty")
    .style.display =
      "flex";

  document
    .getElementById("cameraButton")
    .textContent =
      "📷 カメラON";

}


/* ==========================================
   画面共有
========================================== */

async function toggleScreenShare(){

  if(!screenEnabled){

    try{

      screenStream =
        await navigator.mediaDevices
          .getDisplayMedia({
            video:true,
            audio:true
          });

      screenEnabled = true;

      document
        .getElementById("screenVideo")
        .srcObject =
          screenStream;

      document
        .getElementById("screenEmpty")
        .style.display =
          "none";

      document
        .getElementById("screenButton")
        .textContent =
          "🛑 画面共有OFF";

      const track =
        screenStream
          .getVideoTracks()[0];

      if(track){

        track.addEventListener(
          "ended",
          () => {

            stopScreenShare();
            updateMediaStatus();

          }
        );

      }

      updateMediaStatus();

    }catch(error){

      if(error.name !== "AbortError"){

        alert(
          "画面共有を開始できませんでした。"
        );

      }

    }

  }else{

    stopScreenShare();
    updateMediaStatus();

  }

}


function stopScreenShare(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }

  screenStream = null;
  screenEnabled = false;

  document
    .getElementById("screenVideo")
    .srcObject =
      null;

  document
    .getElementById("screenEmpty")
    .style.display =
      "flex";

  document
    .getElementById("screenButton")
    .textContent =
      "🖥️ 画面共有";

}


/* ==========================================
   メディア状態
========================================== */

function updateMediaStatus(){

  const status = [];

  if(micEnabled)
    status.push("🎤 マイクON");

  if(cameraEnabled)
    status.push("📷 カメラON");

  if(screenEnabled)
    status.push("🖥️ 画面共有ON");

  document
    .getElementById("status")
    .textContent =
      status.length
        ? status.join("　")
        : "すべてOFF";

}


/* ==========================================
   フレンド検索
========================================== */

function searchFriend(){

  if(!currentUser || guestMode){

    alert(
      "通常アカウントでログインしてください。"
    );

    return;
  }

  const name =
    document
      .getElementById("friendSearch")
      .value
      .trim()
      .toLowerCase();

  if(!name){

    alert(
      "検索するユーザー名を入力してください。"
    );

    return;
  }

  const result =
    document.getElementById(
      "searchResult"
    );

  result.innerHTML = "";

  const users =
    Object.values(accounts)
      .filter(user =>
        user.username
          .toLowerCase()
          .includes(name)
      )
      .filter(user =>
        user.username !==
        currentUser.username
      );

  if(!users.length){

    result.innerHTML =
      '<div class="empty">プレイヤーが見つかりません。</div>';

    return;
  }

  users.forEach(user => {

    const div =
      document.createElement("div");

    div.className = "friend";

    div.innerHTML = `

      <div class="friendAvatar">
        👤
      </div>

      <div class="friendInfo">

        <strong>
          ${escapeHTML(user.username)}
        </strong>

        <span class="offline">
          プレイヤー
        </span>

      </div>

      <button
        class="green"
        onclick="sendFriendRequest('${escapeHTML(user.username)}')"
      >
        ＋ 追加
      </button>
    `;

    result.appendChild(div);

  });

}


/* ==========================================
   フレンド申請
========================================== */

function sendFriendRequest(username){

  if(!currentUser || guestMode)
    return;

  const exists =
    friendRequests.some(
      request =>
        request.from === currentUser.username &&
        request.to === username &&
        request.status === "pending"
    );

  if(exists){

    alert(
      "すでに申請しています。"
    );

    return;
  }

  friendRequests.push({

    id:Date.now(),

    from:currentUser.username,

    to:username,

    status:"pending"

  });

  saveData();

  alert(
    "フレンド申請を送りました！"
  );

}


/* ==========================================
   申請一覧
========================================== */

function loadRequests(){

  const list =
    document.getElementById(
      "requestList"
    );

  list.innerHTML = "";

  const requests =
    friendRequests.filter(
      request =>
        request.to ===
        currentUser.username &&
        request.status ===
        "pending"
    );

  if(!requests.length){

    list.innerHTML =
      '<div class="empty">フレンド申請はありません。</div>';

    return;
  }

  requests.forEach(request => {

    const div =
      document.createElement("div");

    div.className = "request";

    div.innerHTML = `

      <strong>
        ${escapeHTML(request.from)}
      </strong>

      <p>
        フレンド申請が届いています。
      </p>

      <button
        class="green"
        onclick="acceptFriend(${request.id})"
      >
        ✓ 承認
      </button>

      <button
        class="red"
        onclick="rejectFriend(${request.id})"
      >
        ✕ 拒否
      </button>
    `;

    list.appendChild(div);

  });

}


/* ==========================================
   承認
========================================== */

function acceptFriend(id){

  const request =
    friendRequests.find(
      r => r.id === id
    );

  if(!request)
    return;

  request.status =
    "accepted";

  friendships.push({

    user:currentUser.username,

    friend:request.from

  });

  friendships.push({

    user:request.from,

    friend:currentUser.username

  });

  saveData();

  loadFriends();
  loadRequests();

  alert(
    "フレンドになりました！"
  );

}


/* ==========================================
   拒否
========================================== */

function rejectFriend(id){

  const request =
    friendRequests.find(
      r => r.id === id
    );

  if(!request)
    return;

  request.status =
    "rejected";

  saveData();

  loadRequests();

}


/* ==========================================
   フレンド一覧
========================================== */

function loadFriends(){

  if(!currentUser || guestMode)
    return;

  const list =
    document.getElementById(
      "friendList"
    );

  list.innerHTML = "";

  const friends =
    friendships
      .filter(
        f =>
          f.user ===
          currentUser.username
      )
      .map(
        f =>
          accounts[f.friend]
      )
      .filter(Boolean);

  if(!friends.length){

    list.innerHTML =
      '<div class="empty">フレンドはいません。</div>';

    return;
  }

  friends.forEach(friend => {

    const status =
      friend.status || "offline";

    let statusText;
    let statusClass;

    if(status === "online"){

      statusText =
        "● オンライン";

      statusClass =
        "online";

    }else if(status === "away"){

      statusText =
        "● 離席";

      statusClass =
        "away";

    }else{

      statusText =
        "● オフライン";

      statusClass =
        "offline";

    }

    const div =
      document.createElement("div");

    div.className = "friend";

    div.innerHTML = `

      <div class="friendAvatar">
        👤
      </div>

      <div class="friendInfo">

        <strong>
          ${escapeHTML(friend.username)}
        </strong>

        <span class="${statusClass}">
          ${statusText}
        </span>

      </div>

      <button
        onclick="openDM('${escapeHTML(friend.username)}')"
      >
        💬 DM
      </button>

      <button
        class="red"
        onclick="removeFriend('${escapeHTML(friend.username)}')"
      >
        🗑️ 削除
      </button>

    `;

    list.appendChild(div);

  });

}


/* ==========================================
   フレンド削除
========================================== */

function removeFriend(username){

  if(!confirm(
    "このフレンドを削除しますか？"
  )){
    return;
  }

  friendships =
    friendships.filter(
      f =>
        !(
          (
            f.user ===
            currentUser.username &&
            f.friend === username
          ) ||
          (
            f.user === username &&
            f.friend ===
            currentUser.username
          )
        )
    );

  saveData();

  loadFriends();

  if(currentDM === username)
    closeDM();

}


/* ==========================================
   DM
========================================== */

function openDM(username){

  currentDM = username;

  document
    .getElementById("dmBox")
    .style.display =
      "block";

  document
    .getElementById("dmTitle")
    .textContent =
      username;

  loadDM();

  document
    .getElementById("dmInput")
    .focus();

}


function closeDM(){

  currentDM = null;

  document
    .getElementById("dmBox")
    .style.display =
      "none";

}


function sendDM(){

  if(!currentUser || !currentDM)
    return;

  const input =
    document.getElementById(
      "dmInput"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  messages.push({

    id:Date.now(),

    from:currentUser.username,

    to:currentDM,

    text:text,

    time:new Date().toLocaleTimeString()

  });

  saveData();

  input.value = "";

  loadDM();

}


function loadDM(){

  if(!currentDM)
    return;

  const box =
    document.getElementById(
      "dmMessages"
    );

  box.innerHTML = "";

  const dmMessages =
    messages.filter(
      message =>
        (
          message.from ===
          currentUser.username &&
          message.to === currentDM
        ) ||
        (
          message.from === currentDM &&
          message.to ===
          currentUser.username
        )
    );

  if(!dmMessages.length){

    box.innerHTML =
      '<div class="empty">まだメッセージはありません。</div>';

    return;
  }

  dmMessages.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      message.from ===
      currentUser.username
        ? "message myMessage"
        : "message";

    div.innerHTML =
      `
      ${escapeHTML(message.text)}
      <small style="display:block;opacity:.6">
        ${escapeHTML(message.time)}
      </small>
      `;

    box.appendChild(div);

  });

  box.scrollTop =
    box.scrollHeight;

}


/* ==========================================
   パーティー
========================================== */

function createParty(){

  if(!currentUser){

    alert(
      "ログインしてください。"
    );

    return;
  }

  const code =
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  document
    .getElementById("partyArea")
    .innerHTML = `

      <div class="partyBox">

        <h3>
          🎉 パーティー作成済み
        </h3>

        <p>
          パーティーコード
        </p>

        <strong style="font-size:24px">
          ${code}
        </strong>

        <br>

        <button
          class="red"
          onclick="leaveParty()"
        >
          パーティーを解散
        </button>

      </div>
    `;

}


function leaveParty(){

  document
    .getElementById("partyArea")
    .innerHTML =
      '<div class="empty">パーティーに参加していません。</div>';

}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* ==========================================
   初期化
========================================== */

(function(){

  const savedUser =
    sessionStorage.getItem(
      "voicechat_current_user"
    );

  if(savedUser &&
     accounts[savedUser]){

    currentUser =
      accounts[savedUser];

    currentUser.status =
      "online";

    saveData();

    setLoggedInUI(
      savedUser
    );

  }

})();

</script>
